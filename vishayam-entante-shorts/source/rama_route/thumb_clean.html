<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Ramabhadra&family=Anek+Telugu:wght@800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#222}
.t{position:relative;overflow:hidden;font-family:'Ramabhadra',sans-serif}
.bg{position:absolute;inset:0;background-size:cover;filter:saturate(1.35) contrast(1.12) brightness(1.05)}
.sh{position:absolute;left:0;right:0;top:0}
.o{line-height:1.0;text-shadow:8px 8px 0 #000,-8px 8px 0 #000,8px -8px 0 #000,-8px -8px 0 #000,0 11px 0 #000,0 -9px 0 #000,11px 0 0 #000,-11px 0 0 #000,0 18px 26px rgba(0,0,0,.9)}
.y{color:#ffe100}.w{color:#fff}
.strip{display:inline-block;background:#d71920;color:#fff;border-radius:14px;box-shadow:0 8px 0 rgba(0,0,0,.5);transform:rotate(-2deg);white-space:nowrap}
#v{width:1080px;height:1920px}#v .bg{background-image:url(tb_v.png)}
#v .sh{height:980px;background:linear-gradient(rgba(0,0,0,.8),rgba(0,0,0,.55) 65%,rgba(0,0,0,0))}
#v .txt{position:absolute;top:300px;left:0;right:0;text-align:center}
#h{width:1280px;height:720px}#h .bg{background-image:url(tb_h.png)}
#h .sh{bottom:0;right:auto;width:760px;background:linear-gradient(90deg,rgba(0,0,0,.82),rgba(0,0,0,.6) 65%,rgba(0,0,0,0))}
#h .txt{position:absolute;top:95px;left:0;width:720px;text-align:center}
</style></head><body>
<div id="v" class="t"><div class="bg"></div><div class="sh"></div>
 <div class="txt">
  <div class="o y" style="font-size:280px">రాముడు</div>
  <div class="o w" style="font-size:158px;margin-top:10px">నడిచిన దారి!</div>
  <div style="margin-top:44px"><span class="strip" style="font-size:66px;padding:14px 40px 6px">2,600 కి.మీ. • చెప్పులు లేకుండా</span></div>
 </div>
</div><br>
<div id="h" class="t"><div class="bg"></div><div class="sh"></div>
 <div class="txt">
  <div class="o y" style="font-size:200px">రాముడు</div>
  <div class="o w" style="font-size:112px;margin-top:6px">నడిచిన దారి!</div>
  <div style="margin-top:30px"><span class="strip" style="font-size:44px;padding:10px 28px 4px">2,600 కి.మీ. • చెప్పులు లేకుండా</span></div>
 </div>
</div>
</body></html>
