<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Ramabhadra&family=Anek+Telugu:wght@800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#222}
.t{position:relative;overflow:hidden;font-family:'Ramabhadra',sans-serif;background:#000}
.bg{position:absolute;inset:0;background-size:cover;filter:saturate(1.3) contrast(1.15) brightness(1.05)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,rgba(0,0,0,0) 45%,rgba(0,0,0,.6) 100%)}
.l1{display:inline-block;background:#d71920;color:#fff;border-radius:14px;transform:rotate(-2deg);box-shadow:0 8px 0 rgba(0,0,0,.45);line-height:1.15}
.l2{color:#ffe100;line-height:1.1;text-shadow:6px 6px 0 #000,-6px 6px 0 #000,6px -6px 0 #000,-6px -6px 0 #000,0 9px 0 #000,0 -7px 0 #000,9px 0 0 #000,-9px 0 0 #000,0 14px 18px rgba(0,0,0,.8)}
.badge{position:absolute;display:flex;align-items:center;gap:12px;background:#fff;color:#111;font-family:'Anek Telugu';font-weight:800;border-radius:40px;box-shadow:0 6px 14px rgba(0,0,0,.5)}
.emoji{font-family:'Noto Color Emoji'}
svg{position:absolute;overflow:visible}
#v{width:1080px;height:1920px}
#v .bg{background-image:url(feet.png);background-position:center 70%}
#v .txt{position:absolute;top:300px;left:30px;right:30px;text-align:center}
#v .l1{font-size:78px;padding:10px 34px 4px}
#v .l2{font-size:128px;margin-top:26px}
#v .badge{left:40px;bottom:330px;font-size:52px;padding:10px 30px 8px 20px}
#h{width:1280px;height:720px}
#h .bgblur{position:absolute;inset:0;background:url(map.png) center 60%/1400px auto;filter:blur(16px) brightness(.45) saturate(1.2)}
#h .panel{position:absolute;left:0;top:0;bottom:0;width:560px;background:url(map.png) center 62%/760px auto;filter:saturate(1.3) contrast(1.15);box-shadow:20px 0 40px rgba(0,0,0,.6)}
#h .txt{position:absolute;top:110px;left:580px;right:20px;text-align:center}
#h .l1{font-size:54px;padding:8px 24px 2px}
#h .l2{font-size:84px;margin-top:22px}
#h .badge{right:28px;bottom:110px;font-size:36px;padding:8px 22px 6px 14px}
</style></head><body>
<div id="v" class="t"><div class="bg"></div><div class="vig"></div>
  <div class="txt"><div class="l1">రాముడు నడిచిన దారి</div><div class="l2">2,600 కి.మీ.<br>చెప్పులు లేకుండా!</div></div>
  <svg width="1080" height="1920" style="left:0;top:0">
    <defs><marker id="ah" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#ff1f1f" stroke="#fff" stroke-width=".6"/></marker></defs>
    <path d="M 880 900 C 990 1050, 960 1200, 760 1290" fill="none" stroke="#fff" stroke-width="34" stroke-linecap="round"/>
    <path d="M 880 900 C 990 1050, 960 1200, 760 1290" fill="none" stroke="#ff1f1f" stroke-width="22" stroke-linecap="round" marker-end="url(#ah)"/>
  </svg>
  <div class="badge"><span class="emoji">📍</span>మన లేపాక్షి కూడా!</div>
</div>
<br>
<div id="h" class="t"><div class="bgblur"></div><div class="panel"></div>
  <div class="txt"><div class="l1">రాముడు నడిచిన దారి</div><div class="l2">2,600 కి.మీ.<br>చెప్పులు లేకుండా!</div></div>
  <svg width="1280" height="720" style="left:0;top:0">
    <defs><marker id="ah2" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#ff1f1f" stroke="#fff" stroke-width=".6"/></marker></defs>
    <path d="M 640 520 C 610 600, 560 620, 470 560" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round"/>
    <path d="M 640 520 C 610 600, 560 620, 470 560" fill="none" stroke="#ff1f1f" stroke-width="16" stroke-linecap="round" marker-end="url(#ah2)"/>
  </svg>
  <div class="badge"><span class="emoji">📍</span>మన లేపాక్షి కూడా!</div>
</div>
</body></html>
