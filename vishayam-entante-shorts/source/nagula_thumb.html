<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anek+Telugu:wght@700;800&family=Ramabhadra&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#222}
  .t{position:relative;overflow:hidden;font-family:'Ramabhadra',sans-serif}
  .bg{position:absolute;inset:0;background-size:cover;filter:saturate(1.15) contrast(1.06)}
  .shade{position:absolute;inset:0}
  .title{color:#ffd27a;line-height:1.05;text-shadow:0 6px 0 #3a1a00,0 0 28px rgba(0,0,0,.85),0 0 4px #000}
  .pill{display:inline-block;background:#f2b544;color:#1a1310;border-radius:18px;line-height:1.25}
  .bless{color:#fff;font-family:'Anek Telugu',sans-serif;font-weight:700;text-shadow:0 3px 12px rgba(0,0,0,.9)}
  /* vertical cover 1080x1920 */
  #v{width:1080px;height:1920px}
  #v .bg{background-image:url(cobra_2.6.png);background-position:center 40%}
  #v .shade{background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 25%,rgba(0,0,0,0) 48%,rgba(0,0,0,.55) 62%,rgba(0,0,0,.7) 80%,rgba(0,0,0,.5) 100%)}
  #v .top{position:absolute;top:1080px;left:0;right:0;text-align:center}
  #v .title{font-size:190px}
  #v .pill{font-size:84px;padding:14px 44px;margin-top:26px;transform:rotate(-1.5deg)}
  #v .bless{position:absolute;left:0;right:0;top:1470px;text-align:center;font-size:62px}
  /* horizontal 1280x720 */
  #h{width:1280px;height:720px}
  #h .bg{background-image:url(cobra_2.6.png);background-size:760px auto;background-position:right -40px top -170px;background-repeat:no-repeat;left:520px}
  #h .shade{background:linear-gradient(90deg,#0b0d14 0%,#0b0d14 40%,rgba(11,13,20,.6) 55%,rgba(11,13,20,0) 72%)}
  #h .txt{position:absolute;left:56px;top:110px;width:720px}
  #h .title{font-size:128px}
  #h .pill{font-size:60px;padding:10px 32px;margin-top:22px}
  #h .bless{font-size:40px;margin-top:34px;text-shadow:none;color:#e8e2d4}
</style></head><body>
<div id="v" class="t"><div class="bg"></div><div class="shade"></div>
  <div class="top"><div class="title">నాగుల చవితి</div><div class="pill">పుట్టకే పూజ ఎందుకు?</div></div>
  <div class="bless">అసలు కారణం తెలుసా? 🙏</div>
</div>
<br>
<div id="h" class="t"><div class="bg"></div><div class="shade"></div>
  <div class="txt"><div class="title">నాగుల చవితి</div><div class="pill">పుట్టకే పూజ ఎందుకు?</div><div class="bless">వాసుకి • ఆదిశేషుడు • పుట్ట రహస్యం</div></div>
</div>
</body></html>
