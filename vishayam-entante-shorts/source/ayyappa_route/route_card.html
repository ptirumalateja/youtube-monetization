<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Ramabhadra&family=Anek+Telugu:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#fbf5e6;font-family:'Anek Telugu';position:relative;overflow:hidden}
.band{position:absolute;left:0;right:0;top:0;height:300px;background:linear-gradient(#f39a1e,#fbf5e6)}
.title{position:absolute;top:300px;width:100%;text-align:center;font-family:'Ramabhadra';font-size:104px;color:#7a1414;line-height:1.1}
.pill{position:absolute;top:440px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#d71920;color:#fff;font-weight:800;font-size:52px;padding:14px 40px 6px;border-radius:50px;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.emoji{font-family:'Noto Color Emoji'}
.list{position:absolute;top:600px;left:90px;right:60px}
.line{position:absolute;left:46px;top:50px;bottom:60px;width:12px;background:repeating-linear-gradient(#f39a1e 0 34px,transparent 34px 52px);border-radius:6px}
.stop{position:relative;display:flex;align-items:center;height:166px}
.n{flex:none;width:104px;height:104px;border-radius:50%;background:#7a1414;color:#ffd84a;font-weight:800;font-size:60px;display:flex;align-items:center;justify-content:center;padding-top:10px;border:7px solid #fbf5e6;box-shadow:0 0 0 5px #f39a1e;z-index:1}
.t{margin-left:36px}
.p{font-weight:800;font-size:68px;color:#1b1209;line-height:1.05}
.d{font-weight:600;font-size:44px;color:#5b4632;line-height:1.1;margin-top:14px}
.last .n{background:#d71920;color:#fff}
.foot{position:absolute;bottom:250px;width:100%;text-align:center;font-weight:800;font-size:44px;color:#7a1414}
</style></head><body>
<div class="band"></div>
<div class="title">శబరిమల అడవి దారి</div>
<div class="pill"><span class="emoji">📸</span> స్క్రీన్‌షాట్ తీసి సేవ్ చేసుకోండి</div>
<div class="list"><div class="line"></div>
 <div class="stop"><div class="n">1</div><div class="t"><div class="p">ఎరుమేలి</div><div class="d">ఇరుముడితో నడక మొదలు</div></div></div>
 <div class="stop"><div class="n">2</div><div class="t"><div class="p">అళుదా నది</div><div class="d">స్నానం చేసి ఒక రాయి తీసుకుంటారు</div></div></div>
 <div class="stop"><div class="n">3</div><div class="t"><div class="p">కల్లిడుంకున్ను</div><div class="d">ఆ రాయిని ఇక్కడ వదిలేస్తారు</div></div></div>
 <div class="stop"><div class="n">4</div><div class="t"><div class="p">కరిమల</div><div class="d">అన్నిటికన్నా కష్టమైన కొండ</div></div></div>
 <div class="stop"><div class="n">5</div><div class="t"><div class="p">పంబ</div><div class="d">పవిత్ర స్నానం</div></div></div>
 <div class="stop last"><div class="n">6</div><div class="t"><div class="p">18 మెట్లు</div><div class="d">అయ్యప్ప దర్శనం</div></div></div>
</div>
<div class="foot">@vishayamentantetelugu</div>
</body></html>
