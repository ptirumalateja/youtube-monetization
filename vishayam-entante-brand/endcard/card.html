<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anek+Telugu:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;font-family:'Anek Telugu',sans-serif}
.card{display:inline-flex;gap:22px;align-items:center;padding:22px 26px;border-radius:40px;background:rgba(8,8,10,.82);position:relative}
.b{display:flex;align-items:center;gap:12px;font-weight:800;font-size:46px;color:#fff;padding:14px 30px;border-radius:30px;background:rgba(255,255,255,.12);line-height:1}
.e{font-family:'Noto Color Emoji';font-size:44px}
.sub{background:#e62117}
.done .sub{background:#55575c}
.hand{position:absolute;right:30px;bottom:-62px;font-family:'Noto Color Emoji';font-size:86px;display:none}
.done .hand{display:block}
</style></head><body>
<div id="a" class="card"><div class="b"><span class="e">👍</span>లైక్</div><div class="b"><span class="e">↗️</span>షేర్</div><div class="b sub"><span class="e">🔔</span>సబ్‌స్క్రైబ్</div><div class="hand">👆</div></div>
<div style="height:400px"></div>
<div class="done"><div id="b" class="card"><div class="b"><span class="e">👍</span>లైక్</div><div class="b"><span class="e">↗️</span>షేర్</div><div class="b sub"><span class="e">✅</span>సబ్‌స్క్రైబ్</div><div class="hand">👆</div></div></div>
</body></html>
