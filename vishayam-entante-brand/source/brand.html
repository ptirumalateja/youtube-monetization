<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anek+Telugu:wght@500;700;800&family=Ramabhadra&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0d1320;--ink2:#18223a;--gold:#f2b544;--gold2:#ffd27a;--cream:#f6ecdc}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#333;font-family:'Anek Telugu',sans-serif}
  .art{position:relative;overflow:hidden}
  /* ---------- icon (speech bubble with వి) ---------- */
  .bubble{position:absolute}
  .bubble svg{width:100%;height:100%;display:block}
  .vi{position:absolute;left:0;right:0;text-align:center;font-family:'Ramabhadra',sans-serif;color:var(--ink);line-height:1}
  /* avatar */
  #avatar{width:800px;height:800px;background:radial-gradient(circle at 50% 38%,#223055 0%,var(--ink) 70%)}
  #avatar .bubble{left:110px;top:100px;width:580px;height:580px}
  #avatar .vi{top:228px;font-size:250px}
  /* watermark (transparent) */
  #wm{width:600px;height:600px;background:transparent}
  #wm .bubble{left:20px;top:20px;width:560px;height:560px}
  #wm .vi{top:142px;font-size:240px}
  /* banner */
  #banner{width:2560px;height:1440px;background:
     radial-gradient(ellipse 900px 380px at 50% 50%,rgba(242,181,68,.20),rgba(242,181,68,0) 70%),
     linear-gradient(180deg,#0a0f1a 0%,var(--ink) 40%,var(--ink2) 100%)}
  #banner .streak{position:absolute;left:0;right:0;top:960px;height:3px;
     background:linear-gradient(90deg,rgba(242,181,68,0),rgba(242,181,68,.55) 30%,rgba(255,210,122,.9) 50%,rgba(242,181,68,.55) 70%,rgba(242,181,68,0));filter:blur(1px)}
  #banner .safe{position:absolute;left:507px;top:508px;width:1546px;height:423px;display:flex;align-items:center;justify-content:center;gap:56px}
  #banner .bubble{position:relative;width:300px;height:300px;flex:none}
  #banner .vi{top:76px;font-size:132px}
  #banner .txt{display:flex;flex-direction:column;gap:6px}
  #banner .te{font-family:'Ramabhadra',sans-serif;font-size:132px;line-height:1.15;color:var(--cream);letter-spacing:1px}
  #banner .te b{color:var(--gold);font-weight:400}
  #banner .en{font-weight:700;font-size:40px;letter-spacing:16px;color:var(--gold)}
  #banner .tag{font-weight:500;font-size:40px;white-space:nowrap;color:#cfd6e6;margin-top:10px}
  /* show-safe guide (off in export) */
</style></head>
<body>


<div id="avatar" class="art"><canvas id="avatarCv" width="800" height="800"></canvas></div>
<br>
<div id="wm" class="art"><canvas id="wmCv" width="600" height="600"></canvas></div>
<br>
<div id="banner" class="art">
  <div class="streak"></div>
  <div class="safe">
    <canvas id="bannerCv" width="300" height="300" style="flex:none"></canvas>
    <div class="txt">
      <div class="te">విషయం <b>ఏంటంటే</b></div>
      <div class="en">VISHAYAM ENTANTE</div>
      <div class="tag">వార్తలు • చరిత్ర • రహస్యాలు • భక్తి — ఏ విషయమైనా… అర్థమయ్యేలా</div>
    </div>
  </div>
</div>
<script>
// Speech bubble: body centred at (50,44), smooth curved tail at lower-left. No decorative dot.
const BUBBLE = "M50 6 C76.5 6 94 22.5 94 44 C94 65.5 76.5 82 50 82 C44.6 82 39.5 81.2 34.8 79.8 C29.2 85.2 21.4 89.4 12.5 91 C16.8 86 19.6 80.6 20.5 74.8 C11.5 67.6 6 56.8 6 44 C6 22.5 23.5 6 50 6 Z";
const BODY = {cx:50, cy:44, h:76};
async function drawIcon(cv, {pad=0.1, bg=null, inkRatio=0.46, yNudge=0}={}) {
  const S = cv.width, ctx = cv.getContext('2d');
  if (bg) { const g=ctx.createRadialGradient(S/2,S*0.38,0,S/2,S/2,S*0.72); g.addColorStop(0,'#223055'); g.addColorStop(1,'#0d1320'); ctx.fillStyle=g; ctx.fillRect(0,0,S,S); }
  const k = S*(1-2*pad)/100, ox = S*pad, oy = S*pad + yNudge*S;
  ctx.save(); ctx.translate(ox,oy); ctx.scale(k,k);
  const gr = ctx.createLinearGradient(6,6,94,91); gr.addColorStop(0,'#ffd98a'); gr.addColorStop(.55,'#f2b544'); gr.addColorStop(1,'#d9922a');
  ctx.fillStyle = gr; ctx.fill(new Path2D(BUBBLE)); ctx.restore();
  // monogram: size so ink height = inkRatio * body height, ink centred on body centre
  await document.fonts.load('400 100px Ramabhadra', 'వి');
  const probe = 100; ctx.font = `400 ${probe}px Ramabhadra`;
  let m = ctx.measureText('వి'); const inkH = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
  const size = probe * (inkRatio*BODY.h*k) / inkH; ctx.font = `400 ${size}px Ramabhadra`;
  m = ctx.measureText('వి');
  const cx = ox + BODY.cx*k, cy = oy + BODY.cy*k;
  const x = cx - (m.actualBoundingBoxRight - m.actualBoundingBoxLeft)/2;
  const y = cy + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent)/2;
  ctx.fillStyle = '#0d1320'; ctx.textBaseline = 'alphabetic'; ctx.fillText('వి', x, y);
}
window.ready = (async () => {
  await document.fonts.ready;
  await drawIcon(document.getElementById('avatarCv'), {pad:0.12, bg:true, yNudge:0.012});
  await drawIcon(document.getElementById('wmCv'), {pad:0.02});
  await drawIcon(document.getElementById('bannerCv'), {pad:0.02});
})();
</script>
</body></html>
