<script type="module">
// Slow Light reel: "Last 1%" (wireman series).
// window.renderAt(t, samples) -> JPEG dataURL of the frame at video time t (s).
// Street world: metres, the street runs along +x, buildings on the -z side, camera on the +z side.
// Bedroom world: a phone lying on a nightstand; its screen shows the street (render target).
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';

const Q = new URLSearchParams(location.search);
const W = +(Q.get('w')||1080), H = +(Q.get('h')||1920);
const DUR = 24.5, FPS = 30;
const T_PLUG = 14.4;     // plug goes in: the beat drop
const T_SW = 16.4;       // the street becomes a phone screen
const T_RESET = 22.6;    // (screen dimmed) the street inside the phone restarts at the bench
const BEATS = [3.5, 5.5, 7.5, 9.4, 10.8, 12.0];   // each one the windows dim a notch

// ---------- helpers ----------
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,u)=>a+(b-a)*u;
const sstep=(a,b,x)=>{const u=clamp((x-a)/(b-a),0,1);return u*u*(3-2*u);};
const ease=u=>u<0.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function pchip(keys){
  const n=keys.length,x=keys.map(k=>k[0]),y=keys.map(k=>k[1]),d=[],m=new Array(n);
  for(let i=0;i<n-1;i++)d.push((y[i+1]-y[i])/(x[i+1]-x[i]));
  m[0]=d[0];m[n-1]=d[n-2];
  for(let i=1;i<n-1;i++){ if(d[i-1]*d[i]<=0)m[i]=0; else{const w1=2*(x[i+1]-x[i])+(x[i]-x[i-1]),w2=(x[i+1]-x[i])+2*(x[i]-x[i-1]);m[i]=(w1+w2)/(w1/d[i-1]+w2/d[i]);} }
  return t=>{ if(t<=x[0])return y[0]; if(t>=x[n-1])return y[n-1];
    let i=0;while(t>x[i+1])i++; const h=x[i+1]-x[i],s=(t-x[i])/h,s2=s*s,s3=s2*s;
    return (2*s3-3*s2+1)*y[i]+(s3-2*s2+s)*h*m[i]+(-2*s3+3*s2)*y[i+1]+(s3-s2)*h*m[i+1]; };
}

// ---------- story clocks (street time s) ----------
// sprint, a stumble to one knee at about 10.8 s, then a drag to the charger
const heroX=pchip([[0,0],[1.45,0],[1.95,0.9],[2.65,4.2],[3.85,12],[9.4,48.2],[10.35,53.3],[10.8,54.4],[11.75,54.7],[12.6,56.8],[13.0,57.4],[40,57.4]]);
// battery inside the last 1%: 1.00 -> 0.01 (only goes down), then charging
const pctK=pchip([[0,1.0],[1.5,0.96],[3.5,0.84],[5.5,0.70],[7.5,0.54],[9.4,0.38],[10.8,0.22],[12.0,0.10],[13.2,0.04],[14.35,0.01]]);
const pct=s=>s<0?1:pctK(s);
const charge=s=>s<T_PLUG?0:1-Math.exp(-(s-T_PLUG)/1.6);   // 0..1 surge after the plug
// window light level: steps down at each beat; near dark from 12 s (sky and the charger stay)
function lightLevel(s){const lv=[1,0.8,0.62,0.46,0.3,0.16,0.06];let k=0;for(const b of BEATS)if(s>=b)k++;return lv[k];}
const HURDLE_X=19, PUDDLE_X=36;
window.timing=()=>({BEATS,T_PLUG,T_SW,T_RESET,DUR,lampOff:window.lampOff(),stumble:10.85,kneelUp:11.6,lampX:LAMPS.map(L=>L.x),PX:PX()});

// ---------- renderer & composers ----------
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(W,H);

const scene=new THREE.Scene();
const FOG=new THREE.Color('#1b2944');

// A: street straight to the screen.  B: street into a render target (linear), shown on the phone.
const compA=new EffectComposer(renderer);compA.addPass(new RenderPass(scene,camera));
const bloomA=new UnrealBloomPass(new THREE.Vector2(W/2,H/2),0.42,0.5,0.8);compA.addPass(bloomA);compA.addPass(new OutputPass());
const compB=new EffectComposer(renderer);compB.renderToScreen=false;compB.addPass(new RenderPass(scene,camera));

// ---------- sky (blue hour, never black) ----------
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,uniforms:{lv:{value:1}},
  vertexShader:`varying vec3 vd;void main(){vd=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);gl_Position.z=gl_Position.w;}`,
  fragmentShader:`varying vec3 vd;uniform float lv;
  void main(){vec3 d=normalize(vd);float el=d.y;
    vec3 zen=vec3(0.035,0.055,0.12),hor=vec3(0.20,0.20,0.30),glow=vec3(0.42,0.26,0.20);
    vec3 c=mix(hor,zen,smoothstep(0.,0.5,el));
    c+=glow*exp(-max(el,0.)*9.)*0.55;            // warm city glow on the horizon
    c*=0.55+0.45*lv;
    gl_FragColor=vec4(c,1.);}`});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(2000,32,16),skyMat));

// ---------- textures ----------
function canvasTex(size,draw,rep){const c=document.createElement('canvas');c.width=c.height=size;draw(c.getContext('2d'),size);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;if(rep)t.repeat.set(...rep);return t;}
const asphalt=canvasTex(256,(g,s)=>{const R=rng(3);const im=g.createImageData(s,s);for(let i=0;i<s*s;i++){const v=70+(R()-0.5)*40;im.data[i*4]=im.data[i*4+1]=im.data[i*4+2]=v;im.data[i*4+3]=255;}g.putImageData(im,0,0);},[60,8]);asphalt.colorSpace=THREE.SRGBColorSpace;
const paving=canvasTex(256,(g,s)=>{g.fillStyle='#8a8f99';g.fillRect(0,0,s,s);const R=rng(8);for(let y=0;y<4;y++)for(let x=0;x<4;x++){const v=120+R()*40;g.fillStyle=`rgb(${v},${v},${v+6})`;g.fillRect(x*64+2,y*64+2,60,60);}},[80,3]);paving.colorSpace=THREE.SRGBColorSpace;
function glowTex(inner,outer){return canvasTex(256,(g,s)=>{const gr=g.createRadialGradient(128,128,0,128,128,128);gr.addColorStop(0,inner);gr.addColorStop(0.25,outer);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,256,256);});}

  const v=g.getImageData(0,0,s,s);for(let y=0;y<s;y++){const f=Math.pow(1-y/s,1.5)*Math.min(1,y/6);for(let x=0;x<s;x++)v.data[(y*s+x)*4+3]*=f;}g.putImageData(v,0,0);});

// every light source in the street has a rank; it is on while rank < light level (and relights in a wave after the plug)

function lightOn(src,s){

  if(s>=T_PLUG){const tOn=T_PLUG+0.08+Math.abs(PX()-src.x)/38;const fl=s<tOn?0:(s<tOn+0.12?(Math.sin((s-tOn)*160)>0?1:0.3):1);
    const was=offAt(src,T_PLUG-0.01);return Math.max(was,fl*sstep(tOn,tOn+0.02,s));}
  return offAt(src,s);
}
function offAt(src,s){
  if(src.kind==='lamp'){const a=s-src.tOff;if(a<0)return 1;if(a<0.22)return Math.sin(a*120+src.x)>0?0.85:0.1;return 0;}

  // it just went off at the last beat: a short flicker first
  let b=-1;for(const bt of BEATS)if(s>=bt)b=bt;if(b<0)return 1;const a=s-b-src.rank*0.25;
  if(a<0)return 1;if(a<0.18)return Math.sin(a*140+src.rank*20)>0?0.8:0.15;return 0;}

// ---------- buildings & windows ----------

  g.fillStyle='rgba(0,0,0,0.45)';g.fillRect(0,0,s*0.28,s);g.fillStyle='#000';g.fillRect(0,0,s,8);g.fillRect(0,s-8,s,8);g.fillRect(0,0,8,s);g.fillRect(s-8,0,8,s);g.fillRect(s/2-4,0,8,s);g.fillRect(0,s*0.4,s,7);});
winTex.wrapS=winTex.wrapT=THREE.ClampToEdgeWrapping;
// shop front: warm interior, shelves, a counter, mullions
const shopTex=canvasTex(256,(g,s)=>{const gr=g.createLinearGradient(0,0,0,s);gr.addColorStop(0,'#9a9a9a');gr.addColorStop(0.55,'#ffffff');gr.addColorStop(1,'#7a7a7a');g.fillStyle=gr;g.fillRect(0,0,s,s);
  const R=rng(44);g.fillStyle='rgba(0,0,0,0.35)';for(let y=0.22;y<0.6;y+=0.13)g.fillRect(0,y*s,s,5);
  for(let i=0;i<40;i++){g.fillStyle=`rgba(0,0,0,${0.15+R()*0.3})`;g.fillRect(R()*s,(0.12+Math.floor(R()*3)*0.13)*s,6+R()*14,0.09*s);}
  g.fillStyle='rgba(0,0,0,0.5)';g.fillRect(0,0.72*s,s,0.28*s);
  g.fillStyle='#000';g.fillRect(0,0,s,10);g.fillRect(0,s-10,s,10);for(let k=0;k<=4;k++)g.fillRect(k*s/4-5,0,10,s);});
shopTex.wrapS=shopTex.wrapT=THREE.ClampToEdgeWrapping;
const winMat=new THREE.MeshBasicMaterial({color:'#ffffff',map:winTex,fog:true});
const MAXW=1400;const wins=new THREE.InstancedMesh(winGeo,winMat,MAXW);wins.frustumCulled=false;scene.add(wins);
const shops=new THREE.InstancedMesh(winGeo,new THREE.MeshBasicMaterial({color:'#ffffff',map:shopTex,fog:true}),80);shops.frustumCulled=false;scene.add(shops);
const winList=[],shopList=[];
{const R=rng(17);let x=-24;const m=new THREE.Matrix4(),q=new THREE.Quaternion();
  while(x<120){const w=7+R()*7,h=9+R()*12,dz=-3.2-R()*0.6;
    const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,6),facadeMat[Math.floor(R()*facadeMat.length)]);b.position.set(x+w/2,h/2,dz-3);scene.add(b);
    // cornice
    const c=new THREE.Mesh(new THREE.BoxGeometry(w+0.2,0.3,0.4),new THREE.MeshStandardMaterial({color:'#4a5168',roughness:0.8}));c.position.set(x+w/2,h-0.2,dz+0.1);scene.add(c);
    // shop front on the ground floor
    const shopW=w*0.7;
    const shop={x:x+w/2,rank:R(),kind:'shop',col:new THREE.Color(R()<0.7?'#e8924a':'#f0b36a').multiplyScalar(0.62),idx:shopList.length};
    shopList.push({pos:[x+w/2,1.45,dz+0.02],sc:[shopW,2.1],src:shop});sources.push(shop);
    const aw=new THREE.Mesh(new THREE.BoxGeometry(shopW+0.4,0.12,0.9),new THREE.MeshStandardMaterial({color:R()<0.5?'#7a3b32':'#2f5a5a',roughness:0.7}));aw.position.set(x+w/2,2.75,dz+0.45);aw.rotation.x=0.25;scene.add(aw);
    const cols=Math.max(2,Math.floor(w/1.9)),rows=Math.floor((h-4)/2.6);
    for(let r=0;r<rows;r++)for(let k=0;k<cols;k++){if(winList.length>=MAXW)break;
      const wx=x+(k+0.5)*w/cols,wy=4+r*2.6;const warm=R()<0.82;
      const src={x:wx,rank:R(),kind:'win',col:new THREE.Color(warm?(R()<0.5?'#f39a4a':'#f5bd6e'):'#7fa6f0').multiplyScalar(0.4+R()*0.45),idx:winList.length};
      if(R()<0.22)src.rank=2; // a few windows are dark all the time
      winList.push({pos:[wx,wy,dz+0.02],sc:[0.95,1.35],src});sources.push(src);}
    x+=w+0.15+R()*0.4;}
  winList.forEach((wd,i)=>{m.compose(new THREE.Vector3(...wd.pos),q,new THREE.Vector3(wd.sc[0],wd.sc[1],1));wins.setMatrixAt(i,m);wins.setColorAt(i,new THREE.Color(0,0,0));});
  wins.count=winList.length;
  shopList.forEach((wd,i)=>{m.compose(new THREE.Vector3(...wd.pos),q,new THREE.Vector3(wd.sc[0],wd.sc[1],1));shops.setMatrixAt(i,m);shops.setColorAt(i,new THREE.Color(0,0,0));});shops.count=shopList.length;}

// ---------- street lamps ----------
const LAMPS=[];const poleMat=new THREE.MeshStandardMaterial({color:'#20242e',roughness:0.5,metalness:0.6});
const headMat=new THREE.MeshBasicMaterial({color:'#ffe2b0'});
for(let k=0;k<10;k++){const x=-1+9*k;
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.07,4.3,8),poleMat);pole.position.set(x,2.15,-2.65);scene.add(pole);
  const arm=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.06,0.9),poleMat);arm.position.set(x,4.25,-2.25);scene.add(arm);
  const head=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.1,0.22),headMat.clone());head.position.set(x,4.2,-1.85);scene.add(head);
  const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,fog:false}));glow.scale.set(2.4,2.4,1);glow.position.set(x,4.12,-1.85);scene.add(glow);
  const pool=new THREE.Mesh(new THREE.PlaneGeometry(7,7),new THREE.MeshBasicMaterial({map:POOL,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,opacity:0.55}));pool.rotation.x=-Math.PI/2;pool.position.set(x,GY+0.01,-1.2);scene.add(pool);
  // wet-road reflection streak
  const st=new THREE.Mesh(new THREE.PlaneGeometry(0.7,5.5),new THREE.MeshBasicMaterial({map:STREAK,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,opacity:0.5}));st.rotation.x=-Math.PI/2;st.position.set(x,0.02,4.2);scene.add(st);
  const src={x,kind:'lamp',tOff:Infinity};
  src.set=v=>{head.material.color.set('#ffe2b0').multiplyScalar(0.12+0.88*v);glow.material.opacity=0.95*v;pool.material.opacity=0.55*v;st.material.opacity=0.5*v;};
  sources.push(src);LAMPS.push(src);}

// ---------- props: start bench, barrier, puddle ----------
const benchMat=new THREE.MeshStandardMaterial({color:'#6b4a33',roughness:0.7});const ironMat=new THREE.MeshStandardMaterial({color:'#1d2129',roughness:0.5,metalness:0.6});
{const g=new THREE.Group();const seat=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.06,0.45),benchMat);seat.position.set(0,0.46,0);g.add(seat);
  const back=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.38,0.05),benchMat);back.position.set(0,0.78,-0.22);back.rotation.x=-0.12;g.add(back);
  for(const sx of[-0.8,0.8]){const l=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.46,0.45),ironMat);l.position.set(sx,0.23,0);g.add(l);}
  g.position.set(0,GY,-1.0);scene.add(g);}
{const g=new THREE.Group();const stripe=canvasTex(128,(c,s)=>{for(let i=0;i<8;i++){c.fillStyle=i%2?'#efe3c8':'#d9a43a';c.beginPath();c.moveTo(i*32-64,0);c.lineTo(i*32-32,0);c.lineTo(i*32+32,s);c.lineTo(i*32,s);c.fill();}});
  const bar=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.22,1.9),new THREE.MeshStandardMaterial({map:stripe,roughness:0.6,emissive:'#3a2a10',emissiveIntensity:0.6}));bar.position.set(0,0.62,0);g.add(bar);

  g.position.set(HURDLE_X,GY,0);scene.add(g);}
const puddle=new THREE.Mesh(new THREE.CircleGeometry(1,40),new THREE.MeshStandardMaterial({color:'#11182a',roughness:0.05,metalness:0.9}));puddle.rotation.x=-Math.PI/2;puddle.scale.set(1.3,0.8,1);puddle.position.set(PUDDLE_X,GY+0.005,0.05);scene.add(puddle);
const ripples=[0,1,2].map(i=>{const r=new THREE.Mesh(new THREE.RingGeometry(0.9,1,40),new THREE.MeshBasicMaterial({color:'#cfe6ff',transparent:true,opacity:0,depthWrite:false}));r.rotation.x=-Math.PI/2;r.position.set(PUDDLE_X,GY+0.01,0.05);scene.add(r);return r;});

// ---------- wireman rig ----------
const L={thigh:0.46,shin:0.46,torso:0.56,neck:0.07,head:0.125,upper:0.31,fore:0.29};
const wireMat=new THREE.MeshStandardMaterial({color:'#9fb4c6',roughness:0.35,metalness:0,emissive:new THREE.Color('#9fdcff'),emissiveIntensity:1});
function makeFigure(mat,r){
  const g=new THREE.Group();const cyl=new THREE.CylinderGeometry(r,r,1,10,1,true),sph=new THREE.SphereGeometry(r,12,8);
  const bones=[],joints=[];for(let i=0;i<9;i++){const b=new THREE.Mesh(cyl,mat);g.add(b);bones.push(b);}
  for(let i=0;i<12;i++){const j=new THREE.Mesh(sph,mat);g.add(j);joints.push(j);}
  const head=new THREE.Mesh(new THREE.SphereGeometry(L.head,24,16),mat);g.add(head);
  return {g,bones,joints,head};
}
const UP=new THREE.Vector3(0,1,0),tmp=new THREE.Vector3();
function bone(m,a,b){tmp.subVectors(b,a);const len=tmp.length();m.position.addVectors(a,b).multiplyScalar(0.5);m.scale.set(1,Math.max(len,1e-4),1);m.quaternion.setFromUnitVectors(UP,tmp.normalize());}
const P0={p:0.05,tilt:0,aL:0.05,aR:-0.05,kL:0.05,kR:0.05,sL:0.12,sR:-0.05,eL:0.2,eR:0.2,dy:0};
const POSES={
  stand:{...P0},
