// Frozen Lightning (20 s): storm strike -> sand grains -> quartz lattice melts and freezes into glass -> cut-away fulgurite -> rise back to the storm (loop).
// Three worlds at three scales (desert D in metres, grains G in mm, lattice L in arbitrary units), each with its own camera,
// composited with zoom-dissolves, then bloom + grade. window.renderAt(t) returns {img, proj}.
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';

const q=new URLSearchParams(location.search); const W=+q.get('w')||540, H=+q.get('h')||960; const SC=H/1280;
const renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true}); renderer.setPixelRatio(1); renderer.setSize(W,H); document.body.appendChild(renderer.domElement);
renderer.autoClear=true;
const FOV=50, TAN=Math.tan(FOV*Math.PI/360), UK=(H/2)/TAN;
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ss=(a,b,x)=>{const k=clamp((x-a)/(b-a));return k*k*(3-2*k)};
const lerp=(a,b,k)=>a+(b-a)*k;
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const NOISE=`
float hash3(vec3 p){ p=fract(p*0.3183099+vec3(.1,.2,.3)); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }

 return mix(mix(mix(hash3(i),hash3(i+vec3(1,0,0)),f.x),mix(hash3(i+vec3(0,1,0)),hash3(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(hash3(i+vec3(0,0,1)),hash3(i+vec3(1,0,1)),f.x),mix(hash3(i+vec3(0,1,1)),hash3(i+vec3(1,1,1)),f.x),f.y),f.z); }

vec3 vnoise3(vec3 p){ return vec3(vnoise(p), vnoise(p+vec3(31.4,17.2,5.9)), vnoise(p+vec3(-11.3,47.1,23.7)))*2.-1.; }
`;
// ------------------------------------------------------------------ point sprites (bolt, arcs, dust)
let PMK=0;
function pointsMat(u,frag){
  const key='pm'+(PMK++);
  const mat=new THREE.ShaderMaterial({transparent:true,depthTest:true,depthWrite:false,blending:THREE.AdditiveBlending,
    uniforms:Object.assign({uSize:{value:1},uMin:{value:1.2*SC},uMax:{value:60*SC},uAmp:{value:1},uK:{value:UK},uLead:{value:1},uTime:{value:0},uDrift:{value:new THREE.Vector3()}},u||{}),
    vertexShader:`attribute vec3 color; attribute float aSize; attribute float aS; varying vec3 vc; uniform float uSize,uMin,uMax,uAmp,uK,uLead,uTime; uniform vec3 uDrift;
      void main(){ vec3 p=position+uDrift*(0.6+0.8*fract(aS*7.13)); vec4 mv=modelViewMatrix*vec4(p,1.0); float d=max(-mv.z,0.01);
        float raw=aSize*uSize*uK/d; float px=clamp(raw,uMin,uMax); gl_PointSize=px;
        float lead=smoothstep(uLead+0.002,uLead-0.004,aS);
        vc=color*uAmp*lead*(raw<uMin? max(0.25,raw/uMin):1.0)*(px<raw? (px*px)/(raw*raw):1.0)*(1.0+0.0*uTime);
        gl_Position=projectionMatrix*mv; }`,
    fragmentShader:frag||`varying vec3 vc; void main(){ vec2 c=gl_PointCoord-0.5; float r=length(c)*2.0; float a=smoothstep(1.0,0.0,r); a*=a; gl_FragColor=vec4(vc*a,1.0);} `});
  mat.customProgramCacheKey=()=>key; return mat;
}
function makePoints(arr,mat,scene){ // arr: [{p:[x,y,z],c:[r,g,b],s,aS}]
  const n=arr.length, g=new THREE.BufferGeometry(); const pos=new Float32Array(n*3), col=new Float32Array(n*3), sz=new Float32Array(n), as=new Float32Array(n);
  arr.forEach((o,i)=>{pos.set(o.p,i*3); col.set(o.c,i*3); sz[i]=o.s; as[i]=o.aS||0;});
  g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setAttribute('color',new THREE.BufferAttribute(col,3)); g.setAttribute('aSize',new THREE.BufferAttribute(sz,1)); g.setAttribute('aS',new THREE.BufferAttribute(as,1));
  const pts=new THREE.Points(g,mat); pts.frustumCulled=false; scene.add(pts); return pts;
}
// ------------------------------------------------------------------ lightning path generator (midpoint displacement + branches)
function boltPath(a,b,disp,levels,R){
  let pts=[a.clone(),b.clone()]; let d=disp;
  for(let l=0;l<levels;l++){ const np=[pts[0]];
    for(let i=0;i<pts.length-1;i++){ const m=pts[i].clone().lerp(pts[i+1],0.5); m.x+=(R()-0.5)*2*d; m.y+=(R()-0.5)*0.6*d; m.z+=(R()-0.5)*2*d; np.push(m,pts[i+1]); }
    pts=np; d*=0.55; }
  return pts;
}
function sampleLine(pts,step,cb){ let acc=0; const L=[0]; for(let i=1;i<pts.length;i++){acc+=pts[i].distanceTo(pts[i-1]); L.push(acc);}
  for(let i=0;i<pts.length-1;i++){ const seg=L[i+1]-L[i]; const n=Math.max(1,Math.ceil(seg/step)); for(let k=0;k<n;k++){ const f=k/n; cb(pts[i].clone().lerp(pts[i+1],f),(L[i]+seg*f)/acc); } }
  return acc; }
function buildBolt(R,top,bottom,disp,levels,brTot){
  const main=boltPath(top,bottom,disp,levels,R); const polys=[{pts:main,s0:0,s1:1,br:1,w:1}];
  for(let b=0;b<brTot;b++){ const i0=Math.floor(main.length*(b%2? 0.08+R()*0.7 : 0.80+R()*0.17)); const st=main[i0]; const s0=i0/(main.length-1);
    const rem=main[main.length-1].clone().sub(st); const len=rem.length()*(0.12+R()*0.3);
    const dir=rem.normalize().add(V((R()-0.5)*1.6,-0.1-R()*0.3,(R()-0.5)*1.6)).normalize(); const en=st.clone().addScaledVector(dir,len);
    polys.push({pts:boltPath(st,en,len*0.18,6,R),s0,s1:s0+0.18*(1-s0),br:0.25+R()*0.35,w:0.6}); }
  return {polys,main};
}
// camera-facing ribbons (no beading at any distance): core + halo share the geometry, different widths/profiles

    for(let i=0;i<n;i++){ const p=P.pts[i]; const q=i<n-1?P.pts[i+1]:p.clone().add(p.clone().sub(P.pts[i-1])); const u=i/(n-1); const taper=P.w*(P.w<1?(1-0.75*u):1);
      for(const sd of [-1,1]){ pos.push(p.x,p.y,p.z); nxt.push(q.x,q.y,q.z); side.push(sd); as.push(P.s0+(P.s1-P.s0)*u); br.push(P.br*(P.w<1?(1-0.85*u):1)*taper); } }
    for(let i=0;i<n-1;i++){ const a=base+i*2; idx.push(a,a+1,a+2, a+1,a+3,a+2); } base+=n*2; }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setAttribute('aNext',new THREE.Float32BufferAttribute(nxt,3)); g.setAttribute('aSide',new THREE.Float32BufferAttribute(side,1)); g.setAttribute('aS',new THREE.Float32BufferAttribute(as,1)); g.setAttribute('aBr',new THREE.Float32BufferAttribute(br,1)); g.setIndex(idx);
  const m=new THREE.ShaderMaterial({transparent:true,depthTest:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,
    uniforms:Object.assign({uW:{value:0.2},uMinPx:{value:1.0},uK:{value:UK},uRes:{value:new THREE.Vector2(W,H)},uAmp:{value:1},uLead:{value:1},uCol:{value:new THREE.Vector3(0.82,0.80,1.0)}},u||{}),
    vertexShader:`attribute vec3 aNext; attribute float aSide,aS,aBr; uniform float uW,uMinPx,uK,uAmp,uLead; uniform vec2 uRes; varying float vX,vB;
      void main(){ vec4 c0=projectionMatrix*modelViewMatrix*vec4(position,1.); vec4 c1=projectionMatrix*modelViewMatrix*vec4(aNext,1.);
        float w0=max(c0.w,0.02), w1=max(c1.w,0.02); vec2 s0=c0.xy/w0*uRes*0.5, s1=c1.xy/w1*uRes*0.5; vec2 dir=s1-s0; dir=length(dir)>1e-4?normalize(dir):vec2(0.,1.);

        float lead=smoothstep(uLead+0.002,uLead-0.004,aS); vB=aBr*uAmp*lead*min(1.0,raw/uMinPx); }`,
    fragmentShader:frag});
  const mesh=new THREE.Mesh(g,m); mesh.frustumCulled=false; scene.add(mesh); return mesh; }
const RIB_CORE=`uniform vec3 uCol; varying float vX,vB; void main(){ float x=abs(vX); float a=1.0-smoothstep(0.25,1.0,x); gl_FragColor=vec4(uCol*vB*a,1.0);} `;
const RIB_HALO=`uniform vec3 uCol; varying float vX,vB; void main(){ float x=abs(vX); float a=exp(-x*x*4.0)-0.018; gl_FragColor=vec4(uCol*vB*max(a,0.)*0.10,1.0);} `;

// ================================================================== WORLD D: desert storm + fulgurite (metres)
const sD=new THREE.Scene(); const cD=new THREE.PerspectiveCamera(FOV,W/H,0.03,9000);
const RD=rnd(77);
function hD(x,z){ const r=Math.hypot(x,z);
  let h=1.6*Math.sin(x*0.021+z*0.013)+1.1*Math.sin(x*0.047-z*0.031+1.3)+0.5*Math.sin(x*0.11+z*0.07+2.1)+0.25*Math.sin(z*0.23+x*0.05);
  h+=Math.max(0,Math.sin(x*0.006+z*0.009)*9-2);
  return h*ss(9,40,r); }
const TERR_V=`varying vec3 vP; varying vec3 vN; void main(){ vec4 w=modelMatrix*vec4(position,1.); vP=w.xyz; vN=normalize(mat3(modelMatrix)*normal); gl_Position=projectionMatrix*viewMatrix*w; }`;
const terrU={uFlash:{value:0},uHeat:{value:0},uLP:{value:V(0,45,0)},uGhost:{value:0}};
const terrMat=new THREE.ShaderMaterial({uniforms:terrU,vertexShader:TERR_V,fragmentShader:NOISE+`
 uniform float uFlash,uHeat; uniform vec3 uLP; varying vec3 vP; varying vec3 vN;

  float rip=0.5+0.5*sin(p.z*2.6+p.x*0.7+vnoise(p*0.35)*5.0);
  vec3 alb=vec3(0.46,0.39,0.30)*(0.78+0.30*rip)*(0.82+0.36*vnoise(p*6.0));
  vec3 sky=vec3(0.030,0.038,0.070)*(0.45+0.55*n.y);
  vec3 L=uLP-p; float dl=length(L); L/=dl; float fl=uFlash*max(dot(n,L),0.)*1100./(dl*dl+500.)*(0.35+0.65*exp(-length(p.xz)/40.));
  vec3 col=alb*(sky+fl*vec3(0.78,0.78,1.0));
  vec3 Vv=normalize(cameraPosition-p); vec3 Hh=normalize(L+Vv); col+=uFlash*pow(max(dot(n,Hh),0.),30.)*vec3(0.55,0.55,0.8)*0.35*exp(-length(p.xz)/30.);
  float r=length(p.xz);
  col+=uHeat*(vec3(1.0,0.36,0.07)*exp(-r*r/0.35)*2.2+vec3(1.,0.45,0.12)*exp(-r*r/5.)*0.25);
  float dist=length(p-cameraPosition); col=mix(col,vec3(0.010,0.013,0.028)+uFlash*vec3(0.012,0.012,0.02),1.-exp(-dist/1400.));

function terrainMesh(size,seg,drop){ const g=new THREE.PlaneGeometry(size,size,seg,seg); g.rotateX(-Math.PI/2); const p=g.attributes.position;

terrainMesh(44,220,false); terrainMesh(5000,260,true);
// sky dome
const skyU={uFlash:{value:0},uTime:{value:0},uBoltDir:{value:V(-20,420,-60).normalize()}};
const sky=new THREE.Mesh(new THREE.SphereGeometry(6000,64,32),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,uniforms:skyU,
  vertexShader:`varying vec3 vD; void main(){ vD=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader:NOISE+`uniform float uFlash,uTime; uniform vec3 uBoltDir; varying vec3 vD;
  void main(){ vec3 d=normalize(vD); float h=d.y;
   vec3 base=mix(vec3(0.012,0.016,0.034),vec3(0.004,0.006,0.016),clamp(h*1.6,0.,1.));
   base+=vec3(0.030,0.022,0.020)*exp(-abs(h)*16.);

   gl_FragColor=vec4(base,1.); }`})); sky.renderOrder=-10; sD.add(sky);

const dustArr=[]; for(let i=0;i<9000;i++){ const x=(RD()-0.5)*160, z=(RD()-0.5)*160+10, y=RD()*30; const b=0.10+RD()*0.25; dustArr.push({p:[x,y,z],c:[0.9*b,0.82*b,0.7*b],s:0.06+RD()*0.08,aS:RD()}); }

// ---------------- strike FX: fused-sand sparks, dust shockwave, impact glow, rain
const RS=rnd(555); const SPK_N=2200; { }
const spkG=new THREE.BufferGeometry(); { const vel=new Float32Array(SPK_N*3), life=new Float32Array(SPK_N), sd=new Float32Array(SPK_N), pos=new Float32Array(SPK_N*3);

const ring=new THREE.Points(ringG,new THREE.ShaderMaterial({uniforms:ringU,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  vertexShader:`attribute vec3 aSd; uniform float uT,uFl,uK; varying vec3 vc;

  fragmentShader:`varying vec3 vc; void main(){ vec2 c=gl_PointCoord-0.5; float a=smoothstep(0.5,0.0,length(c)); gl_FragColor=vec4(vc*a*a,1.); }`}));

const impactGlow=makePoints([{p:[0,0.4,0],c:[1.0,0.42,0.10],s:3.2,aS:0},{p:[0,0.25,0],c:[1.0,0.85,0.6],s:1.0,aS:0}],pointsMat({uMax:{value:400*SC}}),sD);
const RAIN_N=3200; const rainG=new THREE.BufferGeometry(); { const pos=new Float32Array(RAIN_N*6), off=new Float32Array(RAIN_N*2);
  for(let i=0;i<RAIN_N;i++){ const x=(RS()-0.5)*50, y=RS()*40, z=RS()*48-6; pos.set([x,y,z,x,y,z],i*6); off[i*2]=0; off[i*2+1]=1; }

  vertexShader:`attribute float aOff; uniform float uT,uFl; varying float vA;
   void main(){ vec3 p=position; float y=mod(p.y-uT*16.0,40.0); p.x+=y*0.12; p.y=y; p+=aOff*vec3(0.10,-0.85,0.0); vA=(1.0-aOff*0.7)*(0.03+0.30*uFl); gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.); }`,

// trench motes (reveal)
const moteArr=[]; for(let i=0;i<2500;i++){ moteArr.push({p:[(RD()-0.5)*9,-RD()*6+0.8,RD()*9],c:[0.5,0.45,0.36].map(v=>v*(0.15+RD()*0.3)),s:0.006+RD()*0.012,aS:RD()}); }

// ---------------- fulgurite: branching tube in the plane z=0, hollow, rough crust outside, glassy lining inside

  const pts=[]; let x=0; let vx=0; for(let i=0;i<=44;i++){ const y=-i*0.080; if(i>0){ vx+= (RF()-0.5)*0.05; vx*=0.88; x+=vx+ (RF()-0.5)*0.012; } pts.push(V(x,y,0)); }
