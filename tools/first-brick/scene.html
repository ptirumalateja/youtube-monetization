<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Orb;src:url(Orbitron.ttf);font-weight:100 900}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// First Brick (Perfectionist vs Action Taker) - exact remake of the ref.
// Layout numbers are in the ref's 720x1280 space, drawn at x1.5.
const W=1080,H=1920,S=1.5,DUR=13.93;
const FP=925;   // floor line under the perfectionist (nearer the camera)
const FW=905;   // floor line under the wall (a little further back)
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const mk=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;return c};
const LA=mk(),la=LA.getContext('2d');   // wall + action taker layer
const LP=mk(),lp=LP.getContext('2d');   // perfectionist layer
const FG=mk(),fg=FG.getContext('2d');   // temp figure layer (for glow)
const RF=mk(),rx=RF.getContext('2d');   // reflection temp
const AC=mk(),ax=AC.getContext('2d');   // motion-blur accumulator

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ss=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const ease=t=>{t=clamp(t,0,1);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
function hash(i){const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)}

// ---------- bricks ----------
const BL=72,BH=31,GAP=2.4,WX=470,NC=6,WW=180;
const COURSE_END=[-1,1.3,2.6,3.9,5.3,6.9];
const wall=[];
(function(){
  for(let c=0;c<NC;c++){
    const row=[];
    if(c%2===0){row.push([WX,BL],[WX+BL,BL],[WX+2*BL,BL/2]);}
    else{row.push([WX,BL/2],[WX+BL/2,BL],[WX+BL*1.5,BL]);}
    const t0=c===0?-3:COURSE_END[c-1], t1=COURSE_END[c];
    row.forEach((b,i)=>{
      let T=lerp(t0,t1,(i+1)/row.length);
      if(c===1&&i<1)T=-1;
      wall.push({x:b[0],w:b[1],y:FW-(c+1)*BH,c,T,id:wall.length});
    });
  }
  wall.sort((a,b)=>a.T-b.T);
})();
const pBricks=[{x:196,y:FP-BH,w:76},{x:274,y:FP-BH,w:76},{x:196,y:FP-2*BH,w:76}];
const loose=[{x:396,y:FW-BH,w:62}];

function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function drawBrick(g,x,y,w,h,seed,top=true){
  x*=S;y*=S;w*=S;h*=S;const g2=GAP*S/2;
  const v=(hash(seed)-.5)*16;
  const col=(r,gg,b,a=1)=>`rgba(${r+v|0},${gg+v|0},${b+v|0},${a})`;
  const fx=x+g2,fy=y+g2,fw=w-2*g2,fh=h-2*g2,d=11;
  // right side sliver
  g.fillStyle=col(140,129,116);
  g.beginPath();g.moveTo(fx+fw,fy);g.lineTo(fx+fw+5,fy-d);g.lineTo(fx+fw+5,fy+fh-d);g.lineTo(fx+fw,fy+fh);g.closePath();g.fill();
  if(top){
    const tg=g.createLinearGradient(0,fy-d,0,fy);tg.addColorStop(0,col(236,229,219));tg.addColorStop(1,col(222,213,201));
    g.fillStyle=tg;
    g.beginPath();g.moveTo(fx,fy);g.lineTo(fx+fw,fy);g.lineTo(fx+fw+5,fy-d);g.lineTo(fx+5,fy-d);g.closePath();g.fill();
  }
  const gr=g.createLinearGradient(0,fy,0,fy+fh);
  gr.addColorStop(0,col(212,200,186));gr.addColorStop(1,col(170,158,144));
  g.fillStyle=gr;rr(g,fx,fy,fw,fh,3);g.fill();
  g.fillStyle=col(238,230,220,.6);g.fillRect(fx+2,fy+1.5,fw-4,2);
  g.fillStyle='rgba(55,44,33,.4)';g.fillRect(fx+2,fy+fh-2.5,fw-4,2.5);
}

// ---------- level ----------
function drawLevel(g,cx,cy,ang,len=106){
  g.save();g.translate(cx*S,cy*S);g.rotate(ang);
  const L=len*S,h=12*S;
  g.fillStyle='#0a0a0a';rr(g,-L/2-3,-h/2-3,L+6,h+6,5);g.fill();
  const gr=g.createLinearGradient(0,-h/2,0,h/2);gr.addColorStop(0,'#ff5040');gr.addColorStop(.5,'#e5281c');gr.addColorStop(1,'#b0130b');
  g.fillStyle=gr;rr(g,-L/2,-h/2,L,h,3);g.fill();
  g.fillStyle='#f4f4f4';rr(g,-11*S,-h/2+2.5*S,22*S,h-5*S,2);g.fill();
  g.fillStyle='#86d36b';g.beginPath();g.arc(clamp(ang*120,-6,6)*S,0,2.6*S,0,7);g.fill();
  g.strokeStyle='#333';g.lineWidth=1.2;g.beginPath();g.moveTo(-4*S,-3*S);g.lineTo(-4*S,3*S);g.moveTo(4*S,-3*S);g.lineTo(4*S,3*S);g.stroke();
  g.restore();
}

// ---------- Slow Light two-tone figure: coloured head + torso, cream limbs ----------
// Rig: forward kinematics with fixed bone lengths. Angles in degrees; 0 = limb hanging straight
// down / torso straight up; positive = rotated toward the way he faces (f = +1 right, -1 left).
// Knees only bend backward, elbows only forward. Root height is solved so he rests on the floor.
const W0=22,R=33;
const BONE={th:70,sh:70,torso:96,ua:58,fa:55};
const LIMB={out:'rgba(20,16,12,.85)',base:'#b8ab95',mid:'#e6dcc8',lite:'#fbf6ea',far:{base:'#837b6e',mid:'#a9a193',lite:'#c8c1b4'}};
const BODY={out:'rgba(30,20,4,.9)',base:'#b98d1c',mid:'#e2b734',lite:'#f6d873',far:{base:'#b98d1c',mid:'#e2b734',lite:'#f6d873'}};
const D2R=Math.PI/180;
const down=(a,f)=>[f*Math.sin(a*D2R),Math.cos(a*D2R)];   // limb direction
const up=(a,f)=>[f*Math.sin(a*D2R),-Math.cos(a*D2R)];    // torso/head direction
const add=(p,d,l)=>[p[0]+d[0]*l,p[1]+d[1]*l];
function armIK(sh,t,f){ // 2-bone, elbow always bends forward-down (natural)
  const l1=BONE.ua,l2=BONE.fa;let dx=t[0]-sh[0],dy=t[1]-sh[1],d=Math.hypot(dx,dy);
  const md=l1+l2-.5;if(d>md){t=[sh[0]+dx/d*md,sh[1]+dy/d*md];dx=t[0]-sh[0];dy=t[1]-sh[1];d=md;}
  d=Math.max(d,Math.abs(l1-l2)+1);
  const A=Math.atan2(dy,dx),B=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1));
  const e1=[sh[0]+Math.cos(A+B)*l1,sh[1]+Math.sin(A+B)*l1],e2=[sh[0]+Math.cos(A-B)*l1,sh[1]+Math.sin(A-B)*l1];
  // pick the elbow that sits lower / behind the hand line (never pointing up or forward-inverted)
  const e=(e1[1]+(-f)*e1[0]*0.15)>(e2[1]+(-f)*e2[0]*0.15)?e1:e2;
  return [e,t];
}
// solve all joint positions from angles
function solve(q,floor){
  const f=q.f;
  const legs=[[q.thA,q.knA],[q.thB,q.knB]].map(([th,kn])=>{const k=add([0,0],down(th,f),BONE.th);return [k,add(k,down(th-kn,f),BONE.sh)];});
  let low=0;for(const [k,ft] of legs){low=Math.max(low,ft[1],k[1]);}
  const hip=[q.x,floor-11-low];
  const kA=[hip[0]+legs[0][0][0],hip[1]+legs[0][0][1]],fA=[hip[0]+legs[0][1][0],hip[1]+legs[0][1][1]];
  const kB=[hip[0]+legs[1][0][0],hip[1]+legs[1][0][1]],fB=[hip[0]+legs[1][1][0],hip[1]+legs[1][1][1]];
  const neck=add(hip,up(q.torso,f),BONE.torso);
  const head=add(neck,up(q.torso+q.head,f),R+9);
  const sh=add(hip,up(q.torso,f),BONE.torso*0.88);
  const arm=(hand,ua,el)=>{
    if(hand)return armIK(sh,hand,f);
    const e=add(sh,down(ua,f),BONE.ua);return [e,add(e,down(ua+el,f),BONE.fa)];
  };
  const aA=arm(q.handA,q.uaA,q.elA),aB=arm(q.handB,q.uaB,q.elB);
  return {f,hip,kA,fA,kB,fB,neck,head,sh,eA:aA[0],hA:aA[1],eB:aB[0],hB:aB[1],look:q.look,lookY:q.lookY,expr:q.expr,armOver:q.armOver};
}
function cap(g,a,b,w,far,PAL=LIMB){
  const P=far?PAL.far:PAL, W=w*S;
  const line=(dx,dy)=>{g.beginPath();g.moveTo(a[0]*S+dx,a[1]*S+dy);g.lineTo(b[0]*S+dx,b[1]*S+dy);};
  g.lineCap='round';
  line(0,0);g.strokeStyle=PAL.out;g.lineWidth=W+3.2*S;g.stroke();
  line(0,0);g.strokeStyle=P.base;g.lineWidth=W;g.stroke();
  line(-W*.07,-W*.09);g.strokeStyle=P.mid;g.lineWidth=W*.74;g.stroke();
  g.save();g.globalAlpha=far?.4:.8;line(-W*.16,-W*.2);g.strokeStyle=P.lite;g.lineWidth=W*.3;g.stroke();g.restore();
}
function head(g,c,p){
  const x=c[0]*S,y=c[1]*S,r=R*S;
  g.beginPath();g.arc(x,y,r+1.8*S,0,7);g.fillStyle=BODY.out;g.fill();
  const hg=g.createRadialGradient(x-r*.35,y-r*.4,r*.05,x,y,r);
  hg.addColorStop(0,BODY.lite);hg.addColorStop(.5,BODY.mid);hg.addColorStop(1,BODY.base);
  g.beginPath();g.arc(x,y,r,0,7);g.fillStyle=hg;g.fill();
  const lk=p.f*10*S,ly=(p.lookY||0)*7*S,ex=x+lk,ey=y+ly;
  g.fillStyle='#2a1d08';
  g.beginPath();g.ellipse(ex-7*S,ey-3*S,2.8*S,3.8*S,0,0,7);g.ellipse(ex+7*S,ey-3*S,2.8*S,3.8*S,0,0,7);g.fill();
  g.strokeStyle='#2a1d08';g.lineWidth=2.2*S;g.lineCap='round';g.beginPath();
  if(p.expr==='sad'){g.moveTo(ex-5*S,ey+12*S);g.quadraticCurveTo(ex,ey+8*S,ex+5*S,ey+12*S);}
  else if(p.expr==='smile'){g.moveTo(ex-6*S,ey+9*S);g.quadraticCurveTo(ex,ey+14*S,ex+6*S,ey+9*S);}
  else {g.moveTo(ex-4*S,ey+10*S);g.lineTo(ex+4*S,ey+10*S);}
  g.stroke();
}
function drawFigure(g,p){
  cap(g,p.sh,p.eB,W0-3,true);cap(g,p.eB,p.hB,W0-3,true);
  cap(g,p.hip,p.kB,W0,true);cap(g,p.kB,p.fB,W0,true);
  const nk=[lerp(p.hip[0],p.neck[0],.93),lerp(p.hip[1],p.neck[1],.93)],hp=[lerp(p.hip[0],p.neck[0],.05),lerp(p.hip[1],p.neck[1],.05)];
  cap(g,hp,nk,W0+20,false,BODY);
  cap(g,p.hip,p.kA,W0,false);cap(g,p.kA,p.fA,W0,false);
  if(!p.armOver){cap(g,p.sh,p.eA,W0-3,false);cap(g,p.eA,p.hA,W0-3,false);}
  head(g,p.head,p);
  if(p.armOver){cap(g,p.sh,p.eA,W0-3,false);cap(g,p.eA,p.hA,W0-3,false);}
}
// pose blending works on angles, so limbs swing on arcs and never stretch
const NUM=['x','torso','head','thA','knA','thB','knB','uaA','elA','uaB','elB','lookY'];
function blend(a,b,t){const o={...(t<.5?a:b)};for(const k of NUM)o[k]=lerp(a[k]??0,b[k]??0,t);return o;}
function trackQ(keys,t){
  if(t<=keys[0][0])return keys[0][1];
  for(let i=0;i<keys.length-1;i++){const[a,pa]=keys[i],[b,pb]=keys[i+1];if(t<=b)return blend(pa,pb,ease((t-a)/(b-a)));}
  return keys[keys.length-1][1];
}
function trackV(K,t){
  if(t<=K[0][0])return K[0][1];
  for(let i=0;i<K.length-1;i++){const[a,pa]=K[i],[b,pb]=K[i+1];if(t<=b){const u=ease((t-a)/(b-a));return pa.map((v,j)=>lerp(v,pb[j],u));}}
  return K[K.length-1][1];
}

// ----- Perfectionist: kneels on his right knee, faces right -----
const KNEEL={thA:90,knA:90,thB:0,knB:90};
const Pwork ={f:1,x:112,torso:50,head:38,...KNEEL,uaA:10,elA:60,uaB:10,elB:60,lookY:.7,expr:'flat'};
const Plift ={f:1,x:112,torso:4, head:4, ...KNEEL,uaA:30,elA:70,uaB:30,elB:70,lookY:.1,expr:'flat',armOver:true};
const Preach={f:1,x:112,torso:22,head:-4,...KNEEL,uaA:85,elA:5,uaB:20,elB:50,lookY:-.1,expr:'flat'};
const Pstand={f:1,x:140,torso:14,head:-26,thA:8,knA:10,thB:-10,knB:6,uaA:6,elA:12,uaB:-4,elB:10,lookY:-.7,expr:'sad'};
const PK=[[0,Pwork],[2.45,Pwork],[2.85,Plift],[3.5,Plift],[3.9,Pwork],[6.05,Pwork],[6.35,Preach],[6.85,Preach],[7.2,Pwork],[9.45,Pwork],[10.0,Pstand],[11.45,Pstand],[12.1,Pwork]];
const LV_REST=[234,FP-2*BH-6.5];
function perfectionist(t){
  const q={...trackQ(PK,t)};
  // tiny checking motions while working
  const work=(t<2.45||(t>3.9&&t<6.05)||(t>7.2&&t<9.45)||t>12.1);
  if(work){q.head+=Math.sin(t*2.3)*3;q.torso+=Math.sin(t*1.7)*1.5;}
  const fid=Math.sin(t*5.1)*2.2+Math.sin(t*11.3)*1.2, tilt=Math.sin(t*3.7)*.02+Math.sin(t*8.9)*.008;
  // where the level is: on the brick, lifted to the chest, or held out at arm's length
  const pre=solve({...q,handA:null,handB:null},FP);
  const chest=[pre.sh[0]+50,pre.sh[1]+28];
  const LK=[[0,[LV_REST[0]+fid,LV_REST[1],tilt]],[2.45,[LV_REST[0],LV_REST[1],0]],[2.85,[chest[0],chest[1],0]],[3.5,[chest[0],chest[1],.03]],[3.9,[LV_REST[0],LV_REST[1],0]],
            [6.05,[LV_REST[0]+fid,LV_REST[1],tilt]],[6.35,[pre.sh[0]+150,pre.sh[1]+4,-.02]],[6.85,[pre.sh[0]+150,pre.sh[1]+4,-.02]],[7.2,[LV_REST[0],LV_REST[1],0]],
            [9.45,[LV_REST[0]+fid,LV_REST[1],tilt]],[9.7,[LV_REST[0],LV_REST[1],0]],[12.2,[LV_REST[0],LV_REST[1],0]],[13.93,[LV_REST[0]+fid,LV_REST[1],tilt]]];
  const lv=trackV(LK,t);
  const ca=Math.cos(lv[2]),sa=Math.sin(lv[2]);
  const grip=1-ss((t-9.5)/0.3)+ss((t-11.7)/0.4);
  if(grip>0.02){
    const reach=t>6.2&&t<7.05;
    const hA=reach?[lv[0]-40,lv[1]]:[lv[0]+ca*26,lv[1]-5+sa*26];
    const hB=reach?null:[lv[0]-ca*26,lv[1]-5-sa*26];
    const free=solve({...q,handA:null,handB:null},FP);
    const g2=clamp(grip,0,1);
    q.handA=[lerp(free.hA[0],hA[0],g2),lerp(free.hA[1],hA[1],g2)];
    if(hB)q.handB=[lerp(free.hB[0],hB[0],g2),lerp(free.hB[1],hB[1],g2)];
  }
  const p=solve(q,FP);
  return {p,lv,levelFront:(t>2.6&&t<3.8)||(t>6.2&&t<7.05)};
}

// ----- Action Taker: stands on the floor at the wall's right end, faces left, builds it -----
function wallTop(t){
  let n=0;for(let c=0;c<NC;c++)if(t>=COURSE_END[c])n=c+1;
  const prevEnd=n===0?-1:COURSE_END[n-1],nextEnd=n<NC?COURSE_END[n]:prevEnd+1;
  const frac=n<NC?clamp((t-prevEnd)/(nextEnd-prevEnd),0,1):0;
  return FW-(n+ss(frac))*BH;
}
function activeBrick(t){for(const b of wall)if(b.T>t)return b;return null}
function lastBrick(t){let l=null;for(const b of wall)if(b.T<=t)l=b;return l}
const Asquat={f:-1,x:676,torso:44,head:16,thA:92,knA:118,thB:80,knB:108,uaA:40,elA:30,uaB:20,elB:30,lookY:.6,expr:'flat'};
const Abend ={f:-1,x:676,torso:42,head:14,thA:35,knA:55,thB:18,knB:40,uaA:40,elA:30,uaB:20,elB:30,lookY:.5,expr:'flat'};
const Astand={f:-1,x:676,torso:16,head:8,thA:6,knA:8,thB:-4,knB:4,uaA:40,elA:30,uaB:20,elB:30,lookY:.3,expr:'flat'};
const Alean ={f:-1,x:688,torso:10,head:16,thA:-4,knA:3,thB:12,knB:4,uaA:40,elA:60,uaB:-20,elB:110,lookY:.5,expr:'flat'};
const Arelax={f:-1,x:688,torso:2,head:0,thA:3,knA:3,thB:-3,knB:3,uaA:4,elA:8,uaB:-4,elB:8,lookY:0,expr:'smile'};
function walkQ(ph,x){
  const s=Math.sin(ph);
  return {f:1,x,torso:6,head:0,thA:24*s,knA:8+28*Math.max(0,Math.sin(ph-1.2)),thB:-24*s,knB:8+28*Math.max(0,Math.sin(ph+Math.PI-1.2)),
          uaA:-22*s,elA:18,uaB:22*s,elB:18,lookY:0,expr:'smile'};
}
function actionTaker(t){
  let q,carry=null;
  const ab=activeBrick(t),lb=lastBrick(t);
  const hgt=FW-wallTop(t);
  if(t<6.95){
    const u=clamp((hgt-40)/150,0,1);
    q=u<.5?blend(Asquat,Abend,ss(u*2)):blend(Abend,Astand,ss((u-.5)*2));
    q={...q};
    // lean toward the slot he is filling
    const slot=ab||lb;const dx=(q.x-(slot.x+slot.w/2));
    q.torso+=clamp((dx-90)*0.18,-6,16);
    q.head+=Math.sin(t*6)*2;
    const pre=solve({...q,handA:null,handB:null},FW);
    if(ab){
      const v=clamp(1-(ab.T-t)/0.2,0,1);
      const pick=[pre.hip[0]+26,pre.hip[1]-6];
      const dst=[ab.x+ab.w/2,ab.y+4];
      const cx=lerp(pick[0],dst[0],ease(v)),cy=lerp(pick[1],dst[1],ease(v))-Math.sin(v*Math.PI)*26;
      q.handA=[cx,cy];
      carry={b:ab,cx,cy};
    }
    if(lb)q.handB=[lb.x+lb.w/2+8,lb.y+2+Math.sin(t*30)*2];
  }else if(t<9.35){
    q=t<7.45?blend(Astand,Alean,ease((t-6.95)/0.5)):{...Alean,head:Alean.head+Math.sin(t*1.7)*2};
    q={...q,handA:[WX+WW-26,FW-NC*BH-6]};
  }else if(t<10.15){
    q=blend(Alean,Arelax,ease((t-9.35)/0.55));
    if(t<9.6)q.handA=[WX+WW-26,FW-NC*BH-6];
  }else{
    const w=t-10.15;
    q=blend({...Arelax,f:1},walkQ(w*9,688+w*200),ss(w/0.2));
    q.x=688+w*200;
  }
  const p=solve(q,FW);
  if(carry){ // brick sits in his hand, then is set into its slot
    const h=p.hA;carry={b:carry.b,x:h[0]-carry.b.w/2,y:h[1]-BH*0.55};
    if(ab.T-t>0.2)carry=null;
  }
  return {p,carry,bx:q.x,by:FW,sc:1};
}

// ---------- labels ----------
function labels(g){
  g.save();g.font=`700 ${17*S}px Orb`;g.fillStyle='#f4f4f4';g.textAlign='center';g.textBaseline='alphabetic';
  g.letterSpacing=(4.6*S)+'px';
  g.shadowColor='rgba(255,255,255,.6)';g.shadowBlur=10;
  g.fillText('ACTION TAKER',(OX+K*560*S),(OY+K*416*S));
  g.fillText('PERFECTIONIST',(OX+K*222*S),(OY+K*549*S));
  g.restore();
}

const GL2=mk(),g2=GL2.getContext('2d');
function glowFigure(dst,fn){
  fg.setTransform(1,0,0,1,0,0);fg.clearRect(0,0,W,H);fg.setTransform(K,0,0,K,OX,OY);fn(fg);
  g2.globalCompositeOperation='source-over';g2.clearRect(0,0,W,H);g2.filter='blur(18px)';g2.drawImage(FG,0,0);g2.filter='none';
  g2.globalCompositeOperation='source-in';g2.fillStyle='rgba(255,225,160,0.35)';g2.fillRect(0,0,W,H);
  dst.save();dst.setTransform(1,0,0,1,0,0);dst.globalAlpha=.75;dst.drawImage(GL2,0,0);dst.globalAlpha=1;dst.drawImage(FG,0,0);dst.restore();
}
// side padding: whole stage scaled in about a centre point
const K=0.79,OX=392*S*(1-K),OY=800*S*(1-K);
const FPX=f=>OY+K*f*S;
function drawLayers(t){
  for(const g of [la,lp,fg]){g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,W,H);g.setTransform(K,0,0,K,OX,OY);}
  const A=actionTaker(t);
  // action taker first (behind the wall); scaled about his base while he walks out
  loose.forEach((b,i)=>drawBrick(la,b.x,b.y,b.w,BH,950+i));
  const laid=wall.filter(b=>b.T<=t).sort((a,b)=>a.c-b.c||a.x-b.x);
  la.fillStyle='#2b2520';for(const b of laid)la.fillRect((b.x+1)*S,(b.y+1)*S,(b.w-1)*S,(BH-1)*S);
  for(const b of laid){
    const age=t-b.T;const drop=age<0.07?(1-age/0.07)*6:0;
    const isTop=!laid.some(o=>o.c===b.c+1&&o.x<b.x+b.w-1&&o.x+o.w>b.x+1);
    drawBrick(la,b.x,b.y-drop,b.w,BH,b.id,isTop);
  }
  // action taker stands behind the wall: draw him after it, masked by the wall's face
  const WT=wallTop(t)-2;
  glowFigure(la,g=>{drawFigure(g,A.p);});
  if(A.carry)drawBrick(la,A.carry.x,A.carry.y,A.carry.b.w,BH,A.carry.b.id);
  // perfectionist
  pBricks.forEach((b,i)=>drawBrick(lp,b.x,b.y,b.w,BH,900+i,i!==0));
  const P=perfectionist(t);
  glowFigure(lp,g=>{
    if(!P.levelFront)drawLevel(g,P.lv[0],P.lv[1],P.lv[2]);
    drawFigure(g,P.p);
    if(P.levelFront)drawLevel(g,P.lv[0],P.lv[1],P.lv[2]);
  });
}
function addLayer(src,floor0,alpha){
  const fy=FPX(floor0);
  // reflection
  rx.globalCompositeOperation='source-over';rx.clearRect(0,0,W,H);
  rx.save();rx.translate(0,2*fy);rx.scale(1,-1);rx.filter='blur(2.5px)';rx.drawImage(src,0,0);rx.restore();
  rx.globalCompositeOperation='destination-in';
  const g=rx.createLinearGradient(0,fy,0,fy+175*S*K);
  g.addColorStop(0,'rgba(0,0,0,.62)');g.addColorStop(.35,'rgba(0,0,0,.26)');g.addColorStop(1,'rgba(0,0,0,0)');
  rx.fillStyle=g;rx.fillRect(0,fy,W,H);
  rx.globalCompositeOperation='destination-out';rx.fillStyle='#000';rx.fillRect(0,0,W,fy);
  rx.globalCompositeOperation='source-over';
  ax.globalAlpha=alpha;
  ax.drawImage(RF,0,0);
  ax.save();ax.beginPath();ax.rect(0,0,W,fy+1);ax.clip();ax.drawImage(src,0,0);ax.restore();
  ax.globalAlpha=1;
}
const SUB=3;
const BG=(()=>{const g=ctx.createRadialGradient(W*.5,H*.5,60,W*.5,H*.52,H*.62);g.addColorStop(0,'#38383b');g.addColorStop(.55,'#232325');g.addColorStop(1,'#141415');return g;})();
const TM=mk(),tm=TM.getContext('2d');
window.renderFrame=function(t){
  ctx.globalCompositeOperation='source-over';ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  for(let i=0;i<SUB;i++){
    const tt=t+(i-(SUB-1)/2)*(1/30)/SUB*0.9;
    drawLayers(tt);
    ax.globalCompositeOperation='source-over';ax.fillStyle='#000';ax.fillRect(0,0,W,H);
    addLayer(LA,FW,1);addLayer(LP,FP,1);
    ctx.globalCompositeOperation='lighter';ctx.globalAlpha=1/SUB;ctx.drawImage(AC,0,0);
  }
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  labels(ctx);
};
window.ready=document.fonts.load('700 20px Orb').then(()=>true);
</script></body></html>
