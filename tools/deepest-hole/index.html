<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head>
<body><script type="module">
// The Deepest Hole: a stickman digs a well (10 m) in a cross-section of the ground; the camera then pulls back on a log zoom
// past the deepest hand-dug well (391.6 m), the deepest mine (~4 km) and the Kola borehole (12,262 m), out to the whole
// Earth cut open, then plunges back to his first shovel. renderAt(t) is pure.
// Precision: the face near the holes is its own 800 m plane (small vertex coordinates); the planet-sized disk is drawn
// behind it without depth writes and only once the frame is wider than 200 m. Depth below the surface is computed as
// -(x^2+2Ry+y^2)/(R+r) so it stays exact near the top of a 6,371 km sphere.
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';

const q=new URLSearchParams(location.search); const W=+q.get('w')||540, H=+q.get('h')||960;
const TL=await (await fetch('timeline.json')).json(); const T=TL.T, EV=TL.events, ST=TL.strokes, WT=TL.water, R=TL.R, HO=TL.holes;
const renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true}); renderer.setPixelRatio(1); renderer.setSize(W,H); document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x000000);
const FOV=38; const cam=new THREE.PerspectiveCamera(FOV,W/H,0.05,200);

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)); const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)}; const lerp=(a,b,t)=>a+(b-a)*t;
function keys(k,t){ if(t<=k[0][0])return k[0][1]; for(let i=1;i<k.length;i++){ if(t<=k[i][0]){ const u=(t-k[i-1][0])/(k[i][0]-k[i-1][0]); return lerp(k[i-1][1],k[i][1],u*u*(3-2*u)); } } return k[k.length-1][1]; }
const L2=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t)];

// ---------------------------------------------------------------- well depth (stepwise at impacts), drilled depth of the other holes
function strokeAt(t){ let k=0; for(let i=0;i<ST.length;i++) if(ST[i][0]<=t) k=i; return k; }
function depth(t){ if(t>=EV.reset) return 0; const k=strokeAt(t); const prev=k>0?ST[k-1][1]:0; return lerp(prev,ST[k][1],sstep(ST[k][0],ST[k][0]+0.1,t)); }
function depthSmooth(t){ if(t<=ST[0][0]) return 0; for(let i=1;i<ST.length;i++){ if(t<=ST[i][0]){ const u=(t-ST[i-1][0])/(ST[i][0]-ST[i-1][0]); return lerp(ST[i-1][1],ST[i][1],u); } } return ST[ST.length-1][1]; }
function drilled(h,t){ const d=h.drill; if(!d) return h.depth; const u=clamp((t-d[0])/(d[1]-d[0])); return h.depth*(1-Math.pow(1-u,1.6)); }
window.drilledAt=(name,t)=>drilled(HO[name],t);

// ---------------------------------------------------------------- sky: full-screen, screen-space stars; navy near the ground, black in space
const skyU={uSpace:{value:0},uAsp:{value:W/H}};
const sky=new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.ShaderMaterial({uniforms:skyU,depthTest:false,depthWrite:false,
 vertexShader:`varying vec2 vU; void main(){ vU=uv; gl_Position=vec4(position.xy,0.999,1.0);} `,
 fragmentShader:`varying vec2 vU; uniform float uSpace,uAsp;
  float h(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
  void main(){ vec3 c=mix(vec3(0.020,0.040,0.075),vec3(0.004,0.008,0.020),smoothstep(0.3,1.0,vU.y)); c=mix(c,vec3(0.002,0.003,0.008),uSpace);
   vec2 g=vU*vec2(uAsp,1.0)*vec2(260.0); vec2 id=floor(g); float r=h(id); vec2 o=vec2(h(id+3.1),h(id+7.7))-0.5; float d=length(fract(g)-0.5-o*0.6);
   float s=step(0.985,r)*smoothstep(0.25,0.0,d)*(0.35+0.65*h(id+1.3)); c+=vec3(0.85,0.9,1.0)*s*(0.6+0.6*uSpace);
   gl_FragColor=vec4(c,1.0);} `}));
sky.frustumCulled=false; sky.renderOrder=-10; scene.add(sky);

// ---------------------------------------------------------------- earth: one strata shader, #define per surface
const G={uLamp:{value:new THREE.Vector3()},uLampI:{value:1},uD:{value:0},uWater:{value:0.4},uT:{value:0},
  uWood:{value:0},uMine:{value:0},uKola:{value:0},uHot:{value:0}};
const EARTH_V=`varying vec3 vP; void main(){ vec4 w=modelMatrix*vec4(position,1.0); vP=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`;
const EARTH_F=`
uniform vec3 uLamp; uniform float uLampI,uD,uWater,uT,uWood,uMine,uKola,uHot; varying vec3 vP;
float h21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float vn(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f); return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y); }
float fbm(vec2 p){ float s=0.0,a=0.5; for(int i=0;i<4;i++){ s+=a*vn(p); p*=2.03; a*=0.5; } return s; }
vec3 vor(vec2 p){ vec2 i=floor(p), f=fract(p); float d1=8.0,d2=8.0; vec2 id=vec2(0);
  for(int y=-1;y<=1;y++) for(int x=-1;x<=1;x++){ vec2 g=vec2(x,y); vec2 o=vec2(h21(i+g),h21(i+g+17.3)); vec2 r=g+o-f; float d=dot(r,r); if(d<d1){d2=d1;d1=d;id=i+g;} else if(d<d2) d2=d; }
  return vec3(sqrt(d1),sqrt(d2)-sqrt(d1),h21(id+3.1)); }
const vec3 TEAL=vec3(0.10,0.85,0.80); const vec3 GOLD=vec3(1.0,0.70,0.28); const vec3 CREAM=vec3(0.95,0.88,0.72);
// band-limited noise: octave at wavelength L only where a pixel is much smaller than L
float bl(vec2 p,float L,float px){ return (vn(p/L)-0.5)*clamp(L/(px*6.0)-1.0,0.0,1.0); }
// a vertical hole drawn as a line at least ~1.3 px wide
float hole(float x,float d,float x0,float w,float D,float px){ float hw=max(w*0.5,px*0.65); return step(abs(x-x0),hw)*step(0.0,d)*step(d,D)*step(0.001,D); }
float lineI(float x,float x0,float w,float px){ float hw=max(w*0.5,px*0.65); float wide=smoothstep(3.0,8.0,hw/px); float e=smoothstep(px*1.5,0.0,hw-abs(x-x0)); return mix(1.0,e,wide); }
vec3 deepRock(vec2 xy,float d,float px,out float em,out vec3 emc){
  em=0.0; emc=vec3(0);
  float r=6371000.0-d; vec3 col;
  if(d<2000.0){ // sedimentary: sandstone, shale, limestone bands at several scales
    float b=bl(vec2(xy.x*0.004,d),60.0,px)+bl(vec2(xy.x*0.002,d),350.0,px)*1.3+bl(vec2(xy.x*0.01,d),12.0,px)*0.5;
    float k=fract(b*2.2+0.5);
    col=k<0.4?vec3(0.15,0.105,0.062):(k<0.7?vec3(0.060,0.055,0.060):vec3(0.17,0.155,0.13)); col=mix(col,vec3(0.105,0.085,0.07),0.45);     // sandstone, shale, limestone
    col*=0.8+0.4*(0.5+bl(xy,4.0,px)+bl(xy,30.0,px));
  } else if(d<35000.0){ // crystalline crust: dark granite with veins and gold specks
    float b=bl(xy,600.0,px)+bl(xy,4000.0,px)*1.2+bl(xy,90.0,px)*0.6;
    col=mix(vec3(0.060,0.058,0.064),vec3(0.105,0.090,0.088),0.5+b);
    float sp=step(0.995,h21(floor(xy/max(px*2.0,30.0))))*clamp(60.0/px,0.0,1.0); col+=GOLD*sp*0.25;
    col=mix(col,vec3(0.16,0.05,0.03),smoothstep(25000.0,35000.0,d)*0.5);
  } else if(d<36000.0 && false){
  } else if(r>3480000.0){ // mantle: hotter with depth, slow convection cells
    float k=smoothstep(35000.0,2891000.0,d); float c=bl(xy,700000.0,px)+bl(xy,180000.0,px)*0.7+bl(xy,2.2e6,px);
    col=mix(vec3(0.16,0.035,0.02),vec3(0.42,0.12,0.035),k)*(0.55+0.9*(c+0.5)); em=0.12+0.25*k; emc=vec3(1.0,0.35,0.10);
  } else if(r>1221000.0){ // liquid outer core: swirling molten iron
    float c=bl(xy+vec2(uT*20000.0,0.0),400000.0,px)+bl(xy,120000.0,px)*0.6;
    col=vec3(0.75,0.36,0.08)*(0.7+0.8*c); em=0.3; emc=vec3(1.0,0.55,0.16);
  } else { col=vec3(0.9,0.72,0.38)*(0.9+0.3*bl(xy,250000.0,px)); em=0.42; emc=vec3(1.0,0.82,0.5); }  // solid inner core
  return col;
}
void main(){
  vec3 N=NRM; float u=vP.x+vP.z*0.9; float y=vP.y; float px=max(fwidth(vP.x),fwidth(vP.y))+1e-6;
  float rr=sqrt(vP.x*vP.x+(6371000.0+y)*(6371000.0+y));
  float d=-(vP.x*vP.x+2.0*6371000.0*y+y*y)/(6371000.0+rr);
#if KIND==6
  if(rr>6371000.0) discard;
#endif
#if KIND==0
  if(abs(vP.x)<0.5 && y>-uD && y<0.001 && uD>0.004) discard;
#endif
#if KIND==3
  if(abs(vP.x)<0.5 && abs(vP.z)<0.6 && uD>0.004) discard;
#endif
  vec3 col; float em=0.0; vec3 emc=vec3(0);
#if KIND==3
  vec3 c3=vor(vP.xz*2.6); float crack=1.0-smoothstep(0.0,0.035,c3.y);
  col=mix(vec3(0.050,0.040,0.034),vec3(0.075,0.060,0.048),fbm(vP.xz*3.0)); col*=1.0-0.75*crack;
#else
  // near strata (the first 14 m), faded out as the zoom makes them sub-pixel
  vec3 cn; float emn=0.0; vec3 emcn=vec3(0);
  { float b1=-0.35+0.07*(fbm(vec2(u*1.6,1.0))-0.5), b2=-2.6+0.35*(fbm(vec2(u*0.55,3.0))-0.5), b3=-5.0+0.4*(fbm(vec2(u*0.5,7.0))-0.5), b4=-7.8+0.35*(fbm(vec2(u*0.6,11.0))-0.5);
    float n=fbm(vec2(u,y)*4.0), n2=fbm(vec2(u,y)*18.0);
    if(y>b1){ cn=vec3(0.040,0.030,0.024)*(0.8+0.5*n2); float rt=abs(sin(u*7.0+fbm(vec2(u,y)*3.0)*9.0+y*3.0)); cn+=vec3(0.05,0.042,0.03)*smoothstep(0.985,1.0,rt); }
    else if(y>b2){ cn=mix(vec3(0.082,0.052,0.036),vec3(0.105,0.068,0.046),n)*(0.85+0.3*n2); cn*=0.92+0.08*sin(y*22.0+n*4.0); }
    else if(y>b3){ cn=mix(vec3(0.150,0.118,0.074),vec3(0.185,0.150,0.095),n)*(0.8+0.45*n2); float g=h21(floor(vec2(u,y)*70.0)); cn+=vec3(0.9,0.62,0.22)*step(0.988,g)*0.6; emn+=step(0.994,g)*0.15; emcn=GOLD; }
    else if(y>b4){ vec2 q=vec2(u,y)*5.5; q+=0.45*vec2(fbm(q*0.7),fbm(q*0.7+5.0)); vec3 v=vor(q); float peb=smoothstep(0.05,0.16,v.y)*step(0.35,v.z);
      cn=mix(vec3(0.050,0.044,0.040)*(0.8+0.4*n2),mix(vec3(0.062,0.062,0.066),vec3(0.095,0.085,0.072),v.z)*(0.55+0.6*smoothstep(0.7,0.0,v.x)),peb); }
    else if(y>-WATER){ cn=mix(vec3(0.040,0.050,0.066),vec3(0.055,0.068,0.088),n)*(0.85+0.3*n2); cn*=0.9+0.1*sin(y*30.0+fbm(vec2(u*2.0,y))*6.0);
      float damp=smoothstep(-WATER+0.45,-WATER,y); cn=mix(cn,cn*vec3(0.55,0.75,0.85),damp*0.8); }
    else { vec2 q=vec2(u,y)*7.0; q+=0.22*vec2(fbm(q*0.35),fbm(q*0.35+9.0)); vec3 v=vor(q); float peb=smoothstep(0.03,0.13,v.y);
      float sh=0.6+0.4*sin(uT*2.1+v.z*6.28+y*3.0)*sin(uT*1.3+u*4.0);
      cn=mix(vec3(0.010,0.03,0.035),vec3(0.055,0.07,0.08)*(0.55+0.7*v.z)*(0.6+0.7*smoothstep(0.75,0.0,v.x)),peb);
      emn+=(1.0-peb)*uWater*sh*1.1*smoothstep(-WATER-3.5,-WATER-0.2,y)*smoothstep(-16.0,-13.0,y); emcn=TEAL; emn+=smoothstep(0.03,0.0,abs(y+WATER))*uWater*1.2; }
    if(y>-WATER){ float k=exp(-(y+WATER)/0.55)*uWater*0.32; cn+=TEAL*k*0.35; } }
  float emd; vec3 emcd; vec3 cd=deepRock(vP.xy,d,px,emd,emcd);
  float nearW=(1.0-smoothstep(0.08,0.6,px))*(1.0-smoothstep(12.0,16.0,d));   // near detail only while a pixel is under ~10 cm
  float aq=(1.0-smoothstep(0.6,2.0,px))*smoothstep(9.8,10.2,d)*(1.0-smoothstep(11.0,12.0+px,d));   // keep a thin teal aquifer line at mid zoom
  col=mix(cd,cn,nearW); em=mix(emd,emn,nearW); emc=mix(emcd,emcn,nearW);
  em+=aq*(1.0-nearW)*uWater*0.3; emc=mix(emc,TEAL,aq*(1.0-nearW));
  // the holes, side by side (positions not to scale; depths and widths are real, widths drawn at least ~1.3 px)
  float hw=hole(vP.x,d,0.0,1.0,uD,px)*(1.0-nearW);            col=mix(col,vec3(0.02),hw); em+=hw*0.9*lineI(vP.x,0.0,1.0,px); emc=mix(emc,TEAL,hw);
  float hwd=hole(vP.x,d,(${HO.wood.x.toFixed(1)}),(${HO.wood.w.toFixed(2)}),uWood,px); col=mix(col,vec3(0.02),hwd); em+=hwd*0.45*lineI(vP.x,(${HO.wood.x.toFixed(1)}),(${HO.wood.w.toFixed(2)}),px); emc=mix(emc,CREAM,hwd);
  float hm=hole(vP.x,d,(${HO.mine.x.toFixed(1)}),(${HO.mine.w.toFixed(2)}),uMine,px);
  { float lv=floor(d/250.0); float ly=lv*250.0+125.0; float len=60.0+220.0*h21(vec2(lv,3.0)); float side=h21(vec2(lv,9.0))>0.5?1.0:-1.0; float dx=(vP.x-(${HO.mine.x.toFixed(1)}))*side;
    float tun=step(1500.0,ly)*step(ly,uMine)*step(abs(d-ly),max(3.0,px*0.6))*step(0.0,dx)*step(dx,len); hm=max(hm,tun); }
  col=mix(col,vec3(0.03),hm); em+=hm*0.9; emc=mix(emc,GOLD,hm);
  float hk=hole(vP.x,d,(${HO.kola.x.toFixed(1)}),(${HO.kola.w.toFixed(2)}),uKola,px); float tip=smoothstep(uKola-max(400.0,px*4.0),uKola,d);
  col=mix(col,vec3(0.03),hk); em+=hk*(0.9+0.8*tip*uHot); emc=mix(emc,mix(vec3(1.0,0.55,0.2),vec3(1.0,0.75,0.4),tip),hk);
#endif
#if KIND==2
  // well floor: flooded once he reaches the water
  float wet=smoothstep(${(ST[ST.length-1][0]).toFixed(2)},${(ST[ST.length-1][0]+0.5).toFixed(2)},uT)*step(9.5,uD); col=mix(col,vec3(0.02,0.07,0.08),wet*0.8); em+=wet*0.5*uWater; emc=TEAL;
#endif
  vec3 L=uLamp-vP; float dl=length(L); float fall=uLampI/(1.0+dl*dl*1.1);
  vec3 lit;
#if KIND==0 || KIND==6
  lit=vec3(1.0,0.78,0.5)*fall*0.55+vec3(0.55,0.65,0.85)*0.55;
  float edge=0.0;
#if KIND==0
  if(uD>0.004){ float ex=abs(abs(vP.x)-0.5); if(y>-uD-0.01 && y<0.0) edge+=smoothstep(0.012,0.0,ex); if(abs(vP.x)<0.51) edge+=smoothstep(0.012,0.0,abs(y+uD)); }
#endif
  edge+=smoothstep(max(0.014,px*1.2),0.0,abs(d))*step(0.5,abs(vP.x)+step(uD,0.004));  // the ground line
  float rimE=smoothstep(max(px*1.5,1.0),0.0,abs(d))*step(1000.0,px); em+=rimE*0.5; emc=mix(emc,CREAM,rimE);  // planet rim at large scale
#elif KIND==3
  lit=vec3(1.0,0.78,0.5)*fall*max(dot(N,L/dl),0.0)*1.6+vec3(0.45,0.55,0.8)*0.5;
#else
  lit=vec3(1.0,0.78,0.5)*fall*(max(dot(N,L/dl),0.0)*1.5+0.25)+vec3(0.4,0.5,0.7)*0.12;
#endif
  vec3 o=col*lit+emc*em;
#if KIND==0 || KIND==6
  o+=CREAM*edge*0.18;
#endif
  gl_FragColor=vec4(o,1.0);
}`;
function earthMat(kind,n){ return new THREE.ShaderMaterial({uniforms:G,vertexShader:EARTH_V,depthWrite:kind!==6,
  fragmentShader:`#define KIND ${kind}\n#define WATER ${WT.toFixed(2)}\n#define NRM vec3(${n.map(v=>v.toFixed(1)).join(',')})\n`+EARTH_F}); }
const face=new THREE.Mesh(new THREE.PlaneGeometry(4000,4000),earthMat(0,[0,0,1])); face.position.set(0,-2000,0.6); scene.add(face);
const disk=new THREE.Mesh(new THREE.PlaneGeometry(2*R,2*R,8,8),earthMat(6,[0,0,1])); disk.position.set(0,-R,0.6); disk.renderOrder=-5; disk.frustumCulled=false; scene.add(disk);
const top=new THREE.Mesh(new THREE.PlaneGeometry(40,40),earthMat(3,[0,1,0])); top.rotation.x=-Math.PI/2; top.position.set(0,0,-19.4); scene.add(top);
const back=new THREE.Mesh(new THREE.PlaneGeometry(1,1),earthMat(1,[0,0,1])); scene.add(back);
const wallL=new THREE.Mesh(new THREE.PlaneGeometry(1,1),earthMat(4,[1,0,0])); wallL.rotation.y=Math.PI/2; scene.add(wallL);
const wallR=new THREE.Mesh(new THREE.PlaneGeometry(1,1),earthMat(5,[-1,0,0])); wallR.rotation.y=-Math.PI/2; scene.add(wallR);
const floorM=new THREE.Mesh(new THREE.PlaneGeometry(1,1),earthMat(2,[0,1,0])); floorM.rotation.x=-Math.PI/2; scene.add(floorM);
function setShaft(D){ const d=Math.max(D,0.002);
  back.position.set(0,-d/2,-0.6); back.scale.set(1.0,d,1);
  wallL.position.set(-0.5,-d/2,0); wallL.scale.set(1.2,d,1); wallR.position.set(0.5,-d/2,0); wallR.scale.set(1.2,d,1);
  floorM.position.set(0,-d,0); floorM.scale.set(1.0,1.2,1); }
// water rising in the well once he breaks the water table
const wellWater=new THREE.Mesh(new THREE.PlaneGeometry(1,1.2),new THREE.MeshBasicMaterial({color:0x0f6a66,transparent:true,opacity:0.8}));
wellWater.rotation.x=-Math.PI/2; scene.add(wellWater);

// ---------------------------------------------------------------- the planet: back hemisphere behind the cut face (night side, city lights, rim)
const planet=new THREE.Mesh(new THREE.SphereGeometry(R,192,96,Math.PI,Math.PI),new THREE.ShaderMaterial({
 uniforms:{uSun:{value:new THREE.Vector3(-0.6,0.5,0.6).normalize()},uCam:{value:new THREE.Vector3()}},
 vertexShader:`varying vec3 vN; varying vec3 vW; void main(){ vN=normalize(position); vec4 w=modelMatrix*vec4(position,1.0); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
 fragmentShader:`varying vec3 vN; varying vec3 vW; uniform vec3 uSun,uCam;
  float h21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
  float vn(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f); return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y); }
  float fbm(vec2 p){ float s=0.0,a=0.5; for(int i=0;i<5;i++){ s+=a*vn(p); p*=2.03; a*=0.5; } return s; }
  void main(){ vec3 n=normalize(vN); vec2 sp=vec2(atan(n.z,n.x),asin(n.y));
   float land=smoothstep(0.52,0.56,fbm(sp*vec2(2.2,3.0)+3.0));
   vec3 col=mix(vec3(0.010,0.030,0.070),vec3(0.045,0.050,0.040),land);
   float day=max(dot(n,uSun),0.0); col*=0.2+1.0*day;
   float city=land*step(0.93,h21(floor(sp*vec2(420.0,260.0))))*(1.0-smoothstep(0.0,0.25,day)); col+=vec3(1.0,0.7,0.3)*city*0.6;
   float cl=smoothstep(0.55,0.75,fbm(sp*vec2(4.0,6.0)+uSun.xy)); col=mix(col,vec3(0.6,0.65,0.7)*(0.15+0.9*day),cl*0.35);
   vec3 V=normalize(uCam-vW); float fr=pow(1.0-max(dot(n,V),0.0),3.0); col+=vec3(0.15,0.55,0.75)*fr*0.55;
   gl_FragColor=vec4(col,1.0);} `}));
planet.position.set(0,-R-0.4,0.6); planet.renderOrder=-6; planet.frustumCulled=false; scene.add(planet);

// ---------------------------------------------------------------- tripod, rope, lantern, dirt mound
const wood=new THREE.MeshStandardMaterial({color:0x5a4330,roughness:0.85});
const APEX=new THREE.Vector3(0.28,2.55,0.0);
function stick(a,b,r,mat){ const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,1,8),mat); const d=b.clone().sub(a); m.scale.set(1,d.length(),1); m.position.copy(a).addScaledVector(d,0.5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize()); scene.add(m); return m; }
for(const f of [[-1.15,0,0.45],[1.55,0,0.4],[0.3,0,-1.5]]) stick(new THREE.Vector3(...f),APEX.clone().add(new THREE.Vector3(0,0.12,0)),0.035,wood);
const ropeMat=new THREE.MeshStandardMaterial({color:0xb79a6e,roughness:0.9,emissive:0x1a1208});
const rope=new THREE.Mesh(new THREE.CylinderGeometry(0.014,0.014,1,6),ropeMat); scene.add(rope);
const cord=new THREE.Mesh(new THREE.CylinderGeometry(0.008,0.008,1,5),ropeMat); scene.add(cord);
const lantern=new THREE.Group(); scene.add(lantern); let halo;
{ const glass=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,0.16,16),new THREE.MeshBasicMaterial({color:0xffc070})); lantern.add(glass);
  const capM=new THREE.MeshStandardMaterial({color:0x2a2622,roughness:0.6,metalness:0.4});
  const cap=new THREE.Mesh(new THREE.ConeGeometry(0.095,0.07,16),capM); cap.position.y=0.115; lantern.add(cap);
  const base=new THREE.Mesh(new THREE.CylinderGeometry(0.085,0.085,0.03,16),capM); base.position.y=-0.095; lantern.add(base);
  halo=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    vertexShader:`varying vec2 vU; void main(){ vU=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
    fragmentShader:`varying vec2 vU; void main(){ float r=length(vU-0.5)*2.0; gl_FragColor=vec4(vec3(1.0,0.72,0.38)*exp(-r*r*7.0)*0.32,1.0);} `}));
  halo.scale.set(0.9,0.9,1); halo.position.z=0.12; lantern.add(halo); }
const lampL=new THREE.PointLight(0xffc27a,7,0,1.6); scene.add(lampL);
const fillL=new THREE.DirectionalLight(0x7a8fc0,0.55); fillL.position.set(2,3,6); scene.add(fillL);
const moonL=new THREE.DirectionalLight(0x9fb2d8,0.5); moonL.position.set(-4,6,2); scene.add(moonL);
scene.add(new THREE.AmbientLight(0x1a2236,0.6));
const moundMat=new THREE.MeshStandardMaterial({color:0x4a382a,roughness:1,emissive:0x0d0a08});
const mound=new THREE.Mesh(new THREE.SphereGeometry(1,32,16,0,Math.PI*2,0,Math.PI/2),moundMat); mound.position.set(-1.7,0,-0.35); scene.add(mound);

// ---------------------------------------------------------------- the stickman (IK rig, profile), shovel, clods
const L_UP=0.30,L_FORE=0.29,L_TH=0.47,L_SH=0.47,L_TOR=0.55,HEAD_R=0.118,BR=0.04;
function ik(A,Tg,l1,l2,pick){ const dx=Tg[0]-A[0], dy=Tg[1]-A[1]; const d=Math.max(Math.hypot(dx,dy),1e-4); const dm=Math.min(d,l1+l2-1e-4); const ux=dx/d, uy=dy/d;
  const a=(l1*l1-l2*l2+dm*dm)/(2*dm), h=Math.sqrt(Math.max(0,l1*l1-a*a)); const px=A[0]+ux*a, py=A[1]+uy*a;
  const m1=[px-uy*h,py+ux*h], m2=[px+uy*h,py-ux*h]; return [pick(m1,m2), [A[0]+ux*dm,A[1]+uy*dm]]; }
function joints(P){ const dir=P.dir; const H=P.hip; const U=[Math.sin(P.lean)*dir,Math.cos(P.lean)];
  const N=[H[0]+U[0]*L_TOR,H[1]+U[1]*L_TOR], Sh=[N[0]-U[0]*0.07,N[1]-U[1]*0.07];
  const C=[N[0]+Math.sin(P.lean+P.tilt)*dir*0.18,N[1]+Math.cos(P.lean+P.tilt)*0.18];
  const elbowPick=(a,b)=> (a[1]-b[1])+0.6*dir*(b[0]-a[0])<0?a:b;     // elbows hang low and back
  const kneePick=(a,b)=> dir*(a[0]-b[0])>0?a:b;                    // knees bend forward
  const [eN,wN]=ik(Sh,P.hN,L_UP,L_FORE,elbowPick), [eF,wF]=ik(Sh,P.hF,L_UP,L_FORE,elbowPick);
  const [kN,aN]=ik(H,P.fN,L_TH,L_SH,kneePick), [kF,aF]=ik(H,P.fF,L_TH,L_SH,kneePick);
  return {H,N,Sh,C,eN,wN,eF,wF,kN,aN,kF,aF,tN:[aN[0]+0.15*dir,aN[1]-0.01],tF:[aF[0]+0.15*dir,aF[1]-0.01],dir}; }
const BONES=[['H','N',0],['Sh','eF',-1],['eF','wF',-1],['H','kF',-1],['kF','aF',-1],['aF','tF',-1],['Sh','eN',1],['eN','wN',1],['H','kN',1],['kN','aN',1],['aN','tN',1]];
const JN=['H','N','eN','wN','eF','wF','kN','aN','kF','aF','tN','tF'];
const manMat=new THREE.MeshStandardMaterial({color:0xf2ecdc,roughness:0.55,emissive:0x4a4436,emissiveIntensity:0.6});
const cylG=new THREE.CylinderGeometry(1,1,1,14), sphG=new THREE.SphereGeometry(1,36,24), jG=new THREE.SphereGeometry(1,14,10);
const man={bones:[],joints:[]}; const mk=(g,mat)=>{ const m=new THREE.Mesh(g,mat); m.matrixAutoUpdate=false; m.frustumCulled=false; scene.add(m); return m; };
for(const b of BONES) man.bones.push(mk(cylG,manMat)); for(const j of JN) man.joints.push(mk(jG,manMat)); man.head=mk(sphG,manMat); man.nose=mk(sphG,manMat);
const _m=new THREE.Matrix4(), _q=new THREE.Quaternion(), _p=new THREE.Vector3(), _s=new THREE.Vector3(), _e=new THREE.Euler();
function setM(mesh,p,q,s){ _m.compose(p,q,s); mesh.matrix.copy(_m); mesh.matrixWorld.copy(_m); }
function seg(mesh,p,q,z1,z2,r){ const dx=q[0]-p[0], dy=q[1]-p[1], L=Math.max(Math.hypot(dx,dy),1e-3); _p.set((p[0]+q[0])/2,(p[1]+q[1])/2,(z1+z2)/2); _q.setFromEuler(_e.set(0,0,-Math.atan2(dx,dy))); _s.set(r,L,r); setM(mesh,_p,_q,_s); }
function poseMan(J,z){ BONES.forEach((b,i)=>seg(man.bones[i],J[b[0]],J[b[1]],z+b[2]*0.075,z+b[2]*0.075,BR));
  const zOf={H:0,N:0,eN:1,wN:1,eF:-1,wF:-1,kN:1,aN:1,kF:-1,aF:-1,tN:1,tF:-1};
  JN.forEach((j,i)=>{ _p.set(J[j][0],J[j][1],z+zOf[j]*0.075); setM(man.joints[i],_p,_q.identity(),_s.set(BR,BR,BR)); });
  setM(man.head,_p.set(J.C[0],J.C[1],z),_q.identity(),_s.set(HEAD_R,HEAD_R,HEAD_R));
  setM(man.nose,_p.set(J.C[0]+HEAD_R*0.95*J.dir,J.C[1]-0.012,z),_q.identity(),_s.set(0.034,0.034,0.034)); }

// ---------------------------------------------------------------- the shovel
const bladeMat=new THREE.MeshStandardMaterial({color:0x9aa3ad,roughness:0.35,metalness:0.85,emissive:0x15171a});
const shovel={handle:mk(cylG,wood),grip:mk(cylG,wood),blade:mk(new THREE.BoxGeometry(1,1,1),bladeMat)};
const SH_LEN=1.35, BLADE=0.30;
function poseShovel(tip,a,z){ const d=[-Math.sin(a),Math.cos(a)]; const so=[tip[0]+d[0]*BLADE,tip[1]+d[1]*BLADE], top=[tip[0]+d[0]*SH_LEN,tip[1]+d[1]*SH_LEN];
  seg(shovel.handle,so,top,z,z,0.022);
  _p.set(top[0],top[1],z); _q.setFromEuler(_e.set(Math.PI/2,0,0)); _s.set(0.02,0.16,0.02); setM(shovel.grip,_p,_q,_s);
  _p.set((tip[0]+so[0])/2,(tip[1]+so[1])/2,z); _q.setFromEuler(_e.set(0,0,-Math.atan2(d[0],d[1]))); _s.set(0.025,BLADE,0.24); setM(shovel.blade,_p,_q,_s);
  return {top,at:(s)=>[tip[0]+d[0]*s,tip[1]+d[1]*s]}; }

// ---------------------------------------------------------------- dirt clods thrown on each stroke
const CN=60; const cg=new THREE.BufferGeometry(); const cp=new Float32Array(CN*3), ca=new Float32Array(CN); cg.setAttribute('position',new THREE.BufferAttribute(cp,3)); cg.setAttribute('aA',new THREE.BufferAttribute(ca,1));
const clods=new THREE.Points(cg,new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{uK:{value:H/2/Math.tan(19*Math.PI/180)}},
 vertexShader:`attribute float aA; uniform float uK; varying float vA; void main(){ vA=aA; vec4 mv=modelViewMatrix*vec4(position,1.0); gl_PointSize=max(2.0,uK*0.05/-mv.z); gl_Position=projectionMatrix*mv; }`,
 fragmentShader:`varying float vA; void main(){ float r=length(gl_PointCoord-0.5)*2.0; if(r>1.0) discard; gl_FragColor=vec4(vec3(0.42,0.30,0.20)*(1.1-0.5*r),vA);} `}));
clods.frustumCulled=false; scene.add(clods);
const hr=(i)=>{ let s=(i*2654435761)>>>0; s^=s>>>13; s=(s*1274126177)>>>0; return (s>>>0)/4294967296; };

// ---------------------------------------------------------------- choreography: dig to the water, look down, idle; reset to the surface (unseen at planet scale) for the loop
const MANX=-0.18;
const DK=[[0.00,[0.42,-0.10,0.30,0.38,0.40]],[0.14,[0.40,0.02,0.70,0.30,0.35]],[0.32,[0.42,0.65,1.40,0.12,0.25]],[0.48,[0.40,1.90,2.70,-0.10,0.10]],[0.62,[0.42,1.30,1.60,0.05,0.15]],[0.82,[0.48,0.50,0.55,0.26,0.28]],[1.00,[0.42,-0.10,0.30,0.38,0.40]]];
function cyc(u){ for(let i=1;i<DK.length;i++){ if(u<=DK[i][0]){ const a=DK[i-1], b=DK[i]; const w=(u-a[0])/(b[0]-a[0]); const s=w*w*(3-2*w); return a[1].map((v,j)=>lerp(v,b[1][j],s)); } } return DK[0][1]; }
const REST=[0.36,-0.02,0.12,0.06,0.08];
function manState(t){
  const F=-depth(t); let c, tilt=0.05;
  const lastT=EV.water_hit;
  if(t>=EV.reset){ const ph=0.62+0.38*sstep(T-0.5,T,t); c=cyc(Math.min(ph,0.999)); }          // waiting with the shovel raised; impact lands on frame 0
  else if(t<lastT+0.15){ const k=strokeAt(t); const t0=ST[k][0], t1=k+1<ST.length?ST[k+1][0]:t0+0.7; c=cyc(Math.min((t-t0)/(t1-t0),0.999)); }
  else { const c0=cyc(clamp((t-lastT)/0.6,0,0.14)); c=c0.map((v,j)=>lerp(v,REST[j],sstep(lastT+0.1,lastT+0.5,t))); tilt=0.05+0.45*sstep(lastT+0.2,lastT+0.6,t); }  // he stops and looks down at the water
  const lean=c[3], knee=c[4]; const tip=[MANX+c[0],F+c[1]], a=c[2];
  const hip=[MANX,F+0.92-0.3*knee]; const fN=[MANX+0.2,F+BR], fF=[MANX-0.17,F+BR];
  const d=[-Math.sin(a),Math.cos(a)]; const hF=[tip[0]+d[0]*SH_LEN,tip[1]+d[1]*SH_LEN]; let hN=[tip[0]+d[0]*0.85,tip[1]+d[1]*0.85];
  if(t>lastT && t<EV.reset){ hN=L2(hN,[hF[0]+0.02,hF[1]-0.1],sstep(lastT+0.1,lastT+0.5,t)); }
  return {P:{hip,dir:1,lean,tilt,hN,hF,fN,fF},tip,a};
}

// ---------------------------------------------------------------- camera: log zoom between stops, anchored so the zoom point stays put
const CK=TL.cam;
function follow(t){ return -depthSmooth(t)+0.55; }
function camBase(t){
  if(t<=CK[1][0]) return {S:CK[0][1],cx:CK[0][2],cy:CK[0][3]};
  if(t<=CK[2][0]){ const u=sstep(CK[1][0],CK[2][0],t); return {S:Math.exp(lerp(Math.log(CK[1][1]),Math.log(CK[2][1]),u)),cx:CK[1][2],cy:lerp(CK[1][3],follow(t),u)}; }
  if(t<=CK[3][0]){ const u=sstep(EV.water_hit-0.2,CK[3][0],t); return {S:lerp(CK[2][1],CK[3][1],u),cx:lerp(CK[2][2],CK[3][2],u),cy:lerp(follow(t),CK[3][3],u)}; }
  for(let i=4;i<CK.length;i++){ if(t<=CK[i][0]){ const a=CK[i-1], b=CK[i]; const u=sstep(a[0],b[0],t);
      const la=Math.log(a[1]), lb=Math.log(b[1]); const S=Math.exp(lerp(la,lb,u));
      const w=Math.abs(b[1]-a[1])>1e-6*b[1]? (S-a[1])/(b[1]-a[1]) : u;                 // anchored zoom: centre moves with S
      return {S,cx:lerp(a[2],b[2],w),cy:lerp(a[3],b[3],w)}; } }
  const z=CK[CK.length-1]; return {S:z[1],cx:z[2],cy:z[3]}; }
const AZ=[[0,0.16],[EV.reveal,0.16],[17.4,0.62],[19.9,0.78],[21.6,0.16],[T,0.16]], EL=[[0,0.035],[EV.reveal,0.035],[17.4,0.30],[19.9,0.34],[21.6,0.035],[T,0.035]];
let curS=5;
function camAt(t){ const B=camBase(t); curS=B.S; const dist=B.S/(2*Math.tan(FOV*Math.PI/360));
  const az=keys(AZ,t)+0.03*Math.sin(t*0.45)*(1-sstep(10,40,B.S)), el=keys(EL,t);
  const sh=(t>EV.reveal?Math.exp(-(t-EV.reveal)*5)*0.006*Math.sin(t*57):0)*B.S;
  const nf=1-sstep(10,40,B.S);                       // near the man: camera a little above, looking at the shaft's middle (z=0)
  cam.position.set(B.cx+dist*Math.sin(az)*Math.cos(el)+sh, B.cy+dist*Math.sin(el)+0.25*nf, 0.6+dist*Math.cos(az)*Math.cos(el));
  cam.near=Math.max(0.05,dist*0.02); cam.far=dist*60+3*R*sstep(100,1e5,B.S)+50; cam.lookAt(B.cx,B.cy,0.6*(1-nf)); cam.updateProjectionMatrix();
  return B; }
window.projAt=function(t,pts){ camAt(t); cam.updateMatrixWorld(); return pts.map(p=>{ const v=new THREE.Vector3(p[0],p[1],0.61).project(cam); return [(v.x*0.5+0.5),(0.5-v.y*0.5),curS]; }); };

// ---------------------------------------------------------------- post: bloom + grade
const composer=new EffectComposer(renderer); composer.setSize(W,H);
composer.addPass(new RenderPass(scene,cam));
const bloom=new UnrealBloomPass(new THREE.Vector2(W,H),0.5,0.6,0.62); composer.addPass(bloom);
const gradeU={tDiffuse:{value:null},uT:{value:0},uFlash:{value:0},uAsp:{value:W/H}};
composer.addPass(new ShaderPass({uniforms:gradeU,vertexShader:`varying vec2 vU; void main(){ vU=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
 fragmentShader:`varying vec2 vU; uniform sampler2D tDiffuse; uniform float uT,uFlash,uAsp;
  float h(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233))+uT*37.0)*43758.5453); }
  void main(){ vec2 c=vU-0.5; float r2=dot(c*vec2(uAsp,1.0),c*vec2(uAsp,1.0));
   vec3 col=texture2D(tDiffuse,vU).rgb; col=vec3(1.0)-exp(-1.25*col); col=mix(col,col*vec3(0.9,1.0,1.05),0.5);
   col*=1.0-smoothstep(0.12,0.5,r2)*0.75; col+=(h(vU*vec2(uAsp,1.0)*900.0)-0.5)*0.03; col+=uFlash*vec3(0.95,0.8,0.6);
   gl_FragColor=vec4(max(col,0.0),1.0);} `}));
composer.addPass(new OutputPass());

// ---------------------------------------------------------------- one sub-frame
function setT(t){
  const D=depth(t); G.uD.value=D; G.uT.value=t; setShaft(D);
  G.uWood.value=drilled(HO.wood,t); G.uMine.value=drilled(HO.mine,t); G.uKola.value=drilled(HO.kola,t);
  G.uHot.value=sstep(HO.kola.drill[0],HO.kola.drill[1],t);
  G.uWater.value=keys([[0,0.45],[4.0,0.6],[EV.water_hit,0.7],[EV.water_hit+0.05,1.5],[EV.water_hit+0.8,1.0],[T,1.0]],t);
  const wr=(t>EV.water_hit&&t<EV.reset)?0.28*sstep(EV.water_hit,EV.water_hit+0.8,t):0; wellWater.visible=wr>0.01; wellWater.position.set(0,-D+wr,0);
  const ly=Math.min(1.85,-D+1.95), sw=0.03*Math.sin(t*2.3); lantern.position.set(-0.3+sw,ly,-0.32);
  const LI=0.92+0.05*Math.sin(t*23.0)+0.03*Math.sin(t*41.0);
  lampL.position.copy(lantern.position); lampL.intensity=7*LI; G.uLamp.value.copy(lantern.position); G.uLampI.value=2.2*LI;
  seg(cord,[APEX.x,APEX.y],[-0.3+sw,ly+0.13],-0.32,-0.32,0.008); cord.matrixAutoUpdate=false;
  seg(rope,[APEX.x+0.02,APEX.y],[0.30,-Math.max(D,0.05)],0.0,0.0,0.014); rope.matrixAutoUpdate=false;
  mound.scale.set(0.55+0.5*Math.min(D,10)/10,0.12+0.5*Math.min(D,10)/10,0.5+0.4*Math.min(D,10)/10);
  const S=manState(t); poseMan(joints(S.P),0); poseShovel(S.tip,S.a,0.12);
  const pos=clods.geometry.attributes.position.array, al=clods.geometry.attributes.aA.array; let n=0;
  if(t<EV.water_hit+0.6){ const k=strokeAt(t); for(const kk of [k-1,k]){ if(kk<0) continue; const t0=ST[kk][0], t1=kk+1<ST.length?ST[kk+1][0]:t0+0.7; const tr=t0+0.45*(t1-t0);
      const F=-ST[kk][1]; const age=t-tr; if(age<0||age>0.7||kk===ST.length-1) continue;
      for(let i=0;i<30&&n<CN;i++,n++){ const r1=hr(kk*97+i), r2=hr(kk*131+i+7), r3=hr(kk*53+i+3);
        const vx=-0.6+1.4*(r1-0.5), vy=5.5+3.5*r2, vz=(r3-0.5)*0.8; const sx=MANX+0.4+(r2-0.5)*0.15, sy=F+1.85;
        pos[n*3]=sx+vx*age; pos[n*3+1]=sy+vy*age-4.9*age*age; pos[n*3+2]=0.12+vz*age; al[n]=1.0-sstep(0.45,0.7,age); } } }
  for(;n<CN;n++){ al[n]=0; pos[n*3+1]=-100; }
  clods.geometry.attributes.position.needsUpdate=true; clods.geometry.attributes.aA.needsUpdate=true;
  const B=camAt(t);
  disk.visible=B.S>150; planet.visible=B.S>2e5; halo.visible=B.S<60; top.visible=B.S<3000;
  skyU.uSpace.value=sstep(3000,300000,B.S);
  bloom.strength=0.5+0.25*sstep(1e5,1e7,B.S);
  gradeU.uT.value=t; const dd=t-EV.reveal; gradeU.uFlash.value=(dd>0&&dd<0.18)?0.10*(1-dd/0.18):0;
}
const acc=document.createElement('canvas'); acc.width=W; acc.height=H; const actx=acc.getContext('2d');
window.renderAt=function(t,K=3){
  const fast=(t>1.9&&t<2.6)||(t>2.0&&t<EV.water_hit)||(t>5.9&&t<17.5)||(t>EV.plunge[0]&&t<EV.plunge[1]); if(fast) K=Math.max(K,5);
  actx.globalAlpha=1; actx.clearRect(0,0,W,H); const shutter=1/60;
  for(let k=0;k<K;k++){ setT(t+(K>1?(k/(K-1)-0.5)*shutter:0)); composer.render(); actx.globalAlpha=1/(k+1); actx.drawImage(renderer.domElement,0,0); }
  return acc.toDataURL('image/jpeg',0.93);
};
window.ready=true;
