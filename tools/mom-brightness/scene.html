<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Kalam;src:url(fonts/Kalam.ttf)}
@font-face{font-family:Patrick;src:url(fonts/PatrickHand.ttf)}
@font-face{font-family:Bangers;src:url(fonts/Bangers.ttf)}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// "Mom's Phone" remake. draw(t) renders the frame at time t (seconds).
const W=1080,H=1920;
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const INK='#1b1622';
const SKIN='#c68a5f', SKIN_D='#a46d48';
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const ease=k=>k<0?0:k>1?1:k*k*(3-2*k);
const outBack=k=>{k=clamp(k,0,1);const c=1.7;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2);};
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}

function P(pts,close=true){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);if(close)ctx.closePath();}
function fs(fill,lw=6,stroke=INK){if(fill){ctx.fillStyle=fill;ctx.fill();}if(lw){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();}}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);}
function ell(x,y,rx,ry,rot=0){ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot,0,Math.PI*2);}
function line(x1,y1,x2,y2,lw=8,col=INK){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineWidth=lw;ctx.strokeStyle=col;ctx.lineCap='round';ctx.stroke();}
function curve(pts,lw=8,col=INK){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);if(pts.length==3)ctx.quadraticCurveTo(pts[1][0],pts[1][1],pts[2][0],pts[2][1]);else ctx.bezierCurveTo(pts[1][0],pts[1][1],pts[2][0],pts[2][1],pts[3][0],pts[3][1]);ctx.lineWidth=lw;ctx.strokeStyle=col;ctx.lineCap='round';ctx.stroke();}

// ---------------- characters ----------------
// Kid: head centre at (0,0), head radius 80. Upright body below.
function kidHead(o){
  const r=80;
  // ears
  ell(-r+4,8,16,22);fs(SKIN,5);ell(r-4,8,16,22);fs(SKIN,5);
  ell(0,0,r,r*1.02);fs(o.skull?'#e9e6df':SKIN,6);
  if(o.skull){
    // skull face
    ell(-30,-4,24,28);fs('#1b1622',0);ell(30,-4,24,28);fs('#1b1622',0);
    P([[0,22],[-9,38],[9,38]]);fs('#1b1622',0);
    ctx.fillStyle='#1b1622';for(let i=-3;i<=3;i++){ctx.fillRect(i*11-4,52,7,16);}
    line(-40,50,40,50,4);line(-40,70,40,70,4);
    return;
  }
  // hair: messy black tuft on top
  ctx.beginPath();ctx.moveTo(-r-4,0);
  ctx.bezierCurveTo(-r-10,-r*1.25,r+10,-r*1.25,r+4,-4);
  ctx.lineTo(r-8,-30);ctx.lineTo(r-26,-14);ctx.lineTo(r-30,-42);ctx.lineTo(r-50,-26);ctx.lineTo(r-62,-52);
  ctx.lineTo(-10,-40);ctx.lineTo(-30,-58);ctx.lineTo(-44,-34);ctx.lineTo(-66,-46);ctx.lineTo(-70,-18);ctx.closePath();
  fs('#15111a',5);
  const e=o.eyes||'open';
  if(e=='closed'){curve([[-48,0],[-30,12],[-12,0]],6);curve([[12,0],[30,12],[48,0]],6);}
  else if(e=='sleepy'){ // half lids
    ell(-30,4,22,20);fs('#fff',5);ell(30,4,22,20);fs('#fff',5);
    circ(-28,10,7);fs(INK,0);circ(32,10,7);fs(INK,0);
    ctx.beginPath();ctx.ellipse(-30,4,23,21,0,Math.PI,0);ctx.lineTo(7,8);ctx.lineTo(-53,8);ctx.closePath();fs(SKIN_D,5);
    ctx.beginPath();ctx.ellipse(30,4,23,21,0,Math.PI,0);ctx.lineTo(53,8);ctx.lineTo(7,8);ctx.closePath();fs(SKIN_D,5);
  } else if(e=='squint'){
    curve([[-50,-10],[-26,4],[-10,0]],7);curve([[-50,14],[-26,4],[-10,0]],7);
    curve([[50,-10],[26,4],[10,0]],7);curve([[50,14],[26,4],[10,0]],7);
  } else {
    ell(-30,0,24,26);fs('#fff',5);ell(30,0,24,26);fs('#fff',5);
    circ(-28+(o.look||0),4,8);fs(INK,0);circ(32+(o.look||0),4,8);fs(INK,0);
  }
  const m=o.mouth||'flat';
  if(m=='snore'){ell(0,46,22,16+4*Math.sin((o.t||0)*6));fs('#7a2a35',5);
    // drool
    P([[14,56],[22,74],[16,84],[10,74]]);fs('#9fd6ee',4);}
  else if(m=='yawn'){ell(0,46,16,20);fs('#7a2a35',5);}
  else if(m=='open'){ell(0,46,14,10);fs('#7a2a35',5);}
  else if(m=='grit'){ell(0,46,30,16);fs('#fff',5);line(-28,46,28,46,3);for(let i=-2;i<=2;i++)line(i*10,32,i*10,60,3);}
  else curve([[-14,48],[0,52],[14,48]],5);
}
// lying / standing kid seen from above (used inside bed-local space). pose arms out.
function kidBody(o){
  // legs
  const t=o.t||0;
  if(!o.sit){line(-18,170,-60,320,12);line(18,170,64,315,12);
  ell(-64,330,18,12,0.4);fs(INK,0);ell(68,325,18,12,-0.4);fs(INK,0);}
  // arms
  if(o.lying){
    line(-50,110,-120,60+6*Math.sin(t*3),12);line(50,110,128,150,12);
    circ(-124,56+6*Math.sin(t*3),14);fs(SKIN,5);circ(132,154,14);fs(SKIN,5);
  }
  // torso (tee)
  ctx.beginPath();ctx.moveTo(-50,84);ctx.quadraticCurveTo(-62,150,-42,190);ctx.lineTo(42,190);ctx.quadraticCurveTo(62,150,50,84);ctx.quadraticCurveTo(0,70,-50,84);
  fs('#e2b53c',6);
  // stripes
  ctx.save();ctx.clip();for(let y=104;y<200;y+=28){ctx.fillStyle='#2f6f8f';ctx.fillRect(-70,y,140,10);}ctx.restore();
  ctx.beginPath();ctx.moveTo(-50,84);ctx.quadraticCurveTo(-62,150,-42,190);ctx.lineTo(42,190);ctx.quadraticCurveTo(62,150,50,84);ctx.quadraticCurveTo(0,70,-50,84);fs(null,6);
}

// Mom: head centre (0,0) r 78. standing, feet at y ~ 560
function mom(o){
  o=o||{};
  // hair bun behind
  circ(-58,-50,36);fs('#141019',5);
  // saree body
  ctx.beginPath();ctx.moveTo(-60,110);ctx.quadraticCurveTo(-110,330,-120,560);ctx.lineTo(120,560);ctx.quadraticCurveTo(100,330,62,110);ctx.closePath();
  fs('#9b1d3f',6);
  // gold border at hem and front pleats
  ctx.save();ctx.beginPath();ctx.moveTo(-60,110);ctx.quadraticCurveTo(-110,330,-120,560);ctx.lineTo(120,560);ctx.quadraticCurveTo(100,330,62,110);ctx.closePath();ctx.clip();
  ctx.fillStyle='#e0ad35';ctx.fillRect(-140,520,280,40);
  ctx.fillStyle='#e0ad35';P([[10,300],[30,300],[40,560],[16,560]]);ctx.fill();
  // pallu band over shoulder
  P([[-70,110],[-20,110],[90,330],[60,360]]);ctx.fillStyle='#b8264c';ctx.fill();
  P([[-20,110],[-6,110],[100,320],[90,330]]);ctx.fillStyle='#e0ad35';ctx.fill();
  ctx.restore();
  ctx.beginPath();ctx.moveTo(-60,110);ctx.quadraticCurveTo(-110,330,-120,560);ctx.lineTo(120,560);ctx.quadraticCurveTo(100,330,62,110);ctx.closePath();fs(null,6);
  // feet
  ell(-40,566,26,12);fs(SKIN,5);ell(40,566,26,12);fs(SKIN,5);
  // neck
  P([[-18,70],[18,70],[20,112],[-20,112]]);fs(SKIN,5);
  // arms
  const arm=o.arm||'down';
  if(arm=='down'){line(-62,130,-80,300,14,INK);line(-62,130,-80,300,8,SKIN);circ(-82,306,14);fs(SKIN,5);
                  line(62,130,82,300,14,INK);line(62,130,82,300,8,SKIN);circ(84,306,14);fs(SKIN,5);}
  else { // holding phone forward at (hx,hy)
    const hx=o.hx,hy=o.hy;
    line(-62,130,-80,300,14,INK);line(-62,130,-80,300,8,SKIN);circ(-82,306,14);fs(SKIN,5);
    line(62,130,hx,hy,14,INK);line(62,130,hx,hy,8,SKIN);circ(hx,hy,15);fs(SKIN,5);
  }
  // head
  ell(0,0,78,82);fs(SKIN,6);
  // hair
  ctx.beginPath();ctx.moveTo(-80,10);ctx.bezierCurveTo(-90,-110,90,-110,80,10);ctx.quadraticCurveTo(40,-50,2,-58);ctx.quadraticCurveTo(-40,-50,-80,10);fs('#141019',5);
  // eyes
  const bl=o.blink||0;
  if(bl>0.5){line(-46,6,-14,6,6);line(14,6,46,6,6);}
  else{ell(-30,4,22,25);fs('#fff',5);ell(30,4,22,25);fs('#fff',5);
       circ(-28+(o.look||0),6,8);fs(INK,0);circ(32+(o.look||0),6,8);fs(INK,0);}
  if(o.brows){line(-50,-30,-14,-24,5);line(14,-24,50,-30,5);}
  // bindi
  circ(0,-26,7);fs('#d1132f',0);
  // mouth
  if(o.talk){ell(0,46,12,6+6*Math.abs(Math.sin(o.talk*18)));fs('#6e1f2a',4);} else curve([[-12,46],[0,48],[12,46]],5);
}

function phone(x,y,s,glow,rot=0){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);
  P([[-22,-40],[22,-40],[22,40],[-22,40]]);fs('#2b2b33',5);
  P([[-17,-33],[17,-33],[17,31],[-17,31]]);fs(glow?'#fffbe8':'#3d4552',0);
  ctx.restore();
}

// ---------------- rooms ----------------
const WALL='#4b4258', FLOOR='#3a3346';
function tint(alpha){ctx.save();ctx.globalCompositeOperation='multiply';ctx.fillStyle=`rgba(95,80,140,${alpha})`;ctx.fillRect(0,0,W,H);ctx.restore();}
function vignette(a=0.45){const g=ctx.createRadialGradient(540,1000,300,540,1000,1250);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(10,6,20,${a})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}

// bed affine (wide shot)
const BED={A:[560,830],B:[930,900],D:[200,1520]};
function bedLocal(){ // map local (u 0..360, v 0..700)
  const [ax,ay]=BED.A,[bx,by]=BED.B,[dx,dy]=BED.D;
  ctx.transform((bx-ax)/360,(by-ay)/360,(dx-ax)/700,(dy-ay)/700,ax,ay);
}
function bedWide(){
  const A=BED.A,B=BED.B,D=BED.D,C=[B[0]+D[0]-A[0],B[1]+D[1]-A[1]];
  // headboard
  P([[A[0]-6,A[1]+10],[A[0]-6,A[1]-150],[B[0]+6,B[1]-150],[B[0]+6,B[1]+10]]);fs('#4a2f24',6);
  // frame sides
  P([D,C,[C[0],C[1]+90],[D[0],D[1]+90]]);fs('#3b251c',6);
  P([C,B,[B[0],B[1]+90],[C[0],C[1]+90]]);fs('#2f1d16',6);
  // legs
  P([[D[0]+4,D[1]+90],[D[0]+26,D[1]+90],[D[0]+26,D[1]+140],[D[0]+4,D[1]+140]]);fs('#2a1913',5);
  P([[C[0]-30,C[1]+90],[C[0]-6,C[1]+90],[C[0]-6,C[1]+140],[C[0]-30,C[1]+140]]);fs('#2a1913',5);
  // mattress
  P([A,B,C,D]);fs('#8d8aa0',6);
  P([D,C,[C[0],C[1]+40],[D[0],D[1]+40]]);fs('#77748b',6);
  P([C,B,[B[0],B[1]+40],[C[0],C[1]+40]]);fs('#66637a',6);
}
function roomWide(t,doorOpen){
  ctx.fillStyle=FLOOR;ctx.fillRect(0,0,W,H);
  // back wall
  P([[0,0],[W,0],[W,760],[0,860]]);fs(WALL,0);
  line(0,860,W,760,6,'#231c2c');
  // door (back wall, left)
  const dx=70,dw=250,dt=330,db=842;
  P([[dx,dt],[dx+dw,dt-6],[dx+dw,db-23],[dx,db]]);fs(doorOpen>0?'#ffe79a':'#241a1c',6);
  if(doorOpen>0){
    // warm light spill on floor
    ctx.save();ctx.globalAlpha=0.35*doorOpen;P([[dx,db],[dx+dw,db-23],[dx+dw+260*doorOpen,1500],[dx-60,1560]]);ctx.fillStyle='#ffe08a';ctx.fill();ctx.restore();
  }
  // door panel swinging (hinge at left edge)
  const w=dw*(1-0.78*doorOpen);
  P([[dx,dt],[dx+w,dt-6+20*doorOpen],[dx+w,db-23+30*doorOpen],[dx,db]]);fs('#5a3a2c',6);
  circ(dx+w-24,(dt+db)/2+12,8);fs('#c9a35a',3);
  // switch board
  P([[400,560],[440,558],[440,612],[400,614]]);fs('#d9d3c6',4);
  bedWide();
}

// close room (two-shot) for scenes 3 and 9
function roomMid(){
  ctx.fillStyle=FLOOR;ctx.fillRect(0,0,W,H);
  P([[0,0],[W,0],[W,1060],[0,1120]]);fs(WALL,0);
  line(0,1120,W,1060,6,'#231c2c');
  // door left
  P([[40,520],[300,512],[300,1100],[40,1118]]);fs('#241a1c',6);
  P([[40,520],[110,540],[110,1110],[40,1118]]);fs('#5a3a2c',6);
  P([[300,512],[330,512],[330,1098],[300,1100]]);fs('#3a2620',5);
  // switch board
  P([[370,760],[414,758],[414,816],[370,818]]);fs('#d9d3c6',4);
  // window with curtain right (night)
  P([[760,330],[1000,322],[1000,620],[760,628]]);fs('#1a2340',6);
  ctx.fillStyle='#e6e1c8';circ(940,400,4);ctx.fill();circ(820,470,3);ctx.fill();
  P([[730,300],[800,300],[790,700],[740,700]]);fs('#6b3550',5);
}
function bedMid(){
  // big bed front-right
  P([[380,1080],[1100,1040],[1100,1700],[380,1760]]);fs('#8d8aa0',6); // top
  P([[380,1760],[1100,1700],[1100,1800],[380,1860]]);fs('#77748b',6);
  P([[380,1860],[1100,1800],[1100,1900],[380,1920]]);fs('#3b251c',6);
  // headboard top-right
  P([[860,1060],[860,900],[1100,890],[1100,1048]]);fs('#4a2f24',6);
  // pillow
  ell(950,1060,120,52,-0.05);fs('#b7b4c6',6);
}
function kidSitting(t,o){
  // kid sitting on bed, upright torso, legs stretched toward camera-right
  ctx.save();ctx.translate(760,900);
  // blanket over lap and legs (kid sits against pillow, legs toward camera)
  ctx.beginPath();ctx.moveTo(-95,170);ctx.quadraticCurveTo(40,150,120,200);ctx.quadraticCurveTo(250,300,265,430);
  ctx.quadraticCurveTo(200,520,40,520);ctx.quadraticCurveTo(-110,480,-100,330);ctx.closePath();fs('#4f6aa0',6);
  curve([[20,260],[120,330],[160,470]],4,'#2e3f66');curve([[-40,300],[20,400],[30,500]],4,'#2e3f66');
  ell(200,505,26,15,0.3);fs(SKIN,5);ell(250,470,26,15,0.3);fs(SKIN,5);
  kidBody({t,sit:true});
  // arms
  if(o.skull){
    line(-50,110,-30,240,9,'#e9e6df');line(50,110,30,240,9,'#e9e6df');
  } else if(o.hold){ // both hands at phone (px,py) relative
    line(-50,110,o.px-14,o.py+10,12);line(50,110,o.px+14,o.py+10,12);
    circ(o.px-14,o.py+12,13);fs(SKIN,5);circ(o.px+14,o.py+12,13);fs(SKIN,5);
  } else {
    line(-50,110,-70,250,12);circ(-72,256,14);fs(SKIN,5);
    line(50,110,(o.reach?o.rx:70),(o.reach?o.ry:250),12);circ(o.reach?o.rx:72,o.reach?o.ry:256,14);fs(SKIN,5);
  }
  if(o.skull){ // ribcage over tee
    ctx.fillStyle='#1b1622';ctx.fillRect(-56,80,112,120);
    for(let i=0;i<4;i++){curve([[-40,100+i*24],[0,90+i*24],[40,100+i*24]],7,'#e9e6df');}
    line(0,84,0,196,8,'#e9e6df');
  }
  ctx.translate(0,0);
  kidHead({eyes:o.eyes,mouth:o.mouth,t,skull:o.skull,look:o.look});
  ctx.restore();
}
function bubble(x,y,w,h,txt,k,tailx,taily){
  if(k<=0)return;
  const s=outBack(k);
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.beginPath();ctx.ellipse(0,0,w/2,h/2,-0.08,0,Math.PI*2);fs('#fbfaf5',6);
  P([[-40,h/2-24],[tailx-x,taily-y],[10,h/2-10]],true);fs('#fbfaf5',0);
  curve([[-44,h/2-26],[(tailx-x)*0.6-20,(taily-y)*0.6],[tailx-x,taily-y]],6);
  curve([[tailx-x,taily-y],[(tailx-x)*0.5+10,(taily-y)*0.55],[12,h/2-8]],6);
  ctx.fillStyle=INK;ctx.font='74px Patrick';ctx.textAlign='center';ctx.textBaseline='middle';
  const lines=txt.split('\n');lines.forEach((l,i)=>ctx.fillText(l,0,(i-(lines.length-1)/2)*76));
  ctx.restore();
}
function title(a){
  if(a<=0)return;
  ctx.save();ctx.globalAlpha=a;ctx.font='bold 92px Kalam';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineWidth=12;ctx.strokeStyle='rgba(20,14,28,0.85)';ctx.strokeText("Mom's Phone",540,345);
  ctx.fillStyle='#f3efe6';ctx.fillText("Mom's Phone",540,345);ctx.restore();
}
function zees(x,y,t){
  ctx.save();ctx.font='bold 54px Kalam';ctx.fillStyle='#e8e2f5';
  for(let i=0;i<3;i++){const p=((t*0.9+i/3)%1);ctx.globalAlpha=Math.sin(p*Math.PI);ctx.font=`bold ${36+p*40}px Kalam`;ctx.fillText('z',x+p*70+i*6,y-p*160);}
  ctx.restore();
}

// ---------------- scenes ----------------
function S1(t){ // wide, 0-1.0
  const door=ease((t-0.3)/0.25);
  roomWide(t,door);
  if(door>0.3){ // mom peeks at doorway
    ctx.save();ctx.translate(250,520);ctx.scale(0.62,0.62);mom({look:6});ctx.restore();
    // redraw door panel edge over her body for depth
  }
  ctx.save();bedLocal();
  // pillow
  ell(180,70,120,50);fs('#b7b4c6',6);
  ctx.translate(180,150);ctx.scale(0.95,0.95);
  kidBody({lying:true,t});kidHead({eyes:'closed',mouth:'snore',t});
  ctx.restore();
  zees(640,930,t);
  tint(0.25);vignette();
  title(1);
}
function S2(t){ // close on sleeping kid 1.0-1.6
  const k=(t-1.0);
  ctx.save();
  const s=2.15+0.06*k;ctx.translate(540,900);ctx.scale(s,s);ctx.translate(-560,-1020);
  roomWide(t,1);
  ctx.save();bedLocal();ell(180,70,120,50);fs('#b7b4c6',6);
  ctx.translate(180,150);ctx.scale(0.95,0.95);kidBody({lying:true,t});kidHead({eyes:'closed',mouth:'snore',t});ctx.restore();
  ctx.restore();
  zees(760,700,t);
  tint(0.25);vignette();
  title(1);
}
function cam2(){ctx.translate(540,1060);ctx.scale(1.35,1.35);ctx.translate(-590,-930);}
function S3(t){ // two-shot 1.6-4.15
  ctx.save();cam2();
  roomMid();bedMid();
  const handoff=ease((t-2.95)/0.45);
  // mom
  const mhx=lerp(150,120,handoff), mhy=lerp(130,250,handoff);
  ctx.save();ctx.translate(420,760);
  mom({arm:'hold',hx:mhx,hy:mhy,look:8,talk:(t>1.95&&t<2.6)?t:0});
  ctx.restore();
  // phone position
  let px,py,glow=false;
  if(handoff<1){px=420+lerp(mhx,mhx,0);py=760+mhy-30;}
  const kidHasPhone=t>3.25;
  if(!kidHasPhone){px=420+mhx+8;py=760+mhy-34;phone(px,py,1.15,false,-0.15);}
  const eyes=t<2.2?'closed':(t<3.7?'sleepy':'sleepy');
  if(kidHasPhone){
    kidSitting(t,{eyes,mouth:t<3.7?'yawn':'flat',hold:true,px:0,py:200,look:0});
    phone(760,1088,1.15,false,0);
  } else {
    kidSitting(t,{eyes,mouth:t<2.1?'snore':'yawn',reach:t>2.8,rx:lerp(70,-150,ease((t-2.8)/0.4)),ry:lerp(250,190,ease((t-2.8)/0.4))});
  }
  ctx.restore();
  tint(0.22);vignette();
  title(t<1.9?1:clamp(1-(t-1.9)/0.15,0,1));
  bubble(560,505,640,220,'Beta… NO\nINTERNET!',(t-1.95)/0.22*(t<3.65?1:0),380,700);
}
function S4(t){ // POV silhouette hands with phone 4.15-4.95
  const press=t>4.55;
  const sh=press?Math.sin((t-4.55)*90)*10*Math.exp(-(t-4.55)*6):0;
  ctx.fillStyle='#6e6c72';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(sh,sh*0.6);
  // arms from bottom
  ctx.fillStyle='#0e0c10';

function draw(t){
  ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  if(t<1.0)S1(t);

  else if(t<4.15)S3(t);
  else if(t<4.95)S4(t);
  else if(t<5.05){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);}
  else if(t<5.4)burst(t);
  else if(t<5.5){ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);}
  else if(t<5.75)rays(t);
  else if(t<5.9){ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);}

  else if(t<8.5)windFace(t);
