<!doctype html><html><head><meta charset="utf-8">
<style>@font-face{font-family:PX;src:url(fonts/PressStart2P.woff2)}html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Vehicle-upgrade "by the numbers" reel: retro top-down world drawn at 360x640, scaled 3x.
// Same driver (red cap + shades) in every vehicle; vehicle and landscape upgrade on every number.
const VS=1.25,W=1080,H=1920,S=3,LW=360,LH=640,VX=180,VY=400;
let X0=null;const BL=document.createElement('canvas');BL.width=360;BL.height=640;const BG=BL.getContext('2d');const C=document.getElementById('c'),X=C.getContext('2d');
const L=document.createElement('canvas');L.width=LW;L.height=LH;const G=L.getContext('2d');
const B=v=>'$'+v.toFixed(2).replace(/0$/,'')+'B',M=v=>Math.round(v)+'M',P=v=>'+'+Math.round(v)+'%';
const SC=[
 {type:'title',dur:2.0,veh:'car',bio:'town',v0:64,v1:352,kmh:[0,90]},
 {type:'stat',dur:3.2,veh:'car',bio:'pine',v0:352,v1:512,kmh:[90,160],tag:'#1 PRE-ORDERS',col:'#3ff0ff',from:20,to:32.5,fmt:v=>v.toFixed(1)+'M',cap:['COPIES SOLD BEFORE','THE GAME LAUNCHED']},
 {type:'vs',dur:3.8,veh:'car',bio:'desert',v0:528,v1:608,kmh:[160,210],tag:'#2 LAUNCH DAY',col:'#ffd23f',a:{l:'GTA 5',v:0.8},b:{l:'GTA 6',v:3.79},cap:['FIRST-DAY SALES','NEARLY 5X BIGGER']},
 {type:'stat',dur:3.4,veh:'amb',bio:'neon',v0:640,v1:688,kmh:[210,240],tag:'#3 STREAMS',col:'#ff5fc0',from:60,to:125,fmt:M,cap:['HOURS OF STREAMS','WATCHED IN 24 HOURS'],chip:'7.9M WATCHING AT ONCE'},
 {type:'stat',dur:3.0,veh:'tank',bio:'office',v0:528,v1:528,kmh:[240,260],tag:'#4 INDIA',col:'#9dff5a',from:10,to:60,fmt:P,cap:['MORE INDIANS TOOK','LEAVE ON LAUNCH DAY'],chip:'NOBODY WENT TO WORK'},
 {type:'stat',dur:3.2,veh:'bike',bio:'coast',v0:960,v1:1120,kmh:[260,320],tag:'#5 ISHOWSPEED',col:'#3ff0ff',from:2,to:4.47,fmt:v=>v.toFixed(2)+'M',cap:['HOURS OF HIS STREAM','WATCHED. MOST OF ANYONE.']},
 {type:'stat',dur:3.2,veh:'heli',bio:'beach',v0:1216,v1:1312,kmh:[320,380],tag:'#6 DREAM JOB',col:'#ff9a3c',from:90000,to:120000,fmt:v=>'$'+Math.round(v).toLocaleString('en-US'),cap:['KALSHI PAID ONE PERSON','TO PLAY GTA 6 FOR A YEAR']},
 {type:'cta',dur:3.4,veh:'heli',bio:'sunset',v0:800,v1:416,kmh:[380,380],lines:['WHICH NUMBER','SHOCKED YOU?'],sub:'DROP IT IN THE COMMENTS',btn:'FOLLOW FOR MORE'}];
let t0=0;for(const s of SC){s.t0=t0;t0+=s.dur;}const DUR=t0;window.DUR=DUR;
// ---- simulation ----
const DT=1/240,N=Math.ceil(DUR/DT)+2,SY=new Float64Array(N);
function sceneAt(t){let i=0;for(let k=0;k<SC.length;k++)if(t>=SC[k].t0)i=k;return i;}
function speed(t){const s=SC[sceneAt(t)],u=Math.min(1,(t-s.t0)/s.dur);let v=s.v0+(s.v1-s.v0)*u;if(sceneAt(t)===0)v=s.v0+(s.v1-s.v0)*Math.min(1,Math.pow(u*1.3,1.6));return v;}
for(let i=1;i<N;i++)SY[i]=SY[i-1]-speed(i*DT)*DT;
const vy=t=>{const f=Math.max(0,t/DT),i=Math.min(N-2,Math.floor(f)),r=f-i;return SY[i]*(1-r)+SY[i+1]*r;};
const BND=SC.map(s=>vy(s.t0));
const roadX=y=>180+46*Math.sin(y*0.0035)+22*Math.sin(y*0.0011+1);
function drift(t){let d=0;for(let k=1;k<SC.length;k++){const u=(t-(SC[k].t0-0.15))/0.75;if(u>0&&u<1)d+=Math.sin(Math.PI*u)*(k%2?1:-1);}return d;}
function vehState(t){const y=vy(t),dx=(roadX(y-1)-roadX(y+1))/2,d=drift(t);const s=SC[sceneAt(t)];
  const lane=s.veh==='heli'?0:s.bio==='desert'?15:(s.veh==='bike'?10:12);return{x:roadX(y)+lane+d*10,y,a:Math.atan2(-dx,1)*1+d*0.55,d};}
// skid marks (world coords)
const SK=[];for(let t=0;t<DUR;t+=1/60){const v=vehState(t);const s=SC[sceneAt(t)];if(s.veh==='heli')continue;
  const burn=sceneAt(t)===0&&t<0.9;if(Math.abs(v.d)>0.25||burn){const ca=Math.cos(v.a),sa=Math.sin(v.a);for(const ox of [-7,7]){SK.push([v.x+ox*ca-11*sa*-1,v.y+ox*sa+11*ca,s.veh==='tank'?3:2]);}}}
// ---- helpers ----
function hash(n){n=(n<<13)^n;return ((n*(n*n*15731+789221)+1376312589)&0x7fffffff)/0x7fffffff;}
const BIO={town:{g:'#4a6b3a',g2:'#557a42',road:'#3a3d45',line:'#e8e8e8',side:'#a9a9a0'},
 pine:{g:'#1f4a2c',g2:'#25553a',road:'#34363d',line:'#ffd23f',side:'#6b5a3a'},
 desert:{g:'#d9a35a',g2:'#cf9750',road:'#4a4148',line:'#fff2c8',side:'#b9844a',rw:120},
 neon:{g:'#141428',g2:'#191934',road:'#22223a',line:'#ff5fc0',side:'#2c2c4a'},
 office:{g:'#8a8d94',g2:'#7f828a',road:'#4a4c54',line:'#f0f0f0',side:'#a4a6ad'},
 coast:{g:'#e8cf8a',g2:'#e0c47c',road:'#3c3f48',line:'#ffffff',side:'#d4b66e',sea:'#1f8fc0'},
 beach:{g:'#f0d690',g2:'#e8cc80',road:'#3c3f48',line:'#ffffff',side:'#d4b66e',sea:'#1a9ad0'},
 sunset:{g:'#f0b080',g2:'#e8a070',road:'#4a3a48',line:'#ffe0c0',side:'#d09070',sea:'#4a5ab0'}};
const bioAt=wy=>{let i=0;for(let k=1;k<SC.length;k++)if(wy<BND[k])i=k;return SC[i].bio;};
function R(x,y,w,h,c){G.fillStyle=c;G.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function circ(x,y,r,c){G.fillStyle=c;G.beginPath();G.arc(Math.round(x),Math.round(y),r,0,7);G.fill();}
// ---- world ----
function drawWorld(t,camY,z,camX){
  G.save();G.translate(VX,VY);G.scale(z,z);G.translate(-VX,-VY);G.translate(VX-camX,0);
  const top=camY-VY/z-60,bot=camY+(LH-VY)/z+40,T=8;
  const r0=Math.floor(top/T),r1=Math.ceil(bot/T);
  const sy=wy=>wy-camY+VY;
  for(let r=r0;r<=r1;r++){const wy=r*T,b=BIO[bioAt(wy)],y=sy(wy),rx=roadX(wy);
    R(-200,y,LW+400,T+1,(r>>2)&1?b.g:b.g2);
    if(b.sea){const sx=rx-95+8*Math.sin(wy*0.02);R(-200,y,sx+200,T+1,b.sea);R(sx,y,6,T+1,'#e6f6ff');if(hash(r*7)>.7)R(sx-40-hash(r)*60,y,10,1,'#9fe0ff');}
    const hw=(b.rw||60)/2;R(rx-hw,y,2*hw,T+1,b.road);R(rx-hw-4,y,4,T+1,b.side);R(rx+hw,y,4,T+1,b.side);
    if((r&3)===0){R(rx-hw-9,y,2,3,'#fff');R(rx+hw+7,y,2,3,'#ff3030');}
    if(b.rw){R(rx-1,y,1,T+1,'#ffd23f');R(rx+1,y,1,T+1,'#ffd23f');if(((r%6)+6)%6<3){R(rx-hw/2,y,2,T+1,b.line);R(rx+hw/2,y,2,T+1,b.line);}continue;}
    if(bioAt(wy)==='neon'){R(rx-36,y,2,T+1,'#3ff0ff');R(rx+34,y,2,T+1,'#ff5fc0');}
    if(((r%6)+6)%6<3)R(rx-1,y,2,T+1,b.line);
    if((r&3)===0){R(rx-hw-9,y,2,3,'#fff');R(rx+hw+7,y,2,3,'#ff3030');}}
  // decorations per 32px cell row
  const D=32;for(let r=Math.floor(top/D);r<=Math.ceil(bot/D);r++){const wy=r*D,bio=bioAt(wy),rx=roadX(wy),y=sy(wy);
    for(const side of [-1,1]){const h=hash(r*31+(side>0?17:3)),h2=hash(r*57+(side>0?5:11));const off=(BIO[bio].rw?74:44)+h*46,x=rx+side*off;
      if(bio==='pine'){pine(x,y,9+h2*6);if(h2>.5)pine(rx+side*(130+h*40),y+12,10+h*5);}
      else if(bio==='town'){if(h>.35)house(x+side*14,y,h2);else tree(x,y,7);}
      else if(bio==='desert'){if(h2>.6)cactus(x,y);else if(h2>.3)rock(x,y,3+h*4);}
      else if(bio==='neon'){bldg(rx+side*(70+h*20),y,side,h2,t);if(r%2===0)lamp(rx+side*38,y);}
      else if(bio==='office'){office(rx+side*(78+h*10),y,side,h2);}
      else if(bio==='coast'||bio==='beach'||bio==='sunset'){if(side>0)palm(x+10,y,8+h2*4,t);else if(h2>.75)boat(rx-160-h*60,y,t);}
    }
    if(bio==='office'&&hash(r*13)>.55){const cx=rx+12,cy=y;const flat=wy>vy(t)+6&&SC[sceneAt(t)].veh==='tank';parked(cx,cy,flat,hash(r));}
    if(bio==='desert'&&hash(r*23)>.72){const ln=[-45,-15,45][Math.floor(hash(r*5)*3)];if(ln>0)traffic(rx+ln,y-t*0+0,hash(r*3));else traffic(rx+ln,y,hash(r*3),1);}
    if(bio==='neon'&&hash(r*19)>.6)traffic(rx-14,y+((t*120)%D),hash(r*3));
  }
  // skid marks
  G.fillStyle='rgba(15,15,20,.55)';for(const s of SK){const y=sy(s[1]);if(y<-20||y>LH+20)continue;G.fillRect(Math.round(s[0]),Math.round(y),s[2],s[2]);}
  G.restore();
}
function pine(x,y,r){circ(x+3,y+4,r,'rgba(0,0,0,.3)');circ(x,y,r,'#0f3a1f');circ(x-1,y-1,r*.7,'#1d5a2e');circ(x-2,y-2,r*.35,'#2f7a3e');}
function tree(x,y,r){circ(x+3,y+3,r,'rgba(0,0,0,.3)');circ(x,y,r,'#2f6a2a');circ(x-2,y-2,r*.55,'#4a8a3a');}
function house(x,y,h){const c=['#c0504a','#4a70b0','#d0a040'][Math.floor(h*3)];R(x-12+3,y-10+3,24,22,'rgba(0,0,0,.3)');R(x-12,y-10,24,22,c);R(x-12,y,24,1,'rgba(0,0,0,.3)');R(x-3,y-14,6,6,'#555');}
function cactus(x,y){R(x-2+3,y-8+3,5,16,'rgba(0,0,0,.25)');R(x-2,y-8,5,16,'#3f8a3a');R(x-7,y-3,5,3,'#3f8a3a');R(x-7,y-7,3,5,'#3f8a3a');R(x+3,y,5,3,'#3f8a3a');R(x+6,y-4,3,5,'#3f8a3a');}
function rock(x,y,r){circ(x+2,y+2,r,'rgba(0,0,0,.25)');circ(x,y,r,'#9a7448');circ(x-1,y-1,r*.5,'#b89060');}
function bldg(x,y,side,h,t){const w=44,hh=30;R(x-w/2+4,y-hh/2+4,w,hh,'rgba(0,0,0,.5)');R(x-w/2,y-hh/2,w,hh,['#2a2448','#24304a','#3a2440'][Math.floor(h*3)]);
  const nc=h>.5?'#ff5fc0':'#3ff0ff';G.globalAlpha=.6+.4*Math.sin(t*9+h*20);R(x-w/2,y-hh/2,w,2,nc);R(x-w/2,y+hh/2-2,w,2,nc);G.globalAlpha=1;R(x-6,y-4,12,8,'#151525');}
function lamp(x,y){G.fillStyle='rgba(255,210,120,.18)';G.beginPath();G.arc(x,y,16,0,7);G.fill();R(x-1,y-1,3,3,'#ffe6a0');}
function office(x,y,side,h){const w=52,hh=30;R(x-w/2+4,y-hh/2+4,w,hh,'rgba(0,0,0,.35)');R(x-w/2,y-hh/2,w,hh,h>.5?'#c8ccd4':'#b0b8c4');for(let i=0;i<4;i++)R(x-w/2+5+i*12,y-hh/2+5,8,6,'#7a8ca0');R(x-w/2,y+hh/2-3,w,3,'#8a8f99');}
function parked(x,y,flat,h){const c=['#d04040','#4060d0','#e0e0e0','#40a060'][Math.floor(h*4)];if(flat){R(x-8,y-6,16,13,c);R(x-8,y-1,16,2,'rgba(0,0,0,.4)');R(x-10,y+5,4,2,'#888');R(x+7,y-7,3,2,'#888');}else{R(x-5+2,y-9+2,10,18,'rgba(0,0,0,.35)');R(x-5,y-9,10,18,c);R(x-4,y-5,8,4,'#203040');}}
function traffic(x,y,h,flip){if(flip){G.save();G.translate(x,y);G.rotate(Math.PI);G.translate(-x,-y);}const c=['#e0c040','#e04060','#40c0e0'][Math.floor(h*3)];R(x-5,y-9,10,18,c);R(x-4,y+3,8,4,'#203040');R(x-4,y+8,2,1,'#ff3030');R(x+2,y+8,2,1,'#ff3030');if(flip)G.restore();}
function palm(x,y,r,t){circ(x+5,y+5,r,'rgba(0,0,0,.25)');G.fillStyle='#2f8a3a';for(let k=0;k<6;k++){const a=k*1.05+Math.sin(t*2+x)*.08;G.beginPath();G.ellipse(x+Math.cos(a)*r*.6,y+Math.sin(a)*r*.6,r*.6,2.4,a,0,7);G.fill();}circ(x,y,2.5,'#6a4a2a');}
function boat(x,y,t){R(x-4,y-9,8,18,'#ffffff');R(x-3,y-4,6,6,'#3a6ad0');R(x-1,y+9,2,8,'rgba(255,255,255,.6)');}
// ---- driver + vehicles (local coords, facing up) ----
function driver(x,y){circ(x,y,3.2,'#c8202a');R(x-3,y-5,6,2,'#a01820');R(x-2,y-1,4,1,'#000');}
function vehicle(kind,t,sc){G.save();G.scale(sc,sc);
  if(kind==='car'||kind==='cop'||kind==='old'){const cop=kind==='cop',body=cop?'#14161c':kind==='old'?'#8a8f9a':'#22c4d8',hi=cop?'#f2f2f2':kind==='old'?'#c8ccd4':'#8ff4ff',dk=cop?'#000':kind==='old'?'#5a5f6a':'#0e7f8f';
    R(-10+4,-19+5,20,38,'rgba(0,0,0,.45)');R(-11,-14,3,7,'#111');R(8,-14,3,7,'#111');R(-11,8,3,7,'#111');R(8,8,3,7,'#111');
    R(-9,-19,18,38,body);R(-9,-19,2,38,hi);R(7,-19,2,38,dk);R(-8,-19,16,2,hi);
    R(-7,-9,14,5,'#1a2a3a');R(-6,-9,5,2,'#6fa0c0');R(-7,9,14,4,'#1a2a3a');R(-7,-4,14,13,dk);R(-6,-3,12,11,body);
    if(cop){R(-9,-2,18,6,'#f2f2f2');const on=Math.floor(t*12)%2;R(-6,-4,6,3,on?'#ff2030':'#500');R(0,-4,6,3,on?'#002':'#2060ff');}
    else if(kind==='car'){R(-1,-19,2,38,'#ffffff');driver(-3,1);}
    R(-8,-20,4,1,'#fff6c0');R(4,-20,4,1,'#fff6c0');R(-8,18,4,1,'#ff3030');R(4,18,4,1,'#ff3030');}
  if(kind==='amb'){R(-10+4,-22+4,20,44,'rgba(0,0,0,.45)');R(-10,-22,20,44,'#f4f4f4');R(-10,-22,20,10,'#e8e8e8');R(-8,-14,16,4,'#1a2a3a');driver(-3,-16);R(-3,2,6,14,'#e02030');R(-7,6,14,6,'#e02030');
    const on=Math.floor(t*10)%2;R(-9,-11,8,3,on?'#ff2030':'#600');R(1,-11,8,3,on?'#003':'#2060ff');G.globalAlpha=.35;circ(on?-5:5,-10,14,on?'#ff2030':'#2060ff');G.globalAlpha=1;}
  if(kind==='tank'){R(-15+4,-22+4,30,44,'rgba(0,0,0,.45)');R(-15,-22,8,44,'#2a2f22');R(7,-22,8,44,'#2a2f22');for(let i=0;i<11;i++){const yy=-22+((i*4+t*60)%44);R(-15,yy,8,1,'#151810');R(7,yy,8,1,'#151810');}
    R(-8,-18,16,36,'#5a6a3a');const ta=Math.sin(t*1.5)*.35;G.save();G.rotate(ta);R(-2,-34,4,24,'#4a5a30');R(-9,-9,18,18,'#6a7a48');circ(0,0,6,'#4a5a30');driver(0,1);G.restore();}
  if(kind==='bike'){R(-3+3,-16+3,6,32,'rgba(0,0,0,.4)');R(-2,-16,4,8,'#111');R(-2,9,4,8,'#111');R(-4,-9,8,18,'#ff3a3a');R(-9,-8,18,2,'#222');driver(0,1);R(-1,-17,2,1,'#fff6c0');}
  if(kind==='cheli'){const sp=t*42+1;R(-3,10,6,22,'#e8eef8');circ(0,0,11,'#1a2a6a');circ(0,-4,8,'#9ad8ff');R(-10,-1,20,3,'#fff');const on=Math.floor(t*12)%2;R(-4,5,8,3,on?'#ff2030':'#2060ff');
    G.strokeStyle='rgba(30,30,30,.85)';G.lineWidth=2.5;for(let k=0;k<2;k++){const a=sp+k*Math.PI/2;G.beginPath();G.moveTo(-Math.cos(a)*30,-Math.sin(a)*30);G.lineTo(Math.cos(a)*30,Math.sin(a)*30);G.stroke();}
    G.fillStyle='rgba(255,255,220,.18)';G.beginPath();G.moveTo(0,0);G.lineTo(60,-40);G.lineTo(70,10);G.fill();}
  if(kind==='heli'){const sp=t*40;R(-3,10,6,22,'#ffd23f');R(-7,28,14,3,'#222');circ(0,0,11,'#ffd23f');circ(0,-4,8,'#9ad8ff');driver(0,-2);
    G.strokeStyle='rgba(30,30,30,.85)';G.lineWidth=2.5;for(let k=0;k<2;k++){const a=sp+k*Math.PI/2;G.beginPath();G.moveTo(-Math.cos(a)*30,-Math.sin(a)*30);G.lineTo(Math.cos(a)*30,Math.sin(a)*30);G.stroke();}
    G.fillStyle='rgba(30,30,30,.12)';G.beginPath();G.arc(0,0,30,0,7);G.fill();}
  G.restore();}
// ---- text (full-res) ----
const eo=x=>{x=Math.max(0,Math.min(1,x));return 1-Math.pow(1-x,3);};
const step=(x,n)=>Math.floor(Math.max(0,Math.min(1,x))*n)/n;
function fit(txt,max,size){X.font=size+'px PX';let s=size;while(X.measureText(txt).width>max&&s>10){s-=2;X.font=s+'px PX';}return s;}
function T(txt,x,y,size,col,glow){fit(txt,888,size);X.textAlign='center';X.textBaseline='middle';X.fillStyle='#000';X.fillText(txt,x+6,y+6);if(glow){X.shadowColor=glow;X.shadowBlur=24;}X.fillStyle=col;X.fillText(txt,x,y);X.shadowBlur=0;}
function box(x,y,w,h,col,a){X.fillStyle='rgba(8,8,20,'+(a??.78)+')';X.fillRect(x+12,y,w-24,h);X.fillRect(x,y+12,w,h-24);X.fillStyle=col;const p=6;
  X.fillRect(x+12,y,w-24,p);X.fillRect(x+12,y+h-p,w-24,p);X.fillRect(x,y+12,p,h-24);X.fillRect(x+w-p,y+12,p,h-24);X.fillRect(x+p,y+p,p,p);X.fillRect(x+w-2*p,y+p,p,p);X.fillRect(x+p,y+h-2*p,p,p);X.fillRect(x+w-2*p,y+h-2*p,p,p);}
function hud(s,lt,t){const a=step(lt/.25,5);if(a<=0)return;X.save();X.globalAlpha=Math.min(1,a*1.2);
  if(s.type==='title'){const y=520;T('GTA 6',540,y-150,150,'#ffd23f','#ff8a00');T('JUST BROKE',540,y+10,64,'#fff');T('THE INTERNET',540,y+100,64,'#fff');if(lt>.5)T('6 NUMBERS THAT PROVE IT',540,y+210,30,'#3ff0ff');}
  else if(s.type==='cta'){box(96,360,888,460,'#ff9a3c');T(s.lines[0],540,470,56,'#fff');T(s.lines[1],540,560,56,'#ffd23f','#ff8a00');T(s.sub,540,660,26,'#cfd');if(Math.floor(lt*4)%2||lt>1.5){box(270,710,540,80,'#ff5fc0',.95);T(s.btn,540,752,28,'#fff');}}
  else if(s.type==='vs'){box(96,330,888,520,s.col);T(s.tag,540,395,28,s.col);const u=eo((lt-.2)/1.3);
    T(s.a.l+'  $'+(s.a.v*Math.min(1,u*2)).toFixed(2)+'B',540,490,40,'#9aa');T('VS',540,560,30,'#fff');T(s.b.l+'  '+B(s.b.v*u),540,660,62,'#fff',s.col);

function speedo(t){const s=SC[sceneAt(t)],u=Math.min(1,(t-s.t0)/s.dur),k=Math.round(s.kmh[0]+(s.kmh[1]-s.kmh[0])*u);if(s.type==='cta'||s.type==='title')return;

// ---- frame ----
function renderAt(t){const si=sceneAt(t),s=SC[si],lt=t-s.t0,v=vehState(t);

  else{R(x-36,y-4,30,9,'#f0f0f0');R(x+6,y-4,26,9,'#f0f0f0');const on=Math.floor(t*12)%2;R(x-6,y-20,8,3,on?'#ff2030':'#500');R(x+2,y-20,8,3,on?'#002':'#2060ff');G.globalAlpha=.35;circ(x+(on?-2:6),y-19,16,on?'#ff2030':'#2060ff');G.globalAlpha=1;}
  R(x+35,y-4,3,4,'#fff6c0');R(x-38,y-3,2,4,'#ff3030');
  for(const wx of [x-22,x+22]){circ(wx,y+8,7,'#111');circ(wx,y+8,4,'#888');const a=-t*40;R(wx+Math.cos(a)*3-1,y+8+Math.sin(a)*3-1,2,2,'#222');}
  if(!cop){G.fillStyle='rgba(255,240,200,.18)';G.beginPath();G.moveTo(x+37,y-3);G.lineTo(x+120,y-14);G.lineTo(x+120,y+12);G.fill();}G.restore();}
function sideOpen(t){G.setTransform(1,0,0,1,0,0);G.clearRect(0,0,LW,LH);

  circ(250,300,34,'#fff0b0');G.globalAlpha=.25;circ(250,300,60,'#ffe0a0');G.globalAlpha=1;

    if(k==='motel'){R(x,330,200,110,'#f2d6a8');R(x,330,200,8,'#c8806a');R(x,382,200,5,'#c8806a');

  for(let k=0;k<12;k++){const x=((k*50-d)%600+600)%600-50;R(x,508,26,3,'#ffd890');}
