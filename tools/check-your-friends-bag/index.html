import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';

import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';

const Q = new URLSearchParams(location.search);
const W = +(Q.get('w')||1080), H = +(Q.get('h')||1920);
const DUR = 20.0, FPS = 30;

// ---------- values shared with Part 1 (The Invisible Backpack) ----------
// Part 2 opens on Part 1's last frame, so everything here must match Part 1's style sheet
// (storyboards/invisible-backpack/style-sheet.md). Change values here only.
const CFG = {
  rise:0.38, tread:0.50, stepW:0.95, slab:0.34,      // 7 floating rock steps
  blueZ:-1.75,                                        // the friend's staircase, beside the white one
  hero:{color:'#efe6d4',emis:'#2a241a',r:0.045},      // white stickman (One Step a Day rig)
  blue:{color:'#7f93b8',emis:'#10151f',r:0.04},       // blue crowd / friend
  rock:'#9a948a', warm:'#ffb04a', pain:'#b8673a', calm:'#4f9ee0',
  bagRim:'#a9d6d2',
  lamp:{pos:[3.12,2.66,0.32],color:'#ffcf8a'},
  heroBag:[-0.95,0,0.75],                              // Part 1's empty bag on the ground
  fog:'#16233a', fov:46,
  cam0:{pos:[-4.6,3.3,8.6],look:[1.4,1.55,0]},       // Part 1 final frame camera
};
const RISE=CFG.rise, TREAD=CFG.tread, N=7, TOPY=N*RISE, BZ=CFG.blueZ;
const stepX=k=>(k-1)*TREAD;                       // centre of rock step k (1..7)
const standX=k=>k<=0?-0.45:stepX(k)-0.06;         // where a figure stands on step k (0 = ground)
const standY=k=>k<=0?0:k*RISE;

// ---------- helpers ----------
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,u)=>a+(b-a)*u;
const sstep=(a,b,x)=>{const u=clamp((x-a)/(b-a),0,1);return u*u*(3-2*u);};
const ease=u=>u<0.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
const V3=(a)=>new THREE.Vector3(...a);
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function pchip(keys){
  const n=keys.length,x=keys.map(k=>k[0]),y=keys.map(k=>k[1]),d=[],m=new Array(n);
  for(let i=0;i<n-1;i++)d.push((y[i+1]-y[i])/(x[i+1]-x[i]));
  m[0]=d[0];m[n-1]=d[n-2];
  for(let i=1;i<n-1;i++){ if(d[i-1]*d[i]<=0)m[i]=0; else{const w1=2*(x[i+1]-x[i])+(x[i]-x[i-1]),w2=(x[i+1]-x[i])+2*(x[i]-x[i-1]);m[i]=(w1+w2)/(w1/d[i-1]+w2/d[i]);} }
  return t=>{ if(t<=x[0])return y[0]; if(t>=x[n-1])return y[n-1];
    let i=0;while(t>x[i+1])i++; const h=x[i+1]-x[i],s=(t-x[i])/h,s2=s*s,s3=s2*s;
    return (2*s3-3*s2+1)*y[i]+(s3-2*s2+s)*h*m[i]+(-2*s3+3*s2)*y[i+1]+(s3-s2)*h*m[i+1]; };
}
// piecewise keys [[t, value-or-array]] with ease between keys
function keys(K,t){if(t<=K[0][0])return K[0][1];for(let i=0;i<K.length-1;i++){if(t<=K[i+1][0]){const u=ease((t-K[i][0])/(K[i+1][0]-K[i][0]));const a=K[i][1],b=K[i+1][1];return Array.isArray(a)?a.map((v,j)=>lerp(v,b[j],u)):lerp(a,b,u);}}return K[K.length-1][1];}
const yawTo=(dx,dz)=>Math.atan2(-dz,dx);
function angLerp(a,b,u){let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return a+d*u;}

// ---------- timeline (one place; times.js exports it for the overlay and the mix) ----------
const TL={
  turn:[0.35,1.25],            // hero turns to look back
  xray:[3.35,5.9],             // X-ray on
  collapse:[5.05,5.55],        // friend drops to his knees
  descend:[6.25,8.65],         // hero walks down his 7 steps
  walk:[8.65,9.75],
  kneel:[9.75,10.25], tap:[10.35,10.95], point:[11.0,11.65],
  bagOff:[11.65,12.1], lift:[12.15,12.6], carry:[12.6,13.4],
  load:[13.9,14.45],           // rocks fly from his bag into the white guy's bag
  place:[13.4,14.85,15.3,15.75,16.2,16.62,17.05], // blue step k (1..7) lands
  bridge:18.3, bagDrop:18.45,
};
TL.passes=[];{const [a,b]=TL.descend;for(let i=0;i<=N;i++)TL.passes.push(+(a+(b-a)*i/N).toFixed(3));} // hero leaves step 7-i
window.TL=TL;

// ---------- renderer ----------
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});

renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const FOG=new THREE.Color(CFG.fog);
scene.fog=new THREE.FogExp2(FOG,0.012);
const camera=new THREE.PerspectiveCamera(CFG.fov,W/H,0.05,4000);
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(W/2,H/2),0.45,0.6,0.78);
composer.addPass(bloom);composer.addPass(new OutputPass());

// ---------- sky (pre-dawn; dawn opens a little on the payoff) ----------
const sunElev=pchip([[0,-4],[17,-2.6],[20,-0.6]]);
const dawn=t=>0.18+0.3*sstep(17.5,20,t);
const sunDir=t=>{const e=THREE.MathUtils.degToRad(sunElev(t)),a=THREE.MathUtils.degToRad(-14);return new THREE.Vector3(Math.cos(e)*Math.cos(a),Math.sin(e),Math.cos(e)*Math.sin(a));};
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{sun:{value:new THREE.Vector3(1,0,0)},up:{value:0},dim:{value:0}},
  vertexShader:`varying vec3 vd;void main(){vd=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);gl_Position.z=gl_Position.w;}`,
  fragmentShader:`varying vec3 vd;uniform vec3 sun;uniform float up;uniform float dim;
  float h(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,37.719)))*43758.5453);}
  void main(){vec3 d=normalize(vd);float el=d.y;
    vec3 zen=vec3(0.020,0.035,0.075),hor=vec3(0.075,0.115,0.180),low=vec3(0.045,0.065,0.105);
    vec3 c=mix(hor,zen,smoothstep(0.,0.55,el));c=mix(c,low,smoothstep(0.,-0.25,el));
    float s=max(dot(d,sun),0.);float band=exp(-abs(el)*7.);
    vec3 gold=vec3(1.0,0.62,0.26),teal=vec3(0.10,0.30,0.36);
    c+=teal*band*0.25*(1.-up);c+=gold*band*pow(s,3.)*(0.25+1.1*up);c+=gold*pow(s,40.)*(0.2+1.2*up);
    vec3 g=floor(d*420.);float st=step(0.9975,h(g));c+=vec3(0.85,0.88,1.)*st*smoothstep(0.05,0.4,el)*(1.-up)*0.9;
    gl_FragColor=vec4(c*(1.-0.55*dim),1.);}`});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(3000,48,24),skyMat));
function ridge(r,hgt,seed,col){const R=rng(seed),seg=360,pos=[],idx=[];const ph=[R()*6,R()*6,R()*6];
  for(let i=0;i<=seg;i++){const a=i/seg*Math.PI*2;const y=hgt*(0.45+0.3*Math.sin(a*3+ph[0])+0.18*Math.sin(a*11+ph[1])+0.08*Math.sin(a*29+ph[2]));
    pos.push(Math.cos(a)*r,-2,Math.sin(a)*r, Math.cos(a)*r,y,Math.sin(a)*r);}
  for(let i=0;i<seg;i++){const k=i*2;idx.push(k,k+1,k+2,k+1,k+3,k+2);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);
  return new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:col,side:THREE.DoubleSide,fog:false}));}
scene.add(ridge(900,70,3,'#0d1626'));scene.add(ridge(1400,140,7,'#101b2e'));scene.add(ridge(600,38,11,'#0b1320'));
function noiseTex(size,seed,base,amp,speck){const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');const R=rng(seed);
  const im=g.createImageData(size,size);for(let i=0;i<size*size;i++){let v=base+(R()-0.5)*amp;if(R()<speck)v+=(R()-0.5)*amp*3;im.data[i*4]=im.data[i*4+1]=im.data[i*4+2]=clamp(v,0,255);im.data[i*4+3]=255;}
  g.putImageData(im,0,0);g.globalAlpha=0.35;for(let k=0;k<40;k++){g.fillStyle=R()<0.5?'#000':'#fff';g.beginPath();g.arc(R()*size,R()*size,R()*size*0.12,0,7);g.fill();}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}
const gTex=noiseTex(256,5,120,60,0.02);gTex.repeat.set(160,160);
const groundMat=new THREE.MeshStandardMaterial({color:'#2a3850',roughness:1,bumpMap:gTex,bumpScale:0.6,map:gTex});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(2400,2400),groundMat);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

// ---------- lights ----------
const hemi=new THREE.HemisphereLight('#6f86b8','#1a2236',0.9);scene.add(hemi);
const key=new THREE.DirectionalLight('#9fb4e0',1.15);key.castShadow=true;key.shadow.mapSize.set(2048,2048);
Object.assign(key.shadow.camera,{left:-8,right:8,top:8,bottom:-8,near:1,far:80});key.shadow.bias=-0.0006;key.shadow.normalBias=0.02;
scene.add(key);scene.add(key.target);
const sunLight=new THREE.DirectionalLight('#ffb36b',0);scene.add(sunLight);scene.add(sunLight.target);
const lampLight=new THREE.PointLight(CFG.lamp.color,2.2,7,1.6);lampLight.position.set(CFG.lamp.pos[0],CFG.lamp.pos[1]+0.45,CFG.lamp.pos[2]);scene.add(lampLight);
const warmFill=new THREE.PointLight('#ffc27a',0,6,1.8);scene.add(warmFill);   // follows the white stickman's lit step
const coolFill=new THREE.PointLight('#7fb6ff',0,6,1.8);scene.add(coolFill);   // follows the blue staircase's top

// ---------- rocks ----------
function stoneTex(){const sz=256,c=document.createElement('canvas');c.width=c.height=sz;const g=c.getContext('2d');const R=rng(9);const im=g.createImageData(sz,sz);
  for(let y=0;y<sz;y++)for(let x=0;x<sz;x++){const i=y*sz+x;let v=180+(R()-0.5)*40+12*Math.sin(y*0.13+Math.sin(x*0.05)*2)+8*Math.sin(x*0.09+y*0.04);if(R()<0.015)v-=50;im.data[i*4]=im.data[i*4+1]=im.data[i*4+2]=clamp(v,0,255);im.data[i*4+3]=255;}
  g.putImageData(im,0,0);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}
const sTex=stoneTex();
// an irregular rock slab, unit size (fits a 1x1x1 box); scaled per use
function rockGeo(seed){const g=new THREE.IcosahedronGeometry(0.5,3);const p=g.attributes.position;const R=rng(seed);const ph=[R()*6,R()*6,R()*6,R()*6];
  for(let i=0;i<p.count;i++){const v=new THREE.Vector3(p.getX(i),p.getY(i),p.getZ(i));const d=v.clone().normalize();
    // squash toward a box (superellipsoid) so the slab has a flat top to stand on
    const m=Math.max(Math.abs(d.x),Math.abs(d.y),Math.abs(d.z));const box=d.clone().multiplyScalar(0.5/m);v.lerp(box,0.72);
    const n=1+0.07*Math.sin(d.x*5+ph[0])*Math.sin(d.z*4+ph[1])+0.05*Math.sin(d.y*7+d.x*3+ph[2])+0.03*Math.sin(d.z*11+ph[3]);
    v.multiplyScalar(n);if(v.y>0.4)v.y=0.4+(v.y-0.4)*0.3;p.setXYZ(i,v.x,v.y,v.z);}
  g.computeVertexNormals();return g;}
const ROCKG=[];for(let i=0;i<10;i++)ROCKG.push(rockGeo(100+i*17));
const SLAB=new THREE.Vector3(TREAD*0.96,CFG.slab,CFG.stepW);
function rockMesh(i,glow){const m=new THREE.Mesh(ROCKG[i%ROCKG.length],new THREE.MeshStandardMaterial({color:CFG.rock,roughness:0.9,map:sTex,bumpMap:sTex,bumpScale:0.4,emissive:new THREE.Color(glow),emissiveIntensity:0.12,transparent:true}));
  m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;}
const slabY=k=>k*RISE-CFG.slab*0.45; // rock centre so its top sits at k*RISE

// labels: cream text on a dark chip (canvas sprite)
function labelSprite(txt,accent,hgt){const fs=64,pad=22;const c=document.createElement('canvas');const g=c.getContext('2d');g.font=`bold ${fs}px "Liberation Mono", monospace`;
  const w=Math.ceil(g.measureText(txt).width)+pad*2;c.width=w;c.height=fs+pad*1.5;g.font=`bold ${fs}px "Liberation Mono", monospace`;
  g.fillStyle='rgba(8,12,20,0.78)';g.beginPath();g.roundRect(0,0,c.width,c.height,14);g.fill();g.strokeStyle=accent;g.lineWidth=5;g.beginPath();g.roundRect(2.5,2.5,c.width-5,c.height-5,12);g.stroke();
  g.fillStyle='#f4ecdc';g.textBaseline='middle';g.fillText(txt,pad,c.height/2+3);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false,depthWrite:false,fog:false}));s.renderOrder=20;
  s.scale.set(hgt*c.width/c.height,hgt,1);s.userData.base=s.scale.clone();scene.add(s);return s;}

// the white staircase (Part 1): 7 rock steps glowing warm
const white=[];for(let k=1;k<=N;k++){const m=rockMesh(k-1,CFG.warm);m.scale.copy(SLAB);m.position.set(stepX(k),slabY(k),0);m.rotation.y=(rng(k*31)()-0.5)*0.06;white.push(m);}
// lamp on the top step
const lamp=new THREE.Group();{const post=new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.016,0.32,8),new THREE.MeshStandardMaterial({color:'#2b2a2a',roughness:0.6}));post.position.y=0.16;lamp.add(post);
  const bulb=new THREE.Mesh(new THREE.SphereGeometry(0.05,16,12),new THREE.MeshStandardMaterial({color:'#ffe2b0',emissive:new THREE.Color(CFG.lamp.color),emissiveIntensity:1.1}));bulb.position.y=0.36;lamp.add(bulb);
  const cage=new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.06,0.12,8,1,true),new THREE.MeshStandardMaterial({color:'#1e1c1b',wireframe:true}));cage.position.y=0.36;lamp.add(cage);}
lamp.position.set(...CFG.lamp.pos);scene.add(lamp);

// the friend's rocks: 7 steps + the bridge. Order = placement order.
const FR=[
  {txt:'ALONE',xr:true},{txt:'NO ONE CARES',xr:true},{txt:'TIRED',xr:true},{txt:'EVERYONE AHEAD',xr:true},
  {txt:'NOT GOOD ENOUGH'},{txt:"WHAT'S THE POINT"},{txt:"I CAN'T"},{txt:'TOO LATE',xr:true,bridge:true}];
// positions inside his bag (bag-local: +x forward toward his back, y up), labelled ones stacked so labels never overlap
const BAGPOS=[[0.06,0.12,0.12],[0.0,0.36,-0.14],[-0.04,-0.12,-0.12],[0.02,-0.36,0.1],[-0.12,0.3,0.18],[-0.12,-0.28,-0.2],[-0.14,0.0,0.2],[0.04,0.6,0.0]];
FR.forEach((r,i)=>{r.mesh=rockMesh(i+3,CFG.pain);r.lab=labelSprite(r.txt,'#c9875a',0.085);r.bag=V3(BAGPOS[i]);r.rot=new THREE.Euler((rng(i*7+1)()-0.5)*0.9,(rng(i*7+2)()-0.5)*1.2,(rng(i*7+3)()-0.5)*0.9);});
// extra filler rocks that make the bag overflow (some poke out of the top)
const FILL=[];{const R=rng(808);for(let i=0;i<9;i++){const m=rockMesh(i,CFG.pain);const top=i<3;FILL.push({mesh:m,bag:new THREE.Vector3((R()-0.5)*0.24,top?0.55+R()*0.14:(R()-0.5)*0.9,(R()-0.5)*0.4),s:0.12+R()*0.08,top,rot:new THREE.Euler(R()*3,R()*3,R()*3)});}}

// ---------- bags (the invisible backpack: ghost shell with a fresnel rim; X-ray makes it glow) ----------
const bagMatProto=new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,fog:false,
  uniforms:{col:{value:new THREE.Color(CFG.bagRim)},op:{value:0.5},xr:{value:0}},
  vertexShader:`varying vec3 vN;varying vec3 vV;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);vN=normalize(normalMatrix*normal);vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`uniform vec3 col;uniform float op;uniform float xr;varying vec3 vN;varying vec3 vV;
    void main(){float f=1.-abs(dot(normalize(vN),normalize(vV)));float rim=pow(f,2.2);
      float a=op*(0.05+0.55*rim)+xr*(0.07+0.75*rim);gl_FragColor=vec4(col*(0.6+0.9*xr),a);}`});
function bagGeo(){const g=new THREE.BoxGeometry(1,1,1,8,10,8);const p=g.attributes.position;
  for(let i=0;i<p.count;i++){const v=new THREE.Vector3(p.getX(i),p.getY(i),p.getZ(i));const d=v.clone().normalize();const r=0.5*Math.pow(Math.pow(Math.abs(d.x),4)+Math.pow(Math.abs(d.y),4)+Math.pow(Math.abs(d.z),4),-0.25);
    v.copy(d.multiplyScalar(r));if(v.y>0.3)v.x*=1-(v.y-0.3)*0.5;p.setXYZ(i,v.x,v.y,v.z);}g.computeVertexNormals();return g;}
const BAGG=bagGeo();

  const strapG=new THREE.TorusGeometry(0.32,0.03,6,24,Math.PI);[0.22,-0.22].forEach(z=>{const s=new THREE.Mesh(strapG,mat);s.position.set(0.5,0.05,z);s.rotation.set(0,Math.PI/2,Math.PI/2);s.scale.set(1,0.9,1);g.add(s);});
  body.renderOrder=flap.renderOrder=12;scene.add(g);return {g,mat,flap,body};}
const BIG=new THREE.Vector3(0.62,1.12,0.78);  // the friend's bag: almost twice his torso
const SMALL=new THREE.Vector3(0.36,0.48,0.42);// the white stickman's (Part 1) bag
const fBag=makeBag(), hBag=makeBag();

// ---------- stickman rig (One Step a Day) ----------
const L={thigh:0.46,shin:0.46,torso:0.56,neck:0.07,head:0.125,upper:0.31,fore:0.29};
function makeFigure(color,emis,r){
  const mat=new THREE.MeshStandardMaterial({color,roughness:0.55,metalness:0,emissive:new THREE.Color(emis),emissiveIntensity:1,transparent:true});
  const g=new THREE.Group();const cyl=new THREE.CylinderGeometry(r,r,1,10,1,true),sph=new THREE.SphereGeometry(r,12,8);

  for(let i=0;i<12;i++){const j=new THREE.Mesh(sph,mat);j.castShadow=true;g.add(j);joints.push(j);}

}
const UP=new THREE.Vector3(0,1,0),tmp=new THREE.Vector3();

const P0={p:0.05,tilt:0,aL:0.05,aR:-0.05,kL:0.05,kR:0.05,sL:0.12,sR:-0.05,eL:0.2,eR:0.2,dy:0};

  [20.0,[-8.6,4.5,10.8],[1.3,1.9,-0.7],46],
];
window.cameraAt=t=>{const c=cameraAt(t);return {pos:c.pos.toArray(),look:c.look.toArray(),fov:c.fov};};

// ---------- scene update ----------
function update(t){
  const xr=sstep(TL.xray[0],TL.xray[0]+0.3,t)*(1-sstep(TL.xray[1]-0.4,TL.xray[1],t));
  // figures
  const HS=heroState(t),FS=friendState(t);
  hero.g.position.copy(HS.pos);hero.g.rotation.y=HS.yaw;applyPose(hero,solve(HS.pose));
  friend.g.position.copy(FS.pos);friend.g.rotation.y=FS.yaw;applyPose(friend,solve(FS.pose));
  if(FS.shake){friend.g.position.x+=0.012*FS.shake*Math.sin(t*61);friend.g.position.z+=0.01*FS.shake*Math.sin(t*47+1);}
  hero.g.updateMatrixWorld(true);friend.g.updateMatrixWorld(true);
  // crowd: looks up at the top of the white stair, later at both tops
  crowd.forEach(m=>{const F=m.f;const tgt=new THREE.Vector3(standX(N),TOPY+1.4,BZ*0.5*sstep(16,18,t));const dx=tgt.x-m.x,dz=tgt.z-m.z,dh=Math.hypot(dx,dz);
    F.g.rotation.y=yawTo(dx,dz);const look=-clamp(Math.atan2(tgt.y-1.6,dh)*0.9,0,1.0);
    applyPose(F,solve({...POSES.stand,tilt:look-0.05+0.02*Math.sin(t*0.9+m.ph),p:-0.04+look*0.1}));
    F.mat.emissiveIntensity=m.near?1+0.8*sstep(18.2,19,t):1;});
  // X-ray: the friend's body thins to an outline, the world dims
  friend.mat.opacity=1-0.55*xr;friend.mat.emissive.set(CFG.blue.emis).lerp(new THREE.Color('#2a4f7a'),xr);
  hemi.intensity=0.9*(1-0.55*xr)+0.25*sstep(17.5,20,t);key.intensity=1.15*(1-0.6*xr);
  skyMat.uniforms.dim.value=xr;groundMat.color.set('#2a3850').multiplyScalar(1-0.45*xr);

  // white staircase: warm glow; each step flares as he leaves it on the way down
  white.forEach((m,i)=>{const k=i+1;const tp=TL.passes[N-k];const a=t-tp;let g=0.10+(a>=0?0.55*Math.exp(-a*2.2)+0.06:0);
    if(t>17.0)g=Math.max(g,0.16);m.material.emissiveIntensity=g*(1-0.5*xr);});
  // bags
  let squashF=1+0.03*Math.sin(t*3.1)+(FS.shake||0)*0.05*Math.sin(t*37);
  if(FS.bagOn>0){const b=bagOnBack(friend,BIG);
    if(FS.bagOn<1){const gp=new THREE.Vector3(-0.85,BIG.y*0.5,BZ-0.62),gq=new THREE.Quaternion().setFromEuler(new THREE.Euler(0,0.4,0));b.pos.lerp(gp,1-FS.bagOn);b.q.slerp(gq,1-FS.bagOn);}
    setBag(fBag,b.pos,b.q,BIG,squashF);}
  else {const deflate=1-0.62*sstep(TL.load[0],TL.load[1],t);setBag(fBag,new THREE.Vector3(-0.85,BIG.y*0.5*deflate,BZ-0.62),new THREE.Quaternion().setFromEuler(new THREE.Euler(0,0.4,0.05*(1-deflate))),BIG,deflate);}
  fBag.flap.rotation.z=-1.1*sstep(TL.bagOff[1],TL.lift[0],t);
  fBag.mat.uniforms.xr.value=xr;fBag.mat.uniforms.op.value=0.55+0.15*sstep(TL.bagOff[0],TL.bagOff[1],t);
  // the white stickman's bag: on the ground (Part 1), then on his back to carry the friend's rocks, then dropped from the top
  const hb=CFG.heroBag;
  if(t<13.95){setBag(hBag,new THREE.Vector3(hb[0],SMALL.y*0.32,hb[2]),new THREE.Quaternion().setFromEuler(new THREE.Euler(0.1,0.7,-1.35)),SMALL,0.6);}
  else if(t<TL.bridge+0.15&&HS.bagOn>0.01){const b=bagOnBack(hero,SMALL);const sw=sstep(13.95,14.2,t);const fill=1+0.35*sstep(TL.load[0],TL.load[1],t)-0.05*Math.max(0,cycK(t)-1);
    if(sw<1){b.pos.lerp(new THREE.Vector3(hb[0],0.2,hb[2]),1-sw);}
    if(HS.bagOn<1){b.pos.lerp(new THREE.Vector3(standX(N)+0.35,TOPY+0.25,0.42),1-HS.bagOn);}
    setBag(hBag,b.pos,b.q,SMALL.clone().multiplyScalar(fill),1);}
  else {const a=clamp((t-TL.bagDrop)/0.5,0,1);const y0=TOPY+0.25;const y=Math.max(SMALL.y*0.25,y0-4.9*Math.pow(a*0.5*1.45,2)*2.2);
    setBag(hBag,new THREE.Vector3(standX(N)+0.35+0.4*a,t<TL.bagDrop?y0:y,0.42+0.45*a),new THREE.Quaternion().setFromEuler(new THREE.Euler(0.2*a,0.3,-1.3*a)),SMALL,lerp(1,0.55,a));}
  hBag.mat.uniforms.op.value=0.7;hBag.mat.uniforms.xr.value=0.15+0.25*xr;

  // the friend's rocks
  const loadT=TL.load;
  FR.forEach((r,i)=>{const m=r.mesh,mat=m.material,lab=r.lab;const tp=placeT(i);let pos,sc=BAGSC,q=new THREE.Quaternion().setFromEuler(r.rot),op=1,pain=1,labA=0;
    const inF=inBag(fBag,r.bag.clone().add(new THREE.Vector3(0,0.02*Math.sin(t*23+i)*(FS.shake||0),0)));
    if(i===0){ // ALONE: lifted out by the friend at TL.lift, carried together, set as step 1
      if(t<TL.lift[0]){pos=inF;op=Math.max(xr,0);labA=xr;}
      else if(t<TL.carry[0]){const u=sstep(TL.lift[0],TL.lift[1],t);pos=inF.clone().lerp(handsW(friend),u);op=1;labA=u;}
      else if(t<tp){const u=(t-TL.carry[0])/(tp-TL.carry[0]);const hands=handsW(friend).lerp(handsW(hero),0.45);const dest=new THREE.Vector3(stepX(1),slabY(1),BZ);
        pos=u<0.7?hands:hands.lerp(dest,sstep(0.7,1,u));sc=lerp(BAGSC,1,sstep(0.72,1,u));q.slerp(new THREE.Quaternion(),sstep(0.5,1,u));labA=1;}
      else {pos=new THREE.Vector3(stepX(1),slabY(1),BZ);sc=1;q.identity();labA=1;}
    } else if(r.bridge){ // TOO LATE: the last rock in the white stickman's bag, laid flat across the gap at the top
      const dest=new THREE.Vector3(standX(N)+0.06,TOPY+0.07,BZ*0.5);
      if(t<loadT[0]){pos=inF;op=xr;labA=xr;}
      else if(t<TL.bridge-0.9){const u=sstep(loadT[0]+0.05*i,loadT[0]+0.05*i+0.3,t);pos=inF.clone().lerp(inBag(hBag,new THREE.Vector3(0,0,0)),u);op=1-u;sc=BAGSC*(1-0.6*u);}
      else if(t<tp){const u=sstep(TL.bridge-0.9,TL.bridge-0.55,t);const hands=handsW(hero).lerp(handsW(friend),0.5*sstep(TL.bridge-0.6,TL.bridge-0.4,t));
        pos=inBag(hBag,new THREE.Vector3(0,0.3,0)).lerp(hands,u);pos.lerp(dest,sstep(TL.bridge-0.35,TL.bridge,t));op=u;sc=BAGSC*lerp(0.4,1,u);
        const v=sstep(TL.bridge-0.45,TL.bridge,t);sc=lerp(sc,1,v);q.slerp(new THREE.Quaternion(),v);labA=u;}
      else {pos=dest;sc=1;q.identity();labA=1;}
    } else { // steps 2..7: into the white bag on the load, then handed across, one per cycle
      const c=cyc(t);const k=i+1;
      if(t<loadT[0]){pos=inF;op=Math.max(xr,0);labA=r.xr?xr:0;}
      else if(!c||c.k<k||(c.k===k&&c.u<0.02)){const u=sstep(loadT[0]+0.05*i,loadT[0]+0.05*i+0.3,t);const arc=new THREE.Vector3(0,0.5*Math.sin(u*Math.PI),0);
        pos=inF.clone().lerp(inBag(hBag,new THREE.Vector3(0,0,0)),u).add(arc);op=1-u;sc=BAGSC*(1-0.6*u);}
      else if(c.k===k){const u=c.u;const dest=new THREE.Vector3(stepX(k),slabY(k),BZ);
        const pb=inBag(hBag,new THREE.Vector3(0,0.3,0));const hh=handsW(hero),hf=handsW(friend);
        if(u<0.12){pos=pb.lerp(hh,u/0.12);op=u/0.12;}else if(u<0.3){pos=hh.lerp(hf,ease((u-0.12)/0.18));}else if(u<0.62){pos=hf;}else{pos=hf.lerp(dest,sstep(0.62,0.8,u));}
        sc=lerp(BAGSC,1,sstep(0.55,0.8,u));q.slerp(new THREE.Quaternion(),sstep(0.5,0.8,u));labA=sstep(0.05,0.25,u);}
      else {pos=new THREE.Vector3(stepX(k),slabY(k),BZ);sc=1;q.identity();labA=1;}
    }
    // landing drop
    const age=t-tp;if(age>=0&&age<0.08&&!r.bridge)pos=pos.clone().add(new THREE.Vector3(0,0.12*(1-age/0.08),0));
    m.position.copy(pos);m.quaternion.copy(q);m.scale.copy(rockS(r,sc));
    mat.opacity=clamp(op,0,1);m.visible=op>0.01;mat.depthWrite=op>0.98;
    // colour: dim amber "pain" until it becomes a step, then calm blue
    pain=1-sstep(tp,tp+0.5,t);mat.emissive.copy(glowBlue).lerp(glowPain,pain);
    mat.emissiveIntensity=(pain>0.5?0.18+0.45*xr+0.06*Math.sin(t*5+i):0.28)+(age>=0?0.6*Math.exp(-age*4):0);
    if(r.bridge&&age>=0)mat.emissive.copy(glowBlue).lerp(new THREE.Color(CFG.warm),0.45);
    // labels: big in the X-ray, then on the steps they become
    const lp=pos.clone().add(new THREE.Vector3(0,(sc>0.8?0.1:0.0),sc>0.8?0.55:0.0));
    if(sc>0.8)lp.add(new THREE.Vector3(0,0.05,0));
    lab.position.copy(lp);
    const xrShow=r.xr&&t<TL.lift[0]+0.6?xr:0;
    const stepShow=age>=-0.6&&t>=TL.carry[0]?labA*(t<17.6?0.92:0.92*(1-0.6*sstep(18.4,19,t))):0;
    lab.material.opacity=Math.max(xrShow,stepShow);lab.visible=lab.material.opacity>0.01;
    const big=xrShow>stepShow;lab.scale.copy(lab.userData.base).multiplyScalar(big?1.0:clamp(camera.position.distanceTo(lab.position)/3.2,0.8,2.6));
    if(big){const j=XRORD.indexOf(i);lab.position.copy(inBag(fBag,new THREE.Vector3(0,0,0))).add(new THREE.Vector3(0.05,0.36-j*0.16,0.25));}
  });
  FILL.forEach((f,i)=>{const m=f.mesh;const p=inBag(fBag,f.bag);const u=sstep(loadT[0]+0.03*i,loadT[0]+0.03*i+0.3,t);
    m.position.copy(p).lerp(inBag(hBag,new THREE.Vector3()),u);m.position.y+=0.4*Math.sin(u*Math.PI);
    m.quaternion.setFromEuler(f.rot);m.scale.setScalar(f.s*(1-0.7*u));m.material.opacity=f.top?1-u:Math.max(xr*0.9,0)*(1-u);m.visible=m.material.opacity>0.01;m.material.depthWrite=f.top;
    m.material.emissiveIntensity=0.15+0.4*xr;});

  // sky / light
  const sd=sunDir(t),up=dawn(t);skyMat.uniforms.sun.value.copy(sd);skyMat.uniforms.up.value=up;
  const cam=cameraAt(t);
  key.position.copy(cam.look).add(new THREE.Vector3(-9,16,11));key.target.position.copy(cam.look);
  sunLight.intensity=1.2*sstep(17.5,20,t);sunLight.position.copy(sd).multiplyScalar(40).add(new THREE.Vector3(1.5,1.5,-0.8));sunLight.target.position.set(1.5,1.5,-0.8);
  lampLight.intensity=1.3*(1-0.5*xr);
  const lit=TL.passes.findIndex(p=>p>t);const curK=lit<0?0:N-lit+1;
  warmFill.position.set(HS.pos.x,HS.pos.y+0.8,0.6);warmFill.intensity=t>TL.descend[0]&&t<TL.walk[1]?0.5:0.0;
  const blueTop=TL.place.filter(p=>p<=t).length;coolFill.position.set(stepX(Math.max(1,blueTop)),standY(blueTop)+0.9,BZ+0.5);coolFill.intensity=blueTop>0?1.0+0.8*sstep(17,18.5,t):0;
  scene.fog.color.copy(FOG).lerp(new THREE.Color('#080c16'),xr*0.6);
  bloom.strength=0.45+0.2*xr;
  camera.position.copy(cam.pos);camera.fov=cam.fov;camera.updateProjectionMatrix();camera.lookAt(cam.look);
}
function cycK(t){const c=cyc(t);return c?c.k:0;}

// ---------- frame accumulation (motion blur) ----------
const acc=document.createElement('canvas');acc.width=W;acc.height=H;const actx=acc.getContext('2d');
window.renderAt=(t,samples)=>{
  const n=samples||1;const shutter=1/60;
  for(let i=0;i<n;i++){const tt=Math.max(0,t-shutter*(n>1?i/(n-1):0)+(n>1?shutter*0.5:0));update(Math.min(DUR,tt));composer.render();
    actx.globalAlpha=1/(i+1);actx.drawImage(renderer.domElement,0,0);}
  actx.globalAlpha=1;return acc.toDataURL('image/jpeg',0.94);
};
window.DUR=DUR;window.ready=true;
</script></body></html>
