<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// v3: shot-for-shot replica of the V-Visuals "Perfectionist vs Action Taker" reel.
// Locked camera, ref layout measured from the ref frames (720x1280 x1.5), ref beat timings.
// ?theme=A painted night (ref look)  |  ?theme=B Slow Light (navy/charcoal, gold, teal, cream, red chips)
const W = 1080, H = 1920, DUR = 15.2;
const THEME = (new URLSearchParams(location.search).get('theme')||'A').toUpperCase();
const SL = THEME==='B';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const FONT = '"Inter Display", "Inter", "DejaVu Sans", sans-serif';

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,u)=>a+(b-a)*u;
const smooth=u=>{u=clamp(u,0,1);return u*u*(3-2*u);};
const easeOut=u=>{u=clamp(u,0,1);return 1-Math.pow(1-u,3);};
const easeIn=u=>{u=clamp(u,0,1);return u*u*u;};
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
function pw(keys,t,ease){if(t<=keys[0][0])return keys[0].slice(1);for(let i=1;i<keys.length;i++){if(t<=keys[i][0]){const A=keys[i-1],B=keys[i];let u=(t-A[0])/(B[0]-A[0]);if(ease)u=smooth(u);return A.slice(1).map((v,k)=>lerp(v,B[k+1],u));}}return keys[keys.length-1].slice(1);}

// ---------------- palette ----------------
const C = SL ? {
  wood:'#d9a24a', woodD:'#94601f', woodL:'#f6cf80', woodOut:'#3b2410', rope:'#e6be62',
  skin:'#efe4cf', skinSh:'#b9ab92', skinHi:'#fffaf0', out:'#1d1b1d', ink:'#1d1b1d',
  gold:'#ffc23d', red:'#e0353a', cream:'#f3ead8', glow:'rgba(255,196,90,0.45)'
} : {
  wood:'#dc9c43', woodD:'#9a6224', woodL:'#f4c574', woodOut:'#4a2c12', rope:'#e0b45a',
  skin:'#e3cfb0', skinSh:'#b89c79', skinHi:'#fbf0de', out:'#2b211d', ink:'#2b211d',
  gold:'#ffc93d', red:'#e0353a', cream:'#f4efe6', glow:null
};

// ---------------- ref layout (1080x1920) ----------------
const G = 1620;                               // ground line
const PLAT = {x0:322, x1:975, y:508};          // plateau top edge
const DOOR = {x:655, y:503, w:94, h:122};
const LAD = {bl:[600,G], tl:[644,538], br:[858,G], tr:[716,538], n:19};
const RUNG_Y=[]; {let r=0.958, g=1, s=0; const gaps=[]; for(let i=0;i<LAD.n-1;i++){gaps.push(g); s+=g; g*=r;} let y=1580; RUNG_Y.push(y); for(const gp of gaps){ y-=gp/s*(1580-562); RUNG_Y.push(y);} }
function rungY(i){ if(i<0) return G; if(i>=LAD.n-1) return RUNG_Y[LAD.n-1]+(i-(LAD.n-1))*(RUNG_Y[LAD.n-1]-RUNG_Y[LAD.n-2]); const k=Math.floor(i), f=i-k; return lerp(RUNG_Y[k],RUNG_Y[k+1],f); }
function ladX(y){ const u=(G-y)/(G-LAD.tl[1]); return [lerp(LAD.bl[0],LAD.tl[0],u), lerp(LAD.br[0],LAD.tr[0],u)]; }
const ladMid=y=>{const [a,b]=ladX(y); return (a+b)/2;};
const ladHalf=y=>{const [a,b]=ladX(y); return (b-a)/2;};
const ST = {x0:14, dx:39, dy:61, w:124, fh:50};   // crate steps up the left slope
const stepTop=i=>G-(i+1)*ST.dy;
const stepX=i=>ST.x0+i*ST.dx;

// ---------------- ref timeline ----------------
const AT_C = 17, AT_T0 = 1.55, AT_P = (8.45-AT_T0)/(AT_C-1);
const AT_TOP = 9.2;
const BREAK = 10.12;
const AT_FALL = [10.12, 10.8];
const PF_HIT = 10.15, PF_LAND = 11.55;
const P_FIRST = 3.3, P_P = 0.6;
const HELI_IN = 7.75, HELI_LAND = 10.8;
const LABEL_BR = 9.8;
const RICH = {out:11.95, stop:12.9};
const STARS_T = 11.85;
const KEEP_RUNGS = [2,3];
const STUMP_Y = 1185;

// ---------------- noise ----------------
function hash(i,j){let h=(Math.imul(i,374761393)+Math.imul(j,668265263))|0; h=Math.imul(h^(h>>>13),1274126177); return ((h^(h>>>16))>>>0)/4294967296;}
function vnoise(x,y){const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j;const u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);const a=hash(i,j),b=hash(i+1,j),c=hash(i,j+1),d=hash(i+1,j+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y,o){let s=0,a=0.5,f=1;for(let k=0;k<o;k++){s+=a*vnoise(x*f+k*17.3,y*f-k*9.1);f*=2.03;a*=0.5;}return s;}
function jag(pts, amp, step, seed){
  const R=rng(seed), out=[]; const n=pts.length;
  for(let i=0;i<n;i++){ const [x0,y0]=pts[i],[x1,y1]=pts[(i+1)%n]; const L=Math.hypot(x1-x0,y1-y0), k=Math.max(1,Math.round(L/step)); const nx=-(y1-y0)/L, ny=(x1-x0)/L;
    const a0 = (y0>G+20||y1>G+20)?0:1;
    for(let j=0;j<k;j++){const u=j/k, a=a0*((vnoise(i*7+u*k*0.35,seed)-0.5)*2*amp+(R()-0.5)*amp*0.5); out.push([lerp(x0,x1,u)+nx*a, lerp(y0,y1,u)+ny*a]);} }
  const p=new Path2D(); out.forEach(([x,y],i)=>i?p.lineTo(x,y):p.moveTo(x,y)); p.closePath(); return p;
}
const MTN = jag([[-80,G+40],[-40,1330],[0,1290],[60,1180],[120,1050],[175,920],[225,790],[268,670],[300,580],[PLAT.x0,PLAT.y+6],
                 [PLAT.x1,PLAT.y+4],[990,590],[1005,700],[1022,830],[1050,960],[1072,1030],[1110,1100],[1130,G+40]],9,15,21);
const BULGE = jag([[1010,1080],[1040,1010],[1085,1000],[1110,1060],[1110,1400],[1060,1420],[1030,1300]],6,12,25);

// ---------------- precomputed layers ----------------
const CW=1080, CH=1920;
const BG=document.createElement('canvas'); BG.width=CW; BG.height=CH;
const WORLD=document.createElement('canvas'); WORLD.width=CW; WORLD.height=CH;
const STARS=[]; {const R=rng(5); for(let i=0;i<900;i++){const y=R()*1250; STARS.push([R()*CW, y, 0.5+R()*1.4*(R()<0.08?1.9:1), 0.25+R()*0.75, R()*6.28]);}}
function buildBG(){
  const g=BG.getContext('2d');
  const sk=g.createLinearGradient(0,0,0,CH);
  if(SL){ sk.addColorStop(0,'#05080f'); sk.addColorStop(0.3,'#0a1019'); sk.addColorStop(0.55,'#0f1a22'); sk.addColorStop(1,'#0c141b'); }
  else { sk.addColorStop(0,'#0c1019'); sk.addColorStop(0.3,'#141a28'); sk.addColorStop(0.5,'#20283a'); sk.addColorStop(0.68,'#2c354a'); sk.addColorStop(1,'#262d40'); }
  g.fillStyle=sk; g.fillRect(0,0,CW,CH);
  for(const [x,y,r,a] of STARS){ g.globalAlpha=a*clamp((1300-y)/400,0,1); g.fillStyle=SL?'#e9f1ee':'#f3f1ea'; g.beginPath(); g.arc(x,y,r,0,7); g.fill(); }
  g.globalAlpha=1;
  const L = SL ? [[640,90,'#1b3038',210,3],[720,90,'#172a32',170,7],[810,100,'#13232b',150,11],[910,110,'#101e25',130,15],[1010,110,'#0d1920',120,19],[1110,110,'#0b151b',110,23],[1220,110,'#091217',100,27]]
               : [[640,90,'#56617d',210,3],[720,90,'#4c5772',170,7],[810,100,'#434d67',150,11],[910,110,'#3a435b',130,15],[1010,110,'#323a50',120,19],[1110,110,'#2b3246',110,23],[1220,110,'#252b3d',100,27]];
  for(const [base,amp,col,sc,seed] of L){
    g.beginPath(); g.moveTo(0,CH);
    for(let x=0;x<=CW;x+=5){ const n=fbm(x/sc,seed,4); const pk=Math.pow(Math.abs(Math.sin(x/sc*1.9+seed)),2.5); g.lineTo(x, base-amp*(n*1.1+pk*0.55)); }
    g.lineTo(CW,CH); g.closePath(); g.fillStyle=col; g.fill();
    g.save(); g.clip(); const mg=g.createLinearGradient(0,base-amp*1.3,0,base+50); mg.addColorStop(0,SL?'rgba(90,170,175,0.14)':'rgba(160,175,210,0.16)'); mg.addColorStop(1,'rgba(150,165,200,0)'); g.fillStyle=mg; g.fillRect(0,0,CW,CH); g.restore();
    const mist=g.createLinearGradient(0,base-10,0,base+80); mist.addColorStop(0,'rgba(120,135,165,0)'); mist.addColorStop(0.5,SL?'rgba(70,150,160,0.16)':'rgba(130,145,175,0.2)'); mist.addColorStop(1,'rgba(120,135,165,0)');
    g.fillStyle=mist; g.fillRect(0,base-10,CW,90);
  }
}
function buildWorld(){
  const g=WORLD.getContext('2d');
  const mk=document.createElement('canvas'); mk.width=CW; mk.height=CH; const m=mk.getContext('2d');
  m.fillStyle='#fff'; m.fill(MTN); m.fill(BULGE);
  const mask=m.getImageData(0,0,CW,CH).data;
  const bm=document.createElement('canvas'); bm.width=CW; bm.height=CH; const b2=bm.getContext('2d'); b2.fillStyle='#fff'; b2.fill(BULGE); const bmask=b2.getImageData(0,0,CW,CH).data;
  const id=g.createImageData(CW,CH), d=id.data;
  const H1=(x,y)=>0.6*fbm(x/55,y/190,4)+0.4*fbm(x/13,y/18,3);
  const base = SL? [44,47,52] : [60,53,50];
  for(let py=0;py<CH;py++){
    const y=py;
    for(let px=0;px<CW;px++){
      const x=px, k=(py*CW+px)*4;
      const inM=mask[k+3]/255;
      if(inM>0){
        const h=H1(x,y), hx=H1(x+1.6,y)-H1(x-1.6,y), hy=H1(x,y+1.6)-H1(x,y-1.6);
        const side=clamp((x-650)/430,-1,1);
        let lam = 0.6 - 0.28*side - hx*5.5 - hy*2.2;
        if(bmask[k+3]>0) lam = 0.75 - hx*6 - hy*3;
        lam = clamp(lam,0.08,1.25);
        const crack = smooth(clamp((0.36-fbm(x/8,y/36,3))*6,0,1));
        const ao = 1-0.22*smooth(clamp((y-1250)/350,0,1));
        const v = (0.5+0.62*lam)*(1-crack*0.35)*ao*(0.92+h*0.16);
        let r=base[0]*v, gg=base[1]*v, b=base[2]*v;
        if(SL){ const rim=Math.pow(clamp(-side,0,1),3)*0.35*lam; r+=10*rim; gg+=40*rim; b+=44*rim; }
        if(y<PLAT.y+26 && y>PLAT.y-20 && x>PLAT.x0-10 && x<PLAT.x1+10){ const u=1-Math.abs(y-(PLAT.y+2))/24; r+=42*u; gg+=34*u; b+=24*u; }
        d[k]=r; d[k+1]=gg; d[k+2]=b; d[k+3]=255*inM;
      } else if(y>G-60){
        const n=fbm(x/40,y/14,4), fine=vnoise(x/2.2,y/2.2);
        const pool=Math.exp(-Math.pow((x-560)/480,2)-Math.pow((y-1690)/200,2));
        const v=(0.55+0.5*n+0.12*fine)*(0.72+0.6*pool)*(1-0.3*smooth(clamp((y-1780)/140,0,1)));
        if(SL){ d[k]=48*v+30*pool; d[k+1]=48*v+18*pool; d[k+2]=50*v; }
        else { d[k]=80*v+24*pool; d[k+1]=68*v+14*pool; d[k+2]=60*v; }
        d[k+3]=255;
      }
    }
  }
  g.putImageData(id,0,0);
  const fs=g.createLinearGradient(0,G-40,0,G+60); fs.addColorStop(0,'rgba(8,6,6,0.5)'); fs.addColorStop(1,'rgba(8,6,6,0)'); g.fillStyle=fs; g.fillRect(0,G-40,CW,100);
  const R=rng(71);
  for(let i=0;i<90;i++){ const x=R()*CW, y=G+15+R()*290, s=(4+R()*15)*(0.6+(y-G)/300);
    if(y>1770 && x>60 && x<1020 && s>8) continue;
    g.fillStyle='rgba(15,10,10,0.45)'; g.beginPath(); g.ellipse(x+s*0.3,y+s*0.45,s*1.05,s*0.4,0,0,7); g.fill();
    const pg=g.createRadialGradient(x-s*0.4,y-s*0.5,1,x,y,s*1.2); pg.addColorStop(0,SL?'#6f7478':'#8a7a6c'); pg.addColorStop(1,SL?'#2a2d30':'#3d332e');
    g.fillStyle=pg; g.beginPath(); g.moveTo(x-s,y+s*0.3); g.lineTo(x-s*0.7,y-s*0.5); g.lineTo(x+s*0.2,y-s*0.8); g.lineTo(x+s,y-s*0.2); g.lineTo(x+s*0.9,y+s*0.35); g.closePath(); g.fill(); }
  for(const [x,y,s] of [[95,1792,62],[560,1770,50],[905,1790,58],[750,1840,30]]){
    g.fillStyle='rgba(8,6,6,0.5)'; g.beginPath(); g.ellipse(x+10,y+s*0.35,s*1.2,s*0.35,0,0,7); g.fill();
    const pg=g.createRadialGradient(x-s*0.4,y-s*0.6,2,x,y,s*1.3); pg.addColorStop(0,SL?'#5b6066':'#6e6158'); pg.addColorStop(1,SL?'#1e2124':'#2a2420');
    g.fillStyle=pg; g.beginPath(); g.moveTo(x-s*1.2,y+s*0.3); g.lineTo(x-s*0.8,y-s*0.4); g.lineTo(x-s*0.1,y-s*0.75); g.lineTo(x+s*0.7,y-s*0.5); g.lineTo(x+s*1.2,y+s*0.2); g.lineTo(x+s*0.9,y+s*0.4); g.closePath(); g.fill(); }
}
const GRAIN=document.createElement('canvas'); GRAIN.width=540; GRAIN.height=960;
{const g=GRAIN.getContext('2d'), id=g.createImageData(540,960), R=rng(7);
 for(let i=0;i<id.data.length;i+=4){const v=215+R()*40; id.data[i]=v; id.data[i+1]=v; id.data[i+2]=v; id.data[i+3]=255;} g.putImageData(id,0,0);}

// ---------------- helpers ----------------
function shadowOn(b=10,oy=5,a=0.45){ctx.shadowColor=`rgba(5,4,8,${a})`;ctx.shadowBlur=b;ctx.shadowOffsetX=b*0.2;ctx.shadowOffsetY=oy;}
function shadowOff(){ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function woodGrad(th){ const g=ctx.createLinearGradient(0,-th/2,0,th/2); g.addColorStop(0,C.woodL); g.addColorStop(0.35,C.wood); g.addColorStop(1,C.woodD); return g; }
function plank(x0,y0,x1,y1,th,round=false){
  const L=Math.hypot(x1-x0,y1-y0), a=Math.atan2(y1-y0,x1-x0);
  ctx.save(); ctx.translate(x0,y0); ctx.rotate(a);
  rr(0,-th/2,L,th,round?th/2:Math.min(3,th/2)); ctx.fillStyle=woodGrad(th); ctx.fill();
  shadowOff(); ctx.lineWidth=1.6; ctx.strokeStyle=C.woodOut; ctx.stroke();
  ctx.strokeStyle='rgba(120,70,25,0.45)'; ctx.lineWidth=1;
  for(let k=0;k<2;k++){ const yy=-th*0.15+k*th*0.3; ctx.beginPath(); ctx.moveTo(4,yy); ctx.bezierCurveTo(L*0.3,yy+1.5,L*0.6,yy-1.5,L-4,yy+0.5); ctx.stroke(); }
  ctx.restore();
}
function ik(ax,ay,tx,ty,l1,l2,bend){
  let dx=tx-ax, dy=ty-ay, d=Math.hypot(dx,dy); const maxd=l1+l2-0.5;
  if(d>maxd){tx=ax+dx/d*maxd; ty=ay+dy/d*maxd; dx=tx-ax; dy=ty-ay; d=maxd;}
  d=Math.max(d,Math.abs(l1-l2)+0.5);
  const a=Math.atan2(dy,dx), c=clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1), b=Math.acos(c)*bend;
  return [[ax+Math.cos(a+b)*l1, ay+Math.sin(a+b)*l1],[tx,ty]];
}
function ropeCoil(x,y,s=1){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  for(let k=0;k<4;k++){ ctx.beginPath(); ctx.ellipse(k*1.6-2,k*2,11,21,0.12,0,7); ctx.strokeStyle=C.woodOut; ctx.lineWidth=5.5; ctx.stroke(); ctx.strokeStyle=C.rope; ctx.lineWidth=3.2; ctx.stroke(); }
  ctx.restore(); }

// ---------------- figure (ref mannequin) ----------------
const LIMB=15, TORSO=64, HEADR=31, UA=34, FA=33, TH=42, SH=42;
function limbPath(pts){ctx.beginPath(); pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));}
function paintLimb(pts,w,pal){
  ctx.lineCap='round'; ctx.lineJoin='round';
  limbPath(pts); ctx.strokeStyle=pal.out; ctx.lineWidth=w+4.5; ctx.stroke();
  limbPath(pts); ctx.strokeStyle=pal.sh; ctx.lineWidth=w; ctx.stroke();
  ctx.save(); ctx.translate(-w*0.13,-w*0.1); limbPath(pts); ctx.strokeStyle=pal.skin; ctx.lineWidth=w*0.7; ctx.stroke();
  ctx.translate(-w*0.08,-w*0.06); limbPath(pts); ctx.strokeStyle=pal.hi; ctx.globalAlpha=0.55; ctx.lineWidth=w*0.22; ctx.stroke(); ctx.restore();
}
function drawFig(f){
  ctx.save(); ctx.translate(f.x,f.y); ctx.rotate(f.rot||0); ctx.scale(f.s||1,f.s||1);
  const rich=f.acc==='rich';
  const pal = rich? {skin:'#f6f3ec',sh:'#bdb6a9',hi:'#ffffff',out:C.out} : {skin:C.skin,sh:C.skinSh,hi:C.skinHi,out:C.out};
  if(SL && !rich){ ctx.shadowColor=C.glow; ctx.shadowBlur=18; }
  const lean=f.lean||0;
  const nk=[Math.sin(lean)*TORSO, -Math.cos(lean)*TORSO];
  const sh=[[nk[0]-14*Math.cos(lean), nk[1]+8-14*Math.sin(lean)],[nk[0]+14*Math.cos(lean), nk[1]+8+14*Math.sin(lean)]];
  const hp=[[-8,0],[8,0]];
  for(let i=0;i<2;i++){
    const [k,ft]=ik(hp[i][0],hp[i][1],f.feet[i][0],f.feet[i][1],TH,SH,(f.kneeOut?f.kneeOut[i]:(i?1:-1)));
    paintLimb([hp[i],k,ft],LIMB+1,pal);
    if(rich){ctx.fillStyle='#1e1614'; ctx.beginPath(); ctx.ellipse(ft[0]+(i?4:-4),ft[1]+2,12,6,0,0,7); ctx.fill();}
    else { ctx.fillStyle=pal.sh; ctx.strokeStyle=pal.out; ctx.lineWidth=2.2; ctx.beginPath(); ctx.ellipse(ft[0]+(f.footDir?f.footDir*5:(i?5:-5)),ft[1]+3,10,5.5,0,0,7); ctx.fill(); ctx.stroke(); }
  }
  paintLimb([[0,-2],nk],LIMB+9,pal);
  if(rich){ ctx.strokeStyle='#cfc8bb'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(nk[0]-7,nk[1]+4); ctx.lineTo(nk[0]*0.4,nk[1]*0.4); ctx.lineTo(nk[0]+7,nk[1]+4); ctx.stroke(); }
  if(f.coil){ const sb=ctx.shadowBlur; shadowOff(); ropeCoil(sh[1][0]+9, sh[1][1]+26, 0.95); if(SL&&!rich){ctx.shadowColor=C.glow; ctx.shadowBlur=sb;} }
  for(let i=0;i<2;i++){
    const [e,h]=ik(sh[i][0],sh[i][1],f.hands[i][0],f.hands[i][1],UA,FA,(f.elbowOut?f.elbowOut[i]:(i?-1:1)));
    paintLimb([sh[i],e,h],LIMB-1,pal);
    if(f.tools && f.tools[i]) f.tools[i](h[0],h[1]);
  }
  if(rich){ ctx.lineWidth=3; ctx.strokeStyle='#f2b51d'; ctx.beginPath(); ctx.arc(nk[0],nk[1]+7,9,0.25,Math.PI-0.25); ctx.stroke(); }
  const hc=[nk[0]+Math.sin(lean+(f.headTilt||0))*(HEADR+3), nk[1]-Math.cos(lean+(f.headTilt||0))*(HEADR+3)];
  ctx.fillStyle=pal.out; ctx.beginPath(); ctx.arc(hc[0],hc[1],HEADR+2.6,0,7); ctx.fill();
  shadowOff();
  const hg=ctx.createRadialGradient(hc[0]-HEADR*0.38,hc[1]-HEADR*0.42,2,hc[0],hc[1],HEADR*1.05);
  hg.addColorStop(0,rich?'#ffffff':'#f8eedd'); hg.addColorStop(0.55,rich?'#efe9df':pal.skin); hg.addColorStop(1,pal.sh);
  ctx.fillStyle=hg; ctx.beginPath(); ctx.arc(hc[0],hc[1],HEADR,0,7); ctx.fill();
  ctx.save(); ctx.translate(hc[0],hc[1]); ctx.rotate(lean+(f.headTilt||0));
  const ex=(f.look||0)*8;
  if(f.face!=='back'){
    ctx.fillStyle=C.ink; ctx.strokeStyle=C.ink; ctx.lineWidth=3;
    if(f.expr==='dizzy'){

// ---------------- state: action taker ----------------
function atCycle(t){

  const k=(t-AT_T0)/AT_P; return {c:1+Math.floor(k), u:k-Math.floor(k)};
}
function atRungs(t){

}
function atState(t){

    if(t<lastEnd){ ({c,u}=atCycle(t)); } else { c=AT_C; u=1; }
    let placeU=0,bindU=0,climbU=0;

    const yA = feetF<0? G : rungY(feetF);
    const frac=clamp((G-yA)/(G-LAD.tl[1]),0,1);
    const s = lerp(1.0,0.74,frac);
    const hipY = yA - 80*s;
    const x = ladMid(hipY+20);
    const hw = ladHalf(yA)/s;
    const fy0=(yA-hipY)/s;
    let lf=[-hw*0.42, fy0], rf=[hw*0.42, fy0];
    if(feetF<0){ lf=[-24,80]; rf=[24,80]; }
    if(t<lastEnd && climbU>0){
      const a=smooth(seg(climbU,0,0.55)), b=smooth(seg(climbU,0.45,1));
      const base=((c-1<0?G:rungY(c-1))-hipY)/s, next=(rungY(c)-hipY)/s;
      lf=[-hw*0.42-Math.sin(a*Math.PI)*10, lerp(base,next,a)-Math.sin(a*Math.PI)*12];
      rf=[hw*0.42+Math.sin(b*Math.PI)*10, lerp(base,next,b)-Math.sin(b*Math.PI)*12];

    const newR = Math.min(c+2,LAD.n-1);
    const ry=(rungY(newR)-hipY)/s, rh=ladHalf(rungY(newR))/s;
    let lh, rh2, plankHeld=null;
    if(t<lastEnd && placeU>0){

    } else if(t<lastEnd && bindU>0){

    } else if(t<lastEnd){

      const r1=(rungY(c+0.5)-hipY)/s, r2=(rungY(c+1.5)-hipY)/s;

    return {x, y:hipY, s, feet:[lf,rf], hands:[lh,rh2], face: t>9.55?'front':'back', expr:'shock', look:0.5, coil:true, plankHeld};
  }
  const st=atState(AT_FALL[0]-0.001);

    const u=seg(t,AT_FALL[0],AT_FALL[1]);
    const x=lerp(st.x, lieX, smooth(u)), y=lerp(st.y, lieY, u*u)-Math.sin(u*Math.PI)*40;
    return {x,y,s:lerp(st.s,1,u),rot:u*Math.PI*1.4+0.3*Math.sin(u*9), feet:[[-40,40],[38,52]], hands:[[-60,-120],[60,-110]], face:'front', expr:'shock'};

const PUFFS=[]; {const R=rng(301); for(let i=0;i<150;i++){ const te = i<20? 9.45+R()*0.6 : 9.95+Math.pow(R(),1.6)*2.6;

  }
  const hz = t<9.9?0 : t<11?seg(t,9.9,10.6)*0.28 : lerp(0.28,0.12,seg(t,11,13));
  if(hz>0){ ctx.save(); ctx.clip(MTN); const g=ctx.createLinearGradient(900,500,300,1500); g.addColorStop(0,`rgba(205,160,105,${hz})`); g.addColorStop(1,`rgba(160,125,90,${hz*0.4})`); ctx.fillStyle=g; ctx.fillRect(0,480,1080,1200); ctx.restore(); }
  for(const [tl,x] of [[AT_FALL[1],842],[PF_LAND,330]]){ const u=seg(t,tl,tl+1.2); if(u<=0||u>=1) continue; const r=60+u*120; const rg=ctx.createRadialGradient(x,G-10,4,x,G-10,r); rg.addColorStop(0,`rgba(190,150,105,${0.5*(1-u)})`); rg.addColorStop(1,'rgba(190,150,105,0)'); ctx.fillStyle=rg; ctx.beginPath(); ctx.ellipse(x,G-10,r*1.4,r*0.6,0,0,7); ctx.fill(); }
}

// ---------------- scene pieces ----------------
function drawDoor(t){
  const pulse=0.95+0.05*Math.sin(t*4.7);
  ctx.save(); ctx.globalCompositeOperation='lighter';
  const gg=ctx.createRadialGradient(DOOR.x,DOOR.y-60,10,DOOR.x,DOOR.y-60,300); gg.addColorStop(0,`rgba(255,200,95,${0.8*pulse})`); gg.addColorStop(0.3,'rgba(255,150,45,0.32)'); gg.addColorStop(1,'rgba(255,130,40,0)');
  ctx.fillStyle=gg; ctx.fillRect(DOOR.x-320,DOOR.y-380,640,640);
  const R=rng(9); ctx.fillStyle='rgba(255,210,120,0.35)';
  for(let i=0;i<40;i++){ const a=R()*Math.PI*2, r=40+R()*90; ctx.beginPath(); ctx.arc(DOOR.x+Math.cos(a)*r*1.2, DOOR.y-62+Math.sin(a)*r*0.8-((t*12+R()*30)%30), 1+R()*1.6,0,7); ctx.fill(); }
  ctx.restore();
  const ig=ctx.createLinearGradient(0,DOOR.y-DOOR.h,0,DOOR.y); ig.addColorStop(0,'#fff8dc'); ig.addColorStop(0.6,'#ffe39a'); ig.addColorStop(1,'#ffc04f');
  ctx.save(); ctx.shadowColor='rgba(255,170,60,1)'; ctx.shadowBlur=36; ctx.fillStyle=ig; ctx.fillRect(DOOR.x-DOOR.w/2,DOOR.y-DOOR.h,DOOR.w,DOOR.h); ctx.restore();
  ctx.strokeStyle='rgba(255,170,70,0.9)'; ctx.lineWidth=3; ctx.strokeRect(DOOR.x-DOOR.w/2,DOOR.y-DOOR.h,DOOR.w,DOOR.h);
  ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.clip(MTN);
  const sp=ctx.createRadialGradient(DOOR.x,DOOR.y+4,4,DOOR.x,DOOR.y+4,260); sp.addColorStop(0,'rgba(255,190,90,0.85)'); sp.addColorStop(0.35,'rgba(255,150,60,0.3)'); sp.addColorStop(1,'rgba(255,150,60,0)');
  ctx.fillStyle=sp; ctx.beginPath(); ctx.ellipse(DOOR.x,DOOR.y+10,330,70,0,0,7); ctx.fill();
  const fall=ctx.createLinearGradient(0,DOOR.y,0,DOOR.y+420); fall.addColorStop(0,'rgba(255,160,60,0.32)'); fall.addColorStop(1,'rgba(255,160,60,0)');
  ctx.fillStyle=fall; ctx.beginPath(); ctx.moveTo(DOOR.x-80,DOOR.y); ctx.lineTo(DOOR.x+80,DOOR.y); ctx.lineTo(DOOR.x+200,DOOR.y+420); ctx.lineTo(DOOR.x-200,DOOR.y+420); ctx.closePath(); ctx.fill();
  const lg=ctx.createRadialGradient(DOOR.x,DOOR.y,10,DOOR.x,DOOR.y+120,620); lg.addColorStop(0,'rgba(255,160,70,0.2)'); lg.addColorStop(1,'rgba(200,110,40,0)'); ctx.fillStyle=lg; ctx.fillRect(0,DOOR.y-40,1080,1100);
  ctx.restore();
  ctx.save(); ctx.globalCompositeOperation='lighter'; const R2=rng(13);
  for(let i=0;i<70;i++){ const x=PLAT.x0+20+R2()*(PLAT.x1-PLAT.x0-40), y=PLAT.y+2+R2()*14; const k=Math.exp(-Math.pow((x-DOOR.x)/220,2)); ctx.fillStyle=`rgba(255,190,100,${0.35*k})`; ctx.beginPath(); ctx.ellipse(x,y,3+R2()*6,1.5+R2()*2,0,0,7); ctx.fill(); }
  ctx.restore();
}
function knots(x0,y0,x1,y1,seed){ const R=rng(seed); ctx.strokeStyle=C.woodD; ctx.lineWidth=3; ctx.lineCap='round';
  for(let k=0;k<7;k++){ const u=0.08+R()*0.85; const x=lerp(x0,x1,u), y=lerp(y0,y1,u); const s=R()<0.5?-1:1; ctx.beginPath(); ctx.moveTo(x+s*5,y); ctx.lineTo(x+s*11,y-9); ctx.stroke(); } }
function bind(x,y){ ctx.strokeStyle=C.woodOut; ctx.lineWidth=5.5; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(x-8,y-8); ctx.lineTo(x+8,y+8); ctx.moveTo(x+8,y-8); ctx.lineTo(x-8,y+8); ctx.stroke(); ctx.strokeStyle=C.rope; ctx.lineWidth=3.2; ctx.stroke(); ctx.strokeStyle='rgba(255,240,190,0.6)'; ctx.lineWidth=1; ctx.stroke(); }
function drawLadder(t){
  const broken=t>=BREAK;
  const topY = broken? STUMP_Y : LAD.tl[1];
  shadowOn(8,5,0.5);
  for(const side of [0,1]){
    const b=side?LAD.br:LAD.bl; const [lx,rx]=ladX(topY); const tx=side?rx:lx;
    plank(b[0],b[1],tx,topY,14,true);
    shadowOff(); knots(b[0],b[1],tx,topY,side?3:7); shadowOn(8,5,0.5);
    if(broken){ shadowOff(); ctx.fillStyle=C.woodL; ctx.strokeStyle=C.woodOut; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(tx-8,topY+6); ctx.lineTo(tx-6,topY-26); ctx.lineTo(tx-1,topY-8); ctx.lineTo(tx+2,topY-34); ctx.lineTo(tx+5,topY-12); ctx.lineTo(tx+8,topY+6); ctx.closePath(); ctx.fill(); ctx.stroke(); shadowOn(8,5,0.5); }
  }
  const built=atRungs(t);
  for(let i=0;i<LAD.n;i++){
    if(broken? !KEEP_RUNGS.includes(i) : i>=built) continue;
    const y=rungY(i), [lx,rx]=ladX(y);
    shadowOn(7,4,0.5); plank(lx-12,y,rx+12,y,12,true); shadowOff();
    bind(lx,y); bind(rx,y);
  }
  shadowOff();
}
function drawStairs(t){
  const n=pfSteps(t);
  if(n>0){
    shadowOn(8,5,0.5);
    const last=n-1;
    if(n>1) plank(stepX(0)+ST.w*0.62,G, stepX(last)+ST.w*0.82, stepTop(last)+ST.fh+6, 12, true);
    for(let i=0;i<n;i++){ const x=stepX(i)+ST.w-14, y=stepTop(i)+ST.fh; plank(x,y,x,Math.min(G+2,y+ST.dy*2.4),10,true); }
    shadowOff();
    for(let i=n-1;i>=0;i--){
      let x=stepX(i), y=stepTop(i);
      if(i===n-1 && t>=P_FIRST && t<PF_HIT && n>1){ const tp=P_FIRST+(n-2)*P_P+0.25*P_P; const u=seg(t,tp,tp+0.1); y-=(1-easeOut(u))*14; }
      shadowOn(8,5,0.45); ctx.fillStyle='#000'; ctx.fillRect(x,y,ST.w,ST.fh); shadowOff();
      crate(x,y,ST.w,ST.fh);
    }
  }
  const left = t<2.6?4 : t<3.0?2 : t<P_FIRST?1 : 0;
  shadowOn(5,3,0.5); for(let k=0;k<left;k++) plank(40+k*2,G-8-k*13,152+k*2,G-8-k*13,12); shadowOff();
  if(t<2.45){ shadowOn(6,4,0.5); crate(300,G-46,90,44); shadowOff(); }
}
function drawLabels(t){
  const lab=(text,x,y,size,fg,chip)=>{ ctx.save(); ctx.font=`600 ${size}px ${FONT}`; ctx.letterSpacing=`${Math.round(size*0.2)}px`; ctx.textAlign='center'; ctx.textBaseline='middle';
    if(SL && chip){ const w=ctx.measureText(text).width+size*0.9; ctx.fillStyle=C.red; rr(x-w/2,y-size*0.85,w,size*1.7,6); ctx.fill(); }
    ctx.shadowColor='rgba(0,0,0,0.85)'; ctx.shadowBlur=12; ctx.shadowOffsetY=2; ctx.fillStyle=fg; ctx.fillText(text,x+size*0.1,y+1);
    if(SL && !chip){ shadowOff(); const w=ctx.measureText(text).width; ctx.fillStyle=C.red; ctx.fillRect(x-w*0.18,y+size*0.85,w*0.36,4); }
    ctx.restore(); };
  lab('PERFECTIONIST',292,1814,34,SL?C.cream:'#f1ece4');
  lab('ACTION TAKER',821,1814,34,SL?C.cream:'#f1ece4');
  if(t>LABEL_BR){ const u=seg(t,LABEL_BR,LABEL_BR+0.12), y=lerp(365,432,smooth(seg(t,10.0,10.25))); ctx.save(); ctx.globalAlpha=u; lab('BORN RICH',236,y,36,SL?C.cream:'#f1ece4',SL); ctx.restore(); }
}

// ---------------- frame ----------------
function renderAt(t){
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1; shadowOff(); ctx.globalCompositeOperation='source-over';
  ctx.drawImage(BG,0,0);
  for(let i=0;i<STARS.length;i+=9){ const [x,y,r,a,p]=STARS[i]; const tw=0.5+0.5*Math.sin(t*2.6+p*5); if(tw<0.82) continue; ctx.globalAlpha=(tw-0.82)*5*a*clamp((1300-y)/400,0,1); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x,y,r*1.5,0,7); ctx.fill(); }
  ctx.globalAlpha=1;
  ctx.drawImage(WORLD,0,0);
  drawDoor(t);
  const rich=richState(t);
  if(rich && rich.behind) drawFig(rich);
  drawHeli(t);
  if(rich && !rich.behind) drawFig(rich);
  drawStairs(t);
  drawLadder(t);
  const pf=pfState(t);
  if(pf.carry){ shadowOn(6,4,0.5); crate(pf.x+pf.carry.x-40,pf.y+pf.carry.y-8,90,44); shadowOff(); }
  drawFig(pf);
  if(pf.spark && pf.sparkAt) sparks(pf.sparkAt[0],pf.sparkAt[1]);
  const at=atState(t);
  drawFig(at);
  if(at.plankHeld){ shadowOn(6,4,0.5); const [yy,rh]=at.plankHeld; plank(at.x-(rh+12)*at.s, at.y+yy*at.s-4, at.x+(rh+12)*at.s, at.y+yy*at.s+4, 12, true); shadowOff(); }
  if(t>=AT_FALL[1]){ ropeCoil(760,G-6,1.0); }
  drawDebris(t);
  drawDust(t);
  ctx.setTransform(1,0,0,1,0,0);
  if(SL){ ctx.globalCompositeOperation='soft-light'; ctx.fillStyle='rgba(20,90,100,0.28)'; ctx.fillRect(0,0,W,H); ctx.globalCompositeOperation='source-over'; }
  ctx.globalCompositeOperation='multiply'; ctx.globalAlpha=0.22; ctx.drawImage(GRAIN,0,0,W,H);
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
  const vg=ctx.createRadialGradient(W/2,H*0.45,H*0.32,W/2,H*0.5,H*0.8); vg.addColorStop(0,'rgba(5,6,12,0)'); vg.addColorStop(1,'rgba(5,6,12,0.3)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  drawLabels(t);
}
window.renderAt=renderAt; window.DUR=DUR;
document.fonts.load(`600 40px "Inter Display"`).then(()=>{ buildBG(); buildWorld(); renderAt(0); window.READY=true; });
</script>
