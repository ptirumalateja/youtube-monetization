<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Perfectionist vs Action Taker vs Born Rich: remake of the V-Visuals ladder reel in a
// golden-hour cut-paper diorama look. renderAt(t) draws one frame; render.js drives it.
const W = 1080, H = 1920, DUR = 16.6;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const FONT = '"Inter Display", "Inter", "DejaVu Sans", sans-serif';

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,u)=>a+(b-a)*u;
const smooth=u=>{u=clamp(u,0,1);return u*u*(3-2*u);};
const easeOut=u=>{u=clamp(u,0,1);return 1-Math.pow(1-u,3);};
const easeIn=u=>{u=clamp(u,0,1);return u*u*u;};
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
function pw(keys,t,ease){if(t<=keys[0][0])return keys[0][1];for(let i=1;i<keys.length;i++){if(t<=keys[i][0]){const[a,va]=keys[i-1],[b,vb]=keys[i];let u=(t-a)/(b-a);if(ease)u=smooth(u);return lerp(va,vb,u);}}return keys[keys.length-1][1];}
const backOut=u=>{u=clamp(u,0,1);const c=1.9;return 1+(c+1)*Math.pow(u-1,3)+c*Math.pow(u-1,2);};

// ---------------- palette ----------------
const C={
  wood:'#dc9c43', woodD:'#9a6224', woodL:'#f4c574', woodOut:'#4a2c12', rope:'#e0b45a',
  skin:'#e3cfb0', skinSh:'#b89c79', skinHi:'#fbf0de', out:'#2b211d',
  ink:'#2b211d', gold:'#ffc93d', glow:'#fff3c6'
};

// ---------------- world layout ----------------
const G = 1330;                       // ground line
const PLAT = {x0:262, x1:822, y:588}; // plateau top
const DOOR = {x:542, y:PLAT.y, w:92, h:132};
// ladder rails (left/right) bottom -> top: right of the door, never crossed by the stairs
const LAD = {bl:[652,G], tl:[662,PLAT.y+16], br:[842,G], tr:[748,PLAT.y+16], n:16, r0:G-34, rTop:PLAT.y+40};
function rungY(i){ if(i<0) return G; return lerp(LAD.r0, LAD.rTop, i/(LAD.n-1)); }
function ladX(y){ const u=(G-y)/(G-(PLAT.y+16)); return [lerp(LAD.bl[0],LAD.tl[0],u), lerp(LAD.br[0],LAD.tr[0],u)]; }
function ladMid(y){ const [a,b]=ladX(y); return (a+b)/2; }
function ladHalf(y){ const [a,b]=ladX(y); return (b-a)/2; }
// stairs: straight up the LEFT slope towards the left side of the door
const ST = {x0:142, dx:24, dy:49, tw:80};
function stepTop(i){ return G-(i+1)*ST.dy; }
function stepX(i){ return ST.x0+i*ST.dx; }

// ---------------- timeline ----------------
const AT_P = 0.6, AT_C = 14;            // climbing cycles
const AT_END = AT_C*AT_P;               // 8.4
const REACH0 = AT_END, REACH1 = 9.55;   // last rung + reach for the door
const BLAST = 9.6;                      // helicopter lands, rotor wash
const P_FIRST = 2.5, P_P = 0.8;         // perfectionist: first box, then one step per P_P
const AT_FALL = [9.78, 10.62];
const PF_FALL = [9.95, 10.8];
const RICH = {out:11.15, door:12.15, turn:12.3, glint:12.55, inT:12.95, shut:13.25};
const SIT = 13.9, SHAKE = 14.45, GRAB = 14.85;
const CTA = 13.55;

// ---------------- noise ----------------
function hash(i,j){let h=(Math.imul(i,374761393)+Math.imul(j,668265263))|0; h=Math.imul(h^(h>>>13),1274126177); return ((h^(h>>>16))>>>0)/4294967296;}
function vnoise(x,y){const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j;const u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);const a=hash(i,j),b=hash(i+1,j),c=hash(i,j+1),d=hash(i+1,j+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y,o){let s=0,a=0.5,f=1;for(let k=0;k<o;k++){s+=a*vnoise(x*f+k*17.3,y*f-k*9.1);f*=2.03;a*=0.5;}return s;}
function jag(pts, amp, step, seed, closed=true){ // jagged rock outline
  const R=rng(seed), out=[]; const n=pts.length, m=closed?n:n-1;
  for(let i=0;i<m;i++){ const [x0,y0]=pts[i],[x1,y1]=pts[(i+1)%n]; const L=Math.hypot(x1-x0,y1-y0), k=Math.max(1,Math.round(L/step)); const nx=-(y1-y0)/L, ny=(x1-x0)/L;
    for(let j=0;j<k;j++){const u=j/k, a=(vnoise(i*7+u*k*0.35,seed)-0.5)*2*amp+(R()-0.5)*amp*0.5; out.push([lerp(x0,x1,u)+nx*a, lerp(y0,y1,u)+ny*a]);} }
  if(!closed) out.push(pts[n-1]);
  const p=new Path2D(); out.forEach(([x,y],i)=>i?p.lineTo(x,y):p.moveTo(x,y)); if(closed)p.closePath(); return p;
}
const MTN = jag([[-10,G+30],[40,1210],[100,1060],[150,920],[195,790],[230,680],[PLAT.x0,PLAT.y+4],[PLAT.x1,PLAT.y+2],[852,680],[895,800],[945,950],[1000,1110],[1050,1230],[1095,G+30]],10,16,21);

// ---------------- precomputed painted layers ----------------
const OX=-120, OY=-80, CW=1320, CH=2120;   // canvas offset/size in world units
const BG=document.createElement('canvas'); BG.width=CW; BG.height=CH;
const WORLD=document.createElement('canvas'); WORLD.width=CW; WORLD.height=CH;
const STARS=[]; {const R=rng(5); for(let i=0;i<520;i++){const y=OY+R()*1150; STARS.push([OX+R()*CW, y, 0.5+R()*1.7*(R()<0.1?1.8:1), 0.25+R()*0.75, R()*6.28]);}}
function buildBG(){
  const g=BG.getContext('2d');
  const sk=g.createLinearGradient(0,0,0,CH); sk.addColorStop(0,'#0c1019'); sk.addColorStop(0.28,'#151b29'); sk.addColorStop(0.48,'#232b3e'); sk.addColorStop(0.62,'#30394f'); sk.addColorStop(1,'#2a3144');
  g.fillStyle=sk; g.fillRect(0,0,CW,CH);
  for(const [x,y,r,a] of STARS){ g.globalAlpha=a*clamp((1050-y)/500,0,1); g.fillStyle='#f3f1ea'; g.beginPath(); g.arc(x-OX,y-OY,r,0,7); g.fill(); }
  g.globalAlpha=1;
  // layered far ridges with mist between (back = lighter)
  const L=[[860,170,'#4b5673',300,3],[940,150,'#3e4862',220,7],[1020,140,'#333c53',170,11],[1110,120,'#293045',130,15],[1200,90,'#20263a',100,19]];
  for(const [base,amp,col,sc,seed] of L){
    g.beginPath(); g.moveTo(0,CH);
    for(let x=0;x<=CW;x+=6){ const wx=x+OX; const n=fbm(wx/sc,seed,4); const pk=Math.pow(Math.abs(Math.sin(wx/sc*1.7+seed)),3); g.lineTo(x, base-OY-amp*(n*1.2+pk*0.5)); }
    g.lineTo(CW,CH); g.closePath(); g.fillStyle=col; g.fill();
    // highlight on the ridge tops (moonlight)
    g.save(); g.clip(); const mg=g.createLinearGradient(0,base-OY-amp*1.3,0,base-OY+60); mg.addColorStop(0,'rgba(150,165,200,0.16)'); mg.addColorStop(1,'rgba(150,165,200,0)'); g.fillStyle=mg; g.fillRect(0,0,CW,CH); g.restore();
    // mist band
    const mist=g.createLinearGradient(0,base-OY-10,0,base-OY+90); mist.addColorStop(0,'rgba(120,135,165,0)'); mist.addColorStop(0.5,'rgba(120,135,165,0.18)'); mist.addColorStop(1,'rgba(120,135,165,0)');
    g.fillStyle=mist; g.fillRect(0,base-OY-10,CW,100);
  }
}
function buildWorld(){
  const g=WORLD.getContext('2d');
  // mask of the mesa
  const mk=document.createElement('canvas'); mk.width=CW; mk.height=CH; const m=mk.getContext('2d');
  m.translate(-OX,-OY); m.fillStyle='#fff'; m.fill(MTN);
  const mask=m.getImageData(0,0,CW,CH).data;
  const id=g.createImageData(CW,CH), d=id.data;
  const H1=(x,y)=>0.62*fbm(x/60,y/210,4)+0.38*fbm(x/14,y/20,3);
  for(let py=0;py<CH;py++){
    const y=py+OY;
    for(let px=0;px<CW;px++){
      const x=px+OX, k=(py*CW+px)*4;
      const inM=mask[k+3]/255;
      let r,gg,b;
      if(inM>0){
        const h=H1(x,y), hx=H1(x+1.6,y)-H1(x-1.6,y), hy=H1(x,y+1.6)-H1(x,y-1.6);
        const side=clamp((x-542)/560,-1,1);               // which way the face turns
        let lam = 0.62 - 0.30*side - hx*5.5 - hy*2.2;     // light from upper left
        lam = clamp(lam,0.08,1.2);
        const crack = smooth(clamp((0.36-fbm(x/9,y/40,3))*6,0,1));  // dark cracks
        const ao = 1-0.25*smooth(clamp((y-1050)/320,0,1));
        const v = (0.5+0.62*lam)*(1-crack*0.35)*ao*(0.92+h*0.16);
        r=58*v; gg=51*v; b=48*v;
        // top rim
        if(y<PLAT.y+22 && y>PLAT.y-30 && x>PLAT.x0-20 && x<PLAT.x1+20){ const u=1-Math.abs(y-(PLAT.y-2))/26; r+=40*u; gg+=32*u; b+=22*u; }
        // edge blend
        r=r*inM; gg=gg*inM; b=b*inM;
        if(inM<1){ d[k]=r; d[k+1]=gg; d[k+2]=b; d[k+3]=255*inM; continue; }
        d[k]=r; d[k+1]=gg; d[k+2]=b; d[k+3]=255;
      } else if(y>G-40){
        // dirt ground, lit warmer in the middle
        const n=fbm(x/40,y/14,4), fine=vnoise(x/2.2,y/2.2);
        const pool=Math.exp(-Math.pow((x-540)/520,2)-Math.pow((y-1420)/260,2));
        const v=(0.55+0.5*n+0.12*fine)*(0.75+0.55*pool)*(1-0.25*smooth(clamp((y-1700)/300,0,1)));
        d[k]=78*v+18*pool; d[k+1]=66*v+10*pool; d[k+2]=58*v; d[k+3]=255;
      }
    }
  }
  g.putImageData(id,0,0);
  // ground horizon soften + mesa foot shadow
  g.translate(-OX,-OY);
  const fs=g.createLinearGradient(0,G-30,0,G+70); fs.addColorStop(0,'rgba(10,8,8,0.45)'); fs.addColorStop(1,'rgba(10,8,8,0)');
  g.fillStyle=fs; g.fillRect(OX,G-30,CW,100);
  // painted pebbles
  const R=rng(71);
  for(let i=0;i<70;i++){ const x=OX+R()*CW, y=G+20+R()*700, s=(4+R()*16)*(0.6+(y-G)/700);
    if(y<1470 && x>150 && x<960 && s>10) continue;
    g.fillStyle='rgba(20,14,12,0.45)'; g.beginPath(); g.ellipse(x+s*0.3,y+s*0.45,s*1.05,s*0.4,0,0,7); g.fill();
    const pg=g.createRadialGradient(x-s*0.4,y-s*0.5,1,x,y,s*1.2); pg.addColorStop(0,'#8a7a6c'); pg.addColorStop(1,'#3d332e');
    g.fillStyle=pg; g.beginPath(); g.moveTo(x-s,y+s*0.3); g.lineTo(x-s*0.7,y-s*0.5); g.lineTo(x+s*0.2,y-s*0.8); g.lineTo(x+s,y-s*0.2); g.lineTo(x+s*0.9,y+s*0.35); g.closePath(); g.fill();
    g.strokeStyle='rgba(20,14,12,0.6)'; g.lineWidth=1.2; g.stroke(); }
  // a few rocks on the mesa face
  for(let i=0;i<30;i++){ const x=120+R()*860, y=650+R()*650; const s=5+R()*10; if(x>600&&x<880) continue;
    g.save(); g.clip(MTN); g.fillStyle='rgba(15,12,12,0.35)'; g.beginPath(); g.ellipse(x+3,y+4,s,s*0.5,0,0,7); g.fill(); g.fillStyle='rgba(120,105,95,0.35)'; g.beginPath(); g.ellipse(x,y,s,s*0.55,0,0,7); g.fill(); g.restore(); }
}

// grain overlay
const GRAIN=document.createElement('canvas'); GRAIN.width=540; GRAIN.height=960;
{const g=GRAIN.getContext('2d'), id=g.createImageData(540,960), R=rng(7);
 for(let i=0;i<id.data.length;i+=4){const v=215+R()*40; id.data[i]=v; id.data[i+1]=v; id.data[i+2]=v; id.data[i+3]=255;}
 g.putImageData(id,0,0);}

// ---------------- helpers ----------------
function shadowOn(b=12,oy=6,a=0.45){ctx.shadowColor=`rgba(5,4,8,${a})`;ctx.shadowBlur=b;ctx.shadowOffsetX=b*0.2;ctx.shadowOffsetY=oy;}
function shadowOff(){ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function woodGrad(th){ const g=ctx.createLinearGradient(0,-th/2,0,th/2); g.addColorStop(0,C.woodL); g.addColorStop(0.35,C.wood); g.addColorStop(1,C.woodD); return g; }
function plank(x0,y0,x1,y1,th,round=false){
  const L=Math.hypot(x1-x0,y1-y0), a=Math.atan2(y1-y0,x1-x0);
  ctx.save(); ctx.translate(x0,y0); ctx.rotate(a);
  rr(0,-th/2,L,th,round?th/2:Math.min(3,th/2)); ctx.fillStyle=woodGrad(th); ctx.fill();
  shadowOff();
  ctx.lineWidth=1.6; ctx.strokeStyle=C.woodOut; ctx.stroke();
  ctx.strokeStyle='rgba(120,70,25,0.45)'; ctx.lineWidth=1;
  for(let k=0;k<2;k++){ const yy=-th*0.15+k*th*0.3; ctx.beginPath(); ctx.moveTo(4,yy); ctx.bezierCurveTo(L*0.3,yy+1.5,L*0.6,yy-1.5,L-4,yy+0.5); ctx.stroke(); }
  ctx.restore();
}
function ik(ax,ay,tx,ty,l1,l2,bend){
  let dx=tx-ax, dy=ty-ay, d=Math.hypot(dx,dy); const maxd=l1+l2-0.5;
  if(d>maxd){tx=ax+dx/d*maxd; ty=ay+dy/d*maxd; dx=tx-ax; dy=ty-ay; d=maxd;}
  d=Math.max(d,Math.abs(l1-l2)+0.5);
  const a=Math.atan2(dy,dx), c=clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1), b=Math.acos(c)*bend;
  return [[ax+Math.cos(a+b)*l1, ay+Math.sin(a+b)*l1],[tx,ty]];
}

// ---------------- figure (painted mannequin like the ref) ----------------
const LIMB=15, TORSO=64, HEADR=31, UA=34, FA=33, TH=42, SH=42;
function limbPath(pts){ctx.beginPath(); pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));}
function paintLimb(pts,w,pal){
  ctx.lineCap='round'; ctx.lineJoin='round';
  limbPath(pts); ctx.strokeStyle=pal.out; ctx.lineWidth=w+4.5; ctx.stroke();
  limbPath(pts); ctx.strokeStyle=pal.sh; ctx.lineWidth=w; ctx.stroke();
  ctx.save(); ctx.translate(-w*0.13,-w*0.1); limbPath(pts); ctx.strokeStyle=pal.skin; ctx.lineWidth=w*0.7; ctx.stroke();
  ctx.translate(-w*0.08,-w*0.06); limbPath(pts); ctx.strokeStyle=pal.hi; ctx.globalAlpha=0.55; ctx.lineWidth=w*0.22; ctx.stroke(); ctx.restore();
}
function drawFig(f){
  ctx.save(); ctx.translate(f.x,f.y); ctx.rotate(f.rot||0); ctx.scale(f.s||1,f.s||1);
  const rich=f.acc==='rich';
  const pal = rich? {skin:'#f6f3ec',sh:'#bdb6a9',hi:'#ffffff',out:C.out} : {skin:C.skin,sh:C.skinSh,hi:C.skinHi,out:C.out};
  const lean=f.lean||0;
  const nk=[Math.sin(lean)*TORSO, -Math.cos(lean)*TORSO];
  const sh=[[nk[0]-14*Math.cos(lean), nk[1]+8-14*Math.sin(lean)],[nk[0]+14*Math.cos(lean), nk[1]+8+14*Math.sin(lean)]];
  const hp=[[-8,0],[8,0]];
  // ground contact shadow (only when upright on a surface)
  // legs
  for(let i=0;i<2;i++){
    const [k,ft]=ik(hp[i][0],hp[i][1],f.feet[i][0],f.feet[i][1],TH,SH,(f.kneeOut?f.kneeOut[i]:(i?1:-1)));
    paintLimb([hp[i],k,ft],LIMB+1,pal);
    if(rich){ctx.fillStyle='#1e1614'; ctx.beginPath(); ctx.ellipse(ft[0]+(i?4:-4),ft[1]+2,12,6,0,0,7); ctx.fill();}
    else { ctx.fillStyle=pal.sh; ctx.strokeStyle=pal.out; ctx.lineWidth=2.2; ctx.beginPath(); ctx.ellipse(ft[0]+(i?5:-5),ft[1]+3,10,5.5,0,0,7); ctx.fill(); ctx.stroke(); }
  }
  // torso
  paintLimb([[0,-2],nk],LIMB+9,pal);
  if(rich){ ctx.strokeStyle='#cfc8bb'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(nk[0]-7,nk[1]+4); ctx.lineTo(nk[0]*0.4,nk[1]*0.4); ctx.lineTo(nk[0]+7,nk[1]+4); ctx.stroke();
    ctx.strokeStyle='#f2b51d'; ctx.lineWidth=3.5; ctx.beginPath(); ctx.arc(nk[0],nk[1]+6,11,0.2,Math.PI-0.2); ctx.stroke(); }
  // arms
  for(let i=0;i<2;i++){
    const [e,h]=ik(sh[i][0],sh[i][1],f.hands[i][0],f.hands[i][1],UA,FA,(f.elbowOut?f.elbowOut[i]:(i?-1:1)));
    paintLimb([sh[i],e,h],LIMB-1,pal);
    if(f.tools && f.tools[i]) f.tools[i](h[0],h[1]);
  }
  // head: shaded sphere with an outline
  const hc=[nk[0]+Math.sin(lean+(f.headTilt||0))*(HEADR+3), nk[1]-Math.cos(lean+(f.headTilt||0))*(HEADR+3)];
  ctx.fillStyle=pal.out; ctx.beginPath(); ctx.arc(hc[0],hc[1],HEADR+2.6,0,7); ctx.fill();
  const hg=ctx.createRadialGradient(hc[0]-HEADR*0.38,hc[1]-HEADR*0.42,2,hc[0],hc[1],HEADR*1.05);
  hg.addColorStop(0,rich?'#ffffff':'#f8eedd'); hg.addColorStop(0.55,rich?'#efe9df':pal.skin); hg.addColorStop(1,pal.sh);
  ctx.fillStyle=hg; ctx.beginPath(); ctx.arc(hc[0],hc[1],HEADR,0,7); ctx.fill();
  ctx.save(); ctx.translate(hc[0],hc[1]); ctx.rotate(lean+(f.headTilt||0));
  const lk=f.look||0;
  if(f.face!=='back'){
    ctx.fillStyle=C.ink; ctx.strokeStyle=C.ink; ctx.lineWidth=3;
    const ex=lk*8;
    if(f.expr==='dizzy'){
      for(const s of [-1,1]){ctx.beginPath(); for(let a=0;a<4*Math.PI;a+=0.3){const r=a*0.65; const x=ex+s*11+Math.cos(a+(f.spin||0))*r, y=-2+Math.sin(a+(f.spin||0))*r; a?ctx.lineTo(x,y):ctx.moveTo(x,y);} ctx.lineWidth=2; ctx.stroke();}
      ctx.lineWidth=2.6; ctx.beginPath(); ctx.ellipse(ex,14,5,6.5,0,0,7); ctx.stroke();
    } else if(rich){
      ctx.fillStyle='#120d0c'; rr(ex-23,-10,20,12,4); ctx.fill(); rr(ex+3,-10,20,12,4); ctx.fill(); ctx.fillRect(ex-6,-7,12,3);
      ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.fillRect(ex-20,-8,6,3); ctx.fillRect(ex+6,-8,6,3);
      if(f.glint){ctx.save(); ctx.globalAlpha=f.glint; ctx.fillStyle='#fff'; ctx.beginPath(); const gx=ex+14,gy=-6; for(let k=0;k<8;k++){const r=k%2?3:18*f.glint; const a=k*Math.PI/4; ctx.lineTo(gx+Math.cos(a)*r,gy+Math.sin(a)*r);} ctx.fill(); ctx.restore();}
      ctx.lineWidth=2.6; ctx.beginPath(); ctx.moveTo(ex-6,14); ctx.quadraticCurveTo(ex+2,18,ex+10,12); ctx.stroke();
      ctx.fillStyle='#6e4426'; ctx.fillRect(ex+8,14,18,5); ctx.fillStyle='#ff7a3a'; ctx.fillRect(ex+25,14,3,5);
      ctx.fillStyle='#231816'; ctx.beginPath(); ctx.ellipse(-2,-HEADR+9,HEADR-3,12,-0.1,Math.PI,Math.PI*2); ctx.fill();
    } else {
      const shock=f.expr==='shock';
      ctx.beginPath(); ctx.ellipse(ex-10,-1,shock?4.5:3.4,shock?5.5:4.4,0,0,7); ctx.ellipse(ex+10,-1,shock?4.5:3.4,shock?5.5:4.4,0,0,7); ctx.fill();
      if(f.expr==='focus'||f.expr==='grit'){ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(ex-17,-13); ctx.lineTo(ex-5,-8); ctx.moveTo(ex+17,-13); ctx.lineTo(ex+5,-8); ctx.stroke();}
      if(shock){ctx.beginPath(); ctx.ellipse(ex,14,4.5,6.5,0,0,7); ctx.fill();}
      else {ctx.lineWidth=2.6; ctx.beginPath(); ctx.moveTo(ex-6,13); ctx.quadraticCurveTo(ex,f.expr==='grit'?12:15,ex+6,13); ctx.stroke();}
    }
  }
  ctx.restore();

// ---------------- camera ----------------
function camAt(t){
  let z=pw([[0,1.15],[2.3,1.15],[4.0,1.12],[8.2,1.16],[9.15,1.62],[BLAST-0.001,1.7],[BLAST,1.0],[11.0,1.0],[12.0,1.55],[12.9,1.6],[13.35,1.1],[16.6,1.12]],t,true);
  let fx=pw([[0,492],[2.3,492],[4.0,540],[8.2,560],[9.15,668],[BLAST-0.001,660],[BLAST,540],[11.0,540],[12.0,600],[12.9,560],[13.35,545],[16.6,560]],t,true);
  let fy=pw([[0,1150],[2.3,1150],[4.0,1060],[6.0,1010],[8.2,965],[9.15,650],[BLAST-0.001,640],[BLAST,960],[11.0,960],[12.0,700],[12.9,690],[13.35,1000],[16.6,1010]],t,true);

// ---------------- action taker ----------------
function atState(t){
  const s0=1;
  if(t<REACH1){
    const {c,u}=atCycle(Math.min(t,AT_END-1e-4));
    let feetR = c-1, climbU=0, placeU=0, bindU=0;
    if(t<AT_END){ if(u<0.38) placeU=u/0.38; else if(u<0.52) bindU=(u-0.38)/0.14; else climbU=smooth((u-0.52)/0.48); }
    else { feetR=AT_C-1; climbU=0; }
    // reach phase: one more rung + reach over the edge
    let reach=0;
    if(t>=AT_END){ const r=seg(t,AT_END,AT_END+0.5); feetR = AT_C-1 + smooth(r); reach=smooth(seg(t,AT_END+0.45,REACH1)); }
    const fA = feetR + (t<AT_END?climbU:0);
    const yA = lerp(rungY(Math.floor(fA)), rungY(Math.floor(fA)+1), fA-Math.floor(fA));
    const s = lerp(1.0,0.82, clamp((G-yA)/(G-PLAT.y),0,1));
    const hipY = yA - 78*s;
    const x = ladMid(hipY+20);
    const hw = ladHalf(hipY)/s;
    // feet
    const fy0=(rungY(Math.floor(fA)) - hipY)/s;
    let lf=[-hw*0.42, fy0], rf=[hw*0.42, fy0];
    if(t<AT_END && climbU>0){ // alternate feet: left leads
      const a=smooth(seg(climbU,0,0.55)), b=smooth(seg(climbU,0.45,1));
      const base=(rungY(feetR)-hipY)/s, next=(rungY(feetR+1)-hipY)/s;
      lf=[-hw*0.42-Math.sin(a*Math.PI)*10, lerp(base,next,a)-Math.sin(a*Math.PI)*10];
      rf=[hw*0.42+Math.sin(b*Math.PI)*10, lerp(base,next,b)-Math.sin(b*Math.PI)*10];
    }
    if(feetR<0 && climbU===0){ lf=[-26,78]; rf=[26,78]; }
    // hands
    const newR = (t<AT_END)? c+2 : LAD.n-1;
    const ry=(rungY(newR)-hipY)/s, rh=ladHalf(rungY(newR))/s;
    let lh, rh2, plankHeld=null, wind=0;
    if(t<AT_END && placeU>0){ // lift the new rung from the hip to its slot
      const yy=lerp(-30, ry, easeOut(placeU)); lh=[-rh*0.75, yy]; rh2=[rh*0.75, yy]; plankHeld=[yy, rh];
    } else if(t<AT_END && bindU>0){ // tie the right end

    } else if(t<AT_END){ // climbing: hands on the rails, alternating
      const a=smooth(seg(climbU,0,0.5)), b=smooth(seg(climbU,0.5,1));
      const r1=(rungY(c+0.5)-hipY)/s, r2=(rungY(c+1.5)-hipY)/s;
      lh=[-hw*0.9, lerp(r1,r2,a)+(-hipY*0)]; rh2=[hw*0.9, lerp(r1,r2,b)];
    } else { // the reach
      const ry2=(rungY(LAD.n-1)-hipY)/s;
      lh=[-hw*0.9, ry2+10];
      rh2=[lerp(hw*0.9,-28,reach), lerp(ry2, (DOOR.y-14-hipY)/s, reach)];
    }
    return {x, y:hipY, s, lean:0, feet:[lf,rf], hands:[lh,rh2], face:'back', acc:'band', plankHeld, wind:t*9};
  }
  // falling / lying / getting up
  const start=atState(REACH1-0.001);
  const lieX=858, lieY=G-14;
  if(t<AT_FALL[0]) { const st=atState(REACH1-0.001); st.face='front'; st.expr='shock'; st.hands=[[-40,-140],[40,-140]]; st.face='front'; return st; }
  if(t<AT_FALL[1]){
    const u=seg(t,AT_FALL[0],AT_FALL[1]);

}
function lying(t,x,y,acc,tLand,canRise){

    feet:[[44,8],[78,-6]], hands:[[-70,-60],[-30,-82]], headTilt:0, stars: (canRise && t>SHAKE)?null:t*6, kneeOut:[-1,-1]};
  if(!canRise){ f.feet=[[60,6],[84,-10]]; f.hands=[[-80,-52],[-20,-78]]; }

// ---------------- perfectionist ----------------
function pfState(t){

    } else if(u<0.7){ const ph=((u-0.3)/0.4*2)%1; swing = ph<0.5? -1.2*smooth(ph/0.5) : -1.2+1.2*easeIn((ph-0.5)/0.5);

    } else { const w=seg(u,0.72,1); hands=[[-24,-20],[30,-24]]; lean=0.12;

  if(t<PF_FALL[1]){
    const u=seg(t,PF_FALL[0],PF_FALL[1]);
    const x=lerp(st.x, lieX, easeOut(u)), y=lerp(st.y, lieY, u*u)-Math.sin(u*Math.PI)*50;
    return {x,y,s:1,rot:-u*Math.PI*1.6, lean:0, feet:[[-40,40],[38,52]], hands:[[-60,-120],[60,-110]], face:'front', acc:'glasses', expr:'shock'};
  }
  return lying(t, lieX, lieY, 'glasses', PF_FALL[1], false);
}

// ---------------- helicopter + rich kid ----------------
function heliState(t){
  const keys=[[5.2,1130,230,0.16],[8.6,1010,300,0.3],[9.15,930,380,0.62],[BLAST,770,520,1.0]];
  if(t<5.2) return null;
  if(t>=BLAST) return {x:770,y:520+(t<BLAST+0.25?Math.sin(seg(t,BLAST,BLAST+0.25)*Math.PI)*8:0),s:1};
  let i=1; while(i<keys.length-1 && t>keys[i][0]) i++;
  const [a,ax,ay,as]=keys[i-1],[b,bx,by,bs]=keys[i]; let u=(t-a)/(b-a); if(i===keys.length-1) u=easeIn(u)*0.6+u*0.4;
  return {x:lerp(ax,bx,u), y:lerp(ay,by,u)+Math.sin(t*3)*4*(1-u), s:lerp(as,bs,u)};
}
function drawHeli(t){
  const h=heliState(t); if(!h) return;
  ctx.save(); ctx.translate(h.x,h.y); ctx.scale(h.s,h.s);
  const tilt = t<BLAST? -0.12 : -0.12*Math.max(0,1-(t-BLAST)*3);
  ctx.rotate(tilt);
  shadowOn(14,8,0.4);
  // tail boom
  ctx.fillStyle='#1f1a1d'; ctx.beginPath(); ctx.moveTo(40,-30); ctx.lineTo(170,-38); ctx.lineTo(172,-26); ctx.lineTo(40,-12); ctx.fill();
  ctx.fillStyle='#2a2427'; ctx.beginPath(); ctx.moveTo(158,-38); ctx.lineTo(180,-72); ctx.lineTo(186,-70); ctx.lineTo(176,-30); ctx.fill();
  // body
  ctx.fillStyle='#231d20'; ctx.beginPath(); ctx.ellipse(0,-30,78,40,0,0,7); ctx.fill();
  shadowOff();
  ctx.fillStyle='#f2b51d'; ctx.fillRect(-60,-22,128,7);
  ctx.fillStyle='#9fd3e8'; ctx.beginPath(); ctx.moveTo(-74,-34); ctx.quadraticCurveTo(-60,-66,-18,-66); ctx.lineTo(-18,-34); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.beginPath(); ctx.moveTo(-60,-40); ctx.quadraticCurveTo(-52,-58,-34,-60); ctx.lineTo(-38,-54); ctx.quadraticCurveTo(-50,-52,-54,-40); ctx.fill();
  // skids
  ctx.strokeStyle='#1a1517'; ctx.lineWidth=6; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(-60,10); ctx.lineTo(60,10); ctx.moveTo(-30,-4); ctx.lineTo(-36,10); ctx.moveTo(30,-4); ctx.lineTo(36,10); ctx.stroke();
  // rotor mast + spinning blade (paper strip that flips)
  ctx.fillStyle='#1a1517'; ctx.fillRect(-5,-80,10,14);
  const spin=t*38; const L=150*Math.abs(Math.cos(spin)); const L2=150*Math.abs(Math.sin(spin));
  ctx.fillStyle='rgba(40,34,36,0.85)'; rr(-L,-86,L*2,6,3); ctx.fill();
  ctx.fillStyle='rgba(40,34,36,0.45)'; rr(-L2,-85,L2*2,4,2); ctx.fill();
  ctx.fillStyle='rgba(60,50,52,0.18)'; ctx.beginPath(); ctx.ellipse(0,-83,155,9,0,0,7); ctx.fill();
  // tail rotor
  ctx.save(); ctx.translate(180,-60); ctx.rotate(t*30); ctx.fillStyle='rgba(30,26,28,0.8)'; ctx.fillRect(-2,-22,4,44); ctx.restore();
  ctx.restore();
}
function richState(t){
  if(t<RICH.out) return null;
  const walk=seg(t,RICH.out,RICH.door);
  const x=lerp(722,DOOR.x,smooth(walk)), footY=PLAT.y-2;
  const ph=walk<1? (t-RICH.out)*7 : 0;
  const sw=Math.sin(ph)*(walk<1?1:0);
  const s=0.92;
  let f={x, y:footY-80*s, s, lean:0, face:'front', acc:'rich', look:-0.4,
    feet:[[-10+sw*16,80-Math.max(0,sw)*10],[10-sw*16,80-Math.max(0,-sw)*10]], hands:[[-30-sw*8,-6],[30+sw*8,-6]]};
  if(t>RICH.turn){ f.look=0; f.hands=[[-30,-4],[30,-4]]; }
  if(t>RICH.glint-0.15 && t<RICH.inT){ const g=seg(t,RICH.glint-0.15,RICH.glint+0.05); f.hands[1]=[lerp(30,22,g),lerp(-4,-96,g)]; f.glint=Math.sin(seg(t,RICH.glint,RICH.glint+0.35)*Math.PI); }
  if(t>=RICH.inT){ const u=seg(t,RICH.inT,RICH.shut-0.05); f.s=s*(1-u*0.25); f.y=footY-80*f.s; f.fade=1-u; f.hands=[[-30,-4],[22+u*30,-80-u*20]]; }
  if(t>=RICH.shut-0.05) return null;
  return f;
}

// ---------------- dust + debris ----------------
const PUFFS=[]; {const R=rng(301); for(let i=0;i<60;i++){ PUFFS.push({t0:BLAST+R()*1.6, x:640+R()*240, y:560+R()*40, vx:-140-R()*360, vy:140+R()*260, r:22+R()*46, life:1.2+R()*1.3, c:R()}); }}
const DEBRIS=[]; {const R=rng(401);
  for(let i=BREAK_RUNG+1;i<LAD.n;i++){ const y=rungY(i), [lx,rx]=ladX(y); DEBRIS.push({x:(lx+rx)/2,y,len:rx-lx+20,th:12,vx:-120+R()*360,vy:-200-R()*220,w:(R()-0.5)*14,rest:G-6+R()*14,tx:500+R()*560,delay:R()*0.12}); }
  for(const side of [0,1]){ for(let k=0;k<2;k++){ const ya=rungY(BREAK_RUNG)-20-k*170, yb=ya-170; const xa=ladX(ya)[side], xb=ladX(yb)[side]; DEBRIS.push({x:(xa+xb)/2,y:(ya+yb)/2,len:Math.hypot(xb-xa,yb-ya),th:14,vx:(side?160:-80)+R()*200,vy:-120-R()*200,w:(R()-0.5)*9,rest:G-4+R()*10,a0:Math.atan2(yb-ya,xb-xa),delay:R()*0.1}); } }
}
function drawDebris(t){
  if(t<BLAST+0.18) return;
  const T0=BLAST+0.18;
  for(const d of DEBRIS){
    const tt=Math.max(0,t-T0-d.delay);
    let x=d.x+d.vx*tt, y=d.y+d.vy*tt+0.5*1900*tt*tt, a=(d.a0||0)+d.w*tt;
    if(y>d.rest){ // landed: find landing time and freeze there
      const A=0.5*1900, B=d.vy, Cc=d.y-d.rest; const tl=(-B+Math.sqrt(B*B-4*A*Cc))/(2*A);
      x=d.x+d.vx*tl; y=d.rest; a=Math.round(((d.a0||0)+d.w*tl)/Math.PI)*Math.PI+((d.w>0)?0.12:-0.12);
    }
    x=clamp(x,60,1020);
    shadowOn(8,5,0.3);
    ctx.save(); ctx.translate(x,y); ctx.rotate(a); plank(-d.len/2,0,d.len/2,0,d.th); ctx.restore();
  }
  shadowOff();
}
function drawPuffs(t){
  for(const p of PUFFS){
    const tt=t-p.t0; if(tt<0||tt>p.life) continue;
    const u=tt/p.life;
    const x=p.x+p.vx*tt*(1-u*0.4), y=p.y+p.vy*tt*(1-u*0.3);
    const r=p.r*(0.5+u*1.4);
    ctx.globalAlpha=Math.sin(u*Math.PI)*0.7;
    for(const [ox,oy,k] of [[0,0,1.3],[r*0.7,r*0.2,0.95],[-r*0.6,r*0.3,0.85]]){
      const rg=ctx.createRadialGradient(x+ox-r*0.3,y+oy-r*0.3,2,x+ox,y+oy,r*k);
      rg.addColorStop(0,p.c<0.5?'rgba(214,176,122,0.75)':'rgba(190,150,100,0.7)'); rg.addColorStop(1,'rgba(150,115,80,0)');
      ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(x+ox,y+oy,r*k,0,7); ctx.fill(); }
  }
  ctx.globalAlpha=1; shadowOff();
  // wind streaks
  if(t>BLAST-0.15 && t<BLAST+1.6){
    const k=1-seg(t,BLAST+0.6,BLAST+1.6);
    ctx.strokeStyle=`rgba(255,248,232,${0.65*k})`; ctx.lineWidth=5; ctx.lineCap='round';
    const R=rng(Math.floor(t*30));
    for(let i=0;i<16;i++){ const x=300+R()*700, y=560+R()*700, l=60+R()*120; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-l*0.8,y+l*0.55); ctx.stroke(); }
  }
}

// ---------------- text ----------------
function tag(text,x,y,size,opts={}){ // ref-style label: white, wide letter spacing, soft shadow
  ctx.save(); ctx.setTransform(1,0,0,1,0,0);
  ctx.translate(x,y); const sc=opts.scale??1; ctx.scale(sc,sc);
  ctx.font=`700 ${size}px ${FONT}`; ctx.letterSpacing=`${Math.round(size*0.16)}px`; ctx.textAlign='center'; ctx.textBaseline='middle';
  const w=ctx.measureText(text).width;
  ctx.globalAlpha=opts.alpha??1;
  ctx.shadowColor='rgba(0,0,0,0.85)'; ctx.shadowBlur=14; ctx.shadowOffsetY=3;
  ctx.fillStyle=opts.fg||'#f4efe6'; ctx.fillText(text,size*0.08,0);
  shadowOff();
  if(opts.num){ const cx=-w/2-size*0.75; ctx.letterSpacing='0px'; ctx.fillStyle=C.gold; ctx.strokeStyle=C.out; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(cx,0,size*0.62,0,7); ctx.fill(); ctx.stroke(); ctx.fillStyle=C.ink; ctx.font=`900 ${size*0.82}px ${FONT}`; ctx.fillText(opts.num,cx,2); }
  ctx.restore();
}
function bigLine(lines,y,size,alpha=1,scale=1,col='#fff8ec'){
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=alpha;
  ctx.translate(W/2,y); ctx.scale(scale,scale);
  ctx.font=`900 ${size}px ${FONT}`; ctx.letterSpacing='1px'; ctx.textAlign='center'; ctx.textBaseline='middle';
  lines.forEach((ln,i)=>{ const yy=(i-(lines.length-1)/2)*size*1.08;
    ctx.shadowColor='rgba(0,0,0,0.75)'; ctx.shadowBlur=22; ctx.shadowOffsetY=6;
    ctx.lineJoin='round'; ctx.lineWidth=size*0.12; ctx.strokeStyle='#14110f'; ctx.strokeText(ln,0,yy);
    shadowOff(); ctx.fillStyle=typeof col==='function'?col(i):col; ctx.fillText(ln,0,yy); });
  ctx.restore();
}

// ---------------- frame ----------------
function renderAt(t){
  const cam=camAt(t);
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1; shadowOff();
  drawSky(t,cam);
  applyCam(cam,1);
  drawMountain(t);
  drawDoor(t);
  // rich kid goes in front of the door glow
  const rich=richState(t);
  drawDoorPanel(t);
  if(rich){ ctx.save(); ctx.globalAlpha=rich.fade??1; drawFig(rich); ctx.restore(); }
  drawHeli(t);
  // helicopter shadow sweeping the face
  if(t>8.7 && t<BLAST+0.3){ const u=seg(t,8.7,BLAST); ctx.fillStyle=`rgba(5,4,8,${0.22*Math.sin(u*Math.PI*0.95+0.1)})`; ctx.beginPath(); ctx.ellipse(lerp(1000,700,u),lerp(520,640,u),150,40,-0.3,0,7); ctx.fill(); }
  drawGround(t);
  drawStairs(t);
  drawLadder(t);
  // characters
  const pf=pfState(t);
  if(pf.level){ shadowOn(6,3,0.3); const n=0; const lx=stepX(n)+ST.tw*0.5, ly=stepTop(n)-8; ctx.fillStyle='#47b07a'; rr(lx-34,ly-10,68,14,4); ctx.fill(); shadowOff(); ctx.fillStyle='#d9f7a8'; rr(lx-10,ly-7,20,8,4); ctx.fill(); const bub=Math.sin(t*6)*6*(1-seg(t,1.85,2.1)); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(lx+bub,ly-3,3,0,7); ctx.fill(); }
  drawFig(pf);
  const at=atState(t);
  const hc=drawFig(at);
  if(at.plankHeld){ // rung in the hands
    shadowOn(8,5,0.3); const [yy,rh]=at.plankHeld; plank(at.x-(rh+8)*at.s, at.y+yy*at.s, at.x+(rh+8)*at.s, at.y+yy*at.s, 12); shadowOff(); }
  if(at.carry){ // lifted rung
    const {g,up}=at.carry; const hx=at.x+lerp(28,70,g)-up*30, hy=at.y+lerp(-4,6,g)-up*120;
    shadowOn(8,5,0.3); ctx.save(); ctx.translate(hx,hy); ctx.rotate(lerp(0,-1.25,up)); plank(-50,0,60,0,12); ctx.restore(); shadowOff();
  }
  drawDebris(t);
  drawPuffs(t);

  // ---- grain + grade ----
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalCompositeOperation='multiply'; ctx.globalAlpha=0.22; ctx.drawImage(GRAIN,0,0,W,H);
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
  const vg=ctx.createRadialGradient(W/2,H*0.48,H*0.35,W/2,H*0.5,H*0.78); vg.addColorStop(0,'rgba(5,6,12,0)'); vg.addColorStop(1,'rgba(5,6,12,0.32)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  // blast flash
  if(t>=BLAST&&t<BLAST+0.25){ctx.fillStyle=`rgba(255,244,220,${0.55*(1-seg(t,BLAST,BLAST+0.25))})`; ctx.fillRect(0,0,W,H);}

  // ---- text (screen space, y 300-1440) ----
  // hook
  if(t<2.6){ const out=seg(t,2.25,2.6); bigLine(['WHO REACHES','THE TOP FIRST?'],370-out*40,98,1-out,1+0.03*Math.sin(Math.min(t,0.3)/0.3*Math.PI)); }
  // labels
  const labA = 1-seg(t,BLAST,BLAST+0.2)*0 ;
  const pop=(t0)=>t0<=0?1:backOut(seg(t,t0,t0+0.3));
  tag('PERFECTIONIST',290,1410,40,{num:t>CTA+0.4?'1':null});
  tag('ACTION TAKER',770,1410,40,{num:t>CTA+0.55?'2':null});
  if(t>BLAST+0.1){ const p=proj(cam,330,480); tag('BORN RICH',Math.max(p[0],260),p[1],46*Math.min(cam.z,1.15),{fg:C.gold,num:t>CTA+0.7?'3':null,scale:pop(BLAST+0.1)}); }
  // CTA
  if(t>CTA){ const u=backOut(seg(t,CTA,CTA+0.35)); bigLine(['WHICH ONE','ARE YOU?'],780,108,clamp(seg(t,CTA,CTA+0.15),0,1),u); }
}
window.renderAt=renderAt; window.DUR=DUR;
document.fonts.load(`900 40px "Inter Display"`).then(()=>{ buildBG(); buildWorld(); renderAt(0); window.READY=true; });
</script>
