<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Perfectionist vs Action Taker vs Born Rich: remake of the V-Visuals ladder reel in a
// golden-hour cut-paper diorama look. renderAt(t) draws one frame; render.js drives it.
const W = 1080, H = 1920, DUR = 16.6;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const FONT = '"Inter Display", "Inter", "DejaVu Sans", sans-serif';

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,u)=>a+(b-a)*u;
const smooth=u=>{u=clamp(u,0,1);return u*u*(3-2*u);};
const easeOut=u=>{u=clamp(u,0,1);return 1-Math.pow(1-u,3);};
const easeIn=u=>{u=clamp(u,0,1);return u*u*u;};
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
function pw(keys,t,ease){if(t<=keys[0][0])return keys[0][1];for(let i=1;i<keys.length;i++){if(t<=keys[i][0]){const[a,va]=keys[i-1],[b,vb]=keys[i];let u=(t-a)/(b-a);if(ease)u=smooth(u);return lerp(va,vb,u);}}return keys[keys.length-1][1];}
const backOut=u=>{u=clamp(u,0,1);const c=1.9;return 1+(c+1)*Math.pow(u-1,3)+c*Math.pow(u-1,2);};

// ---------------- palette ----------------
const C={
  sky0:'#f59a86', sky1:'#f9b98f', sky2:'#fcd8ac', sky3:'#fde8c4',
  hill1:'#efb193', hill2:'#e39a84', hill3:'#d48477',
  mtn:'#b9614c', mtnL:'#c97358', mtnD:'#9f4f40', mtnTop:'#e09468', strata:'#ad5845',
  sand:'#efc796', sand2:'#e3b27f', sand3:'#d89f6d',
  wood:'#e7a94e', woodD:'#b9772c', woodL:'#f4c574', rope:'#d7aa5c',
  paper:'#fdf3df', ink:'#4e2a20', shadow:'rgba(96,38,22,0.32)',
  band:'#e0413a', gold:'#ffc93d', glow:'#fff3c6'
};

// ---------------- world layout ----------------
const G = 1330;                       // ground line
const PLAT = {x0:262, x1:822, y:588}; // plateau top
const DOOR = {x:542, y:PLAT.y, w:96, h:136};
// ladder rails (left/right) bottom -> top
const LAD = {bl:[618,G], tl:[652,PLAT.y+16], br:[818,G], tr:[736,PLAT.y+16], n:16, r0:G-34, rTop:PLAT.y+40};
function rungY(i){ if(i<0) return G; return lerp(LAD.r0, LAD.rTop, i/(LAD.n-1)); }
function ladX(y){ const u=(G-y)/(G-(PLAT.y+16)); return [lerp(LAD.bl[0],LAD.tl[0],u), lerp(LAD.br[0],LAD.tr[0],u)]; }
function ladMid(y){ const [a,b]=ladX(y); return (a+b)/2; }
function ladHalf(y){ const [a,b]=ladX(y); return (b-a)/2; }
// stairs
const ST = {x0:196, dx:38, dy:48, tw:74};
function stepTop(i){ return G-(i+1)*ST.dy; }
function stepX(i){ return ST.x0+i*ST.dx; }

// ---------------- timeline ----------------
const AT_P = 0.6, AT_C = 14;            // climbing cycles
const AT_END = AT_C*AT_P;               // 8.4
const REACH0 = AT_END, REACH1 = 9.55;   // last rung + reach for the door
const BLAST = 9.6;                      // helicopter lands, rotor wash
const P_FIRST = 2.5, P_P = 0.8;         // perfectionist: first box, then one step per P_P
const AT_FALL = [9.78, 10.62];
const PF_FALL = [9.95, 10.8];
const RICH = {out:11.15, door:12.15, turn:12.3, glint:12.55, inT:12.95, shut:13.25};
const SIT = 13.9, SHAKE = 14.45, GRAB = 14.85;
const CTA = 13.55;

// ---------------- precomputed paper shapes ----------------
function torn(pts, amp, step, seed, closed=true){
  const R=rng(seed), out=[];
  const n=pts.length, m=closed?n:n-1;
  for(let i=0;i<m;i++){
    const [x0,y0]=pts[i],[x1,y1]=pts[(i+1)%n];
    const L=Math.hypot(x1-x0,y1-y0), k=Math.max(1,Math.round(L/step));
    const nx=-(y1-y0)/L, ny=(x1-x0)/L;
    for(let j=0;j<k;j++){const u=j/k, a=(R()-0.5)*2*amp; out.push([lerp(x0,x1,u)+nx*a, lerp(y0,y1,u)+ny*a]);}
  }
  if(!closed) out.push(pts[n-1]);
  const p=new Path2D(); out.forEach(([x,y],i)=>i?p.lineTo(x,y):p.moveTo(x,y)); if(closed)p.closePath(); return p;
}
function ridge(y0, amp, seg, seed, x0=-300, x1=1380, bottom=2400){
  const R=rng(seed), pts=[[x0,bottom]];
  for(let x=x0;x<=x1;x+=seg){ pts.push([x, y0 - (Math.sin(x*0.004+seed)*0.5+0.5)*amp - R()*amp*0.35]); }
  pts.push([x1,bottom]); return torn(pts,3,22,seed+1);
}
const HILLS=[ridge(940,170,90,3), ridge(1040,130,70,5), ridge(1150,90,60,9)];
const MTN = torn([[-160,G+20],[-40,1180],[90,980],[150,860],[214,700],[PLAT.x0,PLAT.y+6],[PLAT.x1,PLAT.y+4],[868,690],[930,830],[1000,990],[1110,1160],[1240,G+20]],4,18,21);
const MTN_SHADE = torn([[PLAT.x1-4,PLAT.y+6],[868,690],[930,830],[1000,990],[1110,1160],[1240,G+20],[760,G+20],[700,900]],4,18,23);
const MTN_LEFT = torn([[-160,G+20],[-40,1180],[90,980],[150,860],[214,700],[PLAT.x0,PLAT.y+6],[300,700],[200,960],[120,G+20]],4,18,27);
const TOP = torn([[PLAT.x0-6,PLAT.y+8],[PLAT.x0+20,PLAT.y-10],[PLAT.x1-30,PLAT.y-12],[PLAT.x1+6,PLAT.y+6],[PLAT.x1-40,PLAT.y+22],[PLAT.x0+40,PLAT.y+24]],3,14,29);
const STRATA=[]; {const R=rng(31); for(let i=0;i<7;i++){const y=700+i*95+R()*30, x0=120+R()*120-(y-700)*0.25, x1=x0+180+R()*260; STRATA.push(torn([[x0,y],[x1,y-8+R()*16],[x1-20,y+16],[x0+30,y+20]],3,14,40+i));}}
const CHIPS=[]; {const R=rng(51); for(let i=0;i<26;i++){const y=640+R()*680, x=200+R()*700; if(x>590&&x<840) continue; CHIPS.push([x,y,6+R()*12,R()*3]);}}
const SAND = [ridge(G+6,10,80,61,-300,1380,2600), ridge(1560,40,140,63,-300,1380,2600), ridge(1760,60,160,67,-300,1380,2600)];
const ROCKS=[]; {const R=rng(71); for(let i=0;i<9;i++){const x=R()*1080, y=1365+R()*500, s=14+R()*34; if(y<1460&&x>120&&x<960) continue; ROCKS.push([x,y,s,torn([[x-s,y],[x-s*0.6,y-s*0.7],[x+s*0.3,y-s*0.9],[x+s,y-s*0.1],[x+s*0.8,y+s*0.2],[x-s*0.7,y+s*0.2]],2,8,80+i)]);}}
const TUFTS=[]; {const R=rng(91); for(let i=0;i<16;i++) TUFTS.push([R()*1100-10, 1350+R()*560, 0.6+R()*0.8]);}
const CLOUDS=[[150,250,1.0,0.0],[860,170,1.25,0.4],[640,420,0.75,0.7],[60,560,0.8,0.2],[1000,620,0.9,0.9]].map(([x,y,s,o],i)=>{
  const pts=[[-110,0],[-100,-30],[-60,-52],[-20,-40],[10,-72],[60,-60],[90,-34],[118,-20],[120,0]].map(([a,b])=>[a*s,b*s]);
  return {x,y,s,o,path:torn(pts,2,12,100+i)};});

// paper grain overlay
const GRAIN=document.createElement('canvas'); GRAIN.width=540; GRAIN.height=960;
{const g=GRAIN.getContext('2d'), id=g.createImageData(540,960), R=rng(7);
 for(let i=0;i<id.data.length;i+=4){const v=200+R()*55; id.data[i]=v; id.data[i+1]=v*0.97; id.data[i+2]=v*0.92; id.data[i+3]=255;}
 g.putImageData(id,0,0); g.globalAlpha=0.18; g.strokeStyle='#8a6a50'; g.lineWidth=0.6;
 for(let i=0;i<500;i++){const x=R()*540,y=R()*960,a=R()*6.28,l=4+R()*14; g.beginPath(); g.moveTo(x,y); g.quadraticCurveTo(x+Math.cos(a+1)*l*0.5,y+Math.sin(a+1)*l*0.5,x+Math.cos(a)*l,y+Math.sin(a)*l); g.stroke();}}

// ---------------- helpers ----------------
function shadowOn(b=14,oy=7,a=0.32){ctx.shadowColor=`rgba(96,38,22,${a})`;ctx.shadowBlur=b;ctx.shadowOffsetX=b*0.25;ctx.shadowOffsetY=oy;}
function shadowOff(){ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;}
function fillP(p,c){ctx.fillStyle=c;ctx.fill(p);}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function plank(x0,y0,x1,y1,th,col=C.wood,edge=C.woodD){
  const L=Math.hypot(x1-x0,y1-y0), a=Math.atan2(y1-y0,x1-x0);
  ctx.save(); ctx.translate(x0,y0); ctx.rotate(a);
  ctx.fillStyle=col; rr(0,-th/2,L,th,Math.min(4,th/2)); ctx.fill();
  shadowOff(); ctx.fillStyle=edge; ctx.globalAlpha=0.55; ctx.fillRect(2,th/2-th*0.28,L-4,th*0.28); ctx.globalAlpha=1;
  ctx.fillStyle=C.woodL; ctx.globalAlpha=0.6; ctx.fillRect(3,-th/2+1.5,L-6,Math.max(1.5,th*0.16)); ctx.globalAlpha=1;
  ctx.restore();
}
function ik(ax,ay,tx,ty,l1,l2,bend){
  let dx=tx-ax, dy=ty-ay, d=Math.hypot(dx,dy); const maxd=l1+l2-0.5;
  if(d>maxd){tx=ax+dx/d*maxd; ty=ay+dy/d*maxd; dx=tx-ax; dy=ty-ay; d=maxd;}
  d=Math.max(d,Math.abs(l1-l2)+0.5);
  const a=Math.atan2(dy,dx), c=clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1), b=Math.acos(c)*bend;
  return [[ax+Math.cos(a+b)*l1, ay+Math.sin(a+b)*l1],[tx,ty]];
}

// ---------------- figure ----------------
// f = {x,y (hip, world), s scale, rot, lean (rad, torso tilt), hands:[[x,y]x2] local, feet:[[x,y]x2] local,
//      face:'front'|'back', look:dx, acc:'band'|'glasses'|'rich', expr:'focus'|'dizzy'|'cool'|'shock'|'grit', headTilt}
const LIMB=17, TORSO=64, HEADR=30, UA=34, FA=33, TH=42, SH=42;
function drawFig(f){
  ctx.save(); ctx.translate(f.x,f.y); ctx.rotate(f.rot||0); ctx.scale(f.s||1,f.s||1);
  const lean=f.lean||0;
  const nk=[Math.sin(lean)*TORSO, -Math.cos(lean)*TORSO];
  const sh=[[nk[0]-15*Math.cos(lean), nk[1]+8-15*Math.sin(lean)],[nk[0]+15*Math.cos(lean), nk[1]+8+15*Math.sin(lean)]];
  const hp=[[-9,0],[9,0]];
  const body = f.acc==='rich'?'#fffaf0':C.paper;
  ctx.lineCap='round'; ctx.lineJoin='round';
  shadowOn(10,6,0.3);
  // legs
  const legCol = f.acc==='rich'?'#f7efe0':body;
  for(let i=0;i<2;i++){
    const [k,ft]=ik(hp[i][0],hp[i][1],f.feet[i][0],f.feet[i][1],TH,SH, (f.kneeOut?f.kneeOut[i]:(i?1:-1)));
    ctx.strokeStyle=legCol; ctx.lineWidth=LIMB; ctx.beginPath(); ctx.moveTo(hp[i][0],hp[i][1]); ctx.lineTo(k[0],k[1]); ctx.lineTo(ft[0],ft[1]); ctx.stroke();
    if(f.acc==='rich'){ctx.fillStyle='#2a1a16'; ctx.beginPath(); ctx.ellipse(ft[0]+(i?4:-4),ft[1]+2,12,6,0,0,7); ctx.fill();}
  }
  // torso
  ctx.strokeStyle=body; ctx.lineWidth=LIMB+7; ctx.beginPath(); ctx.moveTo(0,-2); ctx.lineTo(nk[0],nk[1]); ctx.stroke();
  if(f.acc==='rich'){ // white suit lapels + gold chain
    shadowOff(); ctx.strokeStyle='#e8dcc4'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(nk[0]-6,nk[1]+4); ctx.lineTo(nk[0]*0.4,nk[1]*0.35); ctx.lineTo(nk[0]+6,nk[1]+4); ctx.stroke();
    ctx.strokeStyle='#f2b51d'; ctx.lineWidth=3.5; ctx.beginPath(); ctx.arc(nk[0],nk[1]+6,11,0.2,Math.PI-0.2); ctx.stroke(); shadowOn(10,6,0.3);
  }
  // arms
  for(let i=0;i<2;i++){
    const [e,h]=ik(sh[i][0],sh[i][1],f.hands[i][0],f.hands[i][1],UA,FA,(f.elbowOut?f.elbowOut[i]:(i?-1:1)));
    ctx.strokeStyle=body; ctx.lineWidth=LIMB-2; ctx.beginPath(); ctx.moveTo(sh[i][0],sh[i][1]); ctx.lineTo(e[0],e[1]); ctx.lineTo(h[0],h[1]); ctx.stroke();
    if(f.tools && f.tools[i]) { shadowOn(8,4,0.3); f.tools[i](h[0],h[1]); }
  }
  // head
  const hc=[nk[0]+Math.sin(lean+(f.headTilt||0))*(HEADR+4), nk[1]-Math.cos(lean+(f.headTilt||0))*(HEADR+4)];
  ctx.fillStyle=body; ctx.beginPath(); ctx.arc(hc[0],hc[1],HEADR,0,7); ctx.fill();
  shadowOff();
  ctx.save(); ctx.translate(hc[0],hc[1]); ctx.rotate(lean+(f.headTilt||0));
  const lk=f.look||0;
  if(f.acc==='band'){ // red headband (tails at back)
    ctx.fillStyle=C.band; ctx.beginPath(); ctx.ellipse(0,-8,HEADR+0.5,8,0,Math.PI*0.98,Math.PI*2.02); ctx.fill();
    ctx.fillRect(-HEADR+1,-14,HEADR*2-2,10);
    if(f.face==='back'){ ctx.beginPath(); ctx.moveTo(0,-10); ctx.quadraticCurveTo(14,4+Math.sin(f.wind||0)*4,22,14); ctx.lineTo(16,16); ctx.quadraticCurveTo(8,4,-2,-6); ctx.fill();
      ctx.beginPath(); ctx.moveTo(0,-10); ctx.quadraticCurveTo(-10,6,-18,18); ctx.lineTo(-12,20); ctx.quadraticCurveTo(-4,6,2,-6); ctx.fill(); }
  }
  if(f.face!=='back'){
    ctx.fillStyle=C.ink; ctx.strokeStyle=C.ink; ctx.lineWidth=3.2;
    const ex=lk*7;
    if(f.expr==='dizzy'){
      for(const s of [-1,1]){ctx.beginPath(); for(let a=0;a<4*Math.PI;a+=0.3){const r=a*0.7; const x=ex+s*11+Math.cos(a+(f.spin||0))*r, y=-2+Math.sin(a+(f.spin||0))*r; a?ctx.lineTo(x,y):ctx.moveTo(x,y);} ctx.lineWidth=2; ctx.stroke();}
      ctx.lineWidth=3; ctx.beginPath(); ctx.ellipse(ex,14,5,6,0,0,7); ctx.stroke();
    } else if(f.acc==='rich' || f.expr==='cool'){
      ctx.fillStyle='#17110f'; rr(ex-23,-10,20,12,4); ctx.fill(); rr(ex+3,-10,20,12,4); ctx.fill(); ctx.fillRect(ex-6,-7,12,3);
      if(f.glint){ctx.save(); ctx.globalAlpha=f.glint; ctx.fillStyle='#fff'; ctx.beginPath(); const gx=ex+14,gy=-6; for(let k=0;k<8;k++){const r=k%2?3:16*f.glint; const a=k*Math.PI/4; ctx.lineTo(gx+Math.cos(a)*r,gy+Math.sin(a)*r);} ctx.fill(); ctx.restore();}
      ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(ex-6,14); ctx.quadraticCurveTo(ex+2,19,ex+10,12); ctx.stroke();
    } else {
      const shock=f.expr==='shock';
      ctx.beginPath(); ctx.arc(ex-10,-2,shock?5:4.2,0,7); ctx.arc(ex+10,-2,shock?5:4.2,0,7); ctx.fill();
      if(f.expr==='focus'||f.expr==='grit'){ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(ex-17,-13); ctx.lineTo(ex-5,-9); ctx.moveTo(ex+17,-13); ctx.lineTo(ex+5,-9); ctx.stroke();}
      if(shock){ctx.beginPath(); ctx.ellipse(ex,14,5,7,0,0,7); ctx.fill();}
      else if(f.expr==='grit'){ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(ex-7,14); ctx.lineTo(ex+7,14); ctx.stroke();}
      else {ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(ex-5,13); ctx.lineTo(ex+5,12); ctx.stroke();}
      if(f.acc==='glasses'){ctx.lineWidth=2.6; ctx.beginPath(); ctx.arc(ex-10,-2,9,0,7); ctx.moveTo(ex+19,-2); ctx.arc(ex+10,-2,9,0,7); ctx.moveTo(ex-1,-3); ctx.lineTo(ex+1,-3); ctx.stroke();}
    }
    if(f.acc==='glasses'){ // pencil behind ear
      ctx.save(); ctx.translate(HEADR-6,-16); ctx.rotate(-0.9); ctx.fillStyle='#f2c14e'; ctx.fillRect(-3,-16,6,26); ctx.fillStyle='#e58a8a'; ctx.fillRect(-3,-19,6,5); ctx.fillStyle=C.ink; ctx.beginPath(); ctx.moveTo(-3,10); ctx.lineTo(3,10); ctx.lineTo(0,16); ctx.fill(); ctx.restore();
    }
    if(f.acc==='rich'){ // slick hair + cigar
      ctx.fillStyle='#2b1d18'; ctx.beginPath(); ctx.ellipse(-2,-HEADR+8,HEADR-2,12,-0.12,Math.PI,Math.PI*2); ctx.fill();
      ctx.fillStyle='#7a4a2a'; ctx.fillRect(ex+8,15,18,5); ctx.fillStyle='#ff7a3a'; ctx.fillRect(ex+25,15,3,5);
    }
  }
  ctx.restore();
  if(f.stars){ // dizzy stars orbit
    for(let k=0;k<3;k++){const a=f.stars+k*2.094; const sx=hc[0]+Math.cos(a)*44, sy=hc[1]-HEADR-6+Math.sin(a)*12; drawStar(sx,sy,9,'#ffd447');}
  }
  ctx.restore();
  shadowOff();
  return hc;
}
function drawStar(x,y,r,col){ctx.fillStyle=col; ctx.beginPath(); for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5, rr2=k%2?r*0.45:r; ctx.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2);} ctx.closePath(); ctx.fill();}
function hammerTool(ang){ return (x,y)=>{ctx.save(); ctx.translate(x,y); ctx.rotate(ang); ctx.fillStyle='#8a5a34'; ctx.fillRect(-3,-30,6,34); ctx.fillStyle='#6d7680'; rr(-13,-38,26,12,3); ctx.fill(); ctx.restore();}; }

// ---------------- camera ----------------
function camAt(t){
  let z=pw([[0,1.2],[2.3,1.2],[4.0,1.12],[8.2,1.16],[9.15,1.62],[BLAST-0.001,1.7],[BLAST,1.0],[11.0,1.0],[12.0,1.55],[12.9,1.6],[13.35,1.1],[16.6,1.12]],t,true);
  let fx=pw([[0,520],[2.3,520],[4.0,540],[8.2,560],[9.15,668],[BLAST-0.001,660],[BLAST,540],[11.0,540],[12.0,600],[12.9,560],[13.35,545],[16.6,560]],t,true);
  let fy=pw([[0,1150],[2.3,1150],[4.0,1060],[6.0,1010],[8.2,965],[9.15,650],[BLAST-0.001,640],[BLAST,960],[11.0,960],[12.0,700],[12.9,690],[13.35,1000],[16.6,1010]],t,true);
  let sx=0, sy=0;
  const shk=(t>=BLAST&&t<BLAST+1.3)?Math.pow(1-(t-BLAST)/1.3,2)*22:0;
  const land=(tt)=>t>=tt&&t<tt+0.35?Math.pow(1-(t-tt)/0.35,2)*10:0;
  const sh2=shk+land(AT_FALL[1])+land(PF_FALL[1])+land(RICH.shut);
  if(sh2>0){sx=Math.sin(t*91)*sh2+Math.sin(t*57)*sh2*0.5; sy=Math.cos(t*83)*sh2*0.8;}
  return {z,fx,fy,sx,sy};
}
function proj(cam,x,y){return [W/2+cam.sx+(x-cam.fx)*cam.z, H/2+cam.sy+(y-cam.fy)*cam.z];}
function applyCam(cam, par=1){
  const z=1+(cam.z-1)*par;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.translate(W/2+cam.sx*par, H/2+cam.sy*par); ctx.scale(z,z);
  ctx.translate(-lerp(540,cam.fx,par), -lerp(960,cam.fy,par));
}

// ---------------- state functions ----------------
function atCycle(t){ const c=Math.floor(t/AT_P), u=(t%AT_P)/AT_P; return {c:Math.min(c,AT_C), u: t>=AT_END?1:u}; }
function atRungs(t){ // rungs built
  if(t>=AT_END) return LAD.n;
  const {c,u}=atCycle(t); return 2+c+(u>=0.38?1:0);
}
function pfSteps(t){ // completed steps (first box is there from frame 0; building stops at the blast)
  t=Math.min(t,PF_FALL[0]);
  if(t<P_FIRST) return 1;
  const k=Math.floor((t-P_FIRST)/P_P), u=((t-P_FIRST)%P_P)/P_P;
  return 1+k+(u>=0.3?1:0);
}
const BREAK_RUNG = 5; // rungs above this break off at the blast

// ---------------- drawing: background ----------------
function drawSky(t,cam){
  ctx.setTransform(1,0,0,1,0,0);
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,C.sky0); g.addColorStop(0.32,C.sky1); g.addColorStop(0.52,C.sky2); g.addColorStop(0.7,C.sky3);

      const base=(rungY(feetR)-hipY)/s, next=(rungY(feetR+1)-hipY)/s;

    }

// ---------------- perfectionist ----------------
function pfState(t){
  if(t<PF_FALL[0]){
    let n, u, standOn;
    if(t<P_FIRST){ standOn=-1; n=0; u=t/P_FIRST; }

    // standing x/y

    if(t<P_FIRST){ fx=stepX(0)-58; fy=G; }
    else {
      const from= standOn<0? [stepX(0)-58,G] : [stepX(standOn)+ST.tw*0.42, stepTop(standOn)];
      const to=[stepX(standOn+1)+ST.tw*0.42, stepTop(standOn+1)];
      const w=smooth(seg(u,0.72,1));

    }

    let swing=0, level=null;
    if(t<P_FIRST){ // first box: obsessive hammering, then a spirit level

      if(u<0.56){ const ph=(t*4.2)%1; swing = ph<0.6? -1.3*smooth(ph/0.6) : -1.3+1.3*easeIn((ph-0.6)/0.4);

      else { hands=[[-26,-18],[26,-20]]; lean=0.15; }

    } else if(u<0.7){ const ph=((u-0.3)/0.4*2)%1; swing = ph<0.5? -1.2*smooth(ph/0.5) : -1.2+1.2*easeIn((ph-0.5)/0.5);

    } else { const w=seg(u,0.72,1); hands=[[-24,-20],[30,-24]]; lean=0.12;

  }

  if(t<PF_FALL[1]){

  if(t>RICH.turn){ f.look=0; f.hands=[[-30,-4],[30,-4]]; }
  if(t>RICH.glint-0.15 && t<RICH.inT){ const g=seg(t,RICH.glint-0.15,RICH.glint+0.05); f.hands[1]=[lerp(30,22,g),lerp(-4,-96,g)]; f.glint=Math.sin(seg(t,RICH.glint,RICH.glint+0.35)*Math.PI); }
  if(t>=RICH.inT){ const u=seg(t,RICH.inT,RICH.shut-0.05); f.s=s*(1-u*0.25); f.y=footY-80*f.s; f.fade=1-u; f.hands=[[-30,-4],[22+u*30,-80-u*20]]; }
  if(t>=RICH.shut-0.05) return null;
  return f;
}

// ---------------- dust + debris ----------------
const PUFFS=[]; {const R=rng(301); for(let i=0;i<60;i++){ PUFFS.push({t0:BLAST+R()*1.6, x:640+R()*240, y:560+R()*40, vx:-140-R()*360, vy:140+R()*260, r:22+R()*46, life:1.2+R()*1.3, c:R()}); }}
const DEBRIS=[]; {const R=rng(401);
  for(let i=BREAK_RUNG+1;i<LAD.n;i++){ const y=rungY(i), [lx,rx]=ladX(y); DEBRIS.push({x:(lx+rx)/2,y,len:rx-lx+20,th:12,vx:-120+R()*360,vy:-200-R()*220,w:(R()-0.5)*14,rest:G-6+R()*14,tx:500+R()*560,delay:R()*0.12}); }
  for(const side of [0,1]){ for(let k=0;k<2;k++){ const ya=rungY(BREAK_RUNG)-20-k*170, yb=ya-170; const xa=ladX(ya)[side], xb=ladX(yb)[side]; DEBRIS.push({x:(xa+xb)/2,y:(ya+yb)/2,len:Math.hypot(xb-xa,yb-ya),th:14,vx:(side?160:-80)+R()*200,vy:-120-R()*200,w:(R()-0.5)*9,rest:G-4+R()*10,a0:Math.atan2(yb-ya,xb-xa),delay:R()*0.1}); } }
}
function drawDebris(t){
  if(t<BLAST+0.18) return;
  const T0=BLAST+0.18;
  for(const d of DEBRIS){
    const tt=Math.max(0,t-T0-d.delay);
    let x=d.x+d.vx*tt, y=d.y+d.vy*tt+0.5*1900*tt*tt, a=(d.a0||0)+d.w*tt;
    if(y>d.rest){ // landed: find landing time and freeze there
      const A=0.5*1900, B=d.vy, Cc=d.y-d.rest; const tl=(-B+Math.sqrt(B*B-4*A*Cc))/(2*A);
      x=d.x+d.vx*tl; y=d.rest; a=Math.round(((d.a0||0)+d.w*tl)/Math.PI)*Math.PI+((d.w>0)?0.12:-0.12);
    }
    x=clamp(x,60,1020);
    shadowOn(8,5,0.3);
    ctx.save(); ctx.translate(x,y); ctx.rotate(a); plank(-d.len/2,0,d.len/2,0,d.th); ctx.restore();
  }
  shadowOff();
}
function drawPuffs(t){
  for(const p of PUFFS){
    const tt=t-p.t0; if(tt<0||tt>p.life) continue;
    const u=tt/p.life;
    const x=p.x+p.vx*tt*(1-u*0.4), y=p.y+p.vy*tt*(1-u*0.3);
    const r=p.r*(0.5+u*1.4);
    ctx.globalAlpha=Math.sin(u*Math.PI)*0.7;
    shadowOn(10,5,0.18);
    ctx.fillStyle=p.c<0.5?'#f6dcb4':'#efcfa2';
    ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.arc(x+r*0.7,y+r*0.2,r*0.7,0,7); ctx.arc(x-r*0.6,y+r*0.3,r*0.6,0,7); ctx.fill();
  }
  ctx.globalAlpha=1; shadowOff();
  // wind streaks
  if(t>BLAST-0.15 && t<BLAST+1.6){
    const k=1-seg(t,BLAST+0.6,BLAST+1.6);
    ctx.strokeStyle=`rgba(255,248,232,${0.65*k})`; ctx.lineWidth=5; ctx.lineCap='round';
    const R=rng(Math.floor(t*30));
    for(let i=0;i<16;i++){ const x=300+R()*700, y=560+R()*700, l=60+R()*120; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-l*0.8,y+l*0.55); ctx.stroke(); }
  }
}

// ---------------- text ----------------
function tag(text,x,y,size,opts={}){
  ctx.save(); ctx.setTransform(1,0,0,1,0,0);
  ctx.translate(x,y); ctx.rotate(opts.rot||0); const sc=opts.scale??1; ctx.scale(sc,sc);
  ctx.font=`900 ${size}px ${FONT}`; ctx.textAlign='center'; ctx.textBaseline='middle';
  const w=ctx.measureText(text).width+size*0.9, h=size*1.45;
  ctx.globalAlpha=opts.alpha??1;
  shadowOn(12,6,0.35); ctx.fillStyle=opts.bg||C.paper; rr(-w/2,-h/2,w,h,size*0.28); ctx.fill(); shadowOff();
  if(opts.num){ctx.fillStyle=opts.numBg||C.ink; ctx.beginPath(); ctx.arc(-w/2-6,-h/2+2,size*0.62,0,7); ctx.fill(); ctx.fillStyle='#fff'; ctx.font=`900 ${size*0.8}px ${FONT}`; ctx.fillText(opts.num,-w/2-6,-h/2+4); ctx.font=`900 ${size}px ${FONT}`;}
  ctx.fillStyle=opts.fg||C.ink; ctx.fillText(text,0,3);
  ctx.restore();
}
function bigLine(lines,y,size,alpha=1,scale=1,col='#fffaf0'){
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=alpha;
  ctx.translate(W/2,y); ctx.scale(scale,scale);
  ctx.font=`900 ${size}px ${FONT}`; ctx.textAlign='center'; ctx.textBaseline='middle';
  lines.forEach((ln,i)=>{ const yy=(i-(lines.length-1)/2)*size*1.08;
    ctx.lineJoin='round'; ctx.lineWidth=size*0.2; ctx.strokeStyle='#4e2a20'; ctx.strokeText(ln,0,yy+4);
    ctx.fillStyle=typeof col==='function'?col(i):col; ctx.fillText(ln,0,yy); });
  ctx.restore();
}

// ---------------- frame ----------------
function renderAt(t){
  const cam=camAt(t);
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1; shadowOff();
  drawSky(t,cam);
  applyCam(cam,1);
  drawMountain(t);
  drawDoor(t);
  // rich kid goes in front of the door glow
  const rich=richState(t);
  drawDoorPanel(t);
  if(rich){ ctx.save(); ctx.globalAlpha=rich.fade??1; drawFig(rich); ctx.restore(); }
  drawHeli(t);
  // helicopter shadow sweeping the face
  if(t>8.7 && t<BLAST+0.3){ const u=seg(t,8.7,BLAST); ctx.fillStyle=`rgba(70,25,15,${0.22*Math.sin(u*Math.PI*0.95+0.1)})`; ctx.beginPath(); ctx.ellipse(lerp(1000,700,u),lerp(520,640,u),150,40,-0.3,0,7); ctx.fill(); }
  drawGround(t);
  drawStairs(t);
  drawLadder(t);
  // characters
  const pf=pfState(t);
  if(pf.level){ shadowOn(6,3,0.3); const n=0; const lx=stepX(n)+ST.tw*0.5, ly=stepTop(n)-8; ctx.fillStyle='#47b07a'; rr(lx-34,ly-10,68,14,4); ctx.fill(); shadowOff(); ctx.fillStyle='#d9f7a8'; rr(lx-10,ly-7,20,8,4); ctx.fill(); const bub=Math.sin(t*6)*6*(1-seg(t,1.85,2.1)); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(lx+bub,ly-3,3,0,7); ctx.fill(); }
  drawFig(pf);
  const at=atState(t);
  const hc=drawFig(at);
  if(at.plankHeld){ // rung in the hands
    shadowOn(8,5,0.3); const [yy,rh]=at.plankHeld; plank(at.x-(rh+8)*at.s, at.y+yy*at.s, at.x+(rh+8)*at.s, at.y+yy*at.s, 12); shadowOff(); }
  if(at.carry){ // lifted rung
    const {g,up}=at.carry; const hx=at.x+lerp(28,70,g)-up*30, hy=at.y+lerp(-4,6,g)-up*120;
    shadowOn(8,5,0.3); ctx.save(); ctx.translate(hx,hy); ctx.rotate(lerp(0,-1.25,up)); plank(-50,0,60,0,12); ctx.restore(); shadowOff();
  }
  drawDebris(t);
  drawPuffs(t);

  // ---- grain + grade ----
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalCompositeOperation='multiply'; ctx.globalAlpha=0.55; ctx.drawImage(GRAIN,0,0,W,H);
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
  const vg=ctx.createRadialGradient(W/2,H*0.48,H*0.35,W/2,H*0.5,H*0.78); vg.addColorStop(0,'rgba(120,50,30,0)'); vg.addColorStop(1,'rgba(120,50,30,0.22)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  // blast flash
  if(t>=BLAST&&t<BLAST+0.25){ctx.fillStyle=`rgba(255,244,220,${0.55*(1-seg(t,BLAST,BLAST+0.25))})`; ctx.fillRect(0,0,W,H);}

  // ---- text (screen space, y 300-1440) ----
  // hook
  if(t<2.6){ const out=seg(t,2.25,2.6); bigLine(['WHO REACHES','THE TOP FIRST?'],370-out*40,98,1-out,1+0.03*Math.sin(Math.min(t,0.3)/0.3*Math.PI)); }
  // labels
  const labA = 1-seg(t,BLAST,BLAST+0.2)*0 ;
  const pop=(t0)=>t0<=0?1:backOut(seg(t,t0,t0+0.3));
  tag('PERFECTIONIST',300,1410,42,{rot:-0.03,num:t>CTA+0.4?'1':null,scale:pop(0.0)});
  tag('ACTION TAKER',774,1410,42,{rot:0.03,num:t>CTA+0.55?'2':null,scale:1});
  if(t>BLAST+0.1){ const p=proj(cam,800,400); tag('BORN RICH',p[0],p[1],48*Math.min(cam.z,1.25),{rot:-0.04,bg:'#231d20',fg:C.gold,num:t>CTA+0.7?'3':null,numBg:C.gold,scale:pop(BLAST+0.1)}); }
  // CTA
  if(t>CTA){ const u=backOut(seg(t,CTA,CTA+0.35)); bigLine(['WHICH ONE','ARE YOU?'],780,108,clamp(seg(t,CTA,CTA+0.15),0,1),u); }
}
window.renderAt=renderAt; window.DUR=DUR;
document.fonts.load(`900 40px "Inter Display"`).then(()=>{ renderAt(0); window.READY=true; });
</script>
