<!doctype html><html><body style="margin:0;background:#000">
<canvas id="c" width="1080" height="1920"></canvas>
<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 R; uniform float NAIL; uniform float DBG; uniform float T; uniform float WR; // wrinkle amount 0..1
float h2(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(h2(i),h2(i+vec2(1,0)),f.x),mix(h2(i+vec2(0,1)),h2(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*n2(p);p*=2.03;a*=.5;}return s;}
mat3 rotX(float a){float c=cos(a),s=sin(a);return mat3(1,0,0,0,c,s,0,-s,c);}
mat3 rotZ(float a){float c=cos(a),s=sin(a);return mat3(c,s,0,-s,c,0,0,0,1);}
mat3 rotY(float a){float c=cos(a),s=sin(a);return mat3(c,0,-s,0,1,0,s,0,c);}
mat3 M;
vec2 h22(vec2 p){return fract(sin(vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3))))*43758.5453);}
float vedge(vec2 x){ // distance to voronoi borders (iq)
  vec2 n=floor(x),f=fract(x),mr,mg;float md=8.;
  for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){vec2 g=vec2(i,j);vec2 o=h22(n+g);vec2 r=g+o-f;float d=dot(r,r);if(d<md){md=d;mr=r;mg=g;}}
  md=8.;
  for(int j=-2;j<=2;j++)for(int i=-2;i<=2;i++){vec2 g=mg+vec2(i,j);vec2 o=h22(n+g);vec2 r=g+o-f;
    if(dot(mr-r,mr-r)>0.00001)md=min(md,dot(0.5*(mr+r),normalize(r-mr)));}
  return md;
}
float WV_PRINT;
float wr(vec3 q){ // pruning wrinkles: elongated cell network on the pad
  vec2 w=vec2(q.x*8.5, (q.y+0.3)*3.8);
  w+=vec2(fbm(w*0.8+1.7),fbm(w*0.8+9.2))*0.9;
  float e=vedge(w);
  float val=exp(-e*e/0.004)-0.35*smoothstep(0.05,0.35,e);   // smooth valley along borders
  float pad=smoothstep(-0.15,0.45,q.z/0.62)*smoothstep(-1.55,-0.95,q.y);
  return val*pad;
}
vec4 drops[6];
float sdFinger(vec3 p, out float wv){
  vec3 q=M*(p-vec3(0.05,-0.15,0.));
  vec3 a=vec3(0,-4.,0), b=vec3(0,0.2,0);
  vec3 qs=q; qs.z*=1.12; qs.x*=0.98;
  vec3 pa=qs-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);
  float r=0.62+0.03*sin(q.y*2.0) - 0.05*smoothstep(-0.9,-1.25,q.y)*smoothstep(-1.6,-1.25,q.y); // joint crease
  float d=length(pa-ba*h)-r;
  wv=wr(q);
  return d+0.014*WR*wv;
}
float map(vec3 p, out float m, out float wv){
  float d=sdFinger(p,wv); m=0.;
  vec3 q=M*(p-vec3(0.05,-0.15,0.)); vec3 nq=q-vec3(0.,-0.35,-0.36);
  float nail=length(nq/vec3(0.46,0.62,0.30))-1.0; nail*=0.30;
  nail=max(nail,-(q.z+0.18)); nail=max(nail,q.y-0.05);
  if(nail<d && NAIL>0.5){d=nail;m=2.;}
  for(int i=0;i<6;i++){float dd=length(p-drops[i].xyz)-drops[i].w; if(dd<d){d=dd;m=1.;}}
  return d;
}
vec3 nrm(vec3 p){float m,w;vec2 e=vec2(0.0015,0);
 return normalize(vec3(map(p+e.xyy,m,w)-map(p-e.xyy,m,w),map(p+e.yxy,m,w)-map(p-e.yxy,m,w),map(p+e.yyx,m,w)-map(p-e.yyx,m,w)));}
vec3 bg(vec2 uv){
  vec3 top=vec3(0.99,0.95,0.86), bot=vec3(0.70,0.88,0.90);
  vec3 c=mix(bot,top,smoothstep(-1.,1.2,uv.y));
  // warm sun glow upper right
  c+=vec3(1.0,0.75,0.45)*0.35*exp(-3.0*length(uv-vec2(0.55,0.9)));
  // bokeh water discs
  for(int i=0;i<22;i++){float fi=float(i);
    vec2 cp=vec2(h2(vec2(fi,1.3))*1.4-0.7,h2(vec2(fi,7.1))*2.4-1.2);
    float r=0.03+0.09*h2(vec2(fi,3.3));
    float dd=length(uv-cp);
    float disc=smoothstep(r,r-0.012,dd)*(0.6+0.4*smoothstep(r-0.03,r,dd));
    c+=vec3(1.0,0.97,0.9)*disc*0.18;}
  // caustic ripples
  vec2 q=uv*6.0; float cs=0.;
  for(int i=0;i<3;i++){q+=vec2(sin(q.y*1.3+T),cos(q.x*1.1-T));cs+=abs(sin(q.x+q.y));}
  c+=vec3(.9,1.,1.)*pow(cs/3.0,6.0)*0.12;
  return c;
}
void main(){
  M=rotY(-0.75)*rotX(-0.30)*rotZ(0.25);
  drops[0]=vec4(-0.18,0.10,0.55,0.055); drops[1]=vec4(0.22,-0.25,0.58,0.04);
  drops[2]=vec4(0.02,-0.55,0.62,0.07); drops[3]=vec4(-0.35,-0.7,0.48,0.035);
  drops[4]=vec4(0.30,0.12,0.40,0.03); drops[5]=vec4(-0.05,0.38,0.33,0.03);
  vec3 col=vec3(0); 
  for(int sx=0;sx<2;sx++)for(int sy=0;sy<2;sy++){
  vec2 uv=(gl_FragCoord.xy+vec2(sx,sy)*0.5-0.5*R)/R.x; uv.y+=0.0;
  vec3 ro=vec3(0,0.25,3.9), rd=normalize(vec3(uv*1.05,-1.9));
  float t=0.,m=0.,wv=0.; bool hit=false;
  for(int i=0;i<260;i++){vec3 p=ro+rd*t;float d=map(p,m,wv);if(d<0.0008){hit=true;break;}t+=d*0.5;if(t>8.)break;}
  vec3 c;
  if(!hit){c=bg(uv*1.6);}
  else{
    vec3 p=ro+rd*t; vec3 n=nrm(p); float mm,ww; map(p,mm,ww);
    vec3 L=normalize(vec3(-0.5,0.7,0.6)), V=-rd;
    vec3 rim=normalize(vec3(0.6,0.8,-0.5));
    if(DBG>0.5){c=vec3(ww);} else if(mm<0.5){
      vec3 skin=vec3(0.93,0.64,0.52);
      float wrap=clamp((dot(n,L)+0.45)/1.45,0.,1.);
      float valley=max(ww,0.)*WR;
      vec3 sss=vec3(1.0,0.35,0.22)*pow(clamp(1.0-dot(n,V),0.,1.),2.0)*0.55;
      c=skin*(0.30+0.85*wrap)*vec3(1.0,0.97,0.94);
      c=mix(c,c*vec3(0.72,0.45,0.42),valley*0.6);
      float pr=0.5+0.5*sin(length((M*(p-vec3(0.05,-0.15,0.))).xy-vec2(0.,-0.55))*150.); c*=0.985+0.015*pr; // darker, redder valleys
      c+=sss;
      c+=vec3(1.0,0.78,0.5)*pow(clamp(dot(n,rim),0.,1.),3.)*0.6;
      vec3 H=normalize(L+V); float spec=pow(clamp(dot(n,H),0.,1.),90.);
      float fres=0.04+0.96*pow(1.-clamp(dot(n,V),0.,1.),5.);
      c+=vec3(1.0,0.96,0.9)*(spec*0.9+fres*0.25)*(0.6+0.4*(1.0-valley));
    } else if(mm<1.5){
      vec3 refl=bg(reflect(rd,n).xy*1.2);
      vec3 refr=vec3(1.0,0.80,0.70)*(0.95+0.25*dot(n,-L)) + vec3(1.0,0.9,0.7)*0.5*smoothstep(0.3,0.9,dot(n,normalize(vec3(0.4,-0.7,0.6))));
      float fres=0.06+0.94*pow(1.-clamp(dot(n,V),0.,1.),4.);
      c=mix(refr*0.95,refl,fres);
      vec3 H=normalize(L+V); c+=vec3(1.)*pow(clamp(dot(n,H),0.,1.),400.)*2.5;
      c*=0.9+0.2*smoothstep(0.,1.,dot(n,V));
    } else {
      float wrap=clamp((dot(n,L)+0.3)/1.3,0.,1.);
      c=vec3(0.98,0.80,0.74)*(0.45+0.6*wrap);
      vec3 H=normalize(L+V); c+=vec3(1.)*pow(clamp(dot(n,H),0.,1.),160.)*1.4;
      c+=vec3(1.)*0.3*pow(1.-clamp(dot(n,V),0.,1.),4.);
    }
    float fog=smoothstep(3.2,6.0,t); c=mix(c,bg(uv*1.6),fog);
  }
  col+=c;}
  col/=4.;
  vec2 q=gl_FragCoord.xy/R; col*=0.96+0.06*smoothstep(1.2,0.3,length(q-0.5)); // gentle, no dark edges
  col=pow(col,vec3(0.95));
  gl_FragColor=vec4(col,1);
}
</script>
<script>
const c=document.getElementById('c');const gl=c.getContext('webgl',{preserveDrawingBuffer:true});
const P=new URLSearchParams(location.search);
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o;}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}'));
gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,document.getElementById('fs').text));gl.linkProgram(pr);gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
gl.uniform2f(gl.getUniformLocation(pr,'R'),1080,1920);gl.uniform1f(gl.getUniformLocation(pr,'T'),+(P.get('t')||0));
gl.uniform1f(gl.getUniformLocation(pr,'NAIL'),+(P.get('nail')||0));gl.uniform1f(gl.getUniformLocation(pr,'DBG'),+(P.get('dbg')||0));
gl.uniform1f(gl.getUniformLocation(pr,'WR'),+(P.get('wr')||1));
gl.drawArrays(gl.TRIANGLES,0,3);gl.finish();window.DONE=1;
</script></body></html>
