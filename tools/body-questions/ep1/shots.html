<!doctype html><html><body style="margin:0;background:#000">
<canvas id="c" width="1080" height="1920"></canvas>
<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 R; uniform float T;
uniform vec3 CAMP, TGT; uniform float FOV, ROLL;
uniform vec3 ROT;          // finger rotation (x,y,z)
uniform float WR0, WR1;    // wrinkle amount for finger 0 / 1
uniform float TWO;         // 1 = two fingers side by side
uniform float XRAY, CON, NERVE, CUT0, VES; // xray mix, vessel width (1 open), nerve glow, nerve cut on finger 0, vessel glow
uniform float DROPS, SS, SHOT, PRESS, DRAIN, TD;
float h2(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(h2(i),h2(i+vec2(1,0)),f.x),mix(h2(i+vec2(0,1)),h2(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*n2(p);p*=2.03;a*=.5;}return s;}
mat3 rotX(float a){float c=cos(a),s=sin(a);return mat3(1,0,0,0,c,s,0,-s,c);}
mat3 rotZ(float a){float c=cos(a),s=sin(a);return mat3(c,s,0,-s,c,0,0,0,1);}
mat3 rotY(float a){float c=cos(a),s=sin(a);return mat3(c,0,-s,0,1,0,s,0,c);}
mat3 M;
vec2 h22(vec2 p){return fract(sin(vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3))))*43758.5453);}
float vedge(vec2 x){
  vec2 n=floor(x),f=fract(x),mr,mg;float md=8.;
  for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){vec2 g=vec2(i,j);vec2 o=h22(n+g);vec2 r=g+o-f;float d=dot(r,r);if(d<md){md=d;mr=r;mg=g;}}
  md=8.;
  for(int j=-2;j<=2;j++)for(int i=-2;i<=2;i++){vec2 g=mg+vec2(i,j);vec2 o=h22(n+g);vec2 r=g+o-f;
    if(dot(mr-r,mr-r)>0.00001)md=min(md,dot(0.5*(mr+r),normalize(r-mr)));}
  return md;
}
float wr(vec3 q){
  vec2 w=vec2(q.x*8.5,(q.y+0.3)*3.8);
  w+=vec2(fbm(w*0.8+1.7),fbm(w*0.8+9.2))*0.9;
  float e=vedge(w);
  float val=exp(-e*e/0.004)-0.35*smoothstep(0.05,0.35,e);
  float pad=smoothstep(-0.15,0.45,q.z/0.62)*smoothstep(-1.55,-0.95,q.y);
  return val*pad;
}
vec3 fspace(vec3 p,float idx){ // world -> finger space
  vec3 off=TWO>0.5?vec3(idx<0.5?-0.78:0.78,0.,0.):vec3(0.05,-0.15,0.);
  float s=TWO>0.5?1.25:1.0;
  return M*((p-off)*s);
}
float fingerD(vec3 q,float wrk,out float wv){
  vec3 a=vec3(0,-4.,0),b=vec3(0,0.2,0);
  vec3 qs=q;qs.z*=1.12;qs.x*=0.98;
  vec3 pa=qs-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);
  float shrink=0.012*wrk*smoothstep(-1.5,-0.6,q.y);
  float r=0.62+0.03*sin(q.y*2.0)-0.05*smoothstep(-0.9,-1.25,q.y)*smoothstep(-1.6,-1.25,q.y)-shrink;
  float d=length(pa-ba*h)-r;
  wv=0.; if(wrk>0.001 && d<0.06) wv=wr(q);
  return d+0.014*wrk*wv;
}
float sdSeg(vec3 p,vec3 a,vec3 b){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h);}
float vessel(vec3 q){
  float d=1e3;
  for(int s=0;s<2;s++){float sx=s==0?-1.:1.;
    vec3 prev=vec3(sx*0.36,-3.4,0.10);
    for(int i=1;i<=8;i++){float y=-3.4+float(i)*0.43; float x=sx*(0.36-0.31*smoothstep(-1.3,0.05,y)); vec3 cur=vec3(x+0.035*sin(float(i)*2.3+sx*1.7),y,0.10+0.12*smoothstep(-1.0,0.0,y));
      d=min(d,sdSeg(q,prev,cur));prev=cur;}
    for(int k=0;k<9;k++){float fk=float(k)+sx*13.;float y=-2.6+float(k)*0.30+0.08*sin(fk*1.9);
      vec3 a=vec3(sx*(0.36-0.31*smoothstep(-1.3,0.05,y)),y,0.12);
      vec3 dir=normalize(vec3(-sx*(0.4+0.4*fract(sin(fk*7.1)*91.)),0.55+0.3*fract(sin(fk*3.3)*51.),0.5));
      vec3 b=a+dir*0.20; vec3 dir2=normalize(dir+vec3(0.25*sin(fk*5.),0.3,0.1)); vec3 c=b+dir2*0.16;
      vec3 tw=b+normalize(vec3(sx*0.5,0.6,0.3))*0.10;
      d=min(d,sdSeg(q,a,b)*1.25); d=min(d,sdSeg(q,b,c)*1.9); d=min(d,sdSeg(q,b,tw)*2.4);}
  }
  return d;
}
float nerve(vec3 q,float cut){
  float d=1e3;
  for(int s=0;s<2;s++){float sx=s==0?-1.:1.;
    vec3 a=vec3(sx*0.42,-3.4,0.22),b=vec3(sx*0.30,-1.0,0.28),c=vec3(sx*0.12,-0.15,0.36);
    float dd=min(sdSeg(q,a,b),sdSeg(q,b,c));
    if(cut>0.5 && q.y>-1.75 && q.y<-1.35) dd=1e3;
    d=min(d,dd);}
  return d;
}
vec4 drops[6];
float map(vec3 p,out float m,out float wv,out float fid){
  float w0,w1;
  float d=fingerD(fspace(p,0.),WR0,w0)/(TWO>0.5?1.25:1.0); m=0.;wv=w0;fid=0.;
  if(TWO>0.5){float d1=fingerD(fspace(p,1.),WR1,w1)/1.25; if(d1<d){d=d1;wv=w1;fid=1.;}}
  if(DROPS>0.5) for(int i=0;i<6;i++){float dd=length(p-drops[i].xyz)-drops[i].w;if(dd<d){d=dd;m=1.;}}
  return d;
}
vec3 nrm(vec3 p){float m,w,f;vec2 e=vec2(0.0015,0);
 return normalize(vec3(map(p+e.xyy,m,w,f)-map(p-e.xyy,m,w,f),map(p+e.yxy,m,w,f)-map(p-e.yxy,m,w,f),map(p+e.yyx,m,w,f)-map(p-e.yyx,m,w,f)));}
vec3 bg(vec2 uv){
  vec3 top=vec3(0.99,0.95,0.86),bot=vec3(0.70,0.88,0.90);
  vec3 c=mix(bot,top,smoothstep(-1.,1.2,uv.y));
  c+=vec3(1.0,0.75,0.45)*0.35*exp(-3.0*length(uv-vec2(0.55,0.9)));
  for(int i=0;i<22;i++){float fi=float(i);
    vec2 cp=vec2(h2(vec2(fi,1.3))*1.4-0.7,h2(vec2(fi,7.1))*2.4-1.2)+0.03*vec2(sin(T*0.6+fi),cos(T*0.5+fi*1.7));
    float r=0.03+0.09*h2(vec2(fi,3.3));float dd=length(uv-cp);
    float disc=smoothstep(r,r-0.012,dd)*(0.6+0.4*smoothstep(r-0.03,r,dd));
    c+=vec3(1.0,0.97,0.9)*disc*0.18;}
  vec2 q=uv*6.0;float cs=0.;
  for(int i=0;i<3;i++){q+=vec2(sin(q.y*1.3+T),cos(q.x*1.1-T));cs+=abs(sin(q.x+q.y));}
  c+=vec3(.9,1.,1.)*pow(cs/3.0,6.0)*0.12;
  return c;
}

vec3 gripShot(vec2 uv){
  vec2 c0=vec2(0.0,-0.05);
  vec2 d=(uv-c0)/vec2(1.0,1.25);
  float r=length(d); float ang0=atan(d.y,d.x); float R0=(0.30+0.10*PRESS)*(1.0+0.06*(fbm(vec2(ang0*1.6,2.0))-0.5));
  vec3 col=bg(uv*1.4)*vec3(0.98,1.0,1.0);
  // wet glass droplets
  for(int i=0;i<16;i++){float fi=float(i);vec2 cp=vec2(h2(vec2(fi,4.2))*1.0-0.5,h2(vec2(fi,8.8))*1.8-0.9);float rr=0.01+0.025*h2(vec2(fi,2.2));
    float dd=length(uv-cp);float m=smoothstep(rr,rr-0.004,dd);col=mix(col,col*0.9+vec3(0.08),m*0.7);col+=vec3(1.)*smoothstep(rr*0.5,0.,length(uv-cp-vec2(-rr*0.3,rr*0.3)))*m*0.6;}
  float inside=smoothstep(R0,R0-0.012,r);
  // finger shadow / blurred body behind the glass
  col=mix(col,vec3(0.92,0.66,0.56),smoothstep(R0+0.25,R0,r)*0.35);
  vec2 w=vec2(d.x*14.0,d.y*9.0+3.0);
  w+=vec2(fbm(w*0.8+1.7),fbm(w*0.8+9.2))*0.9;
  float e=vedge(w);
  float ch=exp(-e*e/0.006);
  vec3 plate=vec3(1.0,0.80,0.72)*(0.92+0.10*fbm(w*3.0)) ;
  plate*=0.78+0.28*smoothstep(0.0,0.28,e); plate+=vec3(1.0,0.95,0.9)*0.10*smoothstep(0.12,0.4,e);
  vec3 water=vec3(0.66,0.70,0.72)*0.85;
  float glint=pow(0.5+0.5*sin(r*55.0-T*9.0+e*6.0),10.0);
  vec3 chc=water+vec3(0.9,1.0,1.0)*glint*0.7*ch;
  vec3 pad=mix(plate,chc,ch*0.85)*(1.0-0.25*smoothstep(R0*0.6,R0,r));
  // fingerprint ridges faint on plateaus
  pad*=0.985+0.015*sin(length(d*vec2(1.,0.8))*520.0+fbm(d*20.)*6.0);
  col=mix(col,pad,inside);
  // water squeezed out: bright ring + radial streaks just outside the pad
  float ring=exp(-pow((r-R0-0.01)/0.012,2.0));
  col+=vec3(0.85,0.97,1.0)*ring*0.22;
  float ang=atan(d.y,d.x);
  float streak=pow(max(0.,sin(ang*22.0+fbm(vec2(ang*3.0,1.))*6.)),6.0)*smoothstep(R0+0.10,R0,r)*smoothstep(R0-0.005,R0+0.02,r);
  col+=vec3(0.8,0.95,1.0)*streak*0.25*(0.6+0.4*sin(T*6.0-r*40.0));
  return col;
}
void main(){
  if(SHOT>0.5){vec2 uv=(gl_FragCoord.xy-0.5*R)/R.x; uv=uv/FOV; gl_FragColor=vec4(pow(gripShot(uv),vec3(0.95)),1.);return;}
  M=rotY(ROT.y)*rotX(ROT.x)*rotZ(ROT.z);
  float sl=T*0.05+TD*DRAIN;
  drops[0]=vec4(-0.18,0.10-sl,0.55,0.055);drops[1]=vec4(0.22,-0.25-sl*1.6,0.58,0.04);
  drops[2]=vec4(0.02,-0.55-sl*0.7,0.62,0.07);drops[3]=vec4(-0.35,-0.7,0.48,0.035);
  drops[4]=vec4(0.30,0.12,0.40,0.03);drops[5]=vec4(-0.05,0.38-sl,0.33,0.03);
  vec3 fw=normalize(TGT-CAMP);vec3 rt=normalize(cross(fw,vec3(sin(ROLL),cos(ROLL),0.)));vec3 up=cross(rt,fw);
  vec3 col=vec3(0);
  int N=int(SS);
  for(int sx=0;sx<2;sx++)for(int sy=0;sy<2;sy++){
  if(sx>=N||sy>=N) continue;
  vec2 uv=(gl_FragCoord.xy+(N>1?vec2(sx,sy)*0.5-0.25:vec2(0))-0.5*R)/R.x;
  vec3 rd=normalize(fw*1.9/FOV+rt*uv.x*1.05+up*uv.y*1.05); vec3 ro=CAMP;
  float t=0.,m=0.,wv=0.,fid=0.;bool hit=false;
  for(int i=0;i<260;i++){vec3 p=ro+rd*t;float d=map(p,m,wv,fid);if(d<0.0008){hit=true;break;}t+=d*0.5;if(t>12.)break;}
  vec2 buv=uv*1.6/FOV*0.9+ (CAMP.xy-vec2(0.,0.25))*0.05;
  vec3 c;
  if(!hit){c=bg(buv);}
  else{
    vec3 p=ro+rd*t;vec3 n=nrm(p);float mm,ww,ff;map(p,mm,ww,ff);
    vec3 L=normalize(vec3(-0.5,0.7,0.6)),V=-rd;vec3 rim=normalize(vec3(0.6,0.8,-0.5));
    if(mm<0.5){
      float wk=ff<0.5?WR0:WR1;
      vec3 skin=vec3(0.93,0.64,0.52);
      float wrap=clamp((dot(n,L)+0.45)/1.45,0.,1.);
      float valley=max(ww,0.)*wk;
      vec3 sss=vec3(1.0,0.35,0.22)*pow(clamp(1.0-dot(n,V),0.,1.),2.0)*0.55;
      c=skin*(0.30+0.85*wrap)*vec3(1.0,0.97,0.94);
      c=mix(c,c*vec3(0.72,0.45,0.42),valley*0.6);
      c+=sss;
      c+=vec3(1.0,0.78,0.5)*pow(clamp(dot(n,rim),0.,1.),3.)*0.6;
      vec3 H=normalize(L+V);float spec=pow(clamp(dot(n,H),0.,1.),90.);
      float fres=0.04+0.96*pow(1.-clamp(dot(n,V),0.,1.),5.);
      c+=vec3(1.0,0.96,0.9)*(spec*0.9+fres*0.25)*(0.6+0.4*(1.0-valley));
      if(XRAY>0.001){
        // translucent: march inside and gather vessel + nerve glow
        vec3 gv=vec3(0);vec3 gn=vec3(0);float thick=0.;
        float sc=TWO>0.5?1.25:1.0;
        for(int k=1;k<34;k++){vec3 pp=p+rd*float(k)*0.036;float w_;vec3 q=fspace(pp,ff);float din=fingerD(q,0.,w_);
          if(din>0.) break; thick+=0.036;
          float vd=vessel(q)-0.030*CON; float nd=nerve(q,ff<0.5?CUT0:0.)-0.022;
          float flow=VES*0.0+0.75+0.25*sin(T*7.0-q.y*9.0);
          gv+=vec3(1.0,0.16,0.12)*(exp(-max(vd,0.)*110.)*0.11+exp(-max(vd,0.)*22.)*0.012)*(0.35+0.65*CON)*flow;
          gn+=vec3(1.0,0.84,0.40)*(exp(-max(nd,0.)*120.)*0.13+exp(-max(nd,0.)*18.)*0.02);}
        vec3 inner=vec3(1.0,0.80,0.72)*(0.70+0.45*exp(-thick*1.2));
        vec3 xr=mix(c,inner,0.65)+gv*VES+gn*NERVE*(1.0+0.6*sin(T*9.0-p.y*6.0));
        xr+=vec3(1.0,0.85,0.75)*pow(1.-clamp(dot(n,V),0.,1.),3.)*0.5;
        c=mix(c,xr,XRAY);
      }
    } else {
      vec3 refl=bg(reflect(rd,n).xy*1.2);
      vec3 refr=vec3(1.0,0.80,0.70)*(0.95+0.25*dot(n,-L))+vec3(1.0,0.9,0.7)*0.5*smoothstep(0.3,0.9,dot(n,normalize(vec3(0.4,-0.7,0.6))));
      float fres=0.06+0.94*pow(1.-clamp(dot(n,V),0.,1.),4.);
      c=mix(refr*0.95,refl,fres);
      vec3 H=normalize(L+V);c+=vec3(1.)*pow(clamp(dot(n,H),0.,1.),400.)*2.5;
    }
    float D=length(TGT-CAMP);float fog=smoothstep(D+1.6,D+6.0,t);c=mix(c,bg(buv),fog);
  }
  col+=c;}
  col/=float(N*N);
  col=pow(col,vec3(0.95));
  gl_FragColor=vec4(col,1);
}
</script>
<script>
const c=document.getElementById('c');const gl=c.getContext('webgl',{preserveDrawingBuffer:true});
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o;}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}'));
gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,document.getElementById('fs').text));gl.linkProgram(pr);gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(pr,n);
const DEF={T:0,CAMP:[0,0.25,3.9],TGT:[0,0.25,0],FOV:1,ROLL:0,ROT:[-0.30,-0.75,0.25],WR0:1,WR1:1,TWO:0,XRAY:0,CON:1,NERVE:0,CUT0:0,VES:1,DROPS:1,SS:2,SHOT:0,PRESS:1,DRAIN:0,TD:0};
window.render=(P)=>{P=Object.assign({},DEF,P);gl.uniform2f(U('R'),1080,1920);
 for(const[k,v]of Object.entries(P)){const u=U(k);if(!u)continue;if(Array.isArray(v))gl.uniform3f(u,...v);else gl.uniform1f(u,v);}
 gl.drawArrays(gl.TRIANGLES,0,3);return c.toDataURL('image/jpeg',0.95);};
window.READY=1;
</script></body></html>
