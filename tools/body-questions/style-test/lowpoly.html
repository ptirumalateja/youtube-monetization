<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="importmap">{"imports":{"three":"./three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const W=1080,H=1920;const rand=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const gl=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});gl.setSize(W,H);gl.shadowMap.enabled=true;gl.shadowMap.type=THREE.PCFSoftShadowMap;gl.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color('#c9d6e3');scene.fog=new THREE.Fog('#c9d6e3',22,75);
const M=(c)=>new THREE.MeshLambertMaterial({color:c,flatShading:true});
const add=(geo,mat,x,y,z,sx=1,sy=1,sz=1,par=scene,r=[0,0,0])=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.rotation.set(...r);m.castShadow=m.receiveShadow=true;par.add(m);return m};
const box=new THREE.BoxGeometry(1,1,1);const ico=new THREE.IcosahedronGeometry(1,1);const cyl8=new THREE.CylinderGeometry(1,1,1,8);
// street
add(box,M('#5d636e'),0,-0.05,-10,80,0.1,80);
add(box,M('#aab2bc'),0,0.08,-5.6,80,0.16,3);add(box,M('#aab2bc'),0,0.08,6.5,80,0.16,3);
for(let i=-5;i<=5;i++)add(box,M('#eef0f2'),i*1.0,0.01,0.6,0.55,0.02,5);
// buildings low poly
for(let i=0;i<16;i++){const x=-30+i*4,h=6+rand(i)*16;const col=['#e8d9c7','#d6c3ae','#c7d3dc','#e3cbb5'][i%4];add(box,M(col),x,h/2,-11-rand(i+3)*3,3.8,h,4);
 for(let k=0;k<Math.floor(h/1.8);k++)for(let j=0;j<2;j++)add(box,M(rand(i*9+k*3+j)>.5?'#8fb3cf':'#6c8aa3'),x-0.8+j*1.6,1.3+k*1.8,-8.95-rand(i+3)*3,.9,1.1,.05)}
for(let i=0;i<6;i++){const x=-15+i*6;add(cyl8,M('#7a5a3c'),x,1.2,-5.2,.15,2.4,.15);add(ico,M('#5fa15a'),x,3.0,-5.2,1.2,1.3,1.2)}
// car (low poly, close, left, braking)
const car=new THREE.Group();scene.add(car);
const red=M('#d8433a');
add(box,red,0,0.75,0,4.4,0.75,2.0,car);
add(box,red,-0.4,1.4,0,2.3,0.65,1.8,car);
add(box,M('#2e3c50'),0.78,1.38,0,0.06,0.5,1.6,car,[0,0,-0.5]);
for(const [x,z] of [[-1.4,1],[1.4,1],[-1.4,-1],[1.4,-1]])add(cyl8,M('#25262b'),x,0.4,z,.42,.28,.42,car,[Math.PI/2,0,0]);
const hl=new THREE.MeshBasicMaterial({color:'#fffbe0'});add(box,hl,2.21,0.85,0.65,.05,.22,.4,car);add(box,hl,2.21,0.85,-0.65,.05,.22,.4,car);
add(box,M('#d0d3d8'),2.25,0.5,0,0.1,0.18,2.0,car);
car.position.set(-2.3,0,1.6);car.rotation.y=-0.4;
// skid marks
for(const z of [0.95,2.25])add(box,new THREE.MeshBasicMaterial({color:'#2b2d33'}),-5.5,0.012,z+(-2.4+3)*0.0,5,0.01,0.22,scene,[0,-0.5,0]);
// low poly man (mixamo-ish proportions), recoiling
const man=new THREE.Group();scene.add(man);
const skin=M('#f0bf96'),shirt=M('#ef7f2d'),jeans=M('#36508a'),shoe=M('#f3f3f3'),hair=M('#3a2618');
const seg=(par,x,y,z,sx,sy,sz,mat,r=[0,0,0])=>add(box,mat,x,y,z,sx,sy,sz,par,r);
const legL=new THREE.Group();legL.position.set(-0.17,1.0,0);legL.rotation.x=0.35;man.add(legL);seg(legL,0,-0.48,0,.24,.95,.26,jeans);seg(legL,0,-0.98,0.08,.24,.14,.4,shoe);
const legR=new THREE.Group();legR.position.set(0.17,1.0,0);legR.rotation.x=-0.4;man.add(legR);seg(legR,0,-0.48,0,.24,.95,.26,jeans);seg(legR,0,-0.98,0.08,.24,.14,.4,shoe);
const torso=new THREE.Group();torso.position.set(0,1.05,0);torso.rotation.set(-0.18,0,0.08);man.add(torso);
seg(torso,0,0.42,0,.62,.85,.36,shirt);
const armL=new THREE.Group();armL.position.set(-0.4,0.75,0);armL.rotation.set(-0.3,0,-2.0);torso.add(armL);seg(armL,0,-0.32,0,.2,.66,.2,shirt);seg(armL,0,-0.72,0,.17,.2,.17,skin);
const armR=new THREE.Group();armR.position.set(0.4,0.75,0);armR.rotation.set(0.2,0,0.7);torso.add(armR);seg(armR,0,-0.32,0,.2,.66,.2,shirt);seg(armR,0,-0.72,0,.17,.2,.17,skin);
// phone flying out of hand
add(box,M('#1a1a1f'),2.0,2.3,0.6,.18,.32,.03,scene,[0.6,0.4,0.9]);
const head=new THREE.Group();head.position.set(0,1.12,0.03);head.rotation.set(0.1,-0.75,0);torso.add(head);
seg(head,0,0.08,0,.12,.14,.12,skin);seg(head,0,0.32,0,.38,.42,.36,skin);seg(head,0,0.53,-0.02,.42,.16,.4,hair);seg(head,0,0.4,-0.17,.4,.3,.08,hair);
const ew=M('#ffffff'),ep=M('#111');for(const s of [-1,1]){seg(head,s*0.09,0.36,0.185,.1,.1,.02,ew);seg(head,s*0.09,0.36,0.197,.04,.05,.01,ep)}
seg(head,0,0.22,0.185,.08,.08,.02,M('#7a2e25'));
man.position.set(1.2,0,0.6);man.rotation.y=0.25;
scene.add(new THREE.HemisphereLight('#ffffff','#8a8f99',1.6));const sun=new THREE.DirectionalLight('#fff4e6',2.4);sun.position.set(6,12,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-12,right:12,top:12,bottom:-12});scene.add(sun);
const cam=new THREE.PerspectiveCamera(42,W/H,.1,200);cam.position.set(0.6,1.5,10.2);cam.lookAt(0.0,2.05,0);
gl.render(scene,cam);
const out=document.getElementById('c'),g=out.getContext('2d');g.drawImage(gl.domElement,0,0);
// headlight glow
const pr=v=>{const p=v.clone().project(cam);return[(p.x+1)/2*W,(1-p.y)/2*H]};
for(const z of [0.65,-0.65]){const [x,y]=pr(new THREE.Vector3(2.21,0.85,z).applyMatrix4(car.matrixWorld));const gr=g.createRadialGradient(x,y,0,x,y,260);gr.addColorStop(0,'rgba(255,250,220,.9)');gr.addColorStop(1,'rgba(255,250,220,0)');g.globalCompositeOperation='screen';g.fillStyle=gr;g.fillRect(x-260,y-260,520,520);g.globalCompositeOperation='source-over'}
// HUD panel (game style)
function panel(x,y,w,h){g.fillStyle='rgba(20,24,32,.82)';g.beginPath();g.roundRect(x,y,w,h,22);g.fill()}
panel(110,720,420,250);
g.font='bold 30px Inter, sans-serif';g.fillStyle='#ffd23f';g.fillText('NEAR MISS',140,768);
g.font='600 28px Inter, sans-serif';const rows=[['HEART','72 → 165 bpm','#ff5a4f'],['ADRENALINE','RELEASING','#ffd23f'],['PUPILS','DILATING','#7fd3ff'],['TIME LEFT','0.8 s','#ffffff']];
rows.forEach(([a,b,c],i)=>{g.fillStyle='#c9d1dc';g.fillText(a,140,820+i*44);g.fillStyle=c;g.textAlign='right';g.fillText(b,505,820+i*44);g.textAlign='left'});
// title (ref style: white + yellow, heavy, outlined)
g.textAlign='center';g.lineJoin='round';
[['A CAR MISSES YOU BY 1 METRE','#ffffff',400,62],['HERE\'S WHAT YOUR BODY DOES','#ffd23f',480,62]].forEach(([t,c,y,s])=>{g.font=`900 ${s}px "Inter Display", Inter, sans-serif`;let fs=s;while(g.measureText(t).width>860){fs-=2;g.font=`900 ${fs}px "Inter Display", Inter, sans-serif`}g.lineWidth=10;g.strokeStyle='#15171c';g.strokeText(t,W/2,y);g.fillStyle=c;g.fillText(t,W/2,y)});
// label pill
g.font='900 92px "Inter Display", Inter, sans-serif';const t='0.2 SECONDS';const tw=g.measureText(t).width;panel(W/2-tw/2-40,560,tw+80,120);g.fillStyle='#ff5a4f';g.fillText(t,W/2,652);
window.DONE=1;
</script></body></html>
