<script>
// "The Unteachable": 938 tries to teach the jar (board, megaphone vs headphones, wrong imitation),
// then walks away to people who want it. Dark eerie look of scene_v4, 27 s.
const W = 1080, H = 1920;
const BAND_Y = 0, BAND_H = 1920;              // scene band (ref: 720x480 at y 400 of 720x1280)
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const PI = Math.PI;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;

const RED = [150, 6, 26], RED_D = [62, 0, 10], RED_L = [214, 44, 62];

const LIME = [74, 92, 60];
const DURATION = 27.0;
const T_COLOR = 6.0;

// ---------------- head shapes (bottom at y=0, up is negative) ----------------
const HEADS = {
  wine:    { H: 330, r: u => 148 * Math.pow(Math.sin(Math.min(1, u * 1.45 + 0.12) * PI / 2), 0.8) * (1 - 0.16 * u * u) },
  tumbler: { H: 340, r: u => 104 + 24 * u },
  tall:    { H: 380, r: u => 96 + 30 * u },
  jar:     { H: 290, r: u => u < 0.86 ? 130 : 130 - 16 * ss((u - 0.86) / 0.06) },
  lime:    { H: 220, r: u => 136 * Math.pow(Math.sin(Math.min(1, u * 1.3 + 0.1) * PI / 2), 0.6) },
  ice:     { H: 240, r: u => 112 + 12 * u },
  mug:     { H: 250, r: u => 116, handle: true },
  square:  { H: 300, r: u => 150 },
  round:   { H: 300, r: u => 150 * Math.pow(Math.sin(Math.min(1, u * 1.2 + 0.2) * PI / 2), 0.5) * (1 - 0.1 * u) },

// ---------------- cast: 938 the teacher, 939 the jar, eager empties ----------------
function mk(o) { return Object.assign({ s0: 0.68, s1: 1.0, grow: Infinity, fillS: Infinity, fillE: Infinity, pre: false, num: null, sil: false, m1: 1 }, o); }
const TCH = mk({ id: 'n938', x: 0, head: 'tall', pre: true, num: 938 });
const JR = mk({ id: 'jar', x: 420, head: 'jar', num: 939, s0: 0.82, jar: true });
const E1 = mk({ id: 'e1', x: 1460, head: 'wine', s0: 0.62, num: 940, fillS: 23.95, fillE: 24.6, grow: 24.65 });
const E2 = mk({ id: 'e2', x: 1700, head: 'lime', s0: 0.62 });
const E3 = mk({ id: 'e3', x: 1940, head: 'ice', s0: 0.62 });
const CAST = [TCH, JR, E1, E2, E3];
const N938X = t => lerp(0, 1100, ramp(t, 22.2, 23.6));
const Ccast = { n938: TCH, jar: JR };
const TR = 0.14;
function fillLvl(c, t) { if (c.jar || c.pre) return 0.86; if (!isFinite(c.fillS)) return 0; return 0.86 * lin(t, c.fillS + TR, c.fillE + TR); }

function gdur(c) { return 1.1; }
function growK(c, t) { if (c.pre) return 1; if (!isFinite(c.grow)) return 0; return lin(t, c.grow, c.grow + gdur(c)); }

  return c.m1 * (k <= 0 ? 0 : stepG(k) * (1 + 0.35 * heave(c, t)) + (k > 0.85 && k < 1 ? 0.25 * pulse(k, 0.85, 1) : 0));
}
function basePose(t, c) { return { lean: 0, tilt: 0, hR: null, hL: null, eyeX: 0, eyeY: 0, mood: 'neutral', blink: 0, dy: Math.sin(t * 2.4 + c.x * 0.01) * 3, flex: 0, walk: 0 }; }
function pourPose(P, t, a, s0, s1, b) {

  if (k <= 0) return 0;

  const th = (lo + hi) / 2;

function poseOf(c, t) {

    if (pourPose(P, t, -1, -0.6, 1.5, 1.85) > 0) P.mood = 'neutral';
    if (t >= 1.85 && t < 4.0) { const w = Math.sin(t * 9); P.hR = [210 + 40 * w, 150 - 70 * Math.abs(w)]; P.hL = [-170, 210 + 40 * Math.sin(t * 9 + 1)]; P.mood = 'frown'; P.dy += 6 * Math.abs(w); }

    if (t >= 7.3 && t < 9.0) { P.mood = 'frown'; P.hR = [150, 140]; P.hL = [-150, 140]; P.lean = 0.05 * Math.sin(t * 40); P.dy += 4 * Math.sin(t * 33); }
    if (t >= 9.0 && t < 11.5) { P.hR = [170, -30]; P.hL = [80, 0]; P.lean = 0.08; P.mood = 'frown'; }
    if (t >= 11.5 && t < 12.6) { const up = pulse(t, 11.8, 12.5); P.hR = [55, -330 - 110 * up]; P.hL = [-55, -330 - 110 * up]; P.eyeX = 6; }
    if (t >= 12.6 && t < 13.2) { P.hR = [260, 100]; }
    if (t >= 13.2 && t < 15.0) P.mood = 'flat';
    if (t >= 15.0 && t < 21.0) { P.mood = t < 17.8 ? 'flat' : t < 19.4 ? 'frown' : 'flat'; if (t > 16.6 && t < 17.8) { P.eyeX = 4; P.eyeY = 8; } if (t >= 19.4) { P.eyeY = 7; P.eyeX = 4; } }

    P.mood = 'flat'; P.eyeX = -6; P.eyeY = -8;
    if (t >= 1.8 && t < 4.0) { P.eyeX = 10 * Math.sin(t * 1.6); P.eyeY = -4; }
    if (t >= 4.0 && t < 6.4) { P.eyeX = -8; P.eyeY = 6; }
    if (t >= 6.4 && t < 7.2) { const k = pulse(t, 6.4, 7.2); P.hL = [lerp(-150, -170, k), lerp(330, -480, k)]; P.eyeX = -8; P.eyeY = -10 * k; }
    if (t >= 7.2 && t < 9.6) { P.mood = 'smile'; P.eyeX = 10; P.eyeY = -4; }
    if (t >= 9.6 && t < 10.0) { P.hR = [130, -180]; P.hL = [-130, -180]; }
    if (t >= 10.0 && t < 13.2) { P.mood = 'squeeze'; P.dy += 7 * Math.sin(t * 12); }
    if (t >= 13.2 && t < 14.2) { const j = Math.sin(t * 50) * 10; P.hR = [150 + j, -330]; P.hL = [-150 + j, -330]; P.mood = 'squeeze'; }
    if (t >= 14.2 && t < 15.0) { const c2 = Math.abs(Math.sin(t * 22)); P.hR = [20 + 40 * c2, 140]; P.hL = [-20 - 40 * c2, 140]; P.mood = 'smile'; P.eyeX = 0; }
    if (t >= 15.0 && t < 21.4) { P.mood = (t > 17.8 && t < 19.2) ? 'flat' : 'squeeze'; P.dy += 4 * Math.sin(t * 8); if (t > 17.8 && t < 19.2) { P.eyeX = 0; P.eyeY = 0; } }
    if (t >= 21.4 && t < 25.6) { P.eyeX = 0; P.eyeY = 9; }
    if (t >= 25.6) { P.hR = [100, 170]; P.hL = [-100, 170]; P.eyeX = 0; P.eyeY = 9; P.tilt = 0.14 * Math.sin((t - 25.6) * 2.2); }
  }
  if (c === E1 || c === E2 || c === E3) {
    P.mood = 'hope'; P.eyeX = -6;
    if (t > 22.6 && t < 23.95) { P.hR = [130, -120 - 30 * Math.sin(t * 9 + c.x)]; P.eyeX = -10; P.eyeY = -8; }

// ---------------- drawing ----------------
function headPath(h) {

  for (let k = N; k >= 0; k--) { const u = k / N; ctx.lineTo(T.r(u), -u * T.H); }
  ctx.closePath();

  path(); ctx.strokeStyle = rgb(col); ctx.lineWidth = w; ctx.stroke();
}
// local transform for a creature: returns function to map local neck-space point to world
function charXform(c, t, P) {
  const s = scaleOf(c, t);
  const x = c.id === 'n938' ? N938X(t) : c.x;
  return { x, s, lean: P.lean, walkBob: P.walk ? Math.abs(Math.sin(t * 12)) * 16 : 0 };
}
function lipOf(c, t) {
  const P = poseOf(c, t), X = charXform(c, t, P), T = HEADS[c.head];
  // neck (0,0) -> rotate lean about hip (0,500) -> head tilt about neck
  const tl = P.lean + P.tilt, dir = Math.sign(tl || 1);
  let lx = T.r(1) * dir, ly = -T.H - 10;
  let hx = lx * Math.cos(tl) - ly * Math.sin(tl), hy = lx * Math.sin(tl) + ly * Math.cos(tl);
  hy += -10;
  // lean about hip
  let nx = 0, ny = -10 + P.dy - X.walkBob;
  const lx2 = (nx - 0) * Math.cos(P.lean) - (ny - 500) * Math.sin(P.lean), ly2 = (nx - 0) * Math.sin(P.lean) + (ny - 500) * Math.cos(P.lean) + 500;
  const wx = lx2 + hx, wy = ly2 + hy;

}
function mouthOf(c, t) {
  const X = charXform(c, t, poseOf(c, t)), T = HEADS[c.head];
  return [X.x - 10 * X.s, 900 + (-10 - T.H * 0.98 - 900) * X.s];

function drawCreature(c, t) {

  const sil = (c.sil && !turned) || SHADOW, m = muscle(c, t), R = c.sil ? (turned ? 1 : 0) : redAmt(c, t);

  const bodyD = sil ? SIL : c.jar ? JAR_D : mix(GREY_D, RED_D, R);
  const ink = sil ? SIL : mix([60, 60, 60], INK, c.jar ? 1 : R);

    const st = P.walk ? Math.sin(t * 12) * 30 : 0;
    ctx.beginPath(); ctx.roundRect(-70 - m * 10 + st, 560, 48 + m * 12, 340, 20); ctx.fill(); if (!sil) ctx.stroke();
    ctx.beginPath(); ctx.roundRect(22 - st, 560, 48 + m * 12, 340, 20); ctx.fill(); if (!sil) ctx.stroke();
  }

    ctx.beginPath();
    ctx.moveTo(-nw, -10);
    ctx.bezierCurveTo(-nw - 20 * m, 50, -Wd - 10, sh - 50, -Wd, sh + 30);
    ctx.bezierCurveTo(-Wd + 10, 320, -Wd + 30 - 20 * m, 520, -Wd + 20, 720);
    ctx.lineTo(Wd - 20, 720);
    ctx.bezierCurveTo(Wd - 30 + 20 * m, 520, Wd - 10, 320, Wd, sh + 30);

  if (!sil) {
    ctx.save(); torso(); ctx.clip();
    ctx.fillStyle = rgb(bodyD, 0.9);
    ctx.beginPath(); ctx.ellipse(Wd * 0.9, 380, Wd * 0.45, 420, 0, 0, 2 * PI); ctx.fill();

      ctx.beginPath(); ctx.moveTo(Wd * 0.62, 190); ctx.quadraticCurveTo(Wd * 0.3, 270 + 20 * m, 6, 215); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, 230); ctx.lineTo(0, 300); ctx.stroke();
      for (const yy of [330, 400]) { ctx.beginPath(); ctx.moveTo(-40, yy); ctx.quadraticCurveTo(-20, yy + 14, -6, yy); ctx.moveTo(40, yy); ctx.quadraticCurveTo(20, yy + 14, 6, yy); ctx.stroke(); }

      for (let v = 0; v < 3; v++) { const u0 = 0.2 + v * 0.22; const p0 = [lerp(s0[0], mid[0], u0), lerp(s0[1], mid[1], u0)], p1 = [lerp(mid[0], h[0], u0), lerp(mid[1], h[1], u0)];

function megaK(t) { return ramp(t, 8.95, 9.2) * (1 - ramp(t, 11.35, 11.5)); }
function drawMegaphone(t) {
  const k = megaK(t); if (k <= 0) return;

function notesOn(t) { return (t > 10.0 && t < 15.0) || (t > 15.0 && t < 21.0) || t > 26.2; }

    const x = 420 + sd * (140 + 40 * Math.sin(t * 2 + i)) + 30 * Math.sin(u * 7 + i), y = -60 - 380 * u;

function drawClaps(t) {

// teacher demonstrates "take the lid off": a ghost lid lifts off his own head

// ---------------- background ----------------
const wall = document.createElement('canvas'); wall.width = 2600; wall.height = 900;
(function () {
  const b = wall.getContext('2d');
  b.fillStyle = 'rgb(122,122,118)'; b.fillRect(0, 0, 2600, 900);
  // concrete blotches and stains
  for (let k = 0; k < 900; k++) {
    const x = hash(k) * 2600, y = hash(k + 99) * 900, r = 20 + hash(k + 7) * 160, v = hash(k + 3) > 0.5 ? 255 : 60;
    const g = b.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(${v},${v},${v - 4},${0.05 + hash(k + 5) * 0.06})`); g.addColorStop(1, `rgba(${v},${v},${v},0)`);

  }
  // cracks
  b.strokeStyle = 'rgba(70,70,68,0.35)'; b.lineWidth = 1.5;
  for (let k = 0; k < 18; k++) { let x = hash(k * 11) * 2600, y = hash(k * 13) * 900; b.beginPath(); b.moveTo(x, y); for (let s = 0; s < 14; s++) { x += (hash(k * 17 + s) - 0.5) * 40; y += 10 + hash(k * 19 + s) * 20; b.lineTo(x, y); } b.stroke(); }
  // pits
  b.fillStyle = 'rgba(40,40,40,0.35)';
  for (let k = 0; k < 500; k++) { b.beginPath(); b.arc(hash(k * 5.1) * 2600, hash(k * 9.3) * 900, 0.6 + hash(k * 2.2) * 2, 0, 2 * PI); b.fill(); }
  const id = b.getImageData(0, 0, 2600, 900), d = id.data;
  for (let k = 0; k < d.length; k += 4) { const n = (Math.random() - 0.5) * 22; d[k] += n; d[k + 1] += n; d[k + 2] += n; }
  b.putImageData(id, 0, 0);
})();
const grain = document.createElement('canvas'); grain.width = 540; grain.height = 360;
const gctx = grain.getContext('2d');
function regrain(seed) { const id = gctx.createImageData(540, 360); let s = seed * 9973; for (let k = 0; k < id.data.length; k += 4) { s = (s * 16807) % 2147483647; const v = s % 255; id.data[k] = id.data[k + 1] = id.data[k + 2] = v; id.data[k + 3] = 16; } gctx.putImageData(id, 0, 0); }


// ---------------- camera (hard cuts) ----------------
function camAt(t) {
  if (t < 4.0) return { x: 210, cy: -150, z: 1.2 + 0.03 * lin(t, 0, 4) };
  if (t < 9.0) return { x: 220, cy: -170, z: 1.0 + 0.04 * lin(t, 4, 9) };
  if (t < 11.5) return { x: 230, cy: -175, z: 1.18 };
  if (t < 15.0) return { x: 210, cy: -195, z: 1.2 + 0.04 * lin(t, 11.5, 15) };
  if (t < 16.6) return { x: 10, cy: -230, z: lerp(2.1, 2.3, lin(t, 15, 16.6)) };
  if (t < 17.8) return { x: 240, cy: -360, z: lerp(1.75, 1.9, lin(t, 16.6, 17.8)) };
  if (t < 19.2) return { x: 420, cy: -20, z: lerp(2.15, 2.35, lin(t, 17.8, 19.2)) };
  if (t < 21.0) return { x: 10, cy: -230, z: lerp(2.1, 2.5, lin(t, 19.2, 21)) };
  if (t < 22.2) return { x: 220, cy: -150, z: 1.0 };
  if (t < 25.6) { const k = ramp(t, 22.2, 23.6); return { x: lerp(220, 1380, k), cy: -150, z: lerp(1.0, 1.06, k) }; }

}
const PUNCH = [[0.0, 0.05, 0.3], [4.9, 0.06, 0.4], [6.95, 0.12, 0.8], [13.3, 0.1, 0.8], [21.9, 0.1, 0.6], [24.65, 0.06, 0.9]];
const FLICK = [0.3, 3.4, 8.2, 12.6, 16.2, 19.9, 22.6, 26.2];
function flicker(t) { let f = 0; for (const t0 of FLICK) { f = Math.max(f, 0.75 * pulse(t, t0, t0 + 0.07), 0.6 * pulse(t, t0 + 0.12, t0 + 0.2)); } return f + 0.05 * (0.5 + 0.5 * Math.sin(t * 31) * Math.sin(t * 7.3)); }

// ---------------- progressive text ----------------
const YEL = '#e3cf6a', WH = '#ffffff';
const TEXT = [
  { a: -1, b: 3.85, rows: [[-1, [["Some people ", WH], ["don’t", YEL]], 360], [-1, [["want to ", WH], ["understand.", YEL]], 440]] },
  { a: 4.15, b: 8.85, rows: [[4.15, [["So you explain it", WH]], 360], [4.6, [["again.", YEL]], 440]] },
  { a: 9.15, b: 14.85, rows: [[9.15, [["And again.", WH]], 360], [11.55, [["And again.", YEL]], 440]] },
  { a: 15.15, b: 20.85, rows: [[15.15, [["But they don’t", WH]], 360], [16.0, [["want to learn.", YEL]], 440]] },
  { a: 21.35, b: 27.5, rows: [[21.35, [["Sometimes,", WH]], 360], [22.3, [["walking away", WH]], 440], [25.75, [["is the lesson.", YEL]], 520]] },

      ctx.restore();
    }

}

// ---------------- frame ----------------
window.renderFrame = function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;

    if (hv > 0.01) { ctx.fillStyle = `rgba(120,0,16,${0.28 * hv})`; ctx.fillRect(0, 0, W, H); }
    // silence beat before the last line: lights dip

    const fl = flicker(t) + 0.55 * hv + dip;
    if (fl > 0.01) { ctx.fillStyle = `rgba(0,0,0,${clamp(fl, 0, 0.85)})`; ctx.fillRect(0, 0, W, H); }
    ctx.fillStyle = 'rgba(235,230,220,0.35)';
    for (let k = 0; k < 46; k++) { const x = (hash(k) * 1200 + t * (8 + hash(k + 3) * 18) + Math.sin(t * 0.7 + k) * 20) % 1200 - 60, y = ((hash(k + 9) * 1960 + t * (5 + hash(k) * 10)) % 1960) - 20; ctx.beginPath(); ctx.arc(x, y, 1 + hash(k + 5) * 2.2, 0, 2 * PI); ctx.fill(); }

    if (hash(sk * 3.3) > 0.55) { ctx.strokeStyle = 'rgba(230,230,225,0.22)'; ctx.lineWidth = 1.5; const x = hash(sk * 7.1) * W; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 6, H); ctx.stroke(); }

window.DURATION = DURATION;
