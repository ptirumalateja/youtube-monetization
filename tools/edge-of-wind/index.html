// ------------------------------------------------------------------ timeline
function mono(keys,t){ const n=keys.length; if(t<=keys[0][0]) return keys[0][1]; if(t>=keys[n-1][0]) return keys[n-1][1];

// Voyager's distance from the Sun (AU); this also drives the on-screen odometer, so it only ever increases
const AUK=[[0,1.0],[2.0,1.25],[3.2,3.2],[5.0,13],[6.6,40],[7.6,68],[8.6,86],[9.6,94],[11.2,104],[12.8,114],[13.5,118.5],[14.05,121],[15.0,122.4],[16.5,123.2]];
// camera distance from its focus (log keyed), focus height, orbit
const DK=[[0,3.3],[1.9,3.8],[2.6,6.2],[4.0,9],[6.6,16],[7.6,23],[9.6,24],[12.6,23],[14.05,23],[14.8,34],[16.0,170],[17.4,620],[18.8,980],[20.9,1080],[21.25,520],[21.55,60],[21.8,8],[22.0,3.3]].map(k=>[k[0],Math.log(k[1])]);
const AZK=[[0,0.0],[2.0,0.02],[6.6,0.16],[9.6,0.22],[14.05,0.28],[16.0,0.45],[18.8,0.62],[20.9,0.70],[21.4,0.45],[22.0,0.0]];
const ELK=[[0,0.06],[2.0,0.08],[9.6,0.12],[14.05,0.14],[16.0,0.30],[18.8,0.36],[20.9,0.38],[21.4,0.25],[22.0,0.06]];
const T_END=22.0;
window.AUat=t=>mono(AUK,t);
function focusAt(t,D,vy){ // ride: just above Voyager; pull-out: move to the bubble's centre; plunge: back to the Sun
  const ride=vy+0.10*D; const opening=0.62*(1-sm(1.4,2.6,t))+ride*sm(1.4,2.6,t);
  const bubble=-55; let f=t<2.6?opening:ride; f=f+(bubble-f)*sm(14.6,18.0,t);
  if(t>20.9){ const u=sm(20.9,21.85,t); f=bubble+(0.62-bubble)*u; } return f; }
let ROLL=0;
function setT(t){
  const au=mono(AUK,Math.min(t,16.5)); const vy=au; // Voyager flies straight up the nose axis
  const D=Math.exp(mono(DK,t)); const fy=focusAt(t,D,vy); const az=mono(AZK,t), el=mono(ELK,t);
  const F=new THREE.Vector3(0,fy,0); const ce=Math.cos(el); const wob=0.004*D;
  cam.position.set(F.x+D*Math.sin(az)*ce+wob*Math.sin(t*0.8),F.y+D*Math.sin(el)+wob*Math.cos(t*0.6),F.z+D*Math.cos(az)*ce);
  ROLL=0.035*Math.sin(t*0.4); cam.up.set(Math.sin(ROLL),Math.cos(ROLL),0); cam.lookAt(F); cam.updateMatrixWorld(); cam.updateProjectionMatrix();
  // Voyager

  // wind layers: amplitude by camera distance; the focus of the lattice is the camera focus
  layers.forEach(l=>{ const w=Math.exp(-0.5*Math.pow(Math.log(D/(l.P*1.1))/0.9,2)); const u=l.mat.uniforms; u.uAmp.value=0.6*w; l.m.visible=w>0.01; u.uF.value.copy(F); u.uT.value=t;
    u.uK2.value=Math.max(1,D/30); const pb=sm(14.6,17.0,t); u.uRegAmp.value.set(1.0-0.5*pb, 1.0, 1.0+1.0*pb); });
  // Sun: disc + corona while close, a star when far
  const sunPx=SUN_R/D*KPX; sun.visible=sunPx>1.5; corona.visible=sun.visible; sun.quaternion.copy(cam.quaternion); corona.quaternion.copy(cam.quaternion); sunStar.quaternion.copy(cam.quaternion);
  coronaMat.uniforms.uO.value=sm(1.5,12,sunPx)*0.95; sunMat.uniforms.uTime.value=t; coronaMat.uniforms.uTime.value=t;
  const starPx=34*SC*2*(1+0.6*sm(14.6,18,t)); sunStar.scale.setScalar(starPx/KPX*cam.position.distanceTo(sun.position)); sunStarMat.uniforms.uO.value=(1-sm(8,30,sunPx))*0.9;
  // boundaries: target-first (rim visible before Voyager reaches it), membranes for volume; rims billboard about the nose axis
  const faceY=Math.atan2(cam.position.x,cam.position.z); [shockRim,hpRim,hpRimOuter].forEach(r=>r.rotation.y=faceY);
  const big=sm(14.6,17.0,t)*(1-sm(21.0,21.6,t));
  shockRim.material.uniforms.uAmp.value=Math.max(sm(6.4,8.2,t)*(1-sm(11.0,13.0,t))*1.7, big*0.8); hpRim.material.uniforms.uAmp.value=Math.max(sm(11.4,12.6,t)*(1.6-0.6*big), 0)*(1-sm(21.0,21.6,t)); hpRimOuter.material.uniforms.uAmp.value=hpRim.material.uniforms.uAmp.value*0.6;
  shockMem.material.uniforms.uAmp.value=(sm(7.6,9.6,t)*(1-sm(10.4,12.0,t))*0.55+big*0.30); hpMem.material.uniforms.uAmp.value=(sm(12.4,14.05,t)*(1-sm(14.6,15.6,t))*0.5+big*0.42);
  [shockRim,hpRim,hpRimOuter,shockMem,hpMem,stars].forEach(o=>o.material.uniforms.uTime.value=t);
  // orbits: visible early, fade with distance
  const orbA=1-sm(40,140,D); ecl.visible=orbA>0.01; ecl.children.forEach(c=>{ if(c.isPoints) c.material.uniforms.uAmp.value=orbA*0.8; });
  planets.forEach(p=>{ const px=Math.max(3.0*SC*2, p.r*0.0)/KPX; p.s.scale.setScalar(px*cam.position.distanceTo(p.s.getWorldPosition(new THREE.Vector3()))*3.2); p.s.material.opacity=orbA; });
  stars.material.uniforms.uAmp.value=0.9;

}
// ------------------------------------------------------------------ composer: soft clamp -> bloom -> grade (teal shadows, warm highlights, vignette, grain)
const comp=new EffectComposer(renderer); comp.setSize(W,H); comp.addPass(new RenderPass(scene,cam));
comp.addPass(new ShaderPass({uniforms:{tDiffuse:{value:null}},vertexShader:`varying vec2 vUv; void main(){vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,fragmentShader:`uniform sampler2D tDiffuse; varying vec2 vUv; void main(){ vec4 c=texture2D(tDiffuse,vUv); c.rgb=vec3(1.0)-exp(-c.rgb*1.25); gl_FragColor=vec4(c.rgb,1.0);} `}));
const bloom=new UnrealBloomPass(new THREE.Vector2(W,H),0.55,0.6,0.42); comp.addPass(bloom);
const grade=new ShaderPass({uniforms:{tDiffuse:{value:null},uT:{value:0},uRes:{value:new THREE.Vector2(W,H)}},vertexShader:`varying vec2 vUv; void main(){vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`uniform sampler2D tDiffuse; uniform float uT; uniform vec2 uRes; varying vec2 vUv; float h(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
   void main(){ vec3 c=texture2D(tDiffuse,vUv).rgb; float l=dot(c,vec3(0.299,0.587,0.114)); c+=vec3(-0.004,0.010,0.018)*(1.0-smoothstep(0.0,0.25,l)); c=mix(c,c*vec3(1.04,1.0,0.95),smoothstep(0.4,1.0,l));
    vec2 q=vUv-0.5; q.x*=uRes.x/uRes.y; c*=1.0-0.42*smoothstep(0.32,0.95,length(q)); c+=(h(vUv*uRes+uT*61.0)-0.5)*0.022; gl_FragColor=vec4(c,1.0);} `});
comp.addPass(grade); comp.addPass(new OutputPass());
const c2=document.createElement('canvas'); c2.width=W; c2.height=H; const ctx=c2.getContext('2d');
window.renderAt=(t,sub)=>{ const n=sub||2, sh=1/60; for(let i=0;i<n;i++){ const tt=t+(n>1?(i/(n-1)-0.5)*sh:0); setT(tt); grade.uniforms.uT.value=tt; comp.render(); ctx.globalAlpha=1/(i+1); ctx.drawImage(renderer.domElement,0,0); }
  ctx.globalAlpha=1; return c2.toDataURL('image/jpeg',0.95); };
// screen positions (0..1) for the overlay: Voyager, the Sun
window.proj=(t)=>{ setT(t); const o=[]; [vg.position.clone(),new THREE.Vector3(0,0,0)].forEach(p=>{ const v=p.clone().project(cam); o.push([(v.x+1)/2,(1-v.y)/2,v.z<1?1:0]); }); return o; };
window.setT=setT; window.vg=vg; window.scene=scene; window.cam=cam; window.renderer=renderer; window.ready=true;
