window.projP=(t)=>{ setT(t); const v=PW.clone(); if(inside(t)) return [-1,-1]; heart.updateMatrixWorld(true); v.copy(P_LOCAL).applyMatrix4(heart.matrixWorld).project(cam); return [(v.x+1)/2,(1-v.y)/2]; };
window.projV=(t)=>{ if(t<CROWD_END){ setCrowd(t); return window.heroChestScreen(); } return window.projP(warp(t)); };
window.renderAt=(t,exp)=>{ const d=1/120; setVideo(t-d); comp.render(); ctx.globalAlpha=1; ctx.drawImage(renderer.domElement,0,0); setVideo(t+d); comp.render(); ctx.globalAlpha=0.5; ctx.drawImage(renderer.domElement,0,0);
  if(exp!==undefined&&exp<1){ ctx.globalAlpha=1-exp; ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H); } ctx.globalAlpha=1; return c2.toDataURL('image/jpeg',0.94); };
window.setT=setT; window.cam=cam; window.ready=true;
</script></body></html>
