const puff=new THREE.Points(puffGeo,pointsMat('puff')); puff.frustumCulled=false; scene.add(puff);

// ------------------------------------------------------------------ batter: right-hander, forward defence, clean silhouette
const silMat=new THREE.ShaderMaterial({transparent:true,uniforms:{uA:{value:1},uRim:{value:new THREE.Color(0xff5a40)}},
  vertexShader:`varying vec3 vn;varying vec3 vv;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);vn=normalize(normalMatrix*normal);vv=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`varying vec3 vn;varying vec3 vv;uniform float uA;uniform vec3 uRim;void main(){float f=pow(1.0-abs(dot(normalize(vn),normalize(vv))),4.0);
    vec3 c=vec3(0.010,0.007,0.008)+uRim*f*0.55; gl_FragColor=vec4(c,uA);}`});
const batter=new THREE.Group(); scene.add(batter);
const unitSph=new THREE.SphereGeometry(1,32,20);
function ellipsoid(c,basis,r){ const m=new THREE.Mesh(unitSph,silMat); const M=new THREE.Matrix4().makeBasis(...basis); m.quaternion.setFromRotationMatrix(M); m.scale.set(...r); m.position.copy(c); batter.add(m); return m; }
function sphere(c,r){ return ellipsoid(c,[V(1,0,0),V(0,1,0),V(0,0,1)],[r,r,r]); }
function limb(a,b,ra,rb){ const d=b.clone().sub(a), L=d.length(); const g=new THREE.CylinderGeometry(rb,ra,L,24,1,true); const m=new THREE.Mesh(g,silMat);
  m.quaternion.setFromUnitVectors(V(0,1,0),d.clone().normalize()); m.position.copy(a).addScaledVector(d,0.5); batter.add(m); sphere(a,ra); sphere(b,rb); return m; }
function box(c,basis,size,rad){ const m=new THREE.Mesh(new RoundedBoxGeometry(size[0],size[1],size[2],3,rad),silMat); m.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(...basis)); m.position.copy(c); batter.add(m); return m; }
function ik(S,Wt,L1,L2,pole){ const d0=Wt.clone().sub(S); let d=d0.length(); const dir=d0.clone().normalize(); d=Math.min(d,L1+L2-1e-3);
  const a=(L1*L1-L2*L2+d*d)/(2*d), h=Math.sqrt(Math.max(0,L1*L1-a*a)); const pp=pole.clone().sub(dir.clone().multiplyScalar(pole.dot(dir))).normalize();
  return S.clone().addScaledVector(dir,a).addScaledVector(pp,h); }
function frame(up,fwdHint){ const u=up.clone().normalize(); const f=fwdHint.clone().sub(u.clone().multiplyScalar(fwdHint.dot(u))).normalize(); const s=new THREE.Vector3().crossVectors(u,f); return [s,u,f]; }
// joint centres for a 1.80 m batter (anthropometric segment lengths)
const J={};
J.pelvis=V(0.02,0.86,1.80); J.hipL=V(0.03,0.86,1.89); J.hipR=V(0.01,0.86,1.71);
J.ankL=V(0.10,0.085,2.06); J.ankR=V(0.0,0.11,1.12);
J.kneL=ik(J.hipL,J.ankL,0.46,0.44,V(0.25,0.1,1)); J.kneR=ik(J.hipR,J.ankR,0.46,0.44,V(0.35,0,1));
J.neck=V(0.05,1.39,2.04); J.shL=V(0.08,1.34,2.21); J.shR=V(0.05,1.38,1.89);
J.head=V(0.08,1.58,2.15);
J.handT=V(0.26,0.96,2.17); J.handB=V(0.27,0.86,2.18);
J.elbL=ik(J.shL,J.handT,0.30,0.31,V(0.35,0.55,0.75)); J.elbR=ik(J.shR,J.handB,0.30,0.31,V(0.25,-0.5,-0.6));
window.J=J;
{ // torso
  const B=frame(J.neck.clone().sub(J.pelvis),V(1,0,0.15));  // s ~ -z.. so flip: we want s from right to left shoulder
  const up=B[1], fw=B[2], side=new THREE.Vector3().crossVectors(fw,up).normalize(); const basis=[side,up,fw];
  const L=J.neck.distanceTo(J.pelvis);
  ellipsoid(J.pelvis.clone().addScaledVector(up,0.02),basis,[0.17,0.12,0.115]);
  ellipsoid(J.pelvis.clone().addScaledVector(up,0.20*L),basis,[0.150,0.15,0.105]);
  ellipsoid(J.pelvis.clone().addScaledVector(up,0.62*L).addScaledVector(fw,0.01),basis,[0.175,0.20,0.120]);
  limb(J.neck.clone().addScaledVector(up,-0.03),J.head.clone().addScaledVector(up,-0.08),0.058,0.052);
  sphere(J.shL,0.062); sphere(J.shR,0.062);
}
limb(J.hipL,J.kneL,0.085,0.060); limb(J.hipR,J.kneR,0.085,0.060);
limb(J.kneL,J.ankL,0.058,0.040); limb(J.kneR,J.ankR,0.058,0.040);
limb(J.shL,J.elbL,0.056,0.044); limb(J.shR,J.elbR,0.056,0.044);
limb(J.elbL,J.handT,0.044,0.034); limb(J.elbR,J.handB,0.044,0.034);
// gloves
for(const [h,e] of [[J.handT,J.elbL],[J.handB,J.elbR]]){ const d=h.clone().sub(e).normalize(); ellipsoid(h.clone().addScaledVector(d,0.035),frame(d,V(0,0,1)),[0.055,0.075,0.05]); }
// feet (heel under ankle, toe forward)
function foot(ank,dirHint,lift){ const f=dirHint.clone().normalize(); const c=ank.clone().addScaledVector(f,0.07); c.y=Math.max(0.035,ank.y-0.05)+lift*0.5;
  const tilt=V(0,1,0).applyAxisAngle(new THREE.Vector3().crossVectors(V(0,1,0),f).normalize(),-lift*2.2);
  box(c,frame(tilt,f),[0.105,0.075,0.29],0.03); }
foot(J.ankL,V(0.45,0,0.9),0); foot(J.ankR,V(0.95,0,0.25),0.06);
// pads: on the front of each shin, from the instep to above the knee, facing the bowler
function pad(kne,ank){ const d=kne.clone().sub(ank).normalize(); const fwHint=V(0.15,0,1); const B=frame(d,fwHint); const up=B[1], fw=B[2];
  const len=ank.distanceTo(kne)+0.17; const c=ank.clone().addScaledVector(up,len/2-0.06).addScaledVector(fw,0.052);
  box(c,[B[0],up,fw],[0.165,len,0.085],0.035);
  box(kne.clone().addScaledVector(up,0.03).addScaledVector(fw,0.085),[B[0],up,fw],[0.15,0.13,0.06],0.03);
  return {c,up,fw}; }
const padL=pad(J.kneL,J.ankL); pad(J.kneR,J.ankR);
// helmet with peak and grille, face toward the bowler and a little down
{ const fw=V(0.05,-0.25,1).normalize(); const B=frame(V(0,1,0.25),fw);
  ellipsoid(J.head,B,[0.125,0.13,0.145]);
  box(J.head.clone().addScaledVector(B[1],0.04).addScaledVector(B[2],0.15),B,[0.20,0.012,0.08],0.005);
  for(let i=0;i<3;i++){ const y=-0.03-i*0.045; const m=new THREE.Mesh(new THREE.TorusGeometry(0.115,0.006,6,24,Math.PI*0.9),silMat);
    m.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(B[0],B[2].clone().negate(),B[1])); m.rotateZ(Math.PI*0.05); m.position.copy(J.head).addScaledVector(B[1],y).addScaledVector(B[2],0.03); batter.add(m); }
  const bar=new THREE.Mesh(new THREE.CylinderGeometry(0.006,0.006,0.13,6),silMat); bar.quaternion.setFromUnitVectors(V(0,1,0),B[1]); bar.position.copy(J.head).addScaledVector(B[1],-0.07).addScaledVector(B[2],0.145); batter.add(bar);
}
// bat: handle in the hands, blade angled down beside the front pad, face to the bowler, hands ahead of the blade
{ const grip=J.handT.clone().add(J.handB).multiplyScalar(0.5); const toe=V(0.32,0.06,2.11); const ax=grip.clone().sub(toe).normalize();
  const B=frame(ax,V(0,0,1));
  const hTop=grip.clone().addScaledVector(ax,0.17), hBot=grip.clone().addScaledVector(ax,-0.14);
  limb(hTop,hBot,0.017,0.017);
  const bladeLen=0.56; const bc=toe.clone().addScaledVector(ax,bladeLen/2);
  box(bc,B,[0.108,bladeLen,0.055],0.012);
}
// place the batter so the front pad meets the ball exactly at the impact point
{ const pc=padL.c, up=padL.up, fw=padL.fw; // pad front surface line: pc + fw*0.0425 + up*s
  const s=(PIMP.y-pc.y-fw.y*0.0425)/up.y; const front=pc.clone().addScaledVector(fw,0.0425).addScaledVector(up,s);
  batter.position.set(PIMP.x-front.x, 0, (PIMP.z-BR)-front.z); window.batterShift=batter.position.toArray(); }

// ------------------------------------------------------------------ post: bloom + grade (vignette, crimson shadows, grain)
const composer=new EffectComposer(renderer); composer.addPass(new RenderPass(scene,cam));
const bloom=new UnrealBloomPass(new THREE.Vector2(W,H),0.55,0.5,0.82); composer.addPass(bloom);
const grade=new ShaderPass({uniforms:{tDiffuse:{value:null},uT:{value:0},uSat:{value:1},uFlash:{value:0}},
  vertexShader:`varying vec2 vu;void main(){vu=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform sampler2D tDiffuse;uniform float uT,uSat,uFlash;varying vec2 vu;
    float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
    void main(){vec4 c=texture2D(tDiffuse,vu);vec3 col=c.rgb;float l=dot(col,vec3(0.299,0.587,0.114));
      col=mix(vec3(l),col,uSat); col+=vec3(0.020,0.002,0.004)*(1.0-smoothstep(0.0,0.25,l));
      vec2 q=vu-0.5;q.x*=0.75;float v=smoothstep(0.85,0.25,length(q));col*=mix(0.45,1.0,v);
      col+=(h(vu*1000.0+uT)-0.5)*0.025; col=mix(col,vec3(1.0,0.92,0.88),uFlash); gl_FragColor=vec4(col,1.);}`});
composer.addPass(grade); composer.addPass(new OutputPass());

// ------------------------------------------------------------------ cameras
function camState(p,t,fov,up){return {p,t,fov,up:up||V(0,1,0)};}
function mixCam(a,b,u){return {p:a.p.clone().lerp(b.p,u),t:a.t.clone().lerp(b.t,u),fov:lerp(a.fov,b.fov,u),up:a.up.clone().lerp(b.up,u).normalize()};}
function hookCam(tb,T){ const b=ballPos(tb); const lag=0.62+0.12*clamp(T/2,0,1);
  return camState(b.clone().add(V(-0.20,0.10,lag)), b.clone().add(V(0.38,-0.62,-7.0)), 38); }
const BROAD=camState(V(0.55,3.6,27.5),V(0.05,0.55,1.6),10.5);
const BROAD2=camState(V(0.50,3.3,26.0),V(0.08,0.38,2.0),7.2);
const PLAN=camState(V(-0.05,8.2,2.2),V(0.0,0.0,1.75),33,V(0,0,-1));
const PLANOBL=camState(V(1.1,4.6,5.6),V(0.0,0.2,1.3),36,V(0,0.6,-0.8));
const ENDON=camState(V(0.02,0.50,4.4),V(-0.07,0.40,0.0),22);
const CLOSE=camState(V(-0.105,0.535,0.62),V(-0.132,0.535,0.0),24);
function cameraAt(T){
  const tb=ballTime(T);
  if(T<2.6){ const u=s5(1.55,2.6,T); return mixCam(hookCam(tb,T),BROAD,u); }
  if(T<7.4){ return mixCam(BROAD,BROAD2,s5(TF,7.4,T)); }
  if(T<9.4){ return mixCam(BROAD2,PLANOBL,s5(7.4,9.4,T)); }
  if(T<10.6){ return mixCam(PLANOBL,PLAN,s5(9.4,10.6,T)); }
  if(T<11.4) return PLAN;
  if(T<13.2){ return mixCam(PLAN,ENDON,s5(11.4,13.2,T)); }
  if(T<13.8) return ENDON;
  if(T<RW0){ return mixCam(ENDON,CLOSE,s5(13.8,15.4,T)); }
  return mixCam(CLOSE,hookCam(tb,0),s5(RW0,END,T));
}

// ------------------------------------------------------------------ state
const tmp=new THREE.Vector3();
function setState(T){
  const tb=ballTime(T);
  const c=cameraAt(T); cam.position.copy(c.p); cam.up.copy(c.up); cam.lookAt(c.t); cam.fov=c.fov; cam.updateProjectionMatrix();
  trailMat.uniforms.uK.value=pointsMat_uK(); projPts.material.uniforms.uK.value=pointsMat_uK(); puff.material.uniforms.uK.value=pointsMat_uK();
  // ball
  const bp=ballPos(tb); ball.position.copy(bp);
  const qs=new THREE.Quaternion().setFromAxisAngle(SPIN_AXIS,spinAngle(tb)); ball.quaternion.copy(qs).multiply(seamQ);
  ballGlow.position.copy(bp); ballGlow.material.opacity=0.45;
  ballKey.position.copy(bp).add(V(0.25,0.35,0.45)); ballRim.position.copy(bp).add(V(-0.3,0.1,-0.35));
  // trail: whole path so far, brighter towards the ball
  const P=trailGeo.attributes.position.array, C=trailGeo.attributes.color.array, S=trailGeo.attributes.aSize.array;
  const fadeIn=T<0.4?0.5+T/0.8:1;
  for(let i=0;i<TRN;i++){ const f=i/(TRN-1); const t=tb*f; const p=ballPos(t); P[i*3]=p.x;P[i*3+1]=p.y;P[i*3+2]=p.z;
    const recent=Math.exp(-(tb-t)/0.12); const a=(0.30+0.70*recent)*fadeIn*(t<0.015?0:1);
    C[i*3]=1.0*a; C[i*3+1]=0.16*a+0.25*recent*a; C[i*3+2]=0.10*a; S[i]=0.020+0.012*recent; }
  trailGeo.attributes.position.needsUpdate=trailGeo.attributes.color.needsUpdate=trailGeo.attributes.aSize.needsUpdate=true;
  // pitch mark appears at the bounce
  const mk=tb>T1?Math.min(1,(tb-T1)/0.03):0; markMat.opacity=0.85*mk;
  // dust puff
  { const P2=puffGeo.attributes.position.array, C2=puffGeo.attributes.color.array, S2=puffGeo.attributes.aSize.array; const age=tb-T1+ (T>TF && T<RW0? 0:0);
    for(let i=0;i<PUFF;i++){ const sd=puffSeed[i]; const a=age>0?age:0; const k=1-Math.exp(-a*9); const x=XP+sd[0]*0.10*k*3, y=0.01+sd[1]*0.16*k, z=ZP+sd[2]*0.25*k*2.2;
      P2[i*3]=x;P2[i*3+1]=y;P2[i*3+2]=z; const al=age>0?Math.exp(-a*1.2)*0.11*(0.4+sd[3]):0; C2[i*3]=al*0.95;C2[i*3+1]=al*0.7;C2[i*3+2]=al*0.5; S2[i]=0.012+0.02*k; }
    puffGeo.attributes.position.needsUpdate=puffGeo.attributes.color.needsUpdate=puffGeo.attributes.aSize.needsUpdate=true; }
  // batter ghosts out while the projection is drawn (Hawk-Eye style), back for the loop
  const ga=T<RW0? 1-0.80*sstep(7.9,9.0,T) : 0.2+0.8*sstep(RW0+0.2,END,T);
  silMat.uniforms.uA.value=ga; silMat.depthWrite=ga>0.99; silMat.transparent=ga<0.999;
  // projection
  const pr=projProgress(T); const tEnd=lerp(T_FREEZE,T_STUMP,pr);
  const P3=projGeo.attributes.position.array, C3=projGeo.attributes.color.array, S3=projGeo.attributes.aSize.array;
  for(let i=0;i<PJN;i++){ const f=i/(PJN-1); const t=lerp(T_FREEZE,T_STUMP,f); const p=ballPos(t); P3[i*3]=p.x;P3[i*3+1]=p.y;P3[i*3+2]=p.z;
    const on=(t<=tEnd&&pr>0)?1:0; const dash=(Math.floor(f*46)%2===0)?1:0.15; const a=on*dash*0.9;
    C3[i*3]=1.0*a;C3[i*3+1]=0.86*a;C3[i*3+2]=0.66*a; S3[i]=0.016; }
  projGeo.attributes.position.needsUpdate=projGeo.attributes.color.needsUpdate=projGeo.attributes.aSize.needsUpdate=true;
  const gp=ballPos(tEnd); ghost.position.copy(gp); ghostRing.position.copy(gp); ghostRing.lookAt(cam.position);
  const gv=pr>0.0005?Math.min(1,pr*30):0; ghost.visible=ghostRing.visible=gv>0; ghostMat.opacity=0.55*gv; ghostRing.material.opacity=gv;
  // stumps glow a little brighter at the reveal
  haloMat.uniforms.uA.value=0.35+0.4*sstep(12.0,13.8,T)*(T<RW0?1:1-s5(RW0,END,T));
  grade.uniforms.uT.value=T*7.31;
  const fl=Math.max(Math.exp(-Math.abs(T-TF)*30)*(T>=TF?1:0)*0.10, (T>=13.75&&T<14.2)?Math.exp(-(T-13.75)*18)*0.08:0);
  grade.uniforms.uFlash.value=fl;
  grade.uniforms.uSat.value=(T>=TF&&T<7.4)?0.82:1;
}
function pointsMat_uK(){ return H/2/Math.tan(cam.fov*Math.PI/360); }

// ------------------------------------------------------------------ render API
const acc=document.createElement('canvas'); acc.width=W; acc.height=H; const actx=acc.getContext('2d');
window.renderAt=(T,nsub,shutter)=>{ nsub=nsub||1; shutter=shutter===undefined?0.5/30:shutter;
  actx.globalAlpha=1; actx.fillStyle='#000'; actx.fillRect(0,0,W,H);
  for(let k=0;k<nsub;k++){ const Tk=nsub>1?T+(k/(nsub-1)-0.5)*shutter:T; setState(Math.max(0,Math.min(END-1e-4,Tk<0?Tk+END:Tk))); composer.render(); actx.globalAlpha=1/(k+1); actx.drawImage(renderer.domElement,0,0); }
  setState(T); return acc.toDataURL('image/jpeg',0.93); };
window.info=(T)=>{ setState(T); const pr=(p)=>{const v=p.clone().project(cam);return [(v.x+1)/2*W,(1-v.y)/2*H,v.z];};
  const gp=ghost.position.clone(); return {tb:ballTime(T),proj:projProgress(T),ball:pr(ball.position),ghost:pr(gp),
    legEdge:pr(V(-0.1143,PST.y,0)), ghostInner:pr(V(PST.x+BR,PST.y,0)), stumpTop:pr(V(0,STUMP_H,0)), stumpBase:pr(V(0,0,0)), pitchMark:pr(V(XP,0,ZP))}; };
window.ready=true;
</script></body></html>
