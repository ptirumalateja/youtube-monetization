    for(let i=0;i<4;i++) bucket(BX[i],top,lv(i),al*eo(seg(t,11.9+i*0.08,12.4+i*0.08)),0.4*seg(t,15,17));
    // drops
    for(const d of DROPS){ const fall=d.fine?0.3:0.45; if(t>d.t-fall&&t<d.t){ const k=(d.t-t)/fall; const X=BX[d.b]-30+d.o*60, Y=top+BH*0.4-k*560; x.save(); x.globalAlpha=al; x.strokeStyle=d.fine?'rgba(255,210,122,0.7)':GOLDL; x.lineWidth=d.fine?2:4; x.beginPath(); x.moveTo(X,Y-(d.fine?50:36)); x.lineTo(X,Y); x.stroke(); x.restore(); } }
    // counts above buckets (each count only climbs)
    const a1=eo(seg(t,12.6,14.6)), b1=eo(seg(t,15.0,17.2));
    for(let i=0;i<4;i++){ const c=b1>0?lerp(C100[i],C10K[i],b1):C100[i]*a1; mono(fmt(c),BX[i],top-40,b1>0.05?32:36,WHITE,al*seg(t,12.5,12.8),'center'); }
    // tolerance band
    const band=(lo,hi,lbl,a)=>{ if(a<=0) return; x.save(); x.globalAlpha=a; const y1=top+BH-hi*BH, y2=top+BH-lo*BH; x.fillStyle='rgba(246,178,58,0.10)'; x.fillRect(150,y1,780,y2-y1); x.setLineDash([10,8]); x.strokeStyle='rgba(246,178,58,0.75)'; x.lineWidth=2; x.beginPath(); x.moveTo(150,y1); x.lineTo(930,y1); x.moveTo(150,y2); x.lineTo(930,y2); x.stroke(); x.restore(); mono(lbl,136,(y1+y2)/2+10,28,GOLD,a,'right',700); };
    band(0.42*0.9,0.42*1.1,'±10%',al*win(t,13.9,15.0,0.3,0.25)); band(0.72*0.99,0.72*1.01,'±1%',al*win(t,16.6,18.0,0.3,0.3));
    headline(t,11.95,12.75,[[['Every pixel is',WHITE]],[['a tiny ',WHITE],['bucket.',GOLD]]]);
    headline(t,12.8,14.95,[[['100',GOLD],[' photons',WHITE]]],{size:96,y:330});
    sub(t,13.9,14.95,[['The counts wobble by about ',WHITE],['10%.',GOLD]]);
    headline(t,15.0,17.9,[[['10,000',GOLD],[' photons',WHITE]]],{size:96,y:330});
    sub(t,16.5,17.9,[['Now they wobble by just ',WHITE],['1%.',GOLD]]);
  }
  // ===== S6 shot noise (17.9-20.8)
  if(t>17.8&&t<21.2){ const al=seg(t,17.9,18.3)*(1-seg(t,20.6,21.0)); const pr=eo(seg(t,18.0,19.6));
    drawTile(70,760,450,315,6,pr,0,1,al*eo(seg(t,17.95,18.4))); drawTile(560,760,450,315,600,pr,3,1,al*eo(seg(t,18.1,18.55)));
    mono('FEW PHOTONS',295,1125,26,MUTED,al,'center'); mono('MANY PHOTONS',785,1125,26,MUTED,al,'center');
    headline(t,18.0,20.9,[[['That’s shot ',WHITE],['noise.',GOLD]]]);
    sub(t,18.6,20.8,[['Even a perfect sensor has it.',WHITE]]);
  }
  // ===== S7 sizes: twelve times the area (20.9-25.6)
  if(t>20.8&&t<26.0){ const al=seg(t,20.9,21.3)*(1-seg(t,25.5,25.9)); const S=24; const fw=36*S, fh=24*S, fx=W/2-fw/2, fy=700;
    x.save(); x.globalAlpha=al; x.fillStyle='rgba(40,40,40,0.35)';
    const fp=eo(seg(t,21.4,22.2)); if(fp>0){ x.fillStyle='rgba(70,60,40,0.30)'; x.fillRect(fx,fy,fw*fp,fh); drawOn(fp,2*(fw+fh),()=>{x.beginPath(); x.rect(fx,fy,fw,fh);}); x.strokeStyle=GOLD; x.lineWidth=4; drawOn(fp,2*(fw+fh),()=>{x.beginPath(); x.rect(fx,fy,fw,fh);}); }
    // phone sensor (true size: 9.79 x 7.34 mm)
    const pw=9.79*S, ph=7.34*S; const pp=eo(seg(t,21.0,21.5)); x.fillStyle='rgba(229,83,75,0.22)'; x.globalAlpha=al*pp; x.fillRect(fx,fy,pw,ph); x.strokeStyle=RED; x.lineWidth=4; x.strokeRect(fx,fy,pw,ph); x.globalAlpha=al;
    // twelve phone-sized tiles (9 x 8 mm each = 72 mm2, the phone sensor's area)
    for(let i=0;i<12;i++){ const c=i%4, r=Math.floor(i/4); const k=eo(seg(t,22.3+i*0.11,22.6+i*0.11)); if(k<=0) continue; x.globalAlpha=al*k*0.9; x.strokeStyle=RED; x.lineWidth=2.5; x.strokeRect(fx+c*9*S+3,fy+r*8*S+3,9*S-6,8*S-6); }
    x.globalAlpha=al; const n=Math.min(12,Math.floor(seg(t,22.3,23.7)*12+(t>22.3?1:0))); if(t>22.3&&t<23.9){ mono('×'+n,W/2,fy+fh/2+38,110,WHITE,al*win(t,22.3,23.9,0.15,0.3),'center',700); }
    // same settings, photons sprinkle evenly; counters inside each sensor
    const sp=seg(t,23.6,25.2); const R=rnd(8); const nP=Math.floor(sp*900); x.fillStyle=GOLDL; for(let i=0;i<nP;i++){ const X=fx+R()*fw, Y=fy+R()*fh; x.globalAlpha=al*0.85; x.beginPath(); x.arc(X,Y,2.6,0,6.29); x.fill(); }
    x.globalAlpha=al; if(sp>0){ const a=win(t,23.7,25.8,0.3,0.3); mono('1×',fx+pw/2,fy+ph/2+16,44,WHITE,a,'center',700); mono('≈12×',fx+fw*0.62,fy+fh*0.62,72,GOLD,a,'center',700); }
    x.restore();
    mono('PHONE',fx,fy+fh+46,26,RED,al*pp); mono('FULL FRAME',fx+fw,fy+fh+46,26,GOLD,al*fp,'right');
    headline(t,20.95,22.2,[[['Now compare',WHITE]],[['the sizes.',WHITE]]]);
    headline(t,22.25,23.65,[[['Twelve',GOLD],[' times',WHITE]],[['the area.',WHITE]]]);
    headline(t,23.7,25.9,[[['Far more ',WHITE],['light',GOLD]],[['in one shot.',WHITE]]]);
    const cA=win(t,23.6,25.9,0.25,0.3); chip('SAME FRAMING',W/2-300,fy-70,cA*eo(seg(t,23.6,23.9))); chip('SAME SHUTTER',W/2,fy-70,cA*eo(seg(t,23.75,24.05))); chip('SAME F-NUMBER',W/2+300,fy-70,cA*eo(seg(t,23.9,24.2)));
    sub(t,21.0,23.6,[['A full-frame sensor ≈ ',WHITE],['12',GOLD],[' phone sensors.',WHITE]]);
  }
  // ===== S8 phones fight back (25.8-29.0)
  if(t>25.7&&t<29.4){ const al=seg(t,25.8,26.2)*(1-seg(t,29.0,29.35)); phone(260,980,0.82,1,al);
    // a stack of noisy frames slides out of the phone, then merges into one cleaner frame
    const n=8; const merge=eio(seg(t,27.4,28.3));
    for(let i=n-1;i>=0;i--){ const k=eo(seg(t,26.2+i*0.09,26.7+i*0.09)); if(k<=0) continue; const ox=lerp(0,(i-3.5)*22,1-merge)*k, oy=lerp(0,(i-3.5)*-20,1-merge)*k;
      if(i===0&&merge>0) drawTile(470+ox,860+oy,500,350,6,1,0,Math.round(lerp(1,8,merge)),al*k,merge>0.95?GOLD:LINE); else if(merge<0.98) drawTile(470+ox,860+oy,500,350,6,1,i,1,al*k*(i===0?1:0.9*(1-merge))); }
    headline(t,25.85,29.3,[[['Phones fight ',WHITE],['back.',GOLD]]]);
    sub(t,26.3,27.6,[['They take many frames in a row…',WHITE]]); sub(t,27.6,29.2,[['…and merge them to cut the ',WHITE],['noise.',GOLD]]);
  }
  // ===== S9 the difference + end line (29.1-32)
  if(t>29.0){ const al=seg(t,29.1,29.5)*(1-seg(t,31.55,31.95));
    phone(300,700,0.42,1,al); camera(780,710,0.42,1,al);
    drawTile(110,880,380,266,6,1,0,1,al*eo(seg(t,29.3,29.7)),RED); drawTile(590,880,380,266,72,1,5,1,al*eo(seg(t,29.45,29.85)),GOLD);
    mono('200 MP · ONE SHOT',300,1196,24,RED,al,'center'); mono('24 MP · ONE SHOT',780,1196,24,GOLD,al,'center');
    // the camera's light pours in: a gold funnel under the camera
    headline(t,29.2,31.95,[[['Megapixels count ',WHITE],['buckets.',GOLD]],[['Light fills them.',WHITE]]],{size:70});
    sub(t,29.8,31.9,[['Bigger pixels, more light, less ',WHITE],['noise.',GOLD]]);
  }
  // loop: the phone outline is already drawing back in at the very end, matching frame 0
  if(t>31.7){ const k=seg(t,31.7,32.0); phone(540,1000,1.25,0.8*k,k); counter(12,'MP',540-1.25*130,1000-1.25*230-40,RED,k,150); }
}
