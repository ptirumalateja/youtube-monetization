<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}@font-face{font-family:'Kalam';src:url(fonts/Kalam-Bold.ttf);font-weight:700}@font-face{font-family:'Playfair';src:url(fonts/PlayfairDisplay.ttf);font-weight:400 900}@font-face{font-family:'Elite';src:url(fonts/SpecialElite.ttf)}@font-face{font-family:'Fraktur';src:url(fonts/UnifrakturCook.ttf);font-weight:700}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// "Respect this woman" replica for Slow Light: paper-cut silhouettes, warm cream sky, deep teal paper ground.
// Beat times are matched to the ref (25 s) + a 2.6 s end card.
const W=1080,H=1920,DUR=27.6;
const cv=document.getElementById('c');let ctx=cv.getContext('2d');const MAIN=ctx;
const STYLE=(new URLSearchParams(location.search).get('style')||'blueprint');const CHALK=STYLE==='chalk';const NEWS=STYLE==='news';
const LAYC=document.createElement('canvas');LAYC.width=1080;LAYC.height=1920;const LAY=LAYC.getContext('2d');
let FONT='"Inter Display","Inter",sans-serif';if((new URLSearchParams(location.search).get('style'))==='chalk')FONT='"Kalam",cursive';if((new URLSearchParams(location.search).get('style'))==='news')FONT='"Playfair",serif';
// BLUEPRINT look (v3): drafting-paper blue, white line work, section-hatched ground, engineering callouts that tell the story.
const C={paper0:'#2a6cb8',paper1:'#1b559b',ground:'rgba(8,36,82,0.42)',ground2:'#123f7a',fig:'#eef5ff',line:'#eaf3ff',
  label:'#eef5ff',text:'#ffffff',gold:'#ffb547',heart:'#ff4d5e',red:'#ff5a4f'};
let MONO='"JetBrains Mono","DejaVu Sans Mono",monospace';
if(NEWS){Object.assign(C,{ground:'rgba(0,0,0,0)',fig:'#1c1a17',line:'#1c1a17',label:'#1c1a17',text:'#1c1a17',gold:'#c8102e',heart:'#c8102e',red:'#c8102e',bfill:'rgba(0,0,0,0)'});MONO='"Elite",monospace';}
if(CHALK){Object.assign(C,{ground:'rgba(255,255,255,0.05)',fig:'#f3f1ea',line:'#f1efe6',label:'#f3f1ea',text:'#f6f4ec',gold:'#ffe27a',heart:'#ff7f96',red:'#ff8fa3',bfill:'rgba(255,255,255,0.06)'});MONO='"Kalam",cursive';}

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,u)=>a+(b-a)*u,smooth=u=>u*u*(3-2*u);
const easeOut=u=>1-Math.pow(1-u,3),easeIn=u=>u*u*u;
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);

// ---------- world ----------
const PIT={x0:0,x1:270,d:360};           // pit interior x0..x1, floor at y=d
const SLOPE_X=-250;                      // left plateau rises to the left of this
function slopeAng(t){return 0.38*smooth(seg(t,2.55,3.05))*(1-smooth(seg(t,24.6,25.6))*0);}
function groundAt(x,t){if(x<SLOPE_X)return (x-SLOPE_X)*Math.tan(slopeAng(t));if(x<PIT.x0||x>PIT.x1)return 0;return PIT.d;}
// boulders: contact x on slope, radius
const FAM={x:-480,R:150}, TRU={x:-720,R:205};
function boulderPos(b,t,extra){const a=slopeAng(t);const cx=b.x+(extra||0);const gy=groundAt(cx,t);return{x:cx-Math.sin(a)*b.R,y:gy-Math.cos(a)*b.R,R:b.R};}

// ---------- precomputed ----------
const Rg=rng(5);
const tufts=[];for(let x=-2000;x<2400;x+=9+Rg()*12)tufts.push([x,6+Rg()*16,Rg()*0.6-0.3]);
const pebbles=[];for(let i=0;i<160;i++)pebbles.push([-2000+Rg()*4400,90+Rg()*1400,4+Rg()*12,Rg()]);
const strata=[];for(let i=0;i<7;i++)strata.push([480+i*170+Rg()*60,Rg()*6,20+Rg()*30]);
const gems=[];for(let i=0;i<14;i++)gems.push([-900+Rg()*2200,560+Rg()*900,8+Rg()*8,Rg()]);
let grain=null;
function makeGrain(){grain=document.createElement('canvas');grain.width=540;grain.height=960;const g=grain.getContext('2d');const id=g.createImageData(540,960);const r=rng(9);
  for(let i=0;i<id.data.length;i+=4){const v=Math.floor(110+r()*90);id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255;}g.putImageData(id,0,0);}

// ---------- camera (world point cx,cy -> screen 540,1000) ----------
const CAM=[
 [0,30,50,1.30],[1.9,40,60,1.33],[2.55,60,120,1.33],[3.05,-275,-60,0.74],[8.8,-275,-60,0.75],
 [9.25,-305,-80,0.79],[10.6,-305,-80,0.80],[11.0,-275,-60,0.75],[12.6,-275,-60,0.75],
 [13.1,-260,-40,0.78],[20.35,-260,-40,0.79],[20.8,-275,-60,0.76],
 [22.2,-290,-60,0.78],[24.2,-320,-80,0.84],[24.8,-300,-60,0.9],[27.6,-240,-100,1.45]];
function camAt(t){let i=CAM.length-1;for(let j=1;j<CAM.length;j++){if(t<CAM[j][0]){i=j;break;}}
  if(t>=CAM[CAM.length-1][0]){const k=CAM[CAM.length-1];return{x:k[1],y:k[2],z:k[3]};}
  const a=CAM[i-1],b=CAM[i],u=smooth((t-a[0])/(b[0]-a[0]));
  return{x:lerp(a[1],b[1],u),y:lerp(a[2],b[2],u),z:Math.exp(lerp(Math.log(a[3]),Math.log(b[3]),u))};}
function shakeAt(t){let s=0;for(const [t0,amp] of [[3.0,10],[8.25,22],[24.25,26]]){const v=t-t0;if(v>=0&&v<0.5)s+=amp*(1-v/0.5);}return s;}

// ---------- figure rig ----------
// angles are absolute, measured from straight down, positive = toward facing direction
const BASE={L:0.02,hl:0,a1:0.08,f1:0.05,a2:-0.06,f2:-0.04,t1:0.06,s1:0.02,t2:-0.06,s2:-0.03};
const P={
 stand:BASE,
 give:{L:0.06,hl:0.12,a1:0.9,f1:1.35,a2:0.7,f2:1.2,t1:0.08,s1:0.02,t2:-0.08,s2:-0.04},
 take:{L:-0.02,hl:0.05,a1:0.8,f1:1.2,a2:0.2,f2:0.15,t1:0.06,s1:0.02,t2:-0.07,s2:-0.03},
 crouch:{L:0.55,hl:0.3,a1:-0.5,f1:-0.3,a2:-0.7,f2:-0.5,t1:1.35,s1:-0.2,t2:1.1,s2:-0.35},
 jump:{L:0.25,hl:0.1,a1:2.6,f1:2.9,a2:2.3,f2:2.6,t1:0.5,s1:-0.3,t2:-0.3,s2:-0.6},
 push:{L:1.0,hl:-0.35,a1:1.62,f1:1.7,a2:1.48,f2:1.58,t1:0.75,s1:-0.05,t2:-0.42,s2:-0.62},
 pushHard:{L:1.12,hl:-0.45,a1:1.75,f1:1.8,a2:1.6,f2:1.68,t1:0.9,s1:0.0,t2:-0.55,s2:-0.72},
 lookUp:{L:-0.12,hl:-0.6,a1:0.1,f1:0.05,a2:-0.05,f2:-0.1,t1:0.05,s1:0.0,t2:-0.06,s2:-0.03},
 wave:{L:-0.14,hl:-0.6,a1:2.7,f1:2.95,a2:-0.05,f2:-0.1,t1:0.05,s1:0.0,t2:-0.06,s2:-0.03},
 holdUp:{L:-0.1,hl:-0.55,a1:2.85,f1:3.05,a2:0.3,f2:0.6,t1:0.08,s1:0.0,t2:-0.1,s2:-0.05},
 holdBoth:{L:0.05,hl:0.25,a1:0.6,f1:1.5,a2:0.5,f2:1.45,t1:0.06,s1:0.02,t2:-0.07,s2:-0.03},
 throwUp:{L:-0.15,hl:-0.6,a1:2.5,f1:2.7,a2:0.3,f2:0.6,t1:0.08,s1:0.0,t2:-0.1,s2:-0.05},
 gesture:{L:0.04,hl:0.3,a1:1.3,f1:1.6,a2:-0.05,f2:-0.05,t1:0.06,s1:0.02,t2:-0.06,s2:-0.03},
 toss:{L:0.08,hl:0.35,a1:1.5,f1:1.9,a2:-0.1,f2:-0.05,t1:0.06,s1:0.02,t2:-0.06,s2:-0.03},
 lookDown:{L:0.06,hl:0.45,a1:0.1,f1:0.05,a2:-0.1,f2:-0.05,t1:0.06,s1:0.02,t2:-0.06,s2:-0.03},
 kneel:{L:0.15,hl:-0.35,a1:1.9,f1:2.4,a2:0.3,f2:0.5,t1:1.55,s1:0.0,t2:0.1,s2:-1.5},
 climb:{L:0.4,hl:-0.3,a1:2.9,f1:3.1,a2:2.6,f2:2.9,t1:1.2,s1:-0.2,t2:-0.1,s2:-0.3},
};
function mix(a,b,u){const o={};for(const k in BASE)o[k]=lerp(a[k],b[k],u);return o;}
// pose track: [[t,poseName or object],...] eased between keys
function track(keys,t){if(t<=keys[0][0])return P[keys[0][1]]||keys[0][1];
  for(let i=1;i<keys.length;i++){if(t<keys[i][0]){const a=P[keys[i-1][1]]||keys[i-1][1],b=P[keys[i][1]]||keys[i][1];return mix(a,b,smooth((t-keys[i-1][0])/(keys[i][0]-keys[i-1][0])));}}
  const k=keys[keys.length-1][1];return P[k]||k;}
function pwv(keys,t){if(t<=keys[0][0])return keys[0][1];for(let i=1;i<keys.length;i++){if(t<keys[i][0]){const u=smooth((t-keys[i-1][0])/(keys[i][0]-keys[i-1][0]));return lerp(keys[i-1][1],keys[i][1],u);}}return keys[keys.length-1][1];}

const LEN={torso:72,neck:10,head:17,ua:38,fa:36,th:50,sh:52};
const V=a=>[Math.sin(a),Math.cos(a)];
function joints(p){// local coords: hip at origin, facing +x
  const up=[Math.sin(p.L),-Math.cos(p.L)];const S=[up[0]*LEN.torso,up[1]*LEN.torso];
  const hd=p.L+p.hl;const Hc=[S[0]+Math.sin(hd)*(LEN.neck+LEN.head),S[1]-Math.cos(hd)*(LEN.neck+LEN.head)];
  const arm=(a,f)=>{const e=[S[0]+V(a)[0]*LEN.ua,S[1]+V(a)[1]*LEN.ua];return[e,[e[0]+V(f)[0]*LEN.fa,e[1]+V(f)[1]*LEN.fa]];};
  const leg=(a,s)=>{const k=[V(a)[0]*LEN.th,V(a)[1]*LEN.th];return[k,[k[0]+V(s)[0]*LEN.sh,k[1]+V(s)[1]*LEN.sh]];};
  const [e1,h1]=arm(p.a1,p.f1),[e2,h2]=arm(p.a2,p.f2),[k1,f1]=leg(p.t1,p.s1),[k2,f2]=leg(p.t2,p.s2);
  return{S,Hc,e1,h1,e2,h2,k1,f1,k2,f2};}
function footDrop(p){const j=joints(p);return Math.max(j.f1[1],j.f2[1],j.k1[1]+8,j.k2[1]+8)+5;}
function seg2(a,b,w){ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}
// kind: 'man','woman','rich','other'
function drawFig(x,y,dir,p,kind,opt={}){
  const j=joints(p);ctx.save();ctx.translate(x,y);ctx.scale(dir,1);
  ctx.fillStyle=ctx.strokeStyle=opt.col||C.fig;ctx.globalAlpha=opt.alpha??1;ctx.lineCap='round';ctx.lineJoin='round';
  const fem=kind==='woman'||kind==='other';
  // legs
  seg2([0,0],j.k2,20);seg2(j.k2,j.f2,15);seg2([0,0],j.k1,20);seg2(j.k1,j.f1,15);
  for(const f of [j.f1,j.f2]){ctx.beginPath();ctx.ellipse(f[0]+6,f[1]+2,11,6,0,0,7);ctx.fill();}
  // torso
  const up=[Math.sin(p.L),-Math.cos(p.L)],nx=[-up[1],up[0]];const hw=fem?13:15,sw=fem?15:19;
  ctx.beginPath();ctx.moveTo(nx[0]*hw,nx[1]*hw);ctx.lineTo(-nx[0]*hw,-nx[1]*hw);
  ctx.lineTo(j.S[0]-nx[0]*sw,j.S[1]-nx[1]*sw);ctx.quadraticCurveTo(j.S[0]+up[0]*10,j.S[1]+up[1]*10,j.S[0]+nx[0]*sw,j.S[1]+nx[1]*sw);ctx.closePath();ctx.fill();
  if(fem){// waist pinch + dress to the knees
    const wa=[up[0]*28,up[1]*28];const km=[(j.k1[0]+j.k2[0])/2,(j.k1[1]+j.k2[1])/2];const kd=[km[0]-wa[0],km[1]-wa[1]];const kl=Math.hypot(...kd)||1;const kn=[-kd[1]/kl,kd[0]/kl];
    const flare=kind==='other'?20:27;const hem=[wa[0]+kd[0]*1.1,wa[1]+kd[1]*1.1];
    ctx.beginPath();ctx.moveTo(wa[0]+nx[0]*12,wa[1]+nx[1]*12);ctx.lineTo(wa[0]-nx[0]*12,wa[1]-nx[1]*12);
    ctx.lineTo(hem[0]-kn[0]*flare,hem[1]-kn[1]*flare);ctx.quadraticCurveTo(hem[0]+kd[0]/kl*6,hem[1]+kd[1]/kl*6,hem[0]+kn[0]*flare,hem[1]+kn[1]*flare);ctx.closePath();ctx.fill();}
  // neck + head
  seg2(j.S,[j.S[0]+(j.Hc[0]-j.S[0])*0.5,j.S[1]+(j.Hc[1]-j.S[1])*0.5],11);
  ctx.beginPath();ctx.arc(j.Hc[0],j.Hc[1],LEN.head,0,7);ctx.fill();
  const hd=p.L+p.hl;const hu=[Math.sin(hd),-Math.cos(hd)],hn=[-hu[1],hu[0]];
  if(kind==='woman'){// long hair down the back
    ctx.beginPath();ctx.ellipse(j.Hc[0]-hn[0]*6-hu[0]*14,j.Hc[1]-hn[1]*6-hu[1]*14,13,28,Math.atan2(hu[1],hu[0])+Math.PI/2,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(j.Hc[0]-hn[0]*4+hu[0]*3,j.Hc[1]-hn[1]*4+hu[1]*3,LEN.head+2,0,7);ctx.fill();}
  if(kind==='other'){// high ponytail
    const pt=[j.Hc[0]+hu[0]*12-hn[0]*12,j.Hc[1]+hu[1]*12-hn[1]*12];ctx.beginPath();ctx.ellipse(pt[0]-hn[0]*10,pt[1]-hn[1]*10+8,8,20,0.5,0,7);ctx.fill();}
  if(kind==='rich'){// top hat
    ctx.save();ctx.translate(j.Hc[0]+hu[0]*12,j.Hc[1]+hu[1]*12);ctx.rotate(hd);ctx.fillRect(-24,-3,48,7);ctx.fillRect(-14,-36,28,36);ctx.restore();}
  if(kind==='man'){const ba=Math.atan2(hu[1],hu[0]);ctx.beginPath();ctx.arc(j.Hc[0]+hu[0]*3,j.Hc[1]+hu[1]*3,LEN.head+1.5,ba-Math.PI/2-0.2,ba+Math.PI/2+0.2);ctx.fill();}
  // arms (far then near)
  seg2(j.S,j.e2,13);seg2(j.e2,j.h2,11);ctx.beginPath();ctx.arc(j.h2[0],j.h2[1],7,0,7);ctx.fill();
  seg2(j.S,j.e1,14);seg2(j.e1,j.h1,11);ctx.beginPath();ctx.arc(j.h1[0],j.h1[1],7,0,7);ctx.fill();
  ctx.restore();
  // world hand positions
  return{h1:[x+dir*j.h1[0],y+j.h1[1]],h2:[x+dir*j.h2[0],y+j.h2[1]],head:[x+dir*j.Hc[0],y+j.Hc[1]],j};
}

// ---------- props ----------
function diamond(x,y,s,t,glow){ctx.save();ctx.translate(x,y);
  if(glow>0){ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(0,0,2,0,0,s*4);g.addColorStop(0,'rgba(255,255,255,'+(0.75*glow)+')');g.addColorStop(1,'rgba(160,220,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,s*4,0,7);ctx.fill();ctx.globalCompositeOperation='source-over';}
  const pts=[[-s,-s*0.35],[-s*0.55,-s*0.8],[s*0.55,-s*0.8],[s,-s*0.35],[0,s]];
  ctx.fillStyle='#dff3ff';ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fill();
  ctx.fillStyle='#9fd3f0';ctx.beginPath();ctx.moveTo(-s,-s*0.35);ctx.lineTo(0,s);ctx.lineTo(-s*0.3,-s*0.35);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ffffff';ctx.beginPath();ctx.moveTo(-s*0.55,-s*0.8);ctx.lineTo(-s*0.1,-s*0.35);ctx.lineTo(s*0.25,-s*0.8);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#4d8fb3';ctx.lineWidth=2;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.stroke();ctx.beginPath();ctx.moveTo(-s,-s*0.35);ctx.lineTo(s,-s*0.35);ctx.stroke();
  // twinkle star
  const tw=0.5+0.5*Math.sin(t*7);if(glow>0){ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(255,255,255,'+(0.6+0.4*tw)*glow+')';const r=s*(1.4+tw);ctx.beginPath();ctx.moveTo(s*0.5,-s*0.6-r);ctx.lineTo(s*0.5+3,-s*0.6-3);ctx.lineTo(s*0.5+r,-s*0.6);ctx.lineTo(s*0.5+3,-s*0.6+3);ctx.lineTo(s*0.5,-s*0.6+r);ctx.lineTo(s*0.5-3,-s*0.6+3);ctx.lineTo(s*0.5-r,-s*0.6);ctx.lineTo(s*0.5-3,-s*0.6-3);ctx.closePath();ctx.fill();}
  ctx.restore();}
function heart(x,y,s,glow){ctx.save();ctx.translate(x,y);
  if(glow>0){const g=ctx.createRadialGradient(0,0,2,0,0,s*3);g.addColorStop(0,'rgba(255,120,120,'+(0.45*glow)+')');g.addColorStop(1,'rgba(255,120,120,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,s*3,0,7);ctx.fill();}
  ctx.fillStyle=C.heart;ctx.beginPath();ctx.moveTo(0,s*0.9);ctx.bezierCurveTo(-s*1.4,-s*0.1,-s*0.7,-s*1.1,0,-s*0.4);ctx.bezierCurveTo(s*0.7,-s*1.1,s*1.4,-s*0.1,0,s*0.9);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.5)';ctx.beginPath();ctx.ellipse(-s*0.42,-s*0.38,s*0.18,s*0.1,-0.6,0,7);ctx.fill();ctx.restore();}
function pickaxe(h,ang,swingMotion){// h = hand, ang = handle direction from down (world, already dir-applied)
  const d=[Math.sin(ang),Math.cos(ang)],L=78,e=[h[0]+d[0]*L,h[1]+d[1]*L],n=[-d[1],d[0]];
  ctx.strokeStyle=C.fig;ctx.lineCap='round';seg2([h[0]-d[0]*14,h[1]-d[1]*14],e,8);
  ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(e[0]-n[0]*34-d[0]*6,e[1]-n[1]*34-d[1]*6);ctx.quadraticCurveTo(e[0]+d[0]*14,e[1]+d[1]*14,e[0]+n[0]*34-d[0]*6,e[1]+n[1]*34-d[1]*6);ctx.stroke();
  if(swingMotion>0){ctx.save();ctx.globalAlpha=0.25*swingMotion;ctx.strokeStyle=C.fig;ctx.lineWidth=3;ctx.beginPath();ctx.arc(h[0],h[1],L+20,Math.atan2(d[1],d[0])-1.0,Math.atan2(d[1],d[0])-0.1);ctx.stroke();ctx.restore();}
  return [e[0]+n[0]*34,e[1]+n[1]*34];}
function house(x,y,a){ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=C.line;ctx.lineWidth=3.5;ctx.fillStyle='rgba(8,36,82,0.35)';
  ctx.beginPath();ctx.rect(x,y-170,230,170);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(x-20,y-165);ctx.lineTo(x+115,y-260);ctx.lineTo(x+250,y-165);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.strokeRect(x+30,y-130,50,46);ctx.strokeRect(x+150,y-130,50,46);ctx.strokeRect(x+95,y-90,42,90);
  for(const [bx,s2] of [[x-40,1],[x+5,0.8]]){ctx.fillStyle=C.gold;ctx.beginPath();ctx.ellipse(bx,y-26*s2,28*s2,26*s2,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(bx-10*s2,y-50*s2);ctx.lineTo(bx+10*s2,y-50*s2);ctx.lineTo(bx+16*s2,y-62*s2);ctx.lineTo(bx-16*s2,y-62*s2);ctx.closePath();ctx.fill();
    ctx.fillStyle='#7a4a00';ctx.font='900 '+Math.round(30*s2)+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('$',bx,y-24*s2);}
  ctx.restore();}

// ---------- boulder + shatter ----------
const shards={};
function makeShards(key,R,n,seed){const r=rng(seed);const a=[];for(let i=0;i<n;i++){const ang=r()*Math.PI*2,rad=Math.sqrt(r())*R*0.92;a.push({x:Math.cos(ang)*rad,y:Math.sin(ang)*rad,s:R*0.12+r()*R*0.2,rot:r()*6,vx:-200-r()*700,vy:-500-r()*900,spin:(r()-0.5)*14,k:Math.floor(r()*5),g:r()});}shards[key]=a;}
makeShards('F',150,70,21);makeShards('T',205,90,22);
const SHATTER=24.25;

const KICK=['THE PROMISE','THE DEAL','BREAKING','HER ANSWER','THE TEST','HIS ANSWER','FINALLY'];
function drawNewsText(t){ctx.setTransform(1,0,0,1,0,0);ctx.textAlign='center';ctx.textBaseline='middle';
  LINES.forEach(([a,b,s,x,y],k)=>{if(t<a-0.01||t>b)return;const u=t===0&&a===0?1:easeOut(seg(t,a,a+0.16)),o=1-smooth(seg(t,b-0.14,b));const al=Math.min(u,o);if(al<=0)return;
    ctx.save();ctx.globalAlpha=al;ctx.translate(540,470);const sc=0.9+0.1*u;ctx.scale(sc,sc);
    ctx.font='400 30px "Elite"';const kw=ctx.measureText(KICK[k]).width+30;ctx.fillStyle=C.red;ctx.fillRect(-kw/2,-150,kw,44);ctx.fillStyle='#efe7d4';ctx.fillText(KICK[k],0,-127);
    ctx.font='900 82px "Playfair"';ctx.fillStyle=C.text;const ls=('\u201C'+s+'\u201D').split('\n');ls.forEach((l,i)=>{const yy=-40+i*92;ctx.lineWidth=12;ctx.strokeStyle='#efe7d4';ctx.lineJoin='round';ctx.strokeText(l,0,yy);ctx.fillText(l,0,yy);});ctx.restore();});
  if(t>25.25){const u=easeOut(seg(t,25.25,25.6));ctx.save();ctx.globalAlpha=u;ctx.translate(540,470);ctx.scale(0.9+0.1*u,0.9+0.1*u);ctx.font='900 118px "Playfair"';ctx.fillStyle=C.text;
    ['RESPECT','THIS WOMAN.'].forEach((l,i)=>{ctx.lineWidth=14;ctx.strokeStyle='#efe7d4';ctx.strokeText(l,0,(i-0.5)*128);ctx.fillText(l,0,(i-0.5)*128);});ctx.restore();}
  if(t>26.0){const u=easeOut(seg(t,26.0,26.4));ctx.save();ctx.globalAlpha=u;ctx.fillStyle='#efe7d4';ctx.fillRect(170,1278,740,150);ctx.strokeStyle=C.text;ctx.lineWidth=3;ctx.strokeRect(170,1278,740,150);ctx.fillStyle=C.text;ctx.font='900 58px "Playfair"';ctx.fillText('Follow Slow Light',540,1330);ctx.font='400 34px "Elite"';ctx.fillText('stories worth slowing down for',540,1392);ctx.restore();}}
function drawText(t){if(NEWS)return drawNewsText(t);ctx.setTransform(1,0,0,1,0,0);ctx.textAlign='center';ctx.textBaseline='middle';
  for(const [a,b,s,x,y] of LINES){if(t<a-0.01||t>b)continue;const u=t===0&&a===0?1:easeOut(seg(t,a,a+0.16)),o=1-smooth(seg(t,b-0.14,b));const al=Math.min(u,o);if(al<=0)continue;
    const sc=0.86+0.14*u;ctx.save();ctx.globalAlpha=al;ctx.translate(x,y);ctx.scale(sc,sc);ctx.font='800 84px '+FONT;
    const ls=s.split('\n');ls.forEach((l,i)=>{const yy=(i-(ls.length-1)/2)*96;ctx.lineWidth=14;ctx.strokeStyle=CHALK?'rgba(44,61,53,0.95)':'rgba(18,62,122,0.95)';ctx.lineJoin='round';ctx.strokeText(l,0,yy);ctx.fillStyle=C.text;ctx.fillText(l,0,yy);});ctx.restore();}
  // end card
  if(t>25.25){const u=easeOut(seg(t,25.25,25.6));ctx.save();ctx.globalAlpha=u;ctx.translate(540,420);ctx.scale(0.9+0.1*u,0.9+0.1*u);ctx.font='900 112px '+FONT;
    ['RESPECT','THIS WOMAN.'].forEach((l,i)=>{ctx.lineWidth=16;ctx.strokeStyle=CHALK?'rgba(44,61,53,0.95)':'rgba(18,62,122,0.95)';ctx.strokeText(l,0,(i-0.5)*124);ctx.fillStyle=C.text;ctx.fillText(l,0,(i-0.5)*124);});ctx.restore();}
  if(t>26.0){const u=easeOut(seg(t,26.0,26.4));ctx.save();ctx.globalAlpha=u;ctx.font='800 60px '+FONT;ctx.fillStyle=C.label;ctx.fillText('Follow Slow Light',540,1320+(1-u)*20);ctx.font='500 42px '+FONT;ctx.globalAlpha=u*0.85;ctx.fillText('stories worth slowing down for',540,1390+(1-u)*20);ctx.restore();}
}

// ---------- frame ----------
function renderAt(t){
  const c=camAt(t);const sh=shakeAt(t);const r=rng(Math.floor(t*60)+3);const ox=(r()-0.5)*sh,oy=(r()-0.5)*sh;
  drawSky(c);
  if(CHALK){ctx=LAY;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);}
  ctx.setTransform(c.z,0,0,c.z,540-c.x*c.z+ox,1000-c.y*c.z+oy);
  drawGrid(c);drawGround(t);
  // pit diamond (before he digs it out)
  if(t<12.8)diamond(PIT.x1-40,PIT.d-14,20,t,0.9);
  // boulders
  if(t>=2.6){
    const roll=t<3.0?seg(t,2.6,3.0):1;
    if(t>=7.95){const tr=t<8.25?seg(t,7.95,8.25):1;boulder(TRU,'Trust',t,(1-tr)*-4+Math.sin(t*0.7)*0.02,-(1-easeIn(tr))*900);}
    boulder(FAM,'Family',t,(1-roll)*-5+Math.sin(t*0.7)*0.02,-(1-easeIn(roll))*900+bShift(t));
    if(t>=2.98&&t<3.6){dust(boulderPos(FAM,t),t-2.98);} if(t>=8.23&&t<8.9){dust(boulderPos(TRU,t),t-8.23);}
  }
  rich(t);other(t);
  const WF=wife(t);husband(t);annotate(t,WF);
  if(t>=SHATTER&&t<SHATTER+0.3){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='rgba(235,245,255,'+(0.55*(1-seg(t,SHATTER,SHATTER+0.3)))+')';ctx.fillRect(0,0,W,H);}
  if(t>SHATTER){ctx.setTransform(c.z,0,0,c.z,540-c.x*c.z,1000-c.y*c.z);const u=smooth(seg(t,SHATTER,SHATTER+1.2));ctx.save();ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(-450,-260,20,-450,-260,700);g.addColorStop(0,'rgba(255,200,120,'+0.22*u+')');g.addColorStop(1,'rgba(255,200,120,0)');ctx.fillStyle=g;ctx.fillRect(-1600,-1300,2400,2400);ctx.restore();}
  ctx.setTransform(1,0,0,1,0,0);titleBlock(t);
  drawText(t);
  if(CHALK){// chalk texture: knock speckles out of the layer, boil at 12 fps, then lay it on the board
    const bf=Math.floor(t*12),rb=rng(bf*7+1);ctx=MAIN;
    LAY.setTransform(1,0,0,1,0,0);LAY.save();LAY.globalCompositeOperation='destination-out';LAY.drawImage(CHALKN,-((rb()*40)|0),-((rb()*40)|0));LAY.restore();
    MAIN.setTransform(1,0,0,1,0,0);MAIN.save();MAIN.shadowColor='rgba(255,255,255,0.18)';MAIN.shadowBlur=3;MAIN.drawImage(LAYC,(rb()-0.5)*2.4,(rb()-0.5)*2.4);MAIN.restore();}
}
let CHALKN=null;
function makeChalk(){CHALKN=document.createElement('canvas');CHALKN.width=1120;CHALKN.height=1960;const g=CHALKN.getContext('2d');const id=g.createImageData(1120,1960);const r=rng(13);const d=id.data;
  // grainy dropouts with short horizontal drag (chalk on slate)
  let run=0,ra=0;for(let i=0;i<d.length;i+=4){if(run<=0){run=r()<0.5?1:Math.floor(r()*5);ra=r()<0.36?Math.floor(140+r()*115):0;}run--;d[i]=d[i+1]=d[i+2]=0;d[i+3]=ra;}
  g.putImageData(id,0,0);}
function dust(p,v){const r=rng(77);ctx.fillStyle=NEWS?'rgba(28,26,23,0.25)':'rgba(234,243,255,0.35)';for(let i=0;i<14;i++){const a=Math.PI*(0.5+r()*0.9),sp=60+r()*160;const x=p.x+Math.cos(a)*(p.R*0.6+sp*v),y=p.y+p.R*0.9-sp*v*0.6*r();ctx.globalAlpha=clamp(0.5-v*0.8,0,1);ctx.beginPath();ctx.arc(x,y,8+r()*14+v*20,0,7);ctx.fill();}ctx.globalAlpha=1;}

function annotate(t,WF){
  if(t>=3.1&&t<SHATTER){const p=boulderPos(FAM,t,bShift(t));const al=smooth(seg(t,3.2,3.7));
    const over=t>=8.25;callout(p.x+p.R*0.55,p.y-p.R*0.8,p.x+p.R*0.55+120,p.y-p.R*0.8-150,over?'LOAD: 200%':'LOAD: 100%',al,over&&Math.sin(t*12)>-0.2&&t<10.5?C.red:null);
    // force vector from her hands into the boulder
    const hx=WF.h1[0],hy=WF.h1[1];const len=over?150:95;ctx.save();ctx.globalAlpha=al;ctx.strokeStyle=ctx.fillStyle=C.gold;ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(hx+len+10,hy+6);ctx.lineTo(hx+16,hy+6);ctx.stroke();arrowHead(hx+4,hy+6,Math.PI,26);
    ctx.font='800 42px '+MONO;ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText('F: HER',hx+30,hy+24);ctx.restore();}
  if(t>=8.25&&t<9.1){const p=boulderPos(TRU,t);callout(p.x+p.R*0.1,p.y-p.R*0.95,p.x+p.R*0.1+60,p.y-p.R-120,'+ TRUST',smooth(seg(t,8.35,8.6))*(1-smooth(seg(t,8.85,9.05))));}
  // offers and rejections
  if(t>7.35&&t<11.0){const a=smooth(seg(t,7.35,7.8))*(1-smooth(seg(t,10.7,11.0)));callout(320,-150,250,-330,'OFFER: EASY LIFE',a);
    stamp(165,-110,'REJECTED',seg(t,9.15,9.4)*(1-smooth(seg(t,10.7,11.0))),-0.18);}
  if(t>14.3&&t<20.75){const a=smooth(seg(t,14.3,14.8))*(1-smooth(seg(t,20.4,20.75)));callout(345,-170,270,-340,'OFFER: "BETTER"',a);
    stamp(185,-120,'REJECTED',seg(t,18.85,19.1)*(1-smooth(seg(t,20.4,20.75))),0.16);}
  if(t>13.0&&t<14.4){callout(150,170,-40,40,'RESULT: FOUND',smooth(seg(t,13.0,13.4))*(1-smooth(seg(t,14.1,14.4))),C.gold);}
  if(t>SHATTER+0.6){const u=seg(t,25.0,25.25);stamp(-215,-330,NEWS?'TRUE STORY':'APPROVED',u,-0.12);}
}
function titleBlock(t){if(NEWS)return;if(false){ctx.save();ctx.fillStyle='#efe7d4';ctx.fillRect(40,1560,1000,120);ctx.fillStyle='#1c1a17';ctx.fillRect(40,1560,1000,4);ctx.fillRect(40,1676,1000,2);ctx.font='400 30px "Elite"';ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillText('CONTINUED IN EVERY HOME  ▸  PAGE 1',60,1600);ctx.globalAlpha=0.7;ctx.font='400 26px "Elite"';ctx.fillText('Behind every man who made it, someone held everything.',60,1645);ctx.restore();return;}
  if(CHALK){ctx.save();ctx.fillStyle=ctx.strokeStyle='rgba(243,241,234,0.9)';ctx.font='700 46px '+MONO;ctx.textAlign='left';ctx.textBaseline='alphabetic';
    ctx.fillText('Lesson 1: Respect',120,1590);ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(118,1606);ctx.quadraticCurveTo(300,1600,520,1610);ctx.stroke();
    ctx.globalAlpha=0.75;ctx.font='700 36px '+MONO;ctx.fillText('Homework: say thank you to her today.',120,1666);ctx.restore();return;}const y0=1540,x0=110,x1=970,h=150;ctx.save();ctx.strokeStyle=ctx.fillStyle='rgba(234,243,255,0.85)';ctx.lineWidth=3;ctx.strokeRect(x0,y0,x1-x0,h);
  ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x0,y0+h/2);ctx.lineTo(x1,y0+h/2);ctx.moveTo(x0+520,y0);ctx.lineTo(x0+520,y0+h);ctx.stroke();
  ctx.font='600 22px '+MONO;ctx.textBaseline='top';ctx.textAlign='left';ctx.globalAlpha=0.7;ctx.fillText('PROJECT',x0+14,y0+10);ctx.fillText('SHEET',x0+534,y0+10);ctx.fillText('DRAWN BY',x0+14,y0+h/2+10);ctx.fillText('SCALE',x0+534,y0+h/2+10);
  ctx.globalAlpha=1;ctx.font='800 32px '+MONO;ctx.fillText('A MARRIAGE',x0+14,y0+36);ctx.fillText('01 / 01',x0+534,y0+36);ctx.fillText('SLOW LIGHT',x0+14,y0+h/2+36);ctx.fillText('1 : 1 LIFE',x0+534,y0+h/2+36);ctx.restore();}
// events for SFX (pickaxe strikes etc.)
function digPh(t){return t<11?(t-6)/0.82:5/0.82+(t-11)/0.62;}
function events(){const ev=[];let last=0;for(let t=6.0;t<12.75;t+=1/240){const ph=digPh(t)%1;if(ph>=0.78&&last<0.78)ev.push(['hit',+t.toFixed(3)]);last=ph;}return ev;}
makeGrain();if(CHALK)makeChalk();makeHalftone();
window.renderAt=renderAt;window.DUR=DUR;window.EVENTS=events();
(CHALK?document.fonts.load('700 84px "Kalam"'):NEWS?Promise.all([document.fonts.load('900 82px "Playfair"'),document.fonts.load('30px "Elite"'),document.fonts.load('700 92px "Fraktur"')]):Promise.resolve()).then(()=>document.fonts.load('800 84px "Inter Display"')).then(()=>document.fonts.load('900 112px "Inter Display"')).then(()=>{renderAt(0);window.READY=true;});
</script>
