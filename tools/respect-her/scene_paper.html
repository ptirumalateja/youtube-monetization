<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// "Respect this woman" replica for Slow Light: paper-cut silhouettes, warm cream sky, deep teal paper ground.
// Beat times are matched to the ref (25 s) + a 2.6 s end card.
const W=1080,H=1920,DUR=27.6;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const FONT='"Inter Display","Inter",sans-serif';
const C={sky0:'#f7f0e3',sky1:'#f0dfc3',hill1:'#c9d8cf',hill2:'#a9c3bb',ground:'#1f4f5a',ground2:'#1a4550',fig:'#173f49',pit:'#e7d3b4',pitShade:'#d9c09b',
  label:'#f7f0e3',text:'#173f49',gold:'#f2b632',heart:'#e5484d'};

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,u)=>a+(b-a)*u,smooth=u=>u*u*(3-2*u);
const easeOut=u=>1-Math.pow(1-u,3),easeIn=u=>u*u*u;
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);

// ---------- world ----------
const PIT={x0:0,x1:270,d:360};           // pit interior x0..x1, floor at y=d
const SLOPE_X=-250;                      // left plateau rises to the left of this
function slopeAng(t){return 0.38*smooth(seg(t,2.55,3.05))*(1-smooth(seg(t,24.6,25.6))*0);}
function groundAt(x,t){if(x<SLOPE_X)return (x-SLOPE_X)*Math.tan(slopeAng(t));if(x<PIT.x0||x>PIT.x1)return 0;return PIT.d;}
// boulders: contact x on slope, radius
const FAM={x:-480,R:150}, TRU={x:-720,R:205};
function boulderPos(b,t,extra){const a=slopeAng(t);const cx=b.x+(extra||0);const gy=groundAt(cx,t);return{x:cx-Math.sin(a)*b.R,y:gy-Math.cos(a)*b.R,R:b.R};}

// ---------- precomputed ----------
const Rg=rng(5);
const tufts=[];for(let x=-2000;x<2400;x+=9+Rg()*12)tufts.push([x,6+Rg()*16,Rg()*0.6-0.3]);
const pebbles=[];for(let i=0;i<160;i++)pebbles.push([-2000+Rg()*4400,90+Rg()*1400,4+Rg()*12,Rg()]);
const strata=[];for(let i=0;i<7;i++)strata.push([480+i*170+Rg()*60,Rg()*6,20+Rg()*30]);
const gems=[];for(let i=0;i<14;i++)gems.push([-900+Rg()*2200,560+Rg()*900,8+Rg()*8,Rg()]);
let grain=null;
function makeGrain(){grain=document.createElement('canvas');grain.width=540;grain.height=960;const g=grain.getContext('2d');const id=g.createImageData(540,960);const r=rng(9);
  for(let i=0;i<id.data.length;i+=4){const v=Math.floor(110+r()*90);id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255;}g.putImageData(id,0,0);}

// ---------- camera (world point cx,cy -> screen 540,1000) ----------
const CAM=[
 [0,30,50,1.30],[1.9,40,60,1.33],[2.55,60,120,1.33],[3.05,-275,-60,0.74],[8.8,-275,-60,0.75],
 [9.25,-305,-80,0.79],[10.6,-305,-80,0.80],[11.0,-275,-60,0.75],[12.6,-275,-60,0.75],
 [13.1,-260,-40,0.78],[20.35,-260,-40,0.79],[20.8,-275,-60,0.76],
 [22.2,-290,-60,0.78],[24.2,-320,-80,0.84],[24.8,-300,-60,0.9],[27.6,-240,-100,1.45]];
function camAt(t){let i=CAM.length-1;for(let j=1;j<CAM.length;j++){if(t<CAM[j][0]){i=j;break;}}
  if(t>=CAM[CAM.length-1][0]){const k=CAM[CAM.length-1];return{x:k[1],y:k[2],z:k[3]};}
  const a=CAM[i-1],b=CAM[i],u=smooth((t-a[0])/(b[0]-a[0]));
  return{x:lerp(a[1],b[1],u),y:lerp(a[2],b[2],u),z:Math.exp(lerp(Math.log(a[3]),Math.log(b[3]),u))};}
function shakeAt(t){let s=0;for(const [t0,amp] of [[3.0,10],[8.25,22],[24.25,26]]){const v=t-t0;if(v>=0&&v<0.5)s+=amp*(1-v/0.5);}return s;}

// ---------- figure rig ----------
// angles are absolute, measured from straight down, positive = toward facing direction
const BASE={L:0.02,hl:0,a1:0.08,f1:0.05,a2:-0.06,f2:-0.04,t1:0.06,s1:0.02,t2:-0.06,s2:-0.03};
const P={
 stand:BASE,
 give:{L:0.06,hl:0.12,a1:0.9,f1:1.35,a2:0.7,f2:1.2,t1:0.08,s1:0.02,t2:-0.08,s2:-0.04},
 take:{L:-0.02,hl:0.05,a1:0.8,f1:1.2,a2:0.2,f2:0.15,t1:0.06,s1:0.02,t2:-0.07,s2:-0.03},
 crouch:{L:0.55,hl:0.3,a1:-0.5,f1:-0.3,a2:-0.7,f2:-0.5,t1:1.35,s1:-0.2,t2:1.1,s2:-0.35},
 jump:{L:0.25,hl:0.1,a1:2.6,f1:2.9,a2:2.3,f2:2.6,t1:0.5,s1:-0.3,t2:-0.3,s2:-0.6},
 push:{L:1.0,hl:-0.35,a1:1.62,f1:1.7,a2:1.48,f2:1.58,t1:0.75,s1:-0.05,t2:-0.42,s2:-0.62},
 pushHard:{L:1.12,hl:-0.45,a1:1.75,f1:1.8,a2:1.6,f2:1.68,t1:0.9,s1:0.0,t2:-0.55,s2:-0.72},
 lookUp:{L:-0.12,hl:-0.6,a1:0.1,f1:0.05,a2:-0.05,f2:-0.1,t1:0.05,s1:0.0,t2:-0.06,s2:-0.03},
 wave:{L:-0.14,hl:-0.6,a1:2.7,f1:2.95,a2:-0.05,f2:-0.1,t1:0.05,s1:0.0,t2:-0.06,s2:-0.03},
 holdUp:{L:-0.1,hl:-0.55,a1:2.85,f1:3.05,a2:0.3,f2:0.6,t1:0.08,s1:0.0,t2:-0.1,s2:-0.05},
 holdBoth:{L:0.05,hl:0.25,a1:0.6,f1:1.5,a2:0.5,f2:1.45,t1:0.06,s1:0.02,t2:-0.07,s2:-0.03},
 throwUp:{L:-0.15,hl:-0.6,a1:2.5,f1:2.7,a2:0.3,f2:0.6,t1:0.08,s1:0.0,t2:-0.1,s2:-0.05},
 gesture:{L:0.04,hl:0.3,a1:1.3,f1:1.6,a2:-0.05,f2:-0.05,t1:0.06,s1:0.02,t2:-0.06,s2:-0.03},
 toss:{L:0.08,hl:0.35,a1:1.5,f1:1.9,a2:-0.1,f2:-0.05,t1:0.06,s1:0.02,t2:-0.06,s2:-0.03},
 lookDown:{L:0.06,hl:0.45,a1:0.1,f1:0.05,a2:-0.1,f2:-0.05,t1:0.06,s1:0.02,t2:-0.06,s2:-0.03},
 kneel:{L:0.15,hl:-0.35,a1:1.9,f1:2.4,a2:0.3,f2:0.5,t1:1.55,s1:0.0,t2:0.1,s2:-1.5},
 climb:{L:0.4,hl:-0.3,a1:2.9,f1:3.1,a2:2.6,f2:2.9,t1:1.2,s1:-0.2,t2:-0.1,s2:-0.3},
};
function mix(a,b,u){const o={};for(const k in BASE)o[k]=lerp(a[k],b[k],u);return o;}
// pose track: [[t,poseName or object],...] eased between keys
function track(keys,t){if(t<=keys[0][0])return P[keys[0][1]]||keys[0][1];
  for(let i=1;i<keys.length;i++){if(t<keys[i][0]){const a=P[keys[i-1][1]]||keys[i-1][1],b=P[keys[i][1]]||keys[i][1];return mix(a,b,smooth((t-keys[i-1][0])/(keys[i][0]-keys[i-1][0])));}}
  const k=keys[keys.length-1][1];return P[k]||k;}
function pwv(keys,t){if(t<=keys[0][0])return keys[0][1];for(let i=1;i<keys.length;i++){if(t<keys[i][0]){const u=smooth((t-keys[i-1][0])/(keys[i][0]-keys[i-1][0]));return lerp(keys[i-1][1],keys[i][1],u);}}return keys[keys.length-1][1];}

const LEN={torso:72,neck:10,head:17,ua:38,fa:36,th:50,sh:52};
const V=a=>[Math.sin(a),Math.cos(a)];
function joints(p){// local coords: hip at origin, facing +x
  const up=[Math.sin(p.L),-Math.cos(p.L)];const S=[up[0]*LEN.torso,up[1]*LEN.torso];
  const hd=p.L+p.hl;const Hc=[S[0]+Math.sin(hd)*(LEN.neck+LEN.head),S[1]-Math.cos(hd)*(LEN.neck+LEN.head)];
  const arm=(a,f)=>{const e=[S[0]+V(a)[0]*LEN.ua,S[1]+V(a)[1]*LEN.ua];return[e,[e[0]+V(f)[0]*LEN.fa,e[1]+V(f)[1]*LEN.fa]];};
  const leg=(a,s)=>{const k=[V(a)[0]*LEN.th,V(a)[1]*LEN.th];return[k,[k[0]+V(s)[0]*LEN.sh,k[1]+V(s)[1]*LEN.sh]];};
  const [e1,h1]=arm(p.a1,p.f1),[e2,h2]=arm(p.a2,p.f2),[k1,f1]=leg(p.t1,p.s1),[k2,f2]=leg(p.t2,p.s2);
  return{S,Hc,e1,h1,e2,h2,k1,f1,k2,f2};}
function footDrop(p){const j=joints(p);return Math.max(j.f1[1],j.f2[1],j.k1[1]+8,j.k2[1]+8)+5;}
function seg2(a,b,w){ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}
// kind: 'man','woman','rich','other'
function drawFig(x,y,dir,p,kind,opt={}){
  const j=joints(p);ctx.save();ctx.translate(x,y);ctx.scale(dir,1);
  ctx.fillStyle=ctx.strokeStyle=opt.col||C.fig;ctx.globalAlpha=opt.alpha??1;ctx.lineCap='round';ctx.lineJoin='round';
  const fem=kind==='woman'||kind==='other';
  // legs
  seg2([0,0],j.k2,20);seg2(j.k2,j.f2,15);seg2([0,0],j.k1,20);seg2(j.k1,j.f1,15);
  for(const f of [j.f1,j.f2]){ctx.beginPath();ctx.ellipse(f[0]+6,f[1]+2,11,6,0,0,7);ctx.fill();}
  // torso
  const up=[Math.sin(p.L),-Math.cos(p.L)],nx=[-up[1],up[0]];const hw=fem?13:15,sw=fem?15:19;
  ctx.beginPath();ctx.moveTo(nx[0]*hw,nx[1]*hw);ctx.lineTo(-nx[0]*hw,-nx[1]*hw);
  ctx.lineTo(j.S[0]-nx[0]*sw,j.S[1]-nx[1]*sw);ctx.quadraticCurveTo(j.S[0]+up[0]*10,j.S[1]+up[1]*10,j.S[0]+nx[0]*sw,j.S[1]+nx[1]*sw);ctx.closePath();ctx.fill();
  if(fem){// waist pinch + dress to the knees
    const wa=[up[0]*28,up[1]*28];const km=[(j.k1[0]+j.k2[0])/2,(j.k1[1]+j.k2[1])/2];const kd=[km[0]-wa[0],km[1]-wa[1]];const kl=Math.hypot(...kd)||1;const kn=[-kd[1]/kl,kd[0]/kl];
    const flare=kind==='other'?20:27;const hem=[wa[0]+kd[0]*1.1,wa[1]+kd[1]*1.1];
    ctx.beginPath();ctx.moveTo(wa[0]+nx[0]*12,wa[1]+nx[1]*12);ctx.lineTo(wa[0]-nx[0]*12,wa[1]-nx[1]*12);
    ctx.lineTo(hem[0]-kn[0]*flare,hem[1]-kn[1]*flare);ctx.quadraticCurveTo(hem[0]+kd[0]/kl*6,hem[1]+kd[1]/kl*6,hem[0]+kn[0]*flare,hem[1]+kn[1]*flare);ctx.closePath();ctx.fill();}
  // neck + head
  seg2(j.S,[j.S[0]+(j.Hc[0]-j.S[0])*0.5,j.S[1]+(j.Hc[1]-j.S[1])*0.5],11);
  ctx.beginPath();ctx.arc(j.Hc[0],j.Hc[1],LEN.head,0,7);ctx.fill();
  const hd=p.L+p.hl;const hu=[Math.sin(hd),-Math.cos(hd)],hn=[-hu[1],hu[0]];
  if(kind==='woman'){// long hair down the back
    ctx.beginPath();ctx.ellipse(j.Hc[0]-hn[0]*6-hu[0]*14,j.Hc[1]-hn[1]*6-hu[1]*14,13,28,Math.atan2(hu[1],hu[0])+Math.PI/2,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(j.Hc[0]-hn[0]*4+hu[0]*3,j.Hc[1]-hn[1]*4+hu[1]*3,LEN.head+2,0,7);ctx.fill();}
  if(kind==='other'){// high ponytail
    const pt=[j.Hc[0]+hu[0]*12-hn[0]*12,j.Hc[1]+hu[1]*12-hn[1]*12];ctx.beginPath();ctx.ellipse(pt[0]-hn[0]*10,pt[1]-hn[1]*10+8,8,20,0.5,0,7);ctx.fill();}
  if(kind==='rich'){// top hat
    ctx.save();ctx.translate(j.Hc[0]+hu[0]*12,j.Hc[1]+hu[1]*12);ctx.rotate(hd);ctx.fillRect(-24,-3,48,7);ctx.fillRect(-14,-36,28,36);ctx.restore();}
  if(kind==='man'){const ba=Math.atan2(hu[1],hu[0]);ctx.beginPath();ctx.arc(j.Hc[0]+hu[0]*3,j.Hc[1]+hu[1]*3,LEN.head+1.5,ba-Math.PI/2-0.2,ba+Math.PI/2+0.2);ctx.fill();}
  // arms (far then near)
  seg2(j.S,j.e2,13);seg2(j.e2,j.h2,11);ctx.beginPath();ctx.arc(j.h2[0],j.h2[1],7,0,7);ctx.fill();
  seg2(j.S,j.e1,14);seg2(j.e1,j.h1,11);ctx.beginPath();ctx.arc(j.h1[0],j.h1[1],7,0,7);ctx.fill();
  ctx.restore();
  // world hand positions
  return{h1:[x+dir*j.h1[0],y+j.h1[1]],h2:[x+dir*j.h2[0],y+j.h2[1]],head:[x+dir*j.Hc[0],y+j.Hc[1]],j};
}

// ---------- props ----------
function diamond(x,y,s,t,glow){ctx.save();ctx.translate(x,y);
  if(glow>0){ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(0,0,2,0,0,s*4);g.addColorStop(0,'rgba(255,255,255,'+(0.75*glow)+')');g.addColorStop(1,'rgba(160,220,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,s*4,0,7);ctx.fill();ctx.globalCompositeOperation='source-over';}
  const pts=[[-s,-s*0.35],[-s*0.55,-s*0.8],[s*0.55,-s*0.8],[s,-s*0.35],[0,s]];
  ctx.fillStyle='#dff3ff';ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fill();
  ctx.fillStyle='#9fd3f0';ctx.beginPath();ctx.moveTo(-s,-s*0.35);ctx.lineTo(0,s);ctx.lineTo(-s*0.3,-s*0.35);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ffffff';ctx.beginPath();ctx.moveTo(-s*0.55,-s*0.8);ctx.lineTo(-s*0.1,-s*0.35);ctx.lineTo(s*0.25,-s*0.8);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#4d8fb3';ctx.lineWidth=2;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.stroke();ctx.beginPath();ctx.moveTo(-s,-s*0.35);ctx.lineTo(s,-s*0.35);ctx.stroke();
  // twinkle star
  const tw=0.5+0.5*Math.sin(t*7);if(glow>0){ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(255,255,255,'+(0.6+0.4*tw)*glow+')';const r=s*(1.4+tw);ctx.beginPath();ctx.moveTo(s*0.5,-s*0.6-r);ctx.lineTo(s*0.5+3,-s*0.6-3);ctx.lineTo(s*0.5+r,-s*0.6);ctx.lineTo(s*0.5+3,-s*0.6+3);ctx.lineTo(s*0.5,-s*0.6+r);ctx.lineTo(s*0.5-3,-s*0.6+3);ctx.lineTo(s*0.5-r,-s*0.6);ctx.lineTo(s*0.5-3,-s*0.6-3);ctx.closePath();ctx.fill();}
  ctx.restore();}
function heart(x,y,s,glow){ctx.save();ctx.translate(x,y);
  if(glow>0){const g=ctx.createRadialGradient(0,0,2,0,0,s*3);g.addColorStop(0,'rgba(255,120,120,'+(0.45*glow)+')');g.addColorStop(1,'rgba(255,120,120,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,s*3,0,7);ctx.fill();}
  ctx.fillStyle=C.heart;ctx.beginPath();ctx.moveTo(0,s*0.9);ctx.bezierCurveTo(-s*1.4,-s*0.1,-s*0.7,-s*1.1,0,-s*0.4);ctx.bezierCurveTo(s*0.7,-s*1.1,s*1.4,-s*0.1,0,s*0.9);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.5)';ctx.beginPath();ctx.ellipse(-s*0.42,-s*0.38,s*0.18,s*0.1,-0.6,0,7);ctx.fill();ctx.restore();}
function pickaxe(h,ang,swingMotion){// h = hand, ang = handle direction from down (world, already dir-applied)
  const d=[Math.sin(ang),Math.cos(ang)],L=78,e=[h[0]+d[0]*L,h[1]+d[1]*L],n=[-d[1],d[0]];
  ctx.strokeStyle=C.fig;ctx.lineCap='round';seg2([h[0]-d[0]*14,h[1]-d[1]*14],e,8);
  ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(e[0]-n[0]*34-d[0]*6,e[1]-n[1]*34-d[1]*6);ctx.quadraticCurveTo(e[0]+d[0]*14,e[1]+d[1]*14,e[0]+n[0]*34-d[0]*6,e[1]+n[1]*34-d[1]*6);ctx.stroke();
  if(swingMotion>0){ctx.save();ctx.globalAlpha=0.25*swingMotion;ctx.strokeStyle=C.fig;ctx.lineWidth=3;ctx.beginPath();ctx.arc(h[0],h[1],L+20,Math.atan2(d[1],d[0])-1.0,Math.atan2(d[1],d[0])-0.1);ctx.stroke();ctx.restore();}
  return [e[0]+n[0]*34,e[1]+n[1]*34];}
function house(x,y,a){ctx.save();ctx.globalAlpha=a;ctx.fillStyle='#6f9c9a';ctx.fillRect(x,y-170,230,170);ctx.beginPath();ctx.moveTo(x-20,y-165);ctx.lineTo(x+115,y-260);ctx.lineTo(x+250,y-165);ctx.closePath();ctx.fill();
  ctx.fillStyle='#f6d98f';ctx.fillRect(x+30,y-130,50,46);ctx.fillRect(x+150,y-130,50,46);ctx.fillStyle='#4c7674';ctx.fillRect(x+95,y-90,42,90);
  // money bags
  for(const [bx,s] of [[x-40,1],[x+5,0.8]]){ctx.fillStyle=C.gold;ctx.beginPath();ctx.ellipse(bx,y-26*s,28*s,26*s,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(bx-10*s,y-50*s);ctx.lineTo(bx+10*s,y-50*s);ctx.lineTo(bx+16*s,y-62*s);ctx.lineTo(bx-16*s,y-62*s);ctx.closePath();ctx.fill();
    ctx.fillStyle='#8a5d12';ctx.font='900 '+Math.round(30*s)+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('$',bx,y-24*s);}
  ctx.restore();}

// ---------- boulder + shatter ----------
const shards={};
function makeShards(key,R,n,seed){const r=rng(seed);const a=[];for(let i=0;i<n;i++){const ang=r()*Math.PI*2,rad=Math.sqrt(r())*R*0.92;a.push({x:Math.cos(ang)*rad,y:Math.sin(ang)*rad,s:R*0.12+r()*R*0.2,rot:r()*6,vx:-200-r()*700,vy:-500-r()*900,spin:(r()-0.5)*14,k:Math.floor(r()*5),g:r()});}shards[key]=a;}
makeShards('F',150,70,21);makeShards('T',205,90,22);
const SHATTER=24.25;
function boulder(b,label,t,rot,extra){const p=boulderPos(b,t,extra);
  if(t<SHATTER){ctx.save();ctx.translate(p.x,p.y);
    // drop shadow (paper)
    ctx.fillStyle='rgba(10,30,35,0.18)';ctx.beginPath();ctx.arc(6,8,p.R,0,7);ctx.fill();
    ctx.rotate(rot);ctx.fillStyle=C.ground;const r=rng(label.length*7);ctx.beginPath();for(let i=0;i<=24;i++){const a=i/24*Math.PI*2,rr=p.R*(0.97+0.05*Math.sin(i*2.3+label.length));ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.07)';ctx.lineWidth=6;ctx.beginPath();ctx.arc(-p.R*0.15,-p.R*0.15,p.R*0.7,3.3,4.6);ctx.stroke();
    for(let i=0;i<5;i++){ctx.fillStyle='rgba(0,0,0,0.08)';ctx.beginPath();ctx.ellipse((r()-0.5)*p.R*1.2,(r()-0.5)*p.R*1.2,8+r()*14,5+r()*8,r()*3,0,7);ctx.fill();}
    ctx.restore();
    ctx.fillStyle=C.label;ctx.font='800 '+Math.round(p.R*0.36)+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,p.x,p.y-p.R*0.05);
  }else{const v=t-SHATTER;const arr=shards[label==='Family'?'F':'T'];const cols=[C.ground,C.ground2,'#2d6a73',C.gold,'#f7f0e3'];
    for(const s of arr){const fx=p.x+s.x+s.vx*v*0.9,fy=p.y+s.y+s.vy*v+700*v*v*0.55;const a=clamp(1-v/1.6,0,1);if(a<=0)continue;
      ctx.save();ctx.globalAlpha=a;ctx.translate(fx,fy);ctx.rotate(s.rot+s.spin*v);const goldMix=smooth(seg(v,0.05,0.6));ctx.fillStyle=goldMix>s.g?cols[3+(s.k%2)]:cols[s.k%3];
      ctx.beginPath();ctx.moveTo(-s.s,-s.s*0.3);ctx.lineTo(s.s*0.4,-s.s*0.8);ctx.lineTo(s.s,s.s*0.5);ctx.lineTo(-s.s*0.2,s.s*0.7);ctx.closePath();ctx.fill();ctx.restore();}}
  return p;}

// ---------- landscape ----------
function drawSky(c){ctx.setTransform(1,0,0,1,0,0);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,C.sky0);g.addColorStop(0.55,C.sky1);g.addColorStop(1,'#e9cfa8');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // sun glow
  const sx=780-c.x*0.05,sy=760-c.y*0.05;const sg=ctx.createRadialGradient(sx,sy,10,sx,sy,520);sg.addColorStop(0,'rgba(255,214,150,0.85)');sg.addColorStop(0.25,'rgba(255,214,150,0.35)');sg.addColorStop(1,'rgba(255,214,150,0)');ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,236,200,0.95)';ctx.beginPath();ctx.arc(sx,sy,95,0,7);ctx.fill();
  // distant paper hills with parallax
  for(const [col,par,base,amp,f] of [[C.hill1,0.25,930,60,0.004],[C.hill2,0.45,990,45,0.006]]){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,H);
    for(let x=0;x<=W;x+=20){const wx=x/c.z+(c.x*par);ctx.lineTo(x,base-(c.y*par*0.4)+Math.sin(wx*f)*amp+Math.sin(wx*f*2.7+1)*amp*0.4);}ctx.lineTo(W,H);ctx.closePath();
    ctx.save();ctx.shadowColor='rgba(60,50,30,0.12)';ctx.shadowBlur=14;ctx.shadowOffsetY=-3;ctx.fill();ctx.restore();}}
function groundPath(t){const a=slopeAng(t);ctx.beginPath();ctx.moveTo(-3000,3000);ctx.lineTo(-3000,(-3000-SLOPE_X)*Math.tan(a));ctx.lineTo(SLOPE_X,0);ctx.lineTo(PIT.x0,0);
  // ragged pit walls
  ctx.lineTo(PIT.x0+4,PIT.d*0.3);ctx.lineTo(PIT.x0-3,PIT.d*0.6);ctx.lineTo(PIT.x0+2,PIT.d);ctx.lineTo(PIT.x1-2,PIT.d);ctx.lineTo(PIT.x1+3,PIT.d*0.55);ctx.lineTo(PIT.x1-2,PIT.d*0.25);ctx.lineTo(PIT.x1,0);
  ctx.lineTo(3000,0);ctx.lineTo(3000,3000);ctx.closePath();}
function drawGround(t){
  // pit interior (back wall, darker paper)
  ctx.fillStyle=C.pit;ctx.fillRect(PIT.x0-5,-5,PIT.x1-PIT.x0+10,PIT.d+10);const pg=ctx.createLinearGradient(0,0,0,PIT.d);pg.addColorStop(0,'rgba(0,0,0,0)');pg.addColorStop(1,'rgba(90,60,20,0.25)');ctx.fillStyle=pg;ctx.fillRect(PIT.x0-5,-5,PIT.x1-PIT.x0+10,PIT.d+10);
  ctx.save();ctx.shadowColor='rgba(20,30,30,0.35)';ctx.shadowBlur=22;ctx.shadowOffsetY=-6;groundPath(t);ctx.fillStyle=C.ground;ctx.fill();ctx.restore();
  ctx.save();groundPath(t);ctx.clip();
  // strata + pebbles + buried gems
  const a=slopeAng(t);
  for(const s of strata){ctx.strokeStyle='rgba(0,0,0,0.12)';ctx.lineWidth=s[2]*0.3;ctx.beginPath();for(let x=-2000;x<=2400;x+=40){ctx.lineTo(x,s[0]+Math.sin(x*0.004+s[1])*24);}ctx.stroke();}
  for(const p of pebbles){ctx.fillStyle=p[3]<0.5?'rgba(0,0,0,0.13)':'rgba(255,255,255,0.05)';ctx.beginPath();ctx.ellipse(p[0],p[1],p[2],p[2]*0.6,p[3]*3,0,7);ctx.fill();}
  for(const g of gems){ctx.globalAlpha=0.35+0.35*Math.sin(t*2+g[3]*20);diamond(g[0],g[1],g[2],t,0);ctx.globalAlpha=1;}
  // lighter top lip of the paper layer
  ctx.restore();
  ctx.strokeStyle='#2a6470';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-3000,(-3000-SLOPE_X)*Math.tan(a)+2);ctx.lineTo(SLOPE_X,2);ctx.lineTo(PIT.x0,2);ctx.moveTo(PIT.x1,2);ctx.lineTo(3000,2);ctx.stroke();
  // grass tufts on the surface
  ctx.fillStyle=C.ground;for(const q of tufts){if(q[0]>PIT.x0-6&&q[0]<PIT.x1+6)continue;const gy=groundAt(q[0],t);ctx.beginPath();ctx.moveTo(q[0]-4,gy+2);ctx.lineTo(q[0]+q[2]*10,gy-q[1]);ctx.lineTo(q[0]+4,gy+2);ctx.closePath();ctx.fill();}
  // BUSINESS label on pit floor
  ctx.fillStyle=C.label;ctx.font='800 40px '+FONT;ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText('Business',(PIT.x0+PIT.x1)/2,PIT.d+16);
}

// ---------- characters ----------
// husband
const HX=[[0,-120],[1.8,-120],[2.05,-40],[2.32,90],[3,90],[3.2,70],[6.0,70],[6.2,120],[20.45,120],[20.75,20],[21.0,-110],[21.3,-160],[24.9,-160],[25.4,-185]];
function husband(t){
  let dir=-1,pose,y,x=pwv(HX,t),dig=false,holdD=false,holdH=false;
  if(t<1.75){pose=track([[0,'give'],[0.9,'give'],[1.3,'holdBoth'],[1.75,'give']],t);dir=-1;}
  else if(t<2.32){dir=1;const u=seg(t,1.75,2.32);pose=u<0.35?mix(P.give,P.crouch,smooth(u/0.35)):mix(P.jump,P.crouch,smooth(seg(u,0.75,1)));}
  else if(t<3.15){dir=1;pose=mix(P.crouch,P.stand,smooth(seg(t,2.32,2.7)));}
  else if(t<6.0){dir=-1;pose=track([[3.15,'lookUp'],[3.4,'wave'],[3.62,'lookUp'],[3.85,'wave'],[4.1,'lookUp'],[5.6,'lookUp'],[6.0,'stand']],t);}
  else if(t<12.75){dir=1;dig=true;}
  else if(t<14.9){dir=1;pose=track([[12.75,'holdBoth'],[13.05,'holdUp'],[14.6,'holdUp'],[14.9,'lookUp']],t);holdD=t>12.8;}
  else if(t<17.4){dir=1;pose=track([[14.9,'lookUp'],[15.1,'holdBoth']],t);holdD=true;holdH=t>15.0;}
  else if(t<18.35){dir=1;pose=track([[17.4,'holdBoth'],[17.75,'throwUp'],[18.0,'lookUp'],[18.35,'holdUp']],t);holdD=true;holdH=t<17.85;}
  else if(t<20.45){dir=1;pose=track([[18.35,'holdUp'],[20.0,'holdUp'],[20.45,'climb']],t);holdD=true;}
  else if(t<21.3){dir=-1;const u=seg(t,20.45,21.0);pose=t<21.0?mix(P.climb,P.jump,smooth(u)):mix(P.jump,P.stand,smooth(seg(t,21.0,21.3)));holdD=true;}
  else if(t<22.3){dir=-1;pose=track([[21.3,'stand'],[21.5,'kneel'],[21.95,'kneel'],[22.3,'push']],t);holdD=t<21.85;}
  else if(t<SHATTER){dir=-1;pose=track([[22.3,'push'],[23.6,'pushHard'],[SHATTER,'pushHard']],t);}
  else{dir=-1;pose=track([[SHATTER,'pushHard'],[SHATTER+0.35,'stand'],[25.3,'stand'],[25.7,'take']],t);}
  if(t>=21.95&&t<SHATTER+0.4){const wx=WIFEX+34;x=lerp(-160,wx,smooth(seg(t,21.95,22.3)));if(t>SHATTER)x=lerp(wx,-160,smooth(seg(t,SHATTER,SHATTER+0.4)));}
  // vertical: jump arcs, else ground
  if(t>=1.95&&t<2.32){const u=seg(t,1.95,2.32);y=lerp(-footDrop(P.crouch)*0.6,PIT.d,easeIn(u))-Math.sin(u*Math.PI)*90;}
  else if(t>=20.45&&t<21.0){const u=seg(t,20.45,21.0);const gy=lerp(PIT.d,groundAt(x,t),u);y=gy-footDrop(pose)-Math.sin(u*Math.PI)*170;}
  else if(dig){
    // dig cycle: wind-up 0.62, strike 0.18, recover
    const ph=digPh(t)%1;let sw,m=0;
    if(ph<0.6)sw=lerp(0.45,3.25,smooth(ph/0.6));else if(ph<0.78){const u=(ph-0.6)/0.18;sw=lerp(3.25,0.45,u*u);m=1;}else sw=0.45;
    pose={L:0.38+0.12*Math.sin(sw),hl:0.35,a1:sw-0.25,f1:sw,a2:sw-0.4,f2:sw-0.1,t1:0.55,s1:-0.15,t2:-0.3,s2:-0.45};
    y=PIT.d-footDrop(pose);const r=drawFig(x,y,dir,pose,'man');pickaxe(r.h1,sw*dir,m);return r;}
  else y=groundAt(x,t)-footDrop(pose);
  if(t>=21.3&&t<SHATTER+0.2&&t>=22.3){// keep him on the pushing line (hands on boulder)
  }
  const r=drawFig(x,y,dir,pose,'man');
  if(holdD){const hand=pose===P.holdUp||t>12.95&&t<14.9||t>18.3&&t<20.45?r.h1:r.h1;diamond(hand[0],hand[1]-14,22,t,1);}
  if(holdH){heart(r.h2[0],r.h2[1]-8,20,1);}
  if(t<0.0001){}
  return r;}
// wife
let WIFEX=-300;
function wife(t){let x,y,dir,pose,r;
  if(t<2.6){x=-205;dir=1;pose=track([[0,'take'],[1.75,'take'],[2.1,'lookDown'],[2.6,'lookDown']],t);y=groundAt(x,t)-footDrop(pose);
    if(t>=2.6-1e-6){}
    return drawFig(x,y,dir,pose,'woman');}
  // runs to the boulder then pushes (faces left)
  const bp=boulderPos(FAM,t,bShift(t));
  const strain=t>8.2&&t<SHATTER?0.5+0.5*Math.sin(t*9):0;
  pose=t<2.95?mix(P.lookDown,P.push,smooth(seg(t,2.6,2.95))):(t<SHATTER?mix(P.push,P.pushHard,t>8.15?0.6+0.4*strain:0.2*Math.sin(t*3)*0.5+0.2):track([[SHATTER,'pushHard'],[SHATTER+0.35,'stand'],[25.3,'stand'],[25.7,'take']],t));
  dir=t<25.3?-1:1;
  if(t>=SHATTER){x=-280;y=groundAt(x,t)-footDrop(pose);r=drawFig(x,y,dir,pose,'woman');if(t>25.5)diamond(r.h1[0]+4,r.h1[1]-12,18,t,0.8);return r;}
  // solve hip x so the near hand touches the boulder surface
  const j=joints(pose);let hx=-300;for(let k=0;k<4;k++){const hy=groundAt(hx,t)-footDrop(pose);const handY=hy+j.h1[1];const dy=clamp(handY-bp.y,-bp.R,bp.R);const sx=bp.x+Math.sqrt(bp.R*bp.R-dy*dy);hx=sx+j.h1[0];}
  const runU=smooth(seg(t,2.6,2.95));x=lerp(-205,hx,runU);WIFEX=x;y=groundAt(x,t)-footDrop(pose);
  r=drawFig(x,y,-1,pose,'woman');
  if(t>21.85&&t<SHATTER)diamond(r.h2[0]+6,r.h2[1]-6,15,t,0.6);
  return r;}
// boulder slip: Trust slam pushes Family (and her) back a bit, then she holds
function bShift(t){return 10*smooth(seg(t,8.15,8.4))-4*smooth(seg(t,8.4,9.2))+Math.sin(t*7)*(t>8.2?1.5:0)+6*smooth(seg(t,22.3,23.0))*0;}
function rich(t){if(t<6.9||t>11.1)return;const a=smooth(seg(t,6.9,7.25))*(1-smooth(seg(t,10.7,11.05)));const x=lerp(360,305,smooth(seg(t,6.9,7.3)));
  house(375,0,a);const pose=track([[6.9,'stand'],[7.3,'gesture'],[8.9,'gesture'],[9.3,'stand']],t);drawFig(x,-footDrop(pose),-1,pose,'rich',{alpha:a});}
function other(t){if(t<13.85||t>20.8)return;const a=smooth(seg(t,13.85,14.15))*(1-smooth(seg(t,20.4,20.75)));const x=t<14.3?lerp(430,345,smooth(seg(t,13.85,14.3))):(t>20.4?lerp(345,430,smooth(seg(t,20.4,20.75))):345);
  const walk=(t<14.3||t>20.4)?Math.sin(t*14)*0.35:0;let pose=track([[13.85,'stand'],[14.3,'lookDown'],[14.55,'toss'],[14.85,'lookDown'],[17.6,'lookDown'],[18.2,'lookDown'],[20.4,'stand']],t);
  pose=Object.assign({},pose,{t1:pose.t1+walk,t2:pose.t2-walk});
  const r=drawFig(x,-footDrop(pose),-1,pose,'other',{alpha:a});
  // heart flight: toss at 14.6 lands in his hand at 15.0; thrown back 17.75 -> she catches 18.15
  if(t>=14.55&&t<15.0){const u=seg(t,14.55,15.0);heart(lerp(r.h1[0],150,u),lerp(r.h1[1],250,u)-Math.sin(u*Math.PI)*60,20,1);}
  if(t>=14.0&&t<14.55)heart(r.h1[0]-6,r.h1[1]-6,18,0.7);
  if(t>=17.8&&t<18.15){const u=seg(t,17.8,18.15);heart(lerp(150,r.h1[0]+60,u),lerp(110,r.h1[1]+20,u)-Math.sin(u*Math.PI)*80,18,0.5);}
  if(t>=18.15&&t<18.6){const u=seg(t,18.15,18.6);heart(r.h1[0]+60+u*40,r.h1[1]+20+u*u*400,18*(1-u*0.3),0);}
}

// ---------- text ----------
const LINES=[
 [0.0,1.9,'I will give you\nhappiness.',540,410],
 [3.95,5.65,"Go. I'll hold\nthe family.",620,420],
 [7.25,9.0,'Why suffer?\nCome with me.',640,420],
 [9.05,10.65,'No.\nI believe in him.',560,400],
 [15.5,17.1,"I'm better\nthan her.",640,400],
 [18.75,20.35,'My wife\nis the best.',620,400],
 [22.45,24.2,'I love you.\nThank you.',540,410],
];
function drawText(t){ctx.setTransform(1,0,0,1,0,0);ctx.textAlign='center';ctx.textBaseline='middle';
  for(const [a,b,s,x,y] of LINES){if(t<a-0.01||t>b)continue;const u=t===0&&a===0?1:easeOut(seg(t,a,a+0.16)),o=1-smooth(seg(t,b-0.14,b));const al=Math.min(u,o);if(al<=0)continue;
    const sc=0.86+0.14*u;ctx.save();ctx.globalAlpha=al;ctx.translate(x,y);ctx.scale(sc,sc);ctx.font='800 84px '+FONT;
    const ls=s.split('\n');ls.forEach((l,i)=>{const yy=(i-(ls.length-1)/2)*96;ctx.lineWidth=14;ctx.strokeStyle='rgba(247,240,227,0.9)';ctx.lineJoin='round';ctx.strokeText(l,0,yy);ctx.fillStyle=C.text;ctx.fillText(l,0,yy);});ctx.restore();}
  // end card
  if(t>25.25){const u=easeOut(seg(t,25.25,25.6));ctx.save();ctx.globalAlpha=u;ctx.translate(540,420);ctx.scale(0.9+0.1*u,0.9+0.1*u);ctx.font='900 112px '+FONT;
    ['RESPECT','THIS WOMAN.'].forEach((l,i)=>{ctx.lineWidth=16;ctx.strokeStyle='rgba(247,240,227,0.95)';ctx.strokeText(l,0,(i-0.5)*124);ctx.fillStyle=C.text;ctx.fillText(l,0,(i-0.5)*124);});ctx.restore();}
  if(t>26.0){const u=easeOut(seg(t,26.0,26.4));ctx.save();ctx.globalAlpha=u;ctx.font='800 60px '+FONT;ctx.fillStyle=C.label;ctx.fillText('Follow Slow Light',540,1320+(1-u)*20);ctx.font='500 42px '+FONT;ctx.globalAlpha=u*0.85;ctx.fillText('stories worth slowing down for',540,1390+(1-u)*20);ctx.restore();}
}

// ---------- frame ----------
function renderAt(t){
  const c=camAt(t);const sh=shakeAt(t);const r=rng(Math.floor(t*60)+3);const ox=(r()-0.5)*sh,oy=(r()-0.5)*sh;
  drawSky(c);
  ctx.setTransform(c.z,0,0,c.z,540-c.x*c.z+ox,1000-c.y*c.z+oy);
  drawGround(t);
  // pit diamond (before he digs it out)
  if(t<12.8)diamond(PIT.x1-40,PIT.d-14,20,t,0.9);
  // boulders
  if(t>=2.6){
    const roll=t<3.0?seg(t,2.6,3.0):1;
    if(t>=7.95){const tr=t<8.25?seg(t,7.95,8.25):1;boulder(TRU,'Trust',t,(1-tr)*-4+Math.sin(t*0.7)*0.02,-(1-easeIn(tr))*900);}
    boulder(FAM,'Family',t,(1-roll)*-5+Math.sin(t*0.7)*0.02,-(1-easeIn(roll))*900+bShift(t));
    if(t>=2.98&&t<3.6){dust(boulderPos(FAM,t),t-2.98);} if(t>=8.23&&t<8.9){dust(boulderPos(TRU,t),t-8.23);}
  }
  rich(t);other(t);
  wife(t);husband(t);
  if(t>=SHATTER&&t<SHATTER+0.3){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='rgba(255,246,220,'+(0.55*(1-seg(t,SHATTER,SHATTER+0.3)))+')';ctx.fillRect(0,0,W,H);}
  if(t>SHATTER){ctx.setTransform(c.z,0,0,c.z,540-c.x*c.z,1000-c.y*c.z);const u=smooth(seg(t,SHATTER,SHATTER+1.2));ctx.save();ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(-450,-260,20,-450,-260,700);g.addColorStop(0,'rgba(255,210,140,'+0.16*u+')');g.addColorStop(1,'rgba(255,210,140,0)');ctx.fillStyle=g;ctx.fillRect(-1600,-1300,2400,2400);ctx.restore();}
  // paper grain
  ctx.setTransform(1,0,0,1,0,0);ctx.save();ctx.globalAlpha=0.06;ctx.globalCompositeOperation='overlay';ctx.drawImage(grain,0,0,W,H);ctx.restore();
  // soft warm vignette (light, never dark edges)
  const vg=ctx.createRadialGradient(540,900,500,540,960,1250);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(60,40,20,0.12)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  drawText(t);
}
function dust(p,v){const r=rng(77);ctx.fillStyle='rgba(31,79,90,0.35)';for(let i=0;i<14;i++){const a=Math.PI*(0.5+r()*0.9),sp=60+r()*160;const x=p.x+Math.cos(a)*(p.R*0.6+sp*v),y=p.y+p.R*0.9-sp*v*0.6*r();ctx.globalAlpha=clamp(0.5-v*0.8,0,1);ctx.beginPath();ctx.arc(x,y,8+r()*14+v*20,0,7);ctx.fill();}ctx.globalAlpha=1;}

// events for SFX (pickaxe strikes etc.)
function digPh(t){return t<11?(t-6)/0.82:5/0.82+(t-11)/0.62;}
function events(){const ev=[];let last=0;for(let t=6.0;t<12.75;t+=1/240){const ph=digPh(t)%1;if(ph>=0.78&&last<0.78)ev.push(['hit',+t.toFixed(3)]);last=ph;}return ev;}
makeGrain();
window.renderAt=renderAt;window.DUR=DUR;window.EVENTS=events();
document.fonts.load('800 84px "Inter Display"').then(()=>document.fonts.load('900 112px "Inter Display"')).then(()=>{renderAt(0);window.READY=true;});
</script>
</body></html>
