<html><head><meta charset="utf-8"><title>He Moved a Mountain</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
// Slow Light reel: "He Moved a Mountain" (stickman series, after Dashrath Manjhi, 1960-1982).
// window.renderAt(t, samples) -> JPEG dataURL of the frame at video time t (s).
// World units are metres. The ridge runs along x; the cut runs along z, from the village (z>0) to the town (z<0).
// He starts at the ridge foot (z=+55) and cuts toward -z; the cut is 9.1 m wide, 110 m long, up to 7.7 m deep.
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';

const Q = new URLSearchParams(location.search);
const W = +(Q.get('w')||1080), H = +(Q.get('h')||1920);
const DUR = 25.0, FPS = 30;
const DROP = 16.6;            // the last strike: the wall breaks (the music beat drop)
const REW0 = 23.6;            // rewind to frame 0 starts
const Z0 = 55, Z1 = -55;      // ridge feet along the cut
const HALFW = 4.55;           // half the cut width (9.1 m)

// ---------- helpers ----------
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,u)=>a+(b-a)*u;
const sstep=(a,b,x)=>{const u=clamp((x-a)/(b-a),0,1);return u*u*(3-2*u);};
const ease=u=>u<0.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function pchip(keys){
  const n=keys.length,x=keys.map(k=>k[0]),y=keys.map(k=>k[1]),d=[],m=new Array(n);
  for(let i=0;i<n-1;i++)d.push((y[i+1]-y[i])/(x[i+1]-x[i]));
  m[0]=d[0];m[n-1]=d[n-2];
  for(let i=1;i<n-1;i++){ if(d[i-1]*d[i]<=0)m[i]=0; else{const w1=2*(x[i+1]-x[i])+(x[i]-x[i-1]),w2=(x[i+1]-x[i])+2*(x[i]-x[i-1]);m[i]=(w1+w2)/(w1/d[i-1]+w2/d[i]);} }
  return t=>{ if(t<=x[0])return y[0]; if(t>=x[n-1])return y[n-1];
    let i=0;while(t>x[i+1])i++; const h=x[i+1]-x[i],s=(t-x[i])/h,s2=s*s,s3=s2*s;
    return (2*s3-3*s2+1)*y[i]+(s3-2*s2+s)*h*m[i]+(-2*s3+3*s2)*y[i+1]+(s3-s2)*h*m[i+1]; };
}
// cheap smooth value noise (2D)
function hash2(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s);}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return lerp(lerp(hash2(xi,yi),hash2(xi+1,yi),u),lerp(hash2(xi,yi+1),hash2(xi+1,yi+1),u),v);}
function fbm(x,y,o=4){let a=0.5,s=0,f=1;for(let i=0;i<o;i++){s+=a*vnoise(x*f,y*f);f*=2.03;a*=0.5;}return s;}

// ---------- world clock ----------
// tau(t): world time. Equal to t until REW0, then the world rewinds to tau=0 at the loop point.
function tau(t){ if(t<REW0)return t; const u=clamp((t-REW0)/(DUR-REW0),0,1); return DROP*(1-ease(u)); }
// progress of the cut, 0..1 (1 = through). PROG_END is where the front stops before the final strike.
const PROG_END=0.9864;
const progF=pchip([[0,0],[2.4,0.0015],[3.8,0.012],[5.0,0.06],[8.2,0.34],[9.2,0.395],[11.4,0.405],[12.3,0.47],[13.6,0.86],[14.6,0.95],[15.5,0.972],[16.0,0.982],[DROP-0.001,PROG_END]]);
const prog=w=>w>=DROP?1:Math.min(PROG_END,progF(w));
const zFront=w=>Z0-110*Math.min(prog(w),PROG_END);
// strike count: a strike lands each time S crosses an integer. Hook strikes on frame 0, 0.3 and 0.6 s (one per hook line);
// a slow close-up "day in 1968" (9.3-11.3 s); slow exhausted blows at the end; the last strike at LAST.
const LAST=16.0, NSTR=943;
const SK=[[0,1.0],[0.3,2.0],[0.6,3.0],[1.4,4.0],[2.2,5.2],[3.0,6.6],[3.8,10],[5.0,40],[8.0,470],[8.8,560],[9.3,568],[11.3,571],[11.8,580],[13.5,900],[14.0,935],[14.4,940],[14.9,941],[15.45,942],[LAST,943],[16.5,944]];
const Sf=pchip(SK);
const S=w=>Math.min(NSTR,Sf(w));
window.strikeTimes=()=>{const out=[];let k=1;for(let f=0;f<=DROP*4000;f++){const t=f/4000;while(k<=NSTR&&S(t)>=k){out.push(+t.toFixed(4));k++;}}return out;};
// counters (monotonic in the forward pass): year and metres carved
const yearAt=w=>{const p=prog(w);return p>=1?1982:Math.min(1981,1960+Math.floor(22*p/PROG_END));};
const metresAt=w=>{const p=prog(w);return p>=1?110:Math.min(109,110*p/PROG_END);};
window.counters=t=>{const w=tau(t);return {year:yearAt(w),m:metresAt(w),prog:prog(w)};};
const age=w=>sstep(2.4,15.0,w); // how old he is (0 young, 1 old)

// ---------- renderer ----------
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(W,H);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const FOG=new THREE.Color('#2a3348');
scene.fog=new THREE.FogExp2(FOG,0.0032);
const camera=new THREE.PerspectiveCamera(46,W/H,0.05,5000);
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(W/2,H/2),0.4,0.6,0.82);
composer.addPass(bloom);composer.addPass(new OutputPass());
// "Dust, Stone & Dawn" grade: warm ochre 1960s -> slate 1970s -> blue night -> golden dawn
const grade=new ShaderPass({uniforms:{tDiffuse:{value:null},lift:{value:new THREE.Vector3()},gain:{value:new THREE.Vector3(1,1,1)},sat:{value:1},con:{value:1},vig:{value:0.3},grain:{value:0.025},seed:{value:0},asp:{value:W/H}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform sampler2D tDiffuse;uniform vec3 lift;uniform vec3 gain;uniform float sat;uniform float con;uniform float vig;uniform float grain;uniform float seed;uniform float asp;varying vec2 vUv;
  float hh(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233))+seed)*43758.5453);}
  void main(){vec3 c=texture2D(tDiffuse,vUv).rgb;
    c=c*gain+lift*(1.-c);
    float l=dot(c,vec3(0.2126,0.7152,0.0722));c=mix(vec3(l),c,sat);
    c=(c-0.5)*con+0.5;
    vec2 q=(vUv-0.5)*vec2(asp,1.);c*=1.-vig*smoothstep(0.25,0.85,length(q)*1.25);
    c+=(hh(vUv*vec2(1080.,1920.))-0.5)*grain;
    gl_FragColor=vec4(clamp(c,0.,1.),1.);}`});
composer.addPass(grade);
const GR={hook:[[0.035,0.022,0.0],[1.07,0.99,0.86],1.08,1.06],early:[[0.03,0.018,0.0],[1.08,0.98,0.84],1.1,1.09],
  late:[[0.02,0.03,0.05],[1.06,1.0,0.94],0.95,1.04],night:[[0.025,0.045,0.095],[1.0,1.08,1.28],0.9,1.02],dawn:[[0.0,0.006,0.022],[1.1,0.97,0.8],1.12,1.14]};
function gradeAt(t){const mixG=(a,b,u)=>[a[0].map((v,i)=>lerp(v,b[0][i],u)),a[1].map((v,i)=>lerp(v,b[1][i],u)),lerp(a[2],b[2],u),lerp(a[3],b[3],u)];
  let g=mixG(GR.hook,GR.early,sstep(2.4,3.8,t));g=mixG(g,GR.late,sstep(8.8,13.4,t));g=mixG(g,GR.night,sstep(14.6,15.4,t));g=mixG(g,GR.dawn,sstep(16.25,16.75,t));
  g=mixG(g,GR.hook,sstep(23.8,24.9,t));return g;}

// ---------- sun & sky ----------
// sun sits on the far (-z) side of the ridge. Elevation by world time: golden afternoon during the work,
// dusk then dark before the last strike, a low dawn sun along the cut at the break.
const sunElevF=pchip([[0,30],[2.4,32],[3.8,52],[9,48],[13.5,40],[14.3,28],[15.0,6],[15.6,-6],[16.1,-3],[DROP,3.0],[19,8],[24,12]]);
const sunAzF=pchip([[0,105],[2.4,110],[3.8,150],[14.4,150],[15.2,110],[15.6,20],[DROP,0],[24,4]]);
const sweep=w=>Math.sin((w-3.8)*Math.PI*2/2.2)*sstep(3.8,4.8,w)*(1-sstep(13.6,14.4,w));
function sunDir(w){const e=THREE.MathUtils.degToRad(sunElevF(w)-8*Math.abs(sweep(w))),a=THREE.MathUtils.degToRad(sunAzF(w)+38*sweep(w));return new THREE.Vector3(Math.cos(e)*Math.sin(a),Math.sin(e),-Math.cos(e)*Math.cos(a));}
const dayF=w=>sstep(-6,6,sunElevF(w));
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{sun:{value:new THREE.Vector3(0,0.2,-1)},day:{value:1},warm:{value:0}},
  vertexShader:`varying vec3 vd;void main(){vd=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);gl_Position.z=gl_Position.w;}`,
  fragmentShader:`varying vec3 vd;uniform vec3 sun;uniform float day;uniform float warm;
  float h(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,37.719)))*43758.5453);}
  void main(){vec3 d=normalize(vd);float el=d.y;
    vec3 zenN=vec3(0.018,0.028,0.060),horN=vec3(0.060,0.085,0.140);
    vec3 zenD=vec3(0.13,0.20,0.32),horD=vec3(0.62,0.50,0.36);
    vec3 zen=mix(zenN,zenD,day),hor=mix(horN,horD,day);
    vec3 c=mix(hor,zen,smoothstep(-0.02,0.5,el));
    c=mix(c,hor*0.55,smoothstep(0.,-0.2,el));
    float s=max(dot(d,sun),0.);
    vec3 gold=vec3(1.0,0.60,0.26);
    float band=exp(-abs(el-0.02)*5.);
    c+=gold*band*pow(s,3.)*(0.12+0.6*warm);
    c+=gold*pow(s,90.)*(0.25+0.6*warm)*smoothstep(-0.1,0.02,sun.y);
    vec3 g=floor(d*420.);float st=step(0.9972,h(g));c+=vec3(0.85,0.88,1.)*st*smoothstep(0.05,0.4,el)*(1.-day)*0.8;
    gl_FragColor=vec4(c,1.);}`});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(4000,48,24),skyMat));
function glowTex(){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');const gr=g.createRadialGradient(128,128,0,128,128,128);
  gr.addColorStop(0,'rgba(255,240,210,1)');gr.addColorStop(0.12,'rgba(255,214,150,0.9)');gr.addColorStop(0.32,'rgba(255,170,90,0.3)');gr.addColorStop(1,'rgba(255,140,60,0)');g.fillStyle=gr;g.fillRect(0,0,256,256);return new THREE.CanvasTexture(c);}
const GLOW=glowTex();
const sunSprite=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color:'#ffb45c',transparent:true,depthWrite:false,fog:false,blending:THREE.AdditiveBlending}));
sunSprite.scale.set(300,300,1);scene.add(sunSprite);

// distant mountain rings for the horizon (parallax)
function ring(r,hgt,seed,col){const R=rng(seed),seg=360,pos=[],idx=[];const ph=[R()*6,R()*6,R()*6];
  for(let i=0;i<=seg;i++){const a=i/seg*Math.PI*2;const y=hgt*(0.45+0.3*Math.sin(a*3+ph[0])+0.18*Math.sin(a*11+ph[1])+0.08*Math.sin(a*29+ph[2]));
    pos.push(Math.cos(a)*r,-80,Math.sin(a)*r, Math.cos(a)*r,y,Math.sin(a)*r);}
  for(let i=0;i<seg;i++){const k=i*2;idx.push(k,k+1,k+2,k+1,k+3,k+2);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);
  return new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:col,side:THREE.DoubleSide,fog:true}));}
const rings=[ring(1500,120,3,'#3a4256'),ring(2200,230,7,'#2e364a'),ring(1000,60,11,'#434a5c')];rings.forEach(r=>scene.add(r));

// ---------- terrain: the ridge, carved live ----------
// crest height of the ridge along x (7.7 m over the cut, rising to peaks on the -x side, ending at x~50 on the +x side)
function crest(x){
  const ax=Math.abs(x);
  let c=7.7+24*sstep(6,42,ax)+26*sstep(40,160,ax)*(x<0?1:0.6)+6*(fbm(x*0.03,3.1,3)-0.5)*sstep(6,30,ax);
  c+=10*Math.pow(Math.max(0,Math.sin(x*0.035+1.2)),3)*sstep(30,90,ax);
  return c*sstep(52,34,x); // the +x end of the ridge (the old road goes round it)
}
function halfLen(x){return 55+(0.35*Math.abs(x)*(x<0?1:0.5)+16*(fbm(x*0.02,9.3,3)-0.35))*sstep(8,40,Math.abs(x));}
function baseH(x,z){
  const L=halfLen(x),u=Math.abs(z)/L;
  let s;
  if(z>=0) s=sstep(1.0,0.86,u)*(1-0.18*u*u);            // village side: a short steep foot, then the ridge
  else     s=sstep(1.0,0.975,u)*(0.62+0.38*(1-u*u));     // town side: a cliff, about 4.6 m at the cut
  let h=crest(x)*s;
  h+=s*(0.9*(fbm(x*0.18+7,z*0.18,4)-0.5)+0.35*(vnoise(x*1.1,z*1.1)-0.5));
  // fractured granite: ridged noise for broken ledges and outcrops (more on the high ground)
  const rdg=1-Math.abs(2*fbm(x*0.04+11,z*0.05+5,4)-1);h+=s*s*(2.6*rdg*rdg-0.9)*sstep(0.2,1,s);
  h+=s*1.1*Math.max(0,fbm(x*0.45+3,z*0.45,3)-0.55)*3;
  // fields and soft ground away from the ridge
  h+=(1-s)*0.25*(fbm(x*0.02,z*0.02,3)-0.5);
  return h;
}
const hwAt=z=>HALFW+0.55*(fbm(z*0.11+4,1.7,3)-0.5)+0.10*(vnoise(z*0.9,3.3)-0.5);
const frontOff=x=>0.22*Math.sin(x*1.3)+0.12*Math.sin(x*2.9+0.4)+0.1*(vnoise(x*2.1,7.7)-0.5);
// grid: dense across the cut and along it, coarse elsewhere
function axis(dense0,dense1,step,lo,hi,grow){const a=[];for(let v=dense0;v<=dense1+1e-6;v+=step)a.push(+v.toFixed(4));
  let s=step,v=dense0;while(v>lo){s*=grow;v-=s;a.unshift(Math.max(lo,v));}s=step;v=dense1;while(v<hi){s*=grow;v+=s;a.push(Math.min(hi,v));}return a;}
const XS=axis(-6.4,6.4,0.1,-900,700,1.09),ZS=axis(-60,60,0.33,-700,700,1.09);
const NX=XS.length,NZ=ZS.length;
const tGeo=new THREE.BufferGeometry();
const tPos=new Float32Array(NX*NZ*3),tCol=new Float32Array(NX*NZ*3),BASE=new Float32Array(NX*NZ);
const BAND=[];// vertex indices that can be carved
for(let j=0;j<NZ;j++)for(let i=0;i<NX;i++){const k=j*NX+i,x=XS[i],z=ZS[j];const h=baseH(x,z);BASE[k]=h;tPos[k*3]=x;tPos[k*3+1]=h;tPos[k*3+2]=z;
  if(Math.abs(x)<6.3&&z<Z0+1&&z>Z1-1)BAND.push(k);}
{const idx=[];for(let j=0;j<NZ-1;j++)for(let i=0;i<NX-1;i++){const a=j*NX+i,b=a+1,c=a+NX,d=c+1;idx.push(a,c,b,b,c,d);}tGeo.setIndex(idx);}
tGeo.setAttribute('position',new THREE.BufferAttribute(tPos,3));tGeo.setAttribute('color',new THREE.BufferAttribute(tCol,3));
// colours: weathered rock (dark warm grey), fresh cut rock (pale granite), road floor (dusty tan), fields
const C_ROCK=new THREE.Color('#8b7258'),C_ROCK2=new THREE.Color('#5f4c3e'),C_FRESH=new THREE.Color('#cfb48c'),C_FLOOR=new THREE.Color('#a88a66'),C_FIELD=new THREE.Color('#6b6a3c'),C_FIELD2=new THREE.Color('#8a7448');
const tmpC=new THREE.Color();const C_WEATHER=new THREE.Color('#6c6650'),C_PATH=new THREE.Color('#c2a47c');
function baseColor(k){const x=tPos[k*3],z=tPos[k*3+2],h=BASE[k];const rock=sstep(0.3,1.5,h);
  const n=fbm(x*0.05+3,z*0.05,3);tmpC.copy(C_FIELD).lerp(C_FIELD2,n);const r=C_ROCK2.clone().lerp(C_ROCK,fbm(x*0.3,z*0.3,3));tmpC.lerp(r,rock);return tmpC;}
for(let k=0;k<NX*NZ;k++){const c=baseColor(k);tCol[k*3]=c.r;tCol[k*3+1]=c.g;tCol[k*3+2]=c.b;}
const BASECOL=tCol.slice();
// paths: the village track to the ridge foot (and, once it exists, the road on to the town)
function trackW(x,z){return Math.exp(-Math.pow(x/(1.6+0.004*Math.abs(z)),2));}
const rockMat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.95,metalness:0});
rockMat.onBeforeCompile=sh=>{
  sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vW;').replace('#include <worldpos_vertex>','#include <worldpos_vertex>\nvW=worldPosition.xyz;');
  sh.fragmentShader=sh.fragmentShader.replace('#include <common>',`#include <common>
varying vec3 vW;
float hh(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,37.719)))*43758.5453);}
float vn(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(mix(hh(i),hh(i+vec3(1,0,0)),f.x),mix(hh(i+vec3(0,1,0)),hh(i+vec3(1,1,0)),f.x),f.y),mix(mix(hh(i+vec3(0,0,1)),hh(i+vec3(1,0,1)),f.x),mix(hh(i+vec3(0,1,1)),hh(i+vec3(1,1,1)),f.x),f.y),f.z);}`)
  .replace('#include <color_fragment>',`#include <color_fragment>
  {float n=vn(vW*1.7)*0.5+vn(vW*4.3)*0.3+vn(vW*0.35)*0.4;
   vec3 nrm=normalize(cross(dFdx(vW),dFdy(vW)));float steep=1.-abs(nrm.y);
   float strata=0.5+0.5*sin(vW.y*2.6+vn(vW*vec3(0.25,0.,0.25))*6.);
   diffuseColor.rgb*=0.74+0.42*n;
   diffuseColor.rgb*=mix(vec3(1.),mix(vec3(1.09,0.97,0.84),vec3(0.86,0.88,0.93),strata),smoothstep(0.6,0.92,steep));
   float chis=step(0.9,fract(vW.y*3.7+vn(vW*vec3(1.6,0.,1.6))*2.4))*smoothstep(0.75,0.95,steep)*step(0.45,vn(vW*vec3(0.7,0.,0.7)));
   diffuseColor.rgb*=1.-0.09*chis;
   float d=abs(vW.x);float ao=1.-0.5*smoothstep(3.3,4.6,d)*(1.-smoothstep(0.,1.4,vW.y))*(1.-smoothstep(5.3,6.,d));
   ao*=0.82+0.18*smoothstep(0.25,0.55,vn(vW*2.9));
   diffuseColor.rgb*=ao;}`)
  .replace('#include <normal_fragment_maps>',`#include <normal_fragment_maps>
  {vec3 p=vW*2.1;float e=0.06;
   float n0=vn(p)*0.6+vn(p*2.8)*0.3;
   vec3 g=vec3(vn(p+vec3(e,0,0))*0.6+vn((p+vec3(e,0,0))*2.8)*0.3-n0,vn(p+vec3(0,e,0))*0.6+vn((p+vec3(0,e,0))*2.8)*0.3-n0,vn(p+vec3(0,0,e))*0.6+vn((p+vec3(0,0,e))*2.8)*0.3-n0)/e;
   vec3 gv=(viewMatrix*vec4(g,0.)).xyz;normal=normalize(normal-0.28*smoothstep(0.2,1.6,vW.y)*(gv-dot(gv,normal)*normal));}`);
};
const terrain=new THREE.Mesh(tGeo,rockMat);terrain.receiveShadow=true;terrain.castShadow=true;terrain.frustumCulled=false;scene.add(terrain);
let lastCarve=-1e9;
function carve(w){
  const zf=zFront(w),done=prog(w)>=1;
  const roadOn=sstep(DROP,DROP+0.01,w); // the road on the town side only exists after the break
  for(const k of BAND){const x=tPos[k*3],z=tPos[k*3+2];const hw=hwAt(z);
    const floorY=0.02+0.03*(vnoise(x*2,z*2)-0.5);
