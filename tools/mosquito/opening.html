const fill=new THREE.DirectionalLight(0x6f8fc8,.9); fill.position.set(3,1,6); scene.add(fill);
// ---- mosquito geometry (local: +z forward, +y up, +x right), baked into one merged mesh with vertex colours
function col(g,hex,fn){const c=new THREE.Color(hex),n=g.attributes.position.count,a=new Float32Array(n*3);for(let i=0;i<n;i++){const k=fn?fn(g.attributes.position,i):c;const cc=k.isColor?k:c;a[i*3]=cc.r;a[i*3+1]=cc.g;a[i*3+2]=cc.b}g.setAttribute('color',new THREE.BufferAttribute(a,3));return g}
function bodyGeom(seg){const P=[],dark=0x2b1b14,cream=0xe3d2ac;
 let g=new THREE.SphereGeometry(.085,seg,seg/2);g.translate(0,0,.42);P.push(col(g,0x1d130f));                       // head

const wc=document.createElement('canvas');wc.width=256;wc.height=96;{const x=wc.getContext('2d');x.fillStyle='rgba(255,215,160,0.22)';x.fillRect(0,0,256,96);x.strokeStyle='rgba(255,230,190,0.9)';x.lineWidth=2;
 for(let i=0;i<5;i++){x.beginPath();x.moveTo(0,48);x.lineTo(250,14+i*17);x.stroke()}x.strokeStyle='rgba(255,236,205,1)';x.lineWidth=4;x.strokeRect(2,2,252,92)}

const bodyMat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.5,metalness:.05});
bodyMat.onBeforeCompile=sh=>{sh.fragmentShader=sh.fragmentShader.replace('#include <emissivemap_fragment>','#include <emissivemap_fragment>\n float fr=pow(1.-abs(dot(normalize(normal),normalize(vViewPosition))),2.4); totalEmissiveRadiance+=vec3(1.,.6,.3)*fr*.45;')};
const WG=wingGeom(); // pivot at the root; tip along +x, trailing edge towards -z
// ---- hero (detailed, individually posed)
const heroBody=new THREE.Mesh(bodyGeom(28),bodyMat), wR=new THREE.Mesh(WG,wingMat), wL=new THREE.Mesh(WG,wingMat); wL.scale.x=-1;
const hero=new THREE.Group(); hero.add(heroBody,wR,wL); wR.position.set(.05,.17,.2); wL.position.set(-.05,.17,.2); hero.rotation.set(-.15,.55,0); scene.add(hero);
// ---- swarm (instanced)
const N=380, bodyG=bodyGeom(10), swarmBody=new THREE.InstancedMesh(bodyG,bodyMat,N), swarmWing=new THREE.InstancedMesh(WG,wingMat,N*2);
swarmBody.frustumCulled=swarmWing.frustumCulled=false; scene.add(swarmBody,swarmWing);
const M=[]; for(let i=0;i<N;i++){const near=i>=N*.9;let z=near?U(-9,2):U(-75,-9),x=U(-16,16)*(1+(-z)/45),y=U(-22,22)*(1+(-z)/45);if(near){x=Math.sign(x||1)*U(7,16);}

function placeSwarm(t){const hide=t>=tb;for(let i=0;i<N;i++){const m=M[i];const p=posAt(m,t);q4.setFromUnitVectors(zz,m.dir);const r=new THREE.Quaternion().setFromAxisAngle(zz,m.roll);q4.multiply(r);
  const s=hide?0:m.s*(m.near?ease((t-.8)/.6):1);sv.set(s,s,s);mb.compose(p,q4,sv);swarmBody.setMatrixAt(i,mb);
  const fl=Math.sin(t*6.283*m.f+m.ph)*.7;for(let k=0;k<2;k++){const sd=k?-1:1;mw.makeRotationZ(sd*(.25+fl));const tr=new THREE.Matrix4().makeTranslation(sd*.05,.17,.2);if(sd<0)mw.premultiply(new THREE.Matrix4().makeScale(-1,1,1));
   mw.premultiply(tr);m4.multiplyMatrices(mb,mw);swarmWing.setMatrixAt(i*2+k,m4)}}

// ---- burst particles
const PER=12,NP=(N+1)*PER; const pg=new THREE.BufferGeometry(),pp=new Float32Array(NP*3),pv=new Float32Array(NP*3),p0=new Float32Array(NP*3);pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
const sc=document.createElement('canvas');sc.width=sc.height=64;{const x=sc.getContext('2d');const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,236,200,1)');g.addColorStop(.35,'rgba(255,200,130,.7)');g.addColorStop(1,'rgba(255,160,80,0)');x.fillStyle=g;x.fillRect(0,0,64,64)}

const parts=new THREE.Points(pg,pmat);parts.frustumCulled=false;scene.add(parts);
{let k=0;const all=[...M.map(m=>posAt(m,tb)),new THREE.Vector3(0,0,0)];all.forEach((p,i)=>{for(let j=0;j<PER;j++){p0.set([p.x+U(-.3,.3),p.y+U(-.3,.3),p.z+U(-.3,.3)],k*3);
 const d=new THREE.Vector3(p.x,p.y,U(-.4,.4)*Math.abs(p.z)*.2+U(-3,3));if(i==N)d.set(U(-1,1),U(-1,1),U(-1,1));d.normalize().multiplyScalar(U(6,34));pv.set([d.x,d.y,d.z],k*3);k++}})}

function camAt(t){const push=Math.min(t,.7)/.7;let z=3.5-.35*ease(push);if(t>.7)z=3.15+(34-3.15)*ease((t-.7)/.95);
 const sh=(t<tb?1:Math.exp(-(t-tb)*9))*.03; cam.position.set(Math.sin(t*37)*sh,.02+Math.sin(t*29)*sh,z);cam.lookAt(0,0,-10); cam.rotateZ(Math.sin(t*1.3)*.02)}
