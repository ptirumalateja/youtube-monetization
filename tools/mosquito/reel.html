  for(const tf of tufts){const y=1275+tf.z*620, s=.35+1.4*tf.z, x=((tf.x-u*(30+120*tf.z))%(W+80)+W+80)%(W+80)-40; const sw=Math.sin(t*1.6+tf.ph)*2*s; c.strokeStyle='rgba(20,28,38,.9)'; c.lineWidth=1.6*s; c.beginPath(); c.moveTo(x,y); c.lineTo(x+sw,y-22*s); c.stroke(); c.fillStyle='rgba(245,236,224,.78)'; c.beginPath(); c.arc(x+sw,y-24*s,3.4*s,0,6.3); c.fill()}
  const hs=[...herd].sort((a,b)=>a.z-b.z); const hfade=1-clamp((t-15.45)/.25);
  if(hfade>0) for(const h of hs){const y=1290+h.z*560, s=.34+1.15*h.z, x=((h.x0-u*(26+95*h.z)*h.v)%(W+500)+W+500)%(W+500)-250; c.save(); c.globalAlpha=hfade; drawCaribou(c,x,y,s,t*(3.2*h.v)+h.ph,-1,'#121a24'); c.restore(); c.save(); c.globalAlpha=.5*hfade; c.strokeStyle='#f2a784'; c.lineWidth=2*s; c.beginPath(); c.ellipse(x,y-20*s,64*s,30*s,0,3.5,5.9); c.stroke(); c.restore()}
  const wv=c.createLinearGradient(0,0,0,H); wv.addColorStop(0,'rgba(0,0,0,0)'); wv.addColorStop(1,'rgba(0,0,0,.28)'); c.fillStyle=wv; c.fillRect(0,0,W,H);
}
// ---- act 5 (16-17.5): the wetland at dusk; fish and birds with nothing to eat
function drawBird(c,x,y,s,flap,ang,col){c.save(); c.translate(x,y); c.rotate(ang); c.scale(s,s); c.fillStyle=col; c.strokeStyle=col; c.lineWidth=2; c.beginPath(); c.ellipse(0,0,20,6,0,0,6.3); c.fill(); c.beginPath(); c.moveTo(-18,0); c.lineTo(-40,-6); c.lineTo(-34,2); c.lineTo(-40,9); c.closePath(); c.fill(); const w=Math.sin(flap)*28; for(const sd of[-1,1]){c.beginPath(); c.moveTo(2,0); c.quadraticCurveTo(-4,sd*(26+w*.6),-18,sd*(34+w)); c.quadraticCurveTo(0,sd*14,10,2*sd); c.fill()} c.beginPath(); c.moveTo(20,0); c.lineTo(30,2); c.lineTo(20,3); c.fill(); c.restore()}
function drawFish(c,x,y,s,ph,col,dir){c.save(); c.translate(x,y); c.scale(s*dir,s); c.fillStyle=col; const w=Math.sin(ph)*5; c.beginPath(); c.ellipse(0,0,46,16,0,0,6.3); c.fill(); c.beginPath(); c.moveTo(-40,0); c.lineTo(-66,-16+w); c.lineTo(-66,16+w); c.closePath(); c.fill(); c.beginPath(); c.moveTo(-6,-14); c.lineTo(8,-30); c.lineTo(22,-13); c.fill(); c.fillStyle='rgba(240,210,160,.9)'; c.beginPath(); c.arc(30,-3,3,0,6.3); c.fill(); c.strokeStyle='rgba(120,190,205,.5)'; c.lineWidth=2; c.beginPath(); c.ellipse(0,-2,44,13,0,3.6,5.8); c.stroke(); c.restore()}
const fishes=[]; for(let i=0;i<7;i++) fishes.push({x0:U(0,W),y:1550+U(0,330),s:U(.55,1.05),v:U(60,120)*(R()<.5?-1:1),ph:U(0,6.3)});
const birds=[]; for(let i=0;i<4;i++) birds.push({x0:U(0,W),y0:U(480,980),ax:U(150,330),ay:U(60,140),w:U(.6,1.0),ph:U(0,6.3),s:U(1.9,2.7)});
function actWetland(c,t){
  drawA(c,7+(t-16),{calm:true});
  const u=t-16;
  for(const b of birds){const x=b.x0+b.ax*Math.sin(b.w*u+b.ph)+u*30, y=b.y0+b.ay*Math.sin(b.w*u*1.3+b.ph), vx=b.ax*b.w*Math.cos(b.w*u+b.ph)+30, ang=Math.atan2(b.ay*b.w*1.3*Math.cos(b.w*u*1.3+b.ph),vx)*.7; drawBird(c,((x%1300)+1300)%1300-100,y,b.s,t*14+b.ph,ang,'#0e141c')}
  for(const f of fishes){const dir=f.v<0?-1:1; let x=((f.x0+f.v*u)%1300+1300)%1300-110, y=f.y+10*Math.sin(u*1.5+f.ph); drawFish(c,x,y,f.s*1.5,t*9+f.ph,'#123446',-dir)}
  // a fish rises to the surface for nothing: ripple, then it sinks back
  const rt=u-.55; if(rt>0&&rt<1.2){const k=Math.sin(Math.min(1,rt/1.0)*Math.PI), yy=mix(1700,1448,k); drawFish(c,720,yy,1.35,rt*20,'#123446',1); for(let i=0;i<3;i++){const uu=rt-.45-i*.18; if(uu>0){c.strokeStyle=`rgba(255,215,150,${.55*(1-uu/1)})`; c.lineWidth=2; c.beginPath(); c.ellipse(720,1436,20+uu*160,5+uu*28,0,0,6.3); c.stroke()}}}
  c.fillStyle='rgba(0,0,0,.12)'; c.fillRect(0,0,W,H);
}
// ---- act 6 (17.5-20): a wild orchid and the pollinator that never lands
const bokeh=[]; for(let i=0;i<46;i++) bokeh.push({x:U(0,W),y:U(0,H),r:U(14,70),a:U(.05,.16),c:R()<.5?'255,170,100':'110,200,210',vx:U(-8,8),vy:U(-10,6)});
function stemX(y){return 548+36*Math.sin((y-1900)*.0036)-((1900-y)*.016)}
const flowers=[]; for(let i=0;i<30;i++){const f=i/29; flowers.push({y:mix(1210,700,f),side:i%2?1:-1,sz:mix(30,15,f),ph:U(0,6.3)})}
function drawOrchid(c,t){
  const bg=c.createRadialGradient(540,900,60,540,900,1300); bg.addColorStop(0,'#17404f'); bg.addColorStop(.5,'#0c2231'); bg.addColorStop(1,'#050e18'); c.fillStyle=bg; c.fillRect(0,0,W,H);
  for(const b of bokeh){const x=((b.x+b.vx*t)%(W+200)+W+200)%(W+200)-100, y=((b.y+b.vy*t)%(H+200)+H+200)%(H+200)-100; const g=c.createRadialGradient(x,y,0,x,y,b.r); g.addColorStop(0,`rgba(${b.c},${b.a})`); g.addColorStop(1,`rgba(${b.c},0)`); c.fillStyle=g; c.fillRect(x-b.r,y-b.r,b.r*2,b.r*2)}
  c.strokeStyle='#4f8a5c'; c.lineWidth=10; c.lineCap='round'; c.beginPath(); c.moveTo(stemX(1920),1920); for(let y=1920;y>=660;y-=20) c.lineTo(stemX(y)+Math.sin(t*.8+y*.004)*3,y); c.stroke();
  c.save(); c.translate(stemX(1560),1560); c.rotate(-.55); const lg=c.createLinearGradient(-200,0,0,0); lg.addColorStop(0,'#2f6a52'); lg.addColorStop(1,'#3d7e5a'); c.fillStyle=lg; c.beginPath(); c.ellipse(-130,0,150,44,0,0,6.3); c.fill(); c.strokeStyle='rgba(180,230,190,.45)'; c.lineWidth=2.4; c.beginPath(); c.moveTo(0,0); c.lineTo(-270,0); c.stroke(); c.restore();
  for(const f of flowers){const x=stemX(f.y)+f.side*f.sz*.9+Math.sin(t*1.2+f.ph)*2, y=f.y; c.save(); c.translate(x,y); c.rotate(f.side*.4); const s=f.sz; c.shadowColor='rgba(220,255,200,.65)'; c.shadowBlur=18; c.fillStyle='#eef6dc'; for(let k=0;k<3;k++){c.save(); c.rotate(-1.1+k*1.1); c.beginPath(); c.ellipse(0,-s*.75,s*.34,s*.62,0,0,6.3); c.fill(); c.restore()} c.shadowBlur=0; c.fillStyle='#cfe3a9'; c.beginPath(); c.ellipse(0,s*.35,s*.22,s*.55,0,0,6.3); c.fill(); c.restore()}
  for(let i=0;i<18;i++){const ph=i*2.3, a=.4+.6*Math.abs(Math.sin(t*1.5+ph)); c.fillStyle=`rgba(255,255,230,${a*.9})`; c.beginPath(); c.arc(stemX(900+i*50)+((i*37)%60-30),880+((i*91)%520),2.2,0,6.3); c.fill()}
}
const dust=[]; for(let i=0;i<90;i++) dust.push({a:U(0,6.3),v:U(30,150),r:U(1.6,4.4),l:U(.5,1.2)});
function actOrchid(c,t){
  const u=t-17.5, z=1+.07*u/2.5;
  c.save(); c.translate(540,900); c.scale(z,z); c.translate(-540,-900); drawOrchid(c,t);
  // the mosquito approaches the spike, hovers, then dissolves into dust before it can land
  const mx=mix(1180,700,eo(u/.9))+Math.sin(u*3)*10, my=mix(500,790,eo(u/.9))+Math.cos(u*2.3)*16, dt=u-1.15;
  if(dt<0) drawMosquito(c,mx,my,1.0,-.12,t*54,'#0b1219',1,true,false);
  else if(dt<.8){const a=1-ease(dt/.45); if(a>0) drawMosquito(c,mx,my,1.0*(1-.25*dt),-.12+dt*.4,t*54,'#0b1219',a,true,false); for(const d of dust){const k=dt*d.v, al=clamp(1-dt/(d.l)); if(al>0){c.fillStyle=`rgba(255,238,200,${al*.9})`; c.beginPath(); c.arc(mx+Math.cos(d.a)*k+dt*40,my+Math.sin(d.a)*k-dt*20,d.r,0,6.3); c.fill()}}}
  c.restore();
}
// ---- act 7 (20-23): the web of connections on the Earth, rewiring in ways nobody can predict
const webN=[]; for(let i=0;i<34;i++){const c0=PICKC(); webN.push([c0[0]+U(-3,3),c0[1]+U(-4,4)])}
function PICKC(){return CITIES[Math.floor(R()*CITIES.length)]}
const webE=[]; for(let i=0;i<46;i++){const a=Math.floor(R()*34); let b=Math.floor(R()*34); if(b===a) b=(a+1)%34; const on=20.3+R()*2.0, life=U(.8,2.6); webE.push({a,b,on,off:on+life,col:R()<.5?'255,170,100':'120,215,225',ph:U(0,6.3)})}
function slerpPts(a,b,n){const A=[Math.cos(a[0]*D)*Math.sin(a[1]*D),Math.sin(a[0]*D),Math.cos(a[0]*D)*Math.cos(a[1]*D)],B=[Math.cos(b[0]*D)*Math.sin(b[1]*D),Math.sin(b[0]*D),Math.cos(b[0]*D)*Math.cos(b[1]*D)]; const om=Math.acos(clamp(A[0]*B[0]+A[1]*B[1]+A[2]*B[2],-1,1))||1e-3, out=[]; for(let i=0;i<=n;i++){const f=i/n, k1=Math.sin((1-f)*om)/Math.sin(om), k2=Math.sin(f*om)/Math.sin(om), x=k1*A[0]+k2*B[0], y=k1*A[1]+k2*B[1], z=k1*A[2]+k2*B[2], lift=1+.18*Math.sin(Math.PI*f)*(om/1.5); out.push([Math.asin(y/Math.hypot(x,y,z))/D,Math.atan2(x,z)/D,lift])} return out}
function actWeb(c,t,P,o){
  drawEarth(c,t,P,o);
  c.save(); c.globalCompositeOperation='lighter';
  for(const e of webE){ if(t<e.on||t>e.off+.4) continue; const g=clamp((t-e.on)/.5)*clamp(1-(t-e.off)/.4); const pts=slerpPts(webN[e.a],webN[e.b],18); c.strokeStyle=`rgba(${e.col},${.55*g*o.alpha})`; c.lineWidth=2; c.beginPath(); let st=false; const draw=Math.floor(pts.length*clamp((t-e.on)/.7)); for(let i=0;i<=Math.min(draw,pts.length-1);i++){const p=proj(pts[i][0],pts[i][1],{...P,R:P.R*pts[i][2]}); if(p[2]<.05){st=false; continue} st?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]); st=true} c.stroke()}
  for(let i=0;i<webN.length;i++){const p=proj(webN[i][0],webN[i][1],P); if(p[2]<.1) continue; const tw=.5+.5*Math.abs(Math.sin(t*2+i)); c.fillStyle=`rgba(255,225,170,${.9*tw*o.alpha})`; c.beginPath(); c.arc(p[0],p[1],4.5,0,6.3); c.fill()}
  c.restore();
  // question marks drifting up from a few nodes
  for(let i=0;i<7;i++){const t0=20.9+i*.33, u=t-t0; if(u<0||u>1.6) continue; const p=proj(webN[(i*5)%34][0],webN[(i*5)%34][1],P); if(p[2]<.2) continue; c.save(); c.globalAlpha=Math.sin(Math.min(1,u/1.6)*Math.PI)*.9*o.alpha; c.shadowColor='rgba(0,0,0,.8)'; c.shadowBlur=8; c.font=`bold ${34+i%3*8}px ${MONO}`; c.fillStyle='#ffe2b8'; c.textAlign='center'; c.fillText('?',p[0],p[1]-14-u*40); c.restore()}
}
// ---- act 8 (23-26): back to the marsh; one mosquito and the question
function actFinal(c,t,u){   // u: slide-in progress 0..1 of the marsh over the Earth
  const yA=H*1.15*(1-eo(u)); c.save(); c.translate(0,yA); const off=document.createElement('canvas'); off.width=cv.width; off.height=cv.height; const o=off.getContext('2d'); o.setTransform(SC,0,0,SC,0,0); drawA(o,6+(t-23),{calm:true});
  // the lone mosquito flies in and hovers at the centre
  const f=clamp((t-23.3)/1.1), mx=mix(1250,560,eo(f))+Math.sin((t-23)*2.2)*14*f, my=mix(520,840,eo(f))+Math.cos((t-23)*1.9)*20*f; drawMosquito(o,mx,my,1.9+.1*f,-.1+.05*Math.sin(t*2),t*58,'#0d131b',1,true,false);
  o.setTransform(1,0,0,1,0,0); o.globalCompositeOperation='destination-in'; const top=clamp((1-u)*1.1); const g=o.createLinearGradient(0,0,0,H*SC); g.addColorStop(0,`rgba(0,0,0,${1-top})`); g.addColorStop(Math.min(.9,.15+top*.6),'rgba(0,0,0,1)'); g.addColorStop(1,'rgba(0,0,0,1)'); o.fillStyle=g; o.fillRect(0,0,off.width,off.height); c.drawImage(off,0,0,W,H); c.restore();
}
function frameActs(c,t){
  c.setTransform(SC,0,0,SC,0,0); c.clearRect(0,0,W,H);
  if(t<13.95){ actTransmission(c,Math.min(t,12.8)); if(t>12.25) actBut(c,t) }
  if(t>=13.0&&t<16.2){ // iris reveal of the tundra, then the dive into a pool
    const ir=ease((t-13.0)/.9)*1400, dv=clamp((t-15.45)/.65); c.save(); if(t<13.95){c.beginPath(); c.arc(540,960,ir,0,6.3); c.clip()}
    const px=560,py=1560; c.save(); c.translate(px,py); const sc=1+ei(dv)*16; c.scale(sc,sc); c.translate(-px,-py); drawArctic(c,t); c.restore(); c.restore();
    if(t<13.95){c.strokeStyle=`rgba(255,190,150,${.8*(1-(t-13.0)/.9)})`; c.lineWidth=4; c.beginPath(); c.arc(540,960,ir,0,6.3); c.stroke()}
  }
  if(t>=15.75&&t<17.6){ const a=ease((t-15.75)/.5); c.save(); c.globalAlpha=a; actWetland(c,t); c.restore() }
  if(t>=17.45&&t<20.9){ const a=ease((t-17.45)/.35); c.save(); c.globalAlpha=a; actOrchid(c,t); c.restore() }
  if(t>=19.7&&t<23.7){ // zoom-through from the orchid out to the planet
    const p=clamp((t-19.7)/1.0), kk=eo(p);
    c.fillStyle='#02050b'; if(t<20.7){}
    const earthA=ease(p*1.4); if(t>=19.9){ c.save(); drawSpace(c,t,0,earthA); const Pp={cx:540,cy:t<22.6?840:mix(840,-500,eo((t-22.6)/.9)),R:EARTH_REST.R*mix(3.4,1,kk)*(t<22.6?1:mix(1,.7,eo((t-22.6)/.9))),lat0:8,lon0:20+(t-20)*2.5}; actWeb(c,t,Pp,{alpha:earthA,lights:1,glow:ease(p*1.3),grid:0,mapMix:0,discFade:0}); c.restore() }
    if(t<20.75){const s=mix(1,.02,ei(p)); c.save(); c.globalAlpha=1-ease((p-.45)/.5); c.translate(540,840); c.scale(s,s); c.translate(-540,-900); actOrchid(c,Math.min(t,19.99)); c.restore()}
  }
  if(t>=22.55){ const u=clamp((t-22.6)/.95); if(u>0){ c.save(); actFinal(c,t,u); c.restore() } }
  // narration lines
  caption(c,['WITHOUT MOSQUITOES,','TRANSMISSION COLLAPSES.'],10.3,12.45,170,40,t,34,.9);
  caption(c,['CARIBOU ESCAPE','THE SWARMS.'],13.55,15.9,170,40,t,34,.8);
  caption(c,['SOME FISH AND BIRDS','LOSE FOOD.'],16.0,17.45,170,40,t,44,.6);
  caption(c,['SOME WILD ORCHIDS','LOSE A POLLINATOR.'],17.55,19.9,170,40,t,34,.8);
  caption(c,['AND ECOSYSTEMS CHANGE','IN WAYS WE CAN\'T PREDICT.'],20.1,22.9,170,40,t,34,.9);
  caption(c,['WOULD YOU ERASE','THEM ANYWAY?'],23.4,26.6,170,44,t,30,.9);
  const vg=c.createRadialGradient(540,960,700,540,960,1250); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.35)'); c.fillStyle=vg; c.fillRect(0,0,W,H);
}
function frame(c,t){ if(t<10) frameOpen(c,t); else frameActs(c,t) }

function blurRanges(t){return (t>3.4&&t<5.1)||(t>6.45&&t<7.55)||(t>19.7&&t<20.8)||(t>22.55&&t<23.6)}
window.renderAt=t=>{
  if(blurRanges(t)){const N=6, sh=0.55/30; actx.setTransform(1,0,0,1,0,0); actx.globalCompositeOperation='source-over'; actx.fillStyle='#000'; actx.fillRect(0,0,acc.width,acc.height); actx.globalCompositeOperation='lighter';
    for(let k=0;k<N;k++){frame(ctx,t-sh*(k/(N-1))); actx.globalAlpha=1/N; actx.drawImage(cv,0,0)} actx.globalAlpha=1; ctx.setTransform(1,0,0,1,0,0); ctx.globalCompositeOperation='source-over'; ctx.drawImage(acc,0,0)}
  else frame(ctx,t);
  return cv.toDataURL('image/jpeg',.96)};
window.stateAt=t=>({t});
window.ready=true;
</script></body></html>
