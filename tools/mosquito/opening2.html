  c.fillStyle=`rgb(${lc.join()})`; c.strokeStyle=`rgba(${Math.round(mix(60,120,o.mapMix))},${Math.round(mix(80,190,o.mapMix))},${Math.round(mix(110,200,o.mapMix))},${mix(.5,.9,o.mapMix)})`; c.lineWidth=mix(1,2.2,o.mapMix);
  for(const ring of landRings){if(ring.every(p=>p[1]<-60)) continue; let any=false; const pts=[]; for(const [lo,la] of ring){const p=proj(la,lo,P); if(p[2]>-0.02) any=true; if(p[2]<0){const dx=p[0]-cx,dy=p[1]-cy,d=Math.hypot(dx,dy)||1; pts.push([cx+dx/d*Rr,cy+dy/d*Rr])} else pts.push([p[0],p[1]])} if(!any) continue; c.beginPath(); pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1])); c.closePath(); c.fill(); c.stroke()}
  // graticule
  if(o.grid>0){c.strokeStyle=`rgba(190,222,236,${.5*o.grid})`; c.lineWidth=1.4; for(let lo=-180;lo<=180;lo+=10){c.beginPath(); let st=false; for(let la=-80;la<=80;la+=4){const p=proj(la,lo,P); if(p[2]<0.02){st=false; continue} st?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]); st=true} c.stroke()}
    for(let la=-80;la<=80;la+=10){c.beginPath(); let st=false; for(let lo=-180;lo<=180;lo+=4){const p=proj(la,lo,P); if(p[2]<0.02){st=false; continue} st?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]); st=true} c.stroke()}}
  // city lights
  if(o.lights>0){c.globalCompositeOperation='lighter'; const k=Rr/430; for(const L of lights){const p=proj(L[0],L[1],P); if(p[2]<0.08) continue; const tw=.8+.2*Math.sin(t*2+L[0]*13+L[1]*7); const a=clamp(p[2]*1.4)*L[2]*o.lights*tw*.85; const s=L[3]*3.0*k; c.globalAlpha=o.alpha*Math.min(1,a*.8); c.drawImage(dot,p[0]-s,p[1]-s,s*2,s*2)} c.globalAlpha=o.alpha; c.globalCompositeOperation='source-over'}
  // terminator shade
  const sh=c.createRadialGradient(cx-Rr*.35,cy-Rr*.4,Rr*.2,cx,cy,Rr*1.02); sh.addColorStop(0,'rgba(0,0,0,0)'); sh.addColorStop(.7,`rgba(2,4,10,${.25*(1-o.discFade)})`); sh.addColorStop(1,`rgba(2,4,10,${.6*(1-o.discFade)})`); c.fillStyle=sh; c.fillRect(cx-Rr,cy-Rr,Rr*2,Rr*2);
  c.restore();
  // rim light: thin bright edge, brighter on the upper right
  if(o.glow>0){const rg=c.createLinearGradient(cx-Rr,cy+Rr,cx+Rr,cy-Rr); rg.addColorStop(0,`rgba(255,150,70,${.25*o.glow})`); rg.addColorStop(1,`rgba(255,215,150,${.95*o.glow})`); c.strokeStyle=rg; c.lineWidth=4; c.shadowColor='rgba(255,150,60,.9)'; c.shadowBlur=26; c.beginPath(); c.arc(cx,cy,Rr,0,6.3); c.stroke(); c.shadowBlur=0}
  c.restore();
}
// ---------------------------------------------------------------- text helpers and the data panel
function track(c,s,x,y,sp,font,fill,align,outline){c.font=font; c.fillStyle=fill; c.textBaseline='alphabetic'; c.lineJoin='round'; let w=0; for(const ch of s) w+=c.measureText(ch).width+sp; w-=sp; let xx=align==='c'?x-w/2:x; for(const ch of s){if(outline){c.save(); c.shadowColor='transparent'; c.strokeStyle=outline; c.lineWidth=6; c.strokeText(ch,xx,y); c.restore()} c.fillText(ch,xx,y); xx+=c.measureText(ch).width+sp} return w}
function typed(s,t0,cps,t){return s.slice(0,Math.max(0,Math.floor((t-t0)*cps)))}
function caption(c,lines,t0,t1,y,size,t,cps=26,gap=.9){const a=ease((t-t0)/.3)*(1-ease((t-t1)/.4)); if(a<=0) return; c.save(); c.globalAlpha=a; c.shadowColor='rgba(2,6,16,.92)'; c.shadowBlur=18; c.shadowOffsetX=0; c.shadowOffsetY=7; lines.forEach((s,i)=>{const sp=size*.14; track(c,typed(s,t0+i*gap,cps,t),W/2,y+i*(size*1.5),sp,`bold ${size}px ${MONO}`,'#ffffff','c','rgba(4,8,22,.7)')}); c.restore()}
function drawPanel(c,t,PP){
  const a=ease((t-7.35)/.5);
  c.save(); c.globalAlpha=a; track(c,'THE HUMAN COST',90,172,5,`bold 26px ${MONO}`,'#cfe1ee','l'); c.strokeStyle='rgba(200,225,240,.55)'; c.lineWidth=1.6; c.beginPath(); c.moveTo(90,196); c.lineTo(990,196); c.stroke(); c.restore();
  // markers
  for(let i=0;i<MARKS.length;i++){const t0=7.7+i*.17; const k=ease((t-t0)/.35); if(k<=0) continue; const p=proj(MARKS[i][0],MARKS[i][1],PP); const pul=.5+.5*Math.sin(t*3+i); c.save(); c.globalCompositeOperation='lighter'; const g=c.createRadialGradient(p[0],p[1],0,p[0],p[1],34*k); g.addColorStop(0,'rgba(255,130,90,.9)'); g.addColorStop(1,'rgba(255,100,60,0)'); c.fillStyle=g; c.fillRect(p[0]-40,p[1]-40,80,80); c.restore(); c.fillStyle='#ff8a5b'; c.beginPath(); c.arc(p[0],p[1],7*k,0,6.3); c.fill(); c.strokeStyle=`rgba(255,160,120,${.5*(1-pul)*k})`; c.lineWidth=2; c.beginPath(); c.arc(p[0],p[1],10+14*pul,0,6.3); c.stroke()}
  // counter box
  const ba=ease((t-7.9)/.5); if(ba>0){c.save(); c.globalAlpha=ba; const x=110,y=1215,w=860,h=190; c.fillStyle='rgba(8,18,34,.92)'; c.strokeStyle='rgba(190,215,235,.55)'; c.lineWidth=2; c.beginPath(); c.roundRect(x,y,w,h,14); c.fill(); c.stroke();
    track(c,'ESTIMATED GLOBAL DEATHS',x+34,y+48,4,`bold 22px ${MONO}`,'#9fb8cc','l');
    const v=Math.round(610000*eo((t-8.15)/1.45)); const s=v.toLocaleString('en-US'); c.font=`bold 92px ${MONO}`; c.fillStyle='#f6f1e6'; c.textBaseline='alphabetic'; c.fillText(s,x+34,y+138);
    c.strokeStyle='#ff8a5b'; c.lineWidth=3; c.beginPath(); c.moveTo(x+34,y+160); c.lineTo(x+w-34,y+160); c.stroke(); track(c,'MALARIA / 2024 / WHO',x+34,y+182,4,`bold 18px ${MONO}`,'#9fb8cc','l'); c.restore()}
  const ca=ease((t-9.0)/.5); if(ca>0){c.save(); c.globalAlpha=ca; c.shadowColor='rgba(0,0,0,.5)'; c.shadowBlur=8; track(c,'Malaria took over six hundred',W/2,1520,2,`bold 38px ${MONO}`,'#f4f1ea','c'); track(c,'thousand lives.',W/2,1572,2,`bold 38px ${MONO}`,'#f4f1ea','c'); c.shadowBlur=0; track(c,'WHO ESTIMATE, 2024. MARKERS ILLUSTRATIVE. NOT LIVES INSTANTLY SAVED.',W/2,1650,2,`16px ${MONO}`,'#8fa6ba','c'); c.restore()}
}
// ---------------------------------------------------------------- timeline
const EARTH_REST={cx:540,cy:840,R:410,lat0:8,lon0:20}, PANEL={cx:540,cy:700,R:660,lat0:1,lon0:18};
function frame(c,t){
  c.setTransform(SC,0,0,SC,0,0); c.clearRect(0,0,W,H);
  const T1a=3.45,T1b=4.95, T2a=6.5,T2b=7.45;
  // 1) sunset marsh, then it lifts away (camera rises to space)
  if(t<4.6){
    const p=clamp((t-T1a)/0.95), yA=H*1.15*ei(p);
    if(t>=T1a-0.001){drawSpace(c,t,yA*.5,1)}
    c.save(); c.translate(0,yA); c.scale(1,1);
    if(t>T1a){ // fade the top of the sky so space shows through as the scene slides down
      const off=document.createElement('canvas'); off.width=cv.width; off.height=cv.height; const o=off.getContext('2d'); o.setTransform(SC,0,0,SC,0,0); drawA(o,t); o.setTransform(1,0,0,1,0,0); o.globalCompositeOperation='destination-in'; const g=o.createLinearGradient(0,0,0,H*SC); const top=clamp(p*1.1); g.addColorStop(0,`rgba(0,0,0,${1-top})`); g.addColorStop(Math.min(.9,.15+top*.6),'rgba(0,0,0,1)'); g.addColorStop(1,'rgba(0,0,0,1)'); o.fillStyle=g; o.fillRect(0,0,off.width,off.height); c.drawImage(off,0,0,W,H)
    } else drawA(c,t);
    c.restore();
  } else { const kk=t>=6.5?ease((ease((t-6.5)/(7.45-6.5))-.3)/.6):0; c.fillStyle='#0b1b31'; c.fillRect(0,0,W,H); drawSpace(c,t,0,1-kk) }
  // 2) Earth rises from below with its rim glow, settles, then dives into Africa
  if(t>=4.0&&t<7.55){
    let P, o;
    if(t<T2a){
      const r=clamp((t-4.0)/(T1b-4.0)), k=eo(r); const settle=clamp((t-T1b)/(T2a-T1b));
      P={cx:540,cy:mix(2300,EARTH_REST.cy,k),R:EARTH_REST.R*mix(.72,1,k)*(1+.05*settle),lat0:EARTH_REST.lat0,lon0:EARTH_REST.lon0+3*settle};
      o={alpha:ease(r*1.6),lights:1,glow:1,grid:0,mapMix:0,discFade:0};
    } else {
      const u=ease((t-T2a)/(T2b-T2a)); const base={cx:540,cy:EARTH_REST.cy,R:EARTH_REST.R*1.05,lat0:EARTH_REST.lat0,lon0:EARTH_REST.lon0+3};
      P={cx:mix(base.cx,PANEL.cx,u),cy:mix(base.cy,PANEL.cy,u),R:mix(base.R,PANEL.R,u),lat0:mix(base.lat0,PANEL.lat0,u),lon0:mix(base.lon0,PANEL.lon0,u)};
      o={alpha:1,lights:1-ease(u*1.6),glow:1-ease(u*1.3),grid:ease((u-.15)/.6),mapMix:ease((u-.3)/.6),discFade:ease((u-.4)/.55)};
    }
    // space fades into the panel navy during the dive
    drawEarth(c,t,P,o);
    // pulse ring over the high-burden region as the Earth settles
    const pu=t-5.55; if(pu>0&&pu<1.3&&t<T2a){const p=proj(6,12,P); for(let k=0;k<2;k++){const uu=pu-k*.25; if(uu<0) continue; c.strokeStyle=`rgba(255,170,110,${.8*(1-uu/1.1)})`; c.lineWidth=3; c.beginPath(); c.arc(p[0],p[1],14+uu*150,0,6.3); c.stroke()}}
  }
  if(t>=7.45){c.fillStyle='#0b1b31'; c.fillRect(0,0,W,H); drawEarth(c,t,PANEL,{alpha:1,lights:0,glow:0,grid:1,mapMix:1,discFade:1}); }
  if(t>=6.9){const fa=ease((t-6.9)/.6); const g1=c.createLinearGradient(0,150,0,330); g1.addColorStop(0,`rgba(11,27,49,${fa})`); g1.addColorStop(1,'rgba(11,27,49,0)'); c.fillStyle=g1; c.fillRect(0,0,W,330); const g2=c.createLinearGradient(0,1090,0,1200); g2.addColorStop(0,'rgba(11,27,49,0)'); g2.addColorStop(1,`rgba(11,27,49,${fa})`); c.fillStyle=g2; c.fillRect(0,1090,W,H-1090); c.fillStyle=`rgba(11,27,49,${fa})`; c.fillRect(0,1200,W,H-1200)}
  if(t>=7.1) drawPanel(c,t,PANEL);
  // captions
  caption(c,['WHAT IF EVERY MOSQUITO','VANISHED RIGHT NOW?'],-0.3,3.0,170,40,t,40,.55);   // on screen from the first frame until the swarm has fallen
  caption(c,['OVERNIGHT. ALL GONE.','NO BUZZING. NO BITES.'],4.35,6.45,170,40,t);
  // soft vignette
  const vg=c.createRadialGradient(540,960,700,540,960,1250); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.35)'); c.fillStyle=vg; c.fillRect(0,0,W,H);
}
function blurRanges(t){return (t>3.4&&t<5.1)||(t>6.45&&t<7.55)}
window.renderAt=t=>{
  if(blurRanges(t)){const N=6, sh=0.55/30; actx.setTransform(1,0,0,1,0,0); actx.globalCompositeOperation='source-over'; actx.fillStyle='#000'; actx.fillRect(0,0,acc.width,acc.height); actx.globalCompositeOperation='lighter';
    for(let k=0;k<N;k++){frame(ctx,t-sh*(k/(N-1))); actx.globalAlpha=1/N; actx.drawImage(cv,0,0)} actx.globalAlpha=1; ctx.setTransform(1,0,0,1,0,0); ctx.globalCompositeOperation='source-over'; ctx.drawImage(acc,0,0)}
  else frame(ctx,t);
  return cv.toDataURL('image/jpeg',.96)};
window.stateAt=t=>({t});
window.ready=true;
</script></body></html>
