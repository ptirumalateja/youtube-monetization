<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';

const Q = new URLSearchParams(location.search);
const W = +Q.get('w') || 1920, H = +Q.get('h') || 1080;
const clamp = THREE.MathUtils.clamp, lerp = THREE.MathUtils.lerp;
const ease = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const ramp = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const sstep = (a, b, x) => ease((x - a) / (b - a));

// ------------------------------------------------------------------ data
const AGES = [1, 5, 12, 18, 30, 45, 60, 70, 80, 90, 100];
const raw = {}, jraw = {};
await Promise.all(AGES.map(async a => {
  raw[a] = new Float32Array(await (await fetch(`out/body_${a}.bin`)).arrayBuffer());
  jraw[a] = await (await fetch(`out/joints_${a}.json`)).json();
}));
const idx = new Uint32Array(await (await fetch('out/body_idx.bin')).arrayBuffer());
const TL = await (await fetch('film_timeline.json')).json();
const nV = raw[1].length / 3;

// interpolated body at any age, with the old-age stoop applied
const cacheB = new Map();
function bodyAt(age) {
  age = clamp(age, 1, 100); const key = Math.round(age * 20) / 20;
  if (cacheB.has(key)) return cacheB.get(key);
  let i = 0; while (i < AGES.length - 2 && key > AGES[i + 1]) i++;
  const a0 = AGES[i], a1 = AGES[i + 1], t = clamp((key - a0) / (a1 - a0), 0, 1);
  const pos = new Float32Array(nV * 3), A = raw[a0], B = raw[a1];
  for (let k = 0; k < pos.length; k++) pos[k] = A[k] + (B[k] - A[k]) * t;
  const joints = {};
  for (const n of Object.keys(jraw[a0])) { const p = jraw[a0][n], q = jraw[a1][n]; joints[n] = [lerp(p[0], q[0], t), lerp(p[1], q[1], t), lerp(p[2], q[2], t)]; }
  const old = clamp((key - 55) / 40, 0, 1), maxA = 0.42 * old;
  if (maxA > 0) {
    const py = joints['joint-pelvis'][1], pz = joints['joint-pelvis'][2], ny = joints['joint-neck'][1] + 0.04;
    const bend = (x, y, z) => { const a = maxA * sstep(py, ny, y), dy = y - py, dz = z - pz; return [x, py + dy * Math.cos(a) - dz * Math.sin(a), pz + dz * Math.cos(a) + dy * Math.sin(a)]; };
    for (let i2 = 0; i2 < nV; i2++) pos.set(bend(pos[i2 * 3], pos[i2 * 3 + 1], pos[i2 * 3 + 2]), i2 * 3);
    for (const n of Object.keys(joints)) joints[n] = bend(...joints[n]);
  }
  let h = 0; for (let k = 1; k < pos.length; k += 3) h = Math.max(h, pos[k]);
  const r = {pos, joints, height: h, age: key, old}; cacheB.set(key, r); if (cacheB.size > 60) cacheB.delete(cacheB.keys().next().value); return r;
}

// ------------------------------------------------------------------ renderer, scene, composer

const out = document.getElementById('out'); out.width = W; out.height = H; const ctx = out.getContext('2d');

const mkBg = (inner, mid, outer) => { const c = document.createElement('canvas'); c.width = 512; c.height = 288; const g = c.getContext('2d');
  const gr = g.createRadialGradient(256, 170, 10, 256, 170, 330); gr.addColorStop(0, inner); gr.addColorStop(0.55, mid); gr.addColorStop(1, outer); g.fillStyle = gr; g.fillRect(0, 0, 512, 288);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; };
const BG = {warm: mkBg('#3a2d28', '#1d1c24', '#0f1119'), cool: mkBg('#16243a', '#0d1626', '#090d18'), tree: mkBg('#2a1c14', '#150f0d', '#0a0807')};

  };

{ float e=.0015; float c0=crease(vOP); vec3 g=vec3(crease(vOP+vec3(e,0,0))-c0,crease(vOP+vec3(0,e,0))-c0,crease(vOP+vec3(0,0,e))-c0)/e;
  vec3 gv=(viewMatrix*vec4(g,0.)).xyz; normal=normalize(normal-gv*wrS*vWr*0.0016); }`);
  };
  m.userData.wrS = wrS; return m;

const skinMesh = new THREE.Mesh(geo, skinMat); gSkin.add(skinMesh);
let briefs = null;
const eyeMeshes = [];
const lidMat = patchScan(new THREE.MeshStandardMaterial({color: '#9a6743', roughness: 0.7, side: THREE.DoubleSide}), false);

  const ball = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 16), patchScan(new THREE.MeshStandardMaterial({color: '#b09a86', roughness: 0.8}), false));

  const lidL = new THREE.Mesh(new THREE.SphereGeometry(1.08, 24, 12, 0, Math.PI * 2, 0, 0.28), lidMat); lidL.rotation.x = -Math.PI / 2 - 0.1;
  const g = new THREE.Group(); g.add(ball, iris, pupil, lidU, lidL); iris.position.set(0, -0.07, 0.5); pupil.position.set(0, -0.07, 0.84);
  gSkin.add(g); eyeMeshes.push(g);
}
// lights
const ambient = new THREE.AmbientLight('#1a1d30', 1.4), key = new THREE.SpotLight('#ffb070', 26, 0, 0.8, 0.95, 1.6), rim = new THREE.DirectionalLight('#5a7bd8', 0.9), fill = new THREE.DirectionalLight('#ffd2ae', 1.15);
scene.add(ambient, key, key.target, rim, fill);
const floor = new THREE.Mesh(new THREE.CircleGeometry(1, 64), new THREE.MeshBasicMaterial({color: '#2a2018'})); floor.rotation.x = -Math.PI / 2; floor.position.y = -0.002; scene.add(floor);

// xray shell reuses the same geometry
const xShell = new THREE.Mesh(geo, fresMat('#4fb3ff', '#0a2a66', 2.2, 1.0)); gXray.add(xShell);
const pShell = new THREE.Mesh(geo, fresMat('#6fa8ff', '#07142e', 2.6, 0.55)); gPlex.add(pShell);
const nShell = new THREE.Mesh(geo, fresMat('#5a7cff', '#080a24', 2.4, 0.5)); gNerve.add(nShell);
const mShell = new THREE.Mesh(geo, fresMat('#4fb3ff', '#0a2a66', 2.2, 0.7)); gMuscle.add(mShell);

// ---- plexus (indices chosen once on the age-30 mesh, positions follow the live mesh)
const plexIdx = []; let plexSeg = [];
{ const b = bodyAt(30), P = b.pos; let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647; const minD = 0.03; const sel = [];
  for (let tries = 0; tries < 60000 && sel.length < 1300; tries++) { const i = Math.floor(rnd() * nV); let ok = true; for (const j of sel) { const dx = P[i * 3] - P[j * 3], dy = P[i * 3 + 1] - P[j * 3 + 1], dz = P[i * 3 + 2] - P[j * 3 + 2]; if (dx * dx + dy * dy + dz * dz < minD * minD) { ok = false; break; } } if (ok) sel.push(i); }
  plexIdx.push(...sel);
  for (let a = 0; a < sel.length; a++) { const near = []; for (let c = a + 1; c < sel.length; c++) { const dx = P[sel[a] * 3] - P[sel[c] * 3], dy = P[sel[a] * 3 + 1] - P[sel[c] * 3 + 1], dz = P[sel[a] * 3 + 2] - P[sel[c] * 3 + 2], d = dx * dx + dy * dy + dz * dz; if (d < (minD * 2.1) ** 2) near.push([d, c]); } near.sort((x, y) => x[0] - y[0]); for (const [, c] of near.slice(0, 3)) plexSeg.push(a, c); } }
const plexLineGeo = new THREE.BufferGeometry(); plexLineGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(plexSeg.length * 3), 3));
const plexPtGeo = new THREE.BufferGeometry(); plexPtGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(plexIdx.length * 3), 3));
gPlex.add(new THREE.LineSegments(plexLineGeo, lineMat('#8fc4ff')));
const plexPts = new THREE.Points(plexPtGeo, new THREE.PointsMaterial({color: '#e8f4ff', size: 0.011, sizeAttenuation: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false})); gPlex.add(plexPts);
gPlex.children[1].material.opacity = 0.5;

// ---- skeleton (pooled cylinders), brain, heart, vessels
const cyl = new THREE.CylinderGeometry(1, 1, 1, 10, 1), sph = new THREE.SphereGeometry(1, 16, 12);
const bonePool = []; const boneMat = glowMat('#cfe8ff', 0.8);
for (let i = 0; i < 140; i++) { const m = new THREE.Mesh(cyl, boneMat); m.visible = false; gXray.add(m); bonePool.push(m); }
const skullPieces = []; for (let i = 0; i < 6; i++) { const m = new THREE.Mesh(sph, boneMat); m.visible = false; gXray.add(m); skullPieces.push(m); }
const ribLines = []; for (let i = 0; i < 8; i++) { const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(new Array(61).fill(0).map(() => new THREE.Vector3())), lineMat('#9fd0ff')); gXray.add(l); ribLines.push(l); }
const heart = new THREE.Mesh(sph, glowMat('#ff6a44', 1)), halo = new THREE.Mesh(sph, glowMat('#ff4a2a', 0.22)); gXray.add(heart, halo);
const lungs = [0, 1].map(() => { const m = new THREE.Mesh(sph, fresMat('#6fd0ff', '#0a2a66', 2.0, 0.7)); gXray.add(m); return m; });
let vessels = [], nerves = [], muscles = [];
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const setFromTo = (m, p, q, r) => { const d = q.clone().sub(p), L = d.length(); m.position.copy(p).addScaledVector(d, 0.5); m.scale.set(r, Math.max(L, 1e-4), r); m.quaternion.setFromUnitVectors(V3(0, 1, 0), d.normalize()); m.visible = true; };
const tubeMesh = (pts, r, mat) => new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 40, r, 8, false), mat);

// brain blob + network
const brainMat = new THREE.ShaderMaterial({transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: {c1: {value: new THREE.Color('#9fe0ff')}, c2: {value: new THREE.Color('#1a3a7a')}, a: {value: 0.95}, wave: {value: -2}, hold: {value: 0}, uScan},
  vertexShader: 'varying vec3 vN; varying vec3 vV; varying vec3 vL; varying float vWY; void main(){vec4 mv=modelViewMatrix*vec4(position,1.);vN=normalize(normalMatrix*normal);vV=normalize(-mv.xyz);vL=normalize(position);vWY=(modelMatrix*vec4(position,1.)).y;gl_Position=projectionMatrix*mv;}',
  fragmentShader: 'uniform vec3 c1;uniform vec3 c2;uniform float a;uniform float wave;uniform float hold;uniform float uScan;varying vec3 vN;varying vec3 vV;varying vec3 vL;varying float vWY;void main(){if(vWY>uScan) discard;float f=pow(1.-abs(dot(normalize(vN),normalize(vV))),1.1);vec3 col=mix(c2,c1,f)*(0.25+f*1.6)*a;float z=vL.z;float band=exp(-pow((z-wave)/0.16,2.))*1.6;float front=smoothstep(0.1,0.6,z)*hold;col+=vec3(1.0,0.62,0.25)*(band+front*0.9)*(0.4+f);gl_FragColor=vec4(col,1.);}'});
const brainMesh = (() => { const g = new THREE.IcosahedronGeometry(1, 5), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const v = V3(p.getX(i), p.getY(i), p.getZ(i)).normalize(); const r = 1 + 0.07 * (1 - Math.abs(Math.sin(v.x * 9 + Math.sin(v.y * 7) * 2) * Math.sin(v.y * 8 + v.z * 5))); p.setXYZ(i, v.x * r * 0.92, v.y * r * 0.85, v.z * r * 1.12); }
  g.computeVertexNormals(); return new THREE.Mesh(g, brainMat); })();
const brainCore = new THREE.Mesh(sph, glowMat('#9fe0ff', 0.2));
gBrain.add(brainMesh, brainCore);
// network inside the brain (unit ellipsoid coordinates)
const netNodes = [], netEdges = [], netUse = []; { let s = 11; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  while (netNodes.length < 150) { const p = V3(rnd() * 2 - 1, rnd() * 2 - 1, rnd() * 2 - 1); if (p.lengthSq() < 0.8) netNodes.push(p.multiply(V3(0.82, 0.76, 1.0))); }
  for (let a = 0; a < netNodes.length; a++) { const d = netNodes.map((q, j) => [netNodes[a].distanceToSquared(q), j]).filter(x => x[1] > a).sort((x, y) => x[0] - y[0]).slice(0, 3); for (const [, j] of d) { netEdges.push([a, j]); netUse.push(rnd() < 0.34); } } }
const netGeo = new THREE.BufferGeometry(); netGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(netEdges.length * 6), 3)); netGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(netEdges.length * 6), 3));
{ const P = netGeo.attributes.position; netEdges.forEach(([a, b], i) => { P.setXYZ(i * 2, ...netNodes[a].toArray()); P.setXYZ(i * 2 + 1, ...netNodes[b].toArray()); }); }
const netLines = new THREE.LineSegments(netGeo, new THREE.LineBasicMaterial({vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false}));
const netPts = new THREE.Points(new THREE.BufferGeometry().setFromPoints(netNodes), new THREE.PointsMaterial({color: '#ffffff', size: 0.012, sizeAttenuation: true, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false}));
const brainNet = new THREE.Group(); brainNet.add(netLines, netPts); gBrain.add(brainNet);
function setPrune(p) { const C = netGeo.attributes.color; netEdges.forEach((e, i) => { const used = netUse[i]; const v = used ? 0.55 + 0.45 * p : 0.55 * (1 - p); const c = used ? [0.5 * v + 0.2 * p, 0.8 * v, 1.0 * v] : [0.35 * v, 0.55 * v, 0.9 * v]; C.setXYZ(i * 2, ...c); C.setXYZ(i * 2 + 1, ...c); }); C.needsUpdate = true; }

// floor rings: one circle per year
const RING_N = 100, RING_SEG = 72; const ringGeo = new THREE.BufferGeometry();
{ const P = new Float32Array(RING_N * RING_SEG * 6), C = new Float32Array(RING_N * RING_SEG * 6);
  for (let r = 0; r < RING_N; r++) for (let s = 0; s < RING_SEG; s++) { const a0 = s / RING_SEG * Math.PI * 2, a1 = (s + 1) / RING_SEG * Math.PI * 2, rad = 0.32 + r * 0.0115, o = (r * RING_SEG + s) * 6; P.set([Math.cos(a0) * rad, 0.001, Math.sin(a0) * rad, Math.cos(a1) * rad, 0.001, Math.sin(a1) * rad], o); }
  ringGeo.setAttribute('position', new THREE.BufferAttribute(P, 3)); ringGeo.setAttribute('color', new THREE.BufferAttribute(C, 3)); }
const ringLines = new THREE.LineSegments(ringGeo, new THREE.LineBasicMaterial({vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false})); gRings.add(ringLines);
function setRings(n, bright = 1, hi = -1) { const C = ringGeo.attributes.color; for (let r = 0; r < RING_N; r++) { const on = clamp(n - r, 0, 1), cur = (r === Math.floor(n) - 1) ? 1.6 : 1, h = r === hi ? 2.2 : 1, v = on * 0.55 * bright * Math.max(cur, h), c = [v * 1.0, v * 0.62, v * 0.28]; for (let s = 0; s < RING_SEG * 2; s++) C.setXYZ(r * RING_SEG * 2 + s, ...c); } C.needsUpdate = true; }

// lineup ghosts
const LINE_AGES = [1, 5, 10, 18, 25, 30, 40, 50, 60, 70, 80, 90, 100], ghosts = [];
for (const a of LINE_AGES) { const b = bodyAt(a), g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(b.pos.slice(), 3)); g.setIndex(new THREE.BufferAttribute(idx, 1)); g.computeVertexNormals();
  const m = new THREE.Mesh(g, fresMat('#6fa8ff', '#07142e', 2.4, 0.9, false)); m.position.x = (LINE_AGES.indexOf(a) - 6) * 0.95; gLine.add(m); ghosts.push(m); }

// tree rings finale
const treeMat = new THREE.ShaderMaterial({uniforms: {n: {value: 0}, hi: {value: -1}, t: {value: 0}}, transparent: false,
  vertexShader: 'varying vec2 vU; void main(){vU=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
