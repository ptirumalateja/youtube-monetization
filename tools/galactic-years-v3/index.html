import * as THREE from 'three';

const q=new URLSearchParams(location.search); const OW=+q.get('w')||540, OH=+q.get('h')||960, SS=+q.get('ss')||1; const W=Math.round(OW*SS), H=Math.round(OH*SS); const SC=H/960;   // render SS x larger, downsample on output
const TL=await (await fetch('timeline.json')).json();
const renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true}); renderer.setPixelRatio(1); renderer.setSize(W,H); document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x03040a);
const FOV=50; const cam=new THREE.PerspectiveCamera(FOV,W/H,0.05,1e6);
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}

// ------------------------------------------------------------------ world: galaxy radius 100 in the xz plane, Sun orbit r=55 (8.2 of ~15 kpc)
const GR=100, SUN_R=55;
const TH_NOW=35*Math.PI/180;                 // Sun's angle today (front-right in the overview)
const thAt=lap=>TH_NOW+2*Math.PI*(lap-19.74);
const rAt=lap=>SUN_R+3.6*Math.sin(2*Math.PI*1.35*lap+0.6), yAt=lap=>0.9*Math.sin(2*Math.PI*2.7*lap);

const sunTan=lap=>sunPos(lap+0.0005).sub(sunPos(lap-0.0005)).normalize();
// lap(t): eased between milestone keys so each milestone is read while the Sun crawls, fast in between
const LK=TL.lapKeys;
// monotone cubic (PCHIP) through the keys: smooth speed changes, exact holds, never runs backwards
const LS=(()=>{ const n=LK.length, h=[], d=[], m=new Array(n).fill(0); for(let i=0;i<n-1;i++){ h[i]=LK[i+1][0]-LK[i][0]; d[i]=(LK[i+1][1]-LK[i][1])/h[i]; }

    return (2*u3-3*u2+1)*a+(u3-2*u2+u)*h*LS[i]+(-2*u3+3*u2)*b+(u3-u2)*h*LS[i+1]; } }
}
// lap crossings (ripples, ticks)
const CROSS=[]; { let prev=lapAt(0); for(let t=0;t<=TL.T;t+=0.001){ const l=lapAt(t); for(let k=Math.floor(prev)+1;k<=Math.floor(l);k++) if(k>=1) CROSS.push([t,k]); prev=l; } }
window.CROSS=CROSS;
const SEG=TL.segments; window.want=t=>SEG.some(g=>g.k==='galaxy'&&t>=g.t0-1e-6&&t<g.t1-1e-6);

// ------------------------------------------------------------------ point material (size-attenuated, dim when sub-pixel)

const armPts=[];
for(let i=0;i<260000;i++){ const ai=R()<0.72?(R()<0.5?0:1):(R()<0.5?2:3); const [a0,wgt]=ARMS[ai]; if(R()>wgt+0.25) {i--; continue;}
  const r=BAR_L*0.95+Math.pow(R(),1.25)*(GR-BAR_L); const th=armTh(r,a0)+gauss()*(0.07+0.0018*r)*(ai<2?1:1.5)*(R()<0.5?0.45:1.3);
  const z=gauss()*(0.6+0.012*r); const x=r*Math.cos(th), y=z, zz=r*Math.sin(th); const young=R();
  const c=young<0.35?mixc(ICE,TEAL,R()*0.6):(young<0.8?CREAM:GOLD); add(x,y,zz,c,(0.35+0.55*R())*(1-0.45*r/GR),0.22+R()*0.4); if(i%80===0) armPts.push([r,th]); }

for(let k=0;k<170;k++){ const [r0,th0]=armPts[Math.floor(R()*armPts.length)]; const L=5+R()*12; const n=260; for(let j=0;j<n;j++){ const u=R(); const r=r0+u*L; const th=th0-(u*L/r0)*0.55+gauss()*0.012; add(r*Math.cos(th),gauss()*0.5,r*Math.sin(th),R()<0.4?mixc(ICE,TEAL,R()):CREAM,(0.35+0.5*R())*(1-0.6*u),0.2+R()*0.3);} }
// disc
for(let i=0;i<70000;i++){ const r=-Math.log(1-R()*0.985)*24+4; if(r>GR*1.1){i--;continue;} const th=R()*6.283; add(r*Math.cos(th),gauss()*1.3,r*Math.sin(th),R()<0.6?CREAM:GOLD,0.18+0.3*R(),0.25+R()*0.35); }

for(let k=0;k<900;k++){ const [r,th]=armPts[Math.floor(R()*armPts.length)]; const n=8+Math.floor(R()*14); for(let j=0;j<n;j++) add(r*Math.cos(th)+gauss()*0.7,gauss()*0.3,r*Math.sin(th)+gauss()*0.7,mixc(ICE,TEAL,R()),0.9+0.6*R(),0.35+R()*0.4); }
// stellar halo and globular clusters: sit above and below the disc so camera moves show parallax
for(let i=0;i<26000;i++){ const r=Math.pow(R(),0.6)*150; const a=R()*6.283,b=Math.acos(2*R()-1); add(r*Math.sin(b)*Math.cos(a),r*Math.cos(b)*0.75,r*Math.sin(b)*Math.sin(a),R()<0.7?GOLD:CREAM,0.12+0.25*R(),0.25+R()*0.4); }
for(let k=0;k<70;k++){ const r=30+R()*110; const a=R()*6.283,b=Math.acos(2*R()-1); const cx=r*Math.sin(b)*Math.cos(a),cy=r*Math.cos(b)*0.75,cz=r*Math.sin(b)*Math.sin(a); for(let j=0;j<160;j++){ const q=Math.abs(gauss())*0.9; const a2=R()*6.283,b2=Math.acos(2*R()-1); add(cx+q*Math.sin(b2)*Math.cos(a2),cy+q*Math.cos(b2),cz+q*Math.sin(b2)*Math.sin(a2),mixc(GOLD,CREAM,R()),0.5+0.5*R(),0.18+0.2*R()); } }

for(let i=0;gi<NG;i++){ const r=SUN_R+gauss()*3.2; const th=R()*6.283; add(r*Math.cos(th),gauss()*1.1,r*Math.sin(th),R()<0.75?CREAM:ICE,0.35+0.6*R(),0.012+0.03*R()*R()); }
gal.g.attributes.position.needsUpdate=true;
const gas=makePoints(9000,pointsMat({min:2,max:120,amp:1}),1);
for(let i=0;i<gas.n;i++){ const ai=R()<0.75?(R()<0.5?0:1):(R()<0.5?2:3); const a0=ARMS[ai][0]; const r=BAR_L*0.9+Math.pow(R(),1.2)*(GR-BAR_L); const th=armTh(r,a0)+gauss()*0.06-0.02;
  const warm=r<45&&R()<0.5; put(gas,i,r*Math.cos(th),gauss()*0.8,r*Math.sin(th),warm?[1.0,0.62,0.35]:[0.30,0.62,0.85],0.022+0.03*R(),1.6+R()*3.2); }
// mid-field stars between the camera and the galaxy (parallax against the disc during camera moves)
const mid=makePoints(5000,pointsMat({min:1.2,max:5,amp:0.9}),10);
for(let i=0;i<mid.n;i++){ const r=170+R()*480; const a=R()*6.283,b=Math.acos(2*R()-1); put(mid,i,r*Math.sin(b)*Math.cos(a),r*Math.cos(b),r*Math.sin(b)*Math.sin(a),R()<0.6?CREAM:ICE,0.25+0.75*R()*R(),0.5+R()*1.2); }
// dust lanes: dark soft blobs on the inner (leading) edge of the major arms
const dust=makePoints(60000,pointsMat({dark:true,min:2,max:60,amp:1,darkA:0.22}),3);
for(let i=0;i<dust.n;i++){ const ai=R()<0.8?(R()<0.5?0:1):(R()<0.5?2:3); const a0=ARMS[ai][0]; const r=BAR_L*0.8+Math.pow(R(),1.1)*(GR*0.92-BAR_L); const th=armTh(r,a0)+0.075+gauss()*0.03*(R()<0.6?0.5:1.4);
  put(dust,i,r*Math.cos(th),gauss()*0.35,r*Math.sin(th),[1,1,1],0.5+0.5*R(),0.5+R()*1.3); }
// soft disc glow + core glow (flat in the plane, additive)

const discGlow=new THREE.Mesh(new THREE.PlaneGeometry(2.3*GR,2.3*GR),new THREE.MeshBasicMaterial({map:radialTex([[0,'rgba(255,190,110,0.38)'],[0.12,'rgba(255,170,90,0.22)'],[0.4,'rgba(120,150,190,0.08)'],[1,'rgba(0,0,0,0)']]),transparent:true,blending:THREE.AdditiveBlending,depthTest:false,depthWrite:false,opacity:0.55}));

const coreGlow=new THREE.Sprite(new THREE.SpriteMaterial({map:radialTex([[0,'rgba(255,220,160,1)'],[0.2,'rgba(255,170,80,0.45)'],[1,'rgba(0,0,0,0)']]),transparent:true,blending:THREE.AdditiveBlending,depthTest:false,depthWrite:false,opacity:0.55}));

// ------------------------------------------------------------------ the Sun's orbit: faint dashed path, lap pulse, trail, Sun bead
// persistent golden trace of every completed lap (older laps dimmer); aPh carries the lap number
const TRC_N=60000; const trace=makePoints(TRC_N,new THREE.ShaderMaterial({transparent:true,depthTest:false,depthWrite:false,blending:THREE.AdditiveBlending,
  uniforms:{uLap:{value:0},uAmp:{value:1},uK:{value:HALF/TAN},uMin:{value:1.8*SC},uMax:{value:7*SC},uFlash:{value:0}},
  vertexShader:`attribute vec3 color; attribute float aSize; attribute float aPh; varying vec3 vc; varying float vA; uniform float uLap,uAmp,uK,uMin,uMax,uFlash;
   void main(){ vec4 mv=modelViewMatrix*vec4(position,1.0); float d=max(-mv.z,0.05); float raw=aSize*uK/d; gl_PointSize=clamp(raw,uMin,uMax);

// ------------------------------------------------------------------ camera: blend of poses (target, log distance, direction)
const B=TL.beats;
function dirFrom(az,el){ return new THREE.Vector3(Math.sin(az)*Math.cos(el),Math.sin(el),Math.cos(az)*Math.cos(el)); }
function chasePose(lap){ const s=sunPos(lap), tg=sunTan(lap); const out=s.clone().normalize();

function g5Wide(t){ const k=t-17.6; return {tgt:new THREE.Vector3(3,0,6),dist:355-4*k,dir:dirFrom(-0.20+0.035*k,1.18),off:0.07}; }

function blend(a,b,k){ const dir=a.dir.clone().lerp(b.dir,k).normalize(); return {tgt:a.tgt.clone().lerp(b.tgt,k),dist:Math.exp(lerp(Math.log(a.dist),Math.log(b.dist),k)),dir,off:lerp(a.off,b.off,k)}; }
const ease=(a,b,t)=>{const k=Math.min(1,Math.max(0,(t-a)/(b-a))); return k<0.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;};

    const br=Math.pow(1-u,1.6)*0.9; tCol[i*3]=GOLD[0]*br; tCol[i*3+1]=GOLD[1]*br; tCol[i*3+2]=GOLD[2]*br; }
  trail.g.attributes.position.needsUpdate=true; trail.g.attributes.color.needsUpdate=true; trail.pts.material.uniforms.uAmp.value=t>B.push+1.5&&t<B.dive?0.3:1;

  humanArc.pts.material.uniforms.uProg.value=t>=B.final?sm(B.cap1+0.2,B.cap1+1.0,t):0; humanArc.pts.material.uniforms.uAmp.value=t>=B.final?(1+1.5*sm(B.cap2,B.cap2+0.6,t))*(1-sm(B.dive+0.5,B.dive+1.6,t)):0;

}
